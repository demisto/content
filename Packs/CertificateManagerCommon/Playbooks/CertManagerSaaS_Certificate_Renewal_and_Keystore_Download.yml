inputs:
- key: CertificateFingerprint
  value:
    simple: ${incident.certmanagersaasfingerprint}
  required: false
  description: The SHA-1 fingerprint of the certificate to renew. Defaults to the fingerprint mapped onto
    a fetched issue.
  playbookInputQuery: null
- key: KeystoreFormat
  value:
    simple: PKCS12
  required: false
  description: 'The keystore format: PKCS12 (one .p12 file) or PEM (an encrypted private key file and
    a chain file, leaf first). Pick the format your target accepts.'
  playbookInputQuery: null
- key: KeystorePassphrase
  value: {}
  required: false
  description: The passphrase that encrypts the downloaded private key. Leave it empty to use the integration instance's Keystore passphrase setting, which can come from a saved credential (recommended). Don't type the passphrase here or save it as a default value.
  playbookInputQuery: null
- key: ApplicationID
  value: {}
  required: false
  description: The identifier of the Certificate Manager SaaS application the renewed certificate is requested
    for. Required for Certificate Manager SaaS; not used by Next-Gen Trust Security.
  playbookInputQuery: null
- key: CertificateIssuingTemplateID
  value: {}
  required: true
  description: The identifier of the issuing template the renewed certificate is issued under. Its key
    generation must be done by a VSatellite, or the private key cannot be downloaded.
  playbookInputQuery: null
- key: ValidityPeriod
  value: {}
  required: false
  description: The requested validity of the renewed certificate, as an ISO 8601 duration. Leave empty
    to use the issuing template default.
  playbookInputQuery: null
outputs:
- contextPath: CertManagerSaaS.Certificate.Fingerprint
  description: The fingerprint of the certificate that was renewed.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.Succeeded
  description: Whether the renewed certificate was issued.
  type: boolean
- contextPath: CertManagerSaaS.CertificateRequest.ID
  description: The identifier of the renewal request.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.KeystoreDownloaded
  description: Whether the keystore of the renewed certificate was downloaded.
  type: boolean
- contextPath: CertManagerSaaS.Keystore.KeystoreFileName
  description: The name of the War Room .p12 file (PKCS12 format).
  type: string
- contextPath: CertManagerSaaS.Keystore.PrivateKeyFileName
  description: The name of the War Room file with the encrypted private key (PEM format).
  type: string
- contextPath: CertManagerSaaS.Keystore.ChainFileName
  description: The name of the War Room file with the certificate chain, leaf first (PEM format).
  type: string
tests:
- No tests (auto formatted)
