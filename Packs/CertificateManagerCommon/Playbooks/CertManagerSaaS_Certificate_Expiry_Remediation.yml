inputs:
- key: Fingerprint
  value:
    simple: ${incident.certmanagersaasfingerprint}
  required: false
  description: 'The certificate fingerprint, as mapped onto the incident by the fetch mapper. Preferred:
    it identifies exactly one certificate.'
  playbookInputQuery: null
- key: CommonName
  value:
    simple: ${incident.certmanagersaascommonname}
  required: false
  description: The certificate common name, as mapped onto the incident by the fetch mapper.
  playbookInputQuery: null
- key: CriticalThresholdDays
  value:
    simple: '7'
  required: false
  description: Certificates expiring within this many days are raised to Critical.
  playbookInputQuery: null
- key: HighThresholdDays
  value:
    simple: '30'
  required: false
  description: Certificates expiring within this many days, but outside the critical threshold, are raised
    to High.
  playbookInputQuery: null
- key: AutoRenew
  value:
    simple: 'false'
  required: false
  description: Set to true to request a replacement certificate automatically. Any other value assigns
    the case to the certificate owner or AssigneeRole instead (or leaves it unassigned when neither is
    set).
  playbookInputQuery: null
- key: CertificateOwnerEmail
  value: {}
  required: false
  description: The email of the certificate owner, who gets the case. When empty, a member of AssigneeRole
    gets it; when both are empty, the case stays unassigned.
  playbookInputQuery: null
- key: AssigneeRole
  value: {}
  required: false
  description: A role whose least busy member gets the case when no CertificateOwnerEmail is set. When
    both are empty, the case stays unassigned.
  playbookInputQuery: null
- key: ApplicationID
  value: {}
  required: false
  description: The identifier of the Certificate Manager SaaS application the replacement certificate
    is requested for. Required for Certificate Manager SaaS when auto-renewal is on; not used by Next-Gen
    Trust Security.
  playbookInputQuery: null
- key: CertificateIssuingTemplateID
  value: {}
  required: false
  description: The identifier of the Certificate Manager SaaS issuing template the replacement is issued
    under. Required by the request sub-playbook when auto-renewal is on.
  playbookInputQuery: null
- key: ValidityPeriod
  value: {}
  required: false
  description: The requested validity of the replacement certificate, as an ISO 8601 duration. Leave empty
    to use the issuing template default.
  playbookInputQuery: null
outputs:
- contextPath: CertManagerSaaS.Certificate.Fingerprint
  description: The fingerprint of the expiring certificate.
  type: string
- contextPath: CertManagerSaaS.Certificate.DaysUntilExpiry
  description: Whole days remaining until the certificate expires.
  type: number
- contextPath: CertManagerSaaS.CertificateRequest.Succeeded
  description: Whether a replacement certificate was issued.
  type: boolean
- contextPath: CertManagerSaaS.CertificateRequest.ID
  description: The identifier of the replacement certificate request.
  type: string
tests:
- CertificateManagerSaaS - Test
