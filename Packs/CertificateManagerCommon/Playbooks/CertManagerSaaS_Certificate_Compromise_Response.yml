inputs:
- key: CertificateFingerprint
  value:
    simple: ${incident.certmanagersaasfingerprint}
  required: false
  description: The SHA-1 fingerprint of the compromised certificate. Defaults to the fingerprint mapped
    onto a fetched issue. The natural key, and the only digest revocation accepts - prefer it over the
    common name.
  playbookInputQuery: null
- key: CertificateCommonName
  value:
    simple: ${incident.certmanagersaascommonname}
  required: false
  description: The common name to search on when no fingerprint is available.
  playbookInputQuery: null
- key: RevocationReason
  value:
    simple: KEY_COMPROMISE
  required: false
  description: The revocation reason, passed to the command's "reason" argument. Certificate Manager SaaS
    accepts UNSPECIFIED, KEY_COMPROMISE, AFFILIATION_CHANGED, SUPERSEDED and CESSATION_OF_OPERATION. Other
    RFC 5280 reasons are rejected by the API.
  playbookInputQuery: null
- key: RevocationComment
  value:
    simple: Revoked by Cortex (case ${incident.id})
  required: false
  description: Free text stored with the revocation, passed to the command's "comment" argument. Carries
    the Cortex case identifier so the action is traceable from Certificate Manager SaaS back to Cortex.
    The Next-Gen Trust Security gateway's web filter rejects some wordings (for example "Revoked in Cortex
    case 123"), so test a changed comment before relying on it.
  playbookInputQuery: null
- key: AutoRequestReplacement
  value:
    simple: 'true'
  required: false
  description: Set to true to request a replacement certificate as soon as the revocation succeeds.
  playbookInputQuery: null
- key: ApplicationID
  value: {}
  required: false
  description: The identifier of the Certificate Manager SaaS application the replacement certificate
    is requested for. Required for Certificate Manager SaaS; not used by Next-Gen Trust Security.
  playbookInputQuery: null
- key: CertificateIssuingTemplateID
  value: {}
  required: false
  description: The identifier of the Certificate Manager SaaS issuing template the replacement is issued
    under. Required by the request sub-playbook.
  playbookInputQuery: null
outputs:
- contextPath: CertManagerSaaS.Certificate.Fingerprint
  description: The fingerprint of the certificate that was acted on.
  type: string
- contextPath: CertManagerSaaS.Certificate.Status
  description: The Certificate Manager SaaS status of the certificate after revocation.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.Succeeded
  description: Whether a replacement certificate was issued.
  type: boolean
- contextPath: CertManagerSaaS.CertificateRequest.ID
  description: The identifier of the replacement certificate request.
  type: string
tests:
- CertificateManagerSaaS - Test
