inputs:
- key: SourceIntegration
  value: {}
  required: false
  description: 'The integration to request through: CertificateManagerSaaS or NextGenTrustSecurity (the
    SourceBrand of the certificate being replaced). When empty, the only enabled integration is used;
    with both enabled, the sub-playbook stops and reports failure rather than pick one.'
  playbookInputQuery: null
- key: SourceInstance
  value: {}
  required: false
  description: The integration instance to send the request, status polling and download to - the SourceInstance
    of the certificate being replaced. Set it when the integration has several instances; when empty,
    the commands run on every enabled instance of that integration.
  playbookInputQuery: null
- key: CommonName
  value: {}
  required: true
  description: The subject common name for the new certificate. Required - the sub-playbook reports failure
    without calling out if it is empty.
  playbookInputQuery: null
- key: ApplicationID
  value: {}
  required: false
  description: The identifier of the Certificate Manager SaaS application the certificate is requested
    for. Required by Certificate Manager SaaS; ignored by Next-Gen Trust Security, which doesn't use applications.
  playbookInputQuery: null
- key: CertificateIssuingTemplateID
  value: {}
  required: true
  description: The identifier of the Certificate Manager SaaS issuing template to issue under. Required
    by the API.
  playbookInputQuery: null
- key: SubjectAlternativeNames
  value: {}
  required: false
  description: A comma-separated list of DNS subject alternative names for the new certificate.
  playbookInputQuery: null
- key: ValidityPeriod
  value: {}
  required: false
  description: The requested validity as an ISO 8601 duration - P1Y for a year, P90D for ninety days.
    Leave empty to use the issuing template default.
  playbookInputQuery: null
- key: ExistingCertificateFingerprint
  value: {}
  required: false
  description: The SHA-1 fingerprint of the certificate being replaced, when this request is a renewal.
    Links the new certificate to the old one in Certificate Manager SaaS. A renewal keeps the old certificate's
    subject and subject alternative names.
  playbookInputQuery: null
- key: PollingInterval
  value:
    simple: '1'
  required: false
  description: How often the request status is polled, in minutes.
  playbookInputQuery: null
- key: PollingTimeout
  value:
    simple: '30'
  required: false
  description: How long to poll the request before giving up, in minutes.
  playbookInputQuery: null
- key: DownloadPrivateKey
  value:
    simple: 'false'
  required: false
  description: Set to true to also download the issued certificate's private key and chain to the War
    Room, encrypted with KeystorePassphrase. Works only when a VSatellite generated the key. A failed download
    does not fail the request.
  playbookInputQuery: null
- key: KeystoreFormat
  value:
    simple: PEM
  required: false
  description: 'The keystore format when DownloadPrivateKey is true: PEM (an encrypted private key file
    and a chain file, leaf first) or PKCS12 (one .p12 file).'
  playbookInputQuery: null
- key: KeystorePassphrase
  value: {}
  required: false
  description: Used when DownloadPrivateKey is true. The passphrase that encrypts the downloaded private key. Leave it empty to use the integration instance's Keystore passphrase setting, which can come from a saved credential (recommended). Don't type the passphrase here or save it as a default value.
  playbookInputQuery: null
outputs:
- contextPath: CertManagerSaaS.CertificateRequest.Succeeded
  description: Whether a certificate was issued. Always set, on every path through the sub-playbook.
  type: boolean
- contextPath: CertManagerSaaS.CertificateRequest.ID
  description: The identifier of the certificate request.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.Status
  description: The final status of the certificate request.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.CertificateIDs
  description: The identifiers of the certificates the request produced.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.SubjectDN
  description: The subject distinguished name of the certificate request.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.ErrorMessage
  description: Why the request failed, when it did.
  type: string
- contextPath: CertManagerSaaS.CertificateContents.Contents
  description: The PEM content of the issued certificate, when the download succeeded.
  type: string
- contextPath: File.EntryID
  description: The war room entry identifier of the downloaded certificate file, and of the keystore files
    when DownloadPrivateKey is true.
  type: string
- contextPath: File.Name
  description: The name of the downloaded certificate file, and of the keystore files when DownloadPrivateKey
    is true.
  type: string
- contextPath: CertManagerSaaS.CertificateRequest.KeystoreDownloaded
  description: Whether the private key and chain were downloaded. Set only when DownloadPrivateKey is true
    and the certificate was issued.
  type: boolean
- contextPath: CertManagerSaaS.CertificateRequest.KeystoreErrorMessage
  description: Why the private key download failed, when it did.
  type: string
- contextPath: CertManagerSaaS.Keystore.CertificateID
  description: The identifier of the certificate whose keystore was downloaded.
  type: string
- contextPath: CertManagerSaaS.Keystore.Format
  description: The keystore format, PEM or PKCS12.
  type: string
- contextPath: CertManagerSaaS.Keystore.PrivateKeyFileName
  description: The name of the War Room file that holds the encrypted private key (PEM format).
  type: string
- contextPath: CertManagerSaaS.Keystore.ChainFileName
  description: The name of the War Room file that holds the certificate chain, leaf first (PEM format).
  type: string
- contextPath: CertManagerSaaS.Keystore.KeystoreFileName
  description: The name of the War Room .p12 file (PKCS12 format).
  type: string
tests:
- CertificateManagerSaaS - Test
