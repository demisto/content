      version: -1
      name: Are the required request fields supplied?
      description: A request needs a common name and an issuing template identifier. Certificate Manager
        SaaS also needs an application identifier, and rejects the request without one, which lands on
        the failure output; Next-Gen Trust Security doesn't use applications. Callers that reach this sub-playbook
        without the required fields are routed straight to the failure output, so the caller always receives
        a definite answer rather than an absent key.
      type: condition
      iscommand: false
      brand: ''
    nexttasks:
      '#default#':
      - '9'
      'yes':
      - '18'
    conditions:
    - label: 'yes'
      condition:
      - - operator: isNotEmpty
          left:
            value:
              simple: inputs.CommonName
            iscontext: true
      - - operator: isNotEmpty
          left:
            value:
              simple: inputs.CertificateIssuingTemplateID
            iscontext: true
    separatecontext: false
    continueonerrortype: ''
    view: |-
      {
        "position": {
