inputs:
- key: CertificateStatus
  value:
    simple: ACTIVE
  required: false
  description: Restricts the scan to certificates in this Certificate Manager SaaS status. Leave empty
    to scan every status.
  playbookInputQuery: null
- key: MaxCertificates
  value:
    simple: '500'
  required: false
  description: Maximum number of certificates to evaluate.
  playbookInputQuery: null
- key: MaxPages
  value:
    simple: '50'
  required: false
  description: Maximum number of 100-certificate pages to scan. The upstream page size is capped at 100,
    so a large tenant needs this raised.
  playbookInputQuery: null
- key: MinimumKeySize
  value:
    simple: '2048'
  required: false
  description: Minimum acceptable public key length, in bits. Certificates below it are flagged.
  playbookInputQuery: null
- key: DeprecatedSignatureHashAlgorithms
  value:
    simple: md5,sha1
  required: false
  description: Comma-separated signature hash algorithms treated as deprecated.
  playbookInputQuery: null
- key: MaximumValidityPeriodSeconds
  value:
    simple: '34387200'
  required: false
  description: Maximum permitted validity period, in seconds. Certificate Manager SaaS reports validity
    in seconds and there is no arithmetic available in a filter, so the threshold is given in the same
    unit. The default of 34387200 is 398 days.
  playbookInputQuery: null
outputs:
- contextPath: CertManagerSaaS.ComplianceScan.SelfSigned
  description: Certificates that are self-signed.
  type: unknown
- contextPath: CertManagerSaaS.ComplianceScan.WeakKey
  description: Certificates whose public key is shorter than the configured minimum.
  type: unknown
- contextPath: CertManagerSaaS.ComplianceScan.DeprecatedSignatureAlgorithm
  description: Certificates signed with a deprecated signature hash algorithm.
  type: unknown
- contextPath: CertManagerSaaS.ComplianceScan.ExcessiveValidity
  description: Certificates whose validity period exceeds the configured maximum.
  type: unknown
tests:
- CertificateManagerSaaS - Test
fromversion: 6.10.0
