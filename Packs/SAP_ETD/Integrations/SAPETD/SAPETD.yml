commonfields:
  id: SAPETD
  version: -1
name: SAPETD
display: SAP Enterprise Threat Detection
category: Analytics & SIEM
provider: SAP
description: Use the SAP Enterprise Threat Detection integration to fetch alerts from SAP ETD for ingestion into Cortex XSIAM.
sectionorder:
- Connect
- Collect
configuration:
- name: edition
  display: SAP ETD Edition
  required: true
  type: 15
  section: Connect
  defaultvalue: On-Premise
  options:
  - On-Premise
  - Cloud Edition
  additionalinfo: On-Premise uses Basic authentication against Alerts.xsjs. Cloud Edition uses OAuth2 client credentials against the Data Retriever service.
- name: url
  display: Server URL
  required: true
  type: 0
  section: Connect
  additionalinfo: 'On-Premise: the SAP ETD server URL (e.g., https://<Server_Host>:<Port>). Cloud Edition: the "url" value of the Data Retriever service binding.'
- name: credentials
  display: Username / Client ID
  displaypassword: Password / Client Secret
  required: true
  type: 9
  section: Connect
  additionalinfo: 'On-Premise: the user name and password. Cloud Edition: the "uaa.clientid" and "uaa.clientsecret" values of the service binding.'
- name: token_url
  display: Token URL (Cloud Edition only)
  required: false
  type: 0
  section: Connect
  additionalinfo: The "uaa.url" value of the service binding. /oauth/token is appended when missing. Required for Cloud Edition.
- name: insecure
  display: Trust any certificate (not secure)
  required: false
  type: 8
  defaultvalue: "false"
  section: Connect
  advanced: true
- name: proxy
  display: Use system proxy settings
  required: false
  defaultvalue: "false"
  type: 8
  section: Connect
  advanced: true
- name: isFetchEvents
  display: Fetch events
  required: false
  type: 8
  section: Collect
- name: max_fetch
  display: Maximum number of Threat Detection Alerts per fetch
  required: false
  type: 0
  section: Collect
  advanced: true
  defaultvalue: "10000"
  additionalinfo: Maximum number of alerts to fetch per cycle.
- name: eventFetchInterval
  display: Events Fetch Interval
  required: false
  type: 19
  section: Collect
  advanced: true
  defaultvalue: "1"
script:
  commands:
  - name: sap-etd-get-events
    description: |-
      Gets alerts from SAP Enterprise Threat Detection. Note: Use this command for development and debugging only, as it may produce duplicate events, exceed API rate limits, or disrupt the fetch mechanism.
    deprecated: false
    arguments:
    - name: from_date
      description: >-
        The start date/time to fetch alerts from.
        Supports relative time (e.g., "5 minutes ago", "2 hours ago")
        or specific ISO 8601 dates (e.g., "2026-01-15T15:00:00.00Z").
      defaultValue: "5 minutes ago"
    - name: limit
      description: The maximum number of alerts to retrieve.
      defaultValue: "50"
    - name: should_push_events
      description: If "true", will push events to Cortex XSIAM. Use with caution to avoid duplicates.
      defaultValue: 'false'
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    outputs:
    - contextPath: SAPETD.Alert.AlertId
      description: The unique identifier of the alert.
      type: Number
    - contextPath: SAPETD.Alert.AlertSeverity
      description: 'On-Premise only: the severity level of the alert. Can be LOW, MEDIUM, or HIGH.'
      type: String
    - contextPath: SAPETD.Alert.AlertStatus
      description: 'On-Premise only: the current status of the alert. Can be OPEN or CLOSED.'
      type: String
    - contextPath: SAPETD.Alert.Category
      description: 'On-Premise only: the category of the alert, such as Brute Force Attack.'
      type: String
    - contextPath: SAPETD.Alert.PatternName
      description: The name of the detection pattern that triggered the alert.
      type: String
    - contextPath: SAPETD.Alert.AlertCreationTimestamp
      description: 'On-Premise only: the date and time the alert was created (ISO 8601).'
      type: String
    - contextPath: SAPETD.Alert.Text
      description: 'On-Premise only: a human-readable description of the alert.'
      type: String
    - contextPath: SAPETD.Alert.Score
      description: The alert score value.
      type: Number
    - contextPath: SAPETD.Alert.Status
      description: 'Cloud Edition only: the current status of the alert, such as OPEN, NO_REACTION_NEEDED_T, INVESTIG_TRIGGERED, or EXEMPTED.'
      type: String
    - contextPath: SAPETD.Alert.CreationTimestamp
      description: 'Cloud Edition only: the date and time the alert was created (ISO 8601).'
      type: String
    - contextPath: SAPETD.Alert.MinTimestamp
      description: The time of the first event that triggered the alert (ISO 8601).
      type: String
    - contextPath: SAPETD.Alert.MaxTimestamp
      description: The time of the last event that triggered the alert (ISO 8601).
      type: String
  isfetchevents: true
  runonce: false
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/fastapi:0.125.0.12689358
fromversion: 8.11.0
supportlevelheader: xsoar
marketplaces:
- marketplacev2
- platform
supportedModules:
- xsiam
tests:
- No tests (auto formatted)
