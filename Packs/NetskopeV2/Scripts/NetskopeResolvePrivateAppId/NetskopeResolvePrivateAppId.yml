args:
- description: The app ID, if already known. If provided, used directly - no lookup happens.
  name: app_id
- description: The app name to look up if app_id isn't provided. Matched case-insensitively against netskopev2-list-private-apps' app_name field (Netskope wraps that field in brackets, e.g. "[test server]" - this handles that automatically).
  name: app_name
comment: Fetches all private apps and matches one by name to resolve its application ID. This is necessary because netskopev2-list-private-apps has no name filter argument and Netskope wraps app_name in brackets in list responses.
commonfields:
  id: NetskopeResolvePrivateAppId
  version: -1
name: NetskopeResolvePrivateAppId
outputs:
- contextPath: Netskope.ResolvedAppId.AppId
  description: The resolved (or directly provided) app ID. Empty if resolution failed.
  type: String
- contextPath: Netskope.ResolvedAppId.ResolvedBy
  description: The value indicating whether the ID came from app_id directly, an app_name lookup, or neither was provided.
  type: String
- contextPath: Netskope.ResolvedAppId.Error
  description: The error message if resolution failed (no match, or ambiguous multiple matches). Empty on success.
  type: String
script: ''
type: python
subtype: python3
tags: []
timeout: '0'
