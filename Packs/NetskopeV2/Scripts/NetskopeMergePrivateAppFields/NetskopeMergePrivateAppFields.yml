args:
- description: The ID of the private app to read current host/protocols/tags from. Required only if hosts_to_add, ports_to_add, hosts_to_remove, ports_to_remove, tags_to_add, or tags_to_remove is provided.
  name: app_id
- description: 'The direct-replace host value (from the Host input) - passed through unchanged unless hosts_to_add or hosts_to_remove is also provided, in which case those win and this is ignored.'
  name: host
- description: The direct-replace protocols JSON (from Netskope.BuiltProtocols.ProtocolsJson) - passed through unchanged unless ports_to_add or ports_to_remove is also provided, in which case those win and this is ignored.
  name: protocols_json
- description: The direct-replace comma-separated tags value (from the Tags input) - passed through unchanged unless tags_to_add or tags_to_remove is also provided, in which case those win and this is ignored.
  name: tags
- description: The comma-separated hosts to add to the app's existing host list (e.g. "10.0.0.5") - fetches the app's current host first and merges, deduplicating case-insensitively.
  name: hosts_to_add
- description: The comma-separated ports to add to the app's existing protocols (e.g. "8080") - fetches the app's current protocols first and merges, skipping ports already present.
  name: ports_to_add
- description: The comma-separated hosts to remove from the app's existing host list (e.g. "10.0.0.5") - fetches the app's current host first and removes just these entries.
  name: hosts_to_remove
- description: The comma-separated ports to remove from the app's existing protocols (e.g. "8080") - fetches the app's current protocols first and removes just the matching port entries.
  name: ports_to_remove
- description: The comma-separated tags to add to the app's existing tags (e.g. "test") - fetches the app's current tags first and merges, deduplicating case-insensitively.
  name: tags_to_add
- description: The comma-separated tags to remove from the app's existing tags (e.g. "test") - fetches the app's current tags first and removes just these entries.
  name: tags_to_remove
- defaultValue: tcp
  description: The transport protocol used for any newly added ports in ports_to_add.
  name: protocol_type
comment: Fetches a private app's current host, protocols, and tags, then applies the requested additions or removals without discarding the other values. This is necessary because netskopev2-update-private-app (PATCH) replaces host, protocols, and tags wholesale rather than merging them.
commonfields:
  id: NetskopeMergePrivateAppFields
  version: -1
name: NetskopeMergePrivateAppFields
outputs:
- contextPath: Netskope.MergedPrivateAppFields.Host
  description: The final host value to send - merged with hosts_to_add/hosts_to_remove if provided, otherwise the direct-replace value passed through unchanged.
  type: String
- contextPath: Netskope.MergedPrivateAppFields.ProtocolsJson
  description: The final protocols JSON to send - merged with ports_to_add/ports_to_remove if provided, otherwise the direct-replace value passed through unchanged.
  type: String
- contextPath: Netskope.MergedPrivateAppFields.Tags
  description: The final comma-separated tags value to send - with tags_to_add/tags_to_remove applied if provided, otherwise the direct-replace value passed through unchanged.
  type: String
script: ''
type: python
subtype: python3
tags: []
timeout: '0'
dockerimage: demisto/python3:3.12.8.3296088
fromversion: 6.10.0
tests:
- No tests (auto formatted)
