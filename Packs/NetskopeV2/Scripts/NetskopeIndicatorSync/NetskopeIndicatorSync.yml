args:
- description: The optional comma-separated indicator tags to further restrict the search (e.g. "netskope-block"). If omitted, all indicators of the given indicator_types are considered.
  name: tags
- description: The optional comma-separated indicator tags to exclude - any indicator carrying one of these tags is skipped even if it matches tags/indicator_types.
  name: skip_tags
- description: The comma-separated indicator types to pull from Cortex XSOAR's Threat Intel. Must be one or more of Domain, URL, IP, CIDR.
  name: indicator_types
  required: true
- description: The ID of an existing Netskope Destination Profile to append the new values to (and deploy). If omitted, no append/deploy happens - the script only searches, formats, and returns the new values (for a separate create-profile step to consume).
  name: profile_id
- description: The comma-separated list of values already in the target destination profile (from netskopev2-list-destination-profiles) - used to skip values that are already blocked. Ignored if profile_id is omitted.
  name: existing_values
- defaultValue: '500'
  description: The maximum number of indicators to pull from Cortex XSOAR per run.
  name: max_indicators
- defaultValue: '10'
  description: The maximum number of values per append call, matching netskopev2-update-destination-profile-values' 1-10-per-call limit.
  name: chunk_size
- defaultValue: 'true'
  description: Whether the deploy option is enabled. If profile_id is set and any new values were appended, deploy the profile afterward so the change takes effect immediately.
  name: deploy
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
- description: The optional change note recorded on the deploy call.
  name: change_note
comment: Pulls Domain, URL, IP, and CIDR indicators from Cortex XSOAR's Threat Intel Management and formats CIDR values with the "CIDR:" prefix that Netskope's destination profile Definition field expects. It skips values already present in the target profile. When profile_id is given, it appends the new values in batches of at most chunk_size and deploys the result. Without profile_id, it only prepares the new-value list for a separate create-profile step.
commonfields:
  id: NetskopeIndicatorSync
  version: -1
name: NetskopeIndicatorSync
outputs:
- contextPath: Netskope.Sync.ProfileId
  description: The destination profile ID that was updated (null if this was a create-prep run).
  type: String
- contextPath: Netskope.Sync.Query
  description: The indicator search query that was run.
  type: String
- contextPath: Netskope.Sync.TotalFound
  description: The total indicators returned by the query (before dedup).
  type: Number
- contextPath: Netskope.Sync.SkippedExisting
  description: The number of values skipped because they were already present in the profile or duplicated within this run.
  type: Number
- contextPath: Netskope.Sync.SkippedNoValue
  description: The number of indicators skipped because they did not contain a value.
  type: Number
- contextPath: Netskope.Sync.NewCount
  description: The number of new values found.
  type: Number
- contextPath: Netskope.Sync.AddedCount
  description: The number of new values actually appended to profile_id (0 if profile_id was omitted).
  type: Number
- contextPath: Netskope.Sync.Batches
  description: The number of append batches used.
  type: Number
- contextPath: Netskope.Sync.Deployed
  description: The value indicating whether the profile was deployed after appending.
  type: Boolean
- contextPath: Netskope.Sync.AllNewValues
  description: The flat list of all new, formatted values - for creating a brand-new profile in one call when profile_id was omitted.
  type: List
script: ''
type: python
subtype: python3
tags: []
timeout: '0'
dockerimage: demisto/python3:3.12.8.3296088
fromversion: 6.10.0
tests:
- No tests (auto formatted)
