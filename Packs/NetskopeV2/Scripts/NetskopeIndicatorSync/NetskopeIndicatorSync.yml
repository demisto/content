args:
- description: Optional comma-separated indicator tags to further restrict the search (e.g. "netskope-block"). If omitted, all indicators of the given indicator_types are considered.
  name: tags
- description: Optional comma-separated indicator tags to exclude - any indicator carrying one of these tags is skipped even if it matches tags/indicator_types.
  name: skip_tags
- description: Comma-separated indicator types to pull from XSOAR's Threat Intel. Must be one or more of Domain, URL, IP, CIDR.
  name: indicator_types
  required: true
- description: ID of an existing Netskope Destination Profile to append the new values to (and deploy). If omitted, no append/deploy happens - the script only searches, formats, and returns the new values (for a separate create-profile step to consume).
  name: profile_id
- description: Comma-separated list of values already in the target destination profile (from netskopev2-list-destination-profiles) - used to skip values that are already blocked. Ignored if profile_id is omitted.
  name: existing_values
- defaultValue: '500'
  description: Maximum number of indicators to pull from XSOAR per run.
  name: max_indicators
- defaultValue: '10'
  description: Maximum number of values per append call, matching netskopev2-update-destination-profile-values' 1-10-per-call limit.
  name: chunk_size
- defaultValue: 'true'
  description: If profile_id is set and any new values were appended, deploy the profile afterward so the change takes effect immediately.
  name: deploy
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
- description: Optional change note recorded on the deploy call.
  name: change_note
comment: Pulls Domain/URL/IP/CIDR indicators from XSOAR's own Threat Intel Management, formats CIDR values with the "CIDR:" prefix Netskope's destination profile Definition field expects, skips values already present in the target profile, and - when profile_id is given - appends the new values in batches of at most chunk_size (the API's per-call cap) and deploys the result. Without profile_id, it only prepares the new-value list for a separate create-profile step.
commonfields:
  id: NetskopeIndicatorSync
  version: -1
name: NetskopeIndicatorSync
outputs:
- contextPath: NetskopeSync.profile_id
  description: The destination profile ID that was updated (null if this was a create-prep run).
  type: String
- contextPath: NetskopeSync.query
  description: The indicator search query that was run.
  type: String
- contextPath: NetskopeSync.total_found
  description: Total indicators returned by the query (before dedup).
  type: Number
- contextPath: NetskopeSync.skipped_existing
  description: Number of values skipped because they were already present in the profile or duplicated within this run.
  type: Number
- contextPath: NetskopeSync.new_count
  description: Number of new values found.
  type: Number
- contextPath: NetskopeSync.added_count
  description: Number of new values actually appended to profile_id (0 if profile_id was omitted).
  type: Number
- contextPath: NetskopeSync.batches
  description: Number of append batches used.
  type: Number
- contextPath: NetskopeSync.deployed
  description: Whether the profile was deployed after appending.
  type: Boolean
- contextPath: NetskopeSync.all_new_values
  description: Flat list of all new, formatted values - for creating a brand-new profile in one call when profile_id was omitted.
  type: Unknown
script: ''
type: python
subtype: python3
tags: []
timeout: '0'
dockerimage: demisto/python3:3.12.8.3296088
fromversion: 6.0.0
tests:
- No tests (auto formatted)
