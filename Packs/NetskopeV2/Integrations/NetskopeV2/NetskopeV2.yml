  - name: netskopev2-update-file-hash-list
    description: Update a Netskope file hash list (Netskope API v1) with the values provided. This replaces the full list content - there is no v1 endpoint to read the current list first. The list must already exist in the Netskope UI.
    arguments:
    - name: name
      description: Name of an existing file hash list shown in the Netskope UI.
      required: true
    - name: hash
      description: File hashes to set as the full list content. Only MD5 (32 hex characters) or SHA256 (64 hex characters) are accepted - anything else is rejected. This replaces the entire list, so include existing hashes here too if you don't want to lose them.
      isArray: true
      required: true
    outputs:
    - contextPath: Netskope.FileHashList.name
      description: File hash list name.
      type: string
    - contextPath: Netskope.FileHashList.hash
      description: File hashes set on the list.
      type: unknown
