category: Network Security
provider: Netskope
commonfields:
  id: Netskope (API v2)
  version: -1
configuration:
- display: URL of Netskope Tenant (e.g. https://tenant.goskope.com)
  name: url
  required: true
  type: 0
  additionalinfo: The URL of the Netskope tenant.
- display: API Key
  name: api_key
  required: false
  type: 4
  hidden: true
  additionalinfo: Legacy API key field retained for backward compatibility.
- name: api_key_credentials
  type: 9
  required: false
  displaypassword: API Key
  hiddenusername: true
  additionalinfo: The API v2 key used to authenticate to Netskope.
- name: api_v1_token_credentials
  type: 9
  required: false
  displaypassword: API v1 Token (for file hash list commands)
  additionalinfo: The API v1 token used by the file hash list command.
  hiddenusername: true
- display: Trust any certificate (not secure)
  name: insecure
  required: false
  type: 8
  additionalinfo: Whether to trust unverified TLS certificates. Not recommended.
- display: Use system proxy settings
  name: proxy
  additionalinfo: Whether to use the system proxy settings for connections.
  required: false
  type: 8
description: Manages Netskope policy enforcement workflows for URLs, domains, file hashes, destination and network profiles, device classification, private applications, file inspection, and URL reputation.
display: Netskope - Direct to Zero Trust
name: Netskope (API v2)
script:
  commands:
  - arguments:
    - description: The name of the URL list.
      name: list_name
      required: true
    - description: A comma-separated list of URLs to add to the list.
      isArray: true
      name: url
      required: true
    description: Adds URLs to the Netskope URL block list.
    name: netskopev2-add-url
    outputs:
    - contextPath: Netskope.URLList.id
      description: The URL List ID.
      type: number
    - contextPath: Netskope.URLList.name
      description: The URL List name.
      type: string
    - contextPath: Netskope.URLList.data
      description: The URL List contents.
    - contextPath: Netskope.URLList.data.urls
      description: The list of URLs in URL List.
    - contextPath: Netskope.URLList.data.type
      description: The URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.URLList.modify_by
      description: The user which last modified URL List.
      type: string
    - contextPath: Netskope.URLList.modify_time
      description: The date and time when URL List was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.URLList.modify_type
      description: The URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.URLList.pending
      description: The URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments:
    - description: The name of the URL list.
      name: list_name
      required: true
    - description: A comma-separated list of URLs to remove from the list.
      isArray: true
      name: url
      required: true
    description: Removes URLs from the Netskope URL block list.
    name: netskopev2-remove-url
    outputs:
    - contextPath: Netskope.URLList.id
      description: The URL List ID.
      type: number
    - contextPath: Netskope.URLList.name
      description: The URL List name.
      type: string
    - contextPath: Netskope.URLList.data
      description: The URL List contents.
    - contextPath: Netskope.URLList.data.urls
      description: The list of URLs in URL List.
    - contextPath: Netskope.URLList.data.type
      description: The URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.URLList.modify_by
      description: The user which last modified URL List.
      type: string
    - contextPath: Netskope.URLList.modify_time
      description: The date and time when URL List was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.URLList.modify_type
      description: The URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.URLList.pending
      description: The URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments: []
    description: Gets all applied and pending URL lists.
    name: netskopev2-get-lists
    outputs:
    - contextPath: Netskope.List.id
      description: The URL List ID.
      type: number
    - contextPath: Netskope.List.name
      description: The URL List name.
      type: string
    - contextPath: Netskope.List.data
      description: The URL List contents.
    - contextPath: Netskope.List.data.urls
      description: The list of URLs in URL List.
    - contextPath: Netskope.List.data.type
      description: The URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.List.modify_by
      description: The user which last modified URL List.
      type: string
    - contextPath: Netskope.List.modify_time
      description: The date and time when URL List was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.List.modify_type
      description: The URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.List.pending
      description: The URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments:
    - description: The name of the URL list.
      name: list_name
      required: true
    description: Gets URL list by ID.
    name: netskopev2-get-list
    outputs:
    - contextPath: Netskope.List.id
      description: The URL List ID.
      type: number
    - contextPath: Netskope.List.name
      description: The URL List name.
      type: string
    - contextPath: Netskope.List.data
      description: The URL List contents.
    - contextPath: Netskope.List.data.urls
      description: The list of URLs in URL List.
    - contextPath: Netskope.List.data.type
      description: The URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.List.modify_by
      description: The user which last modified URL List.
      type: string
    - contextPath: Netskope.List.modify_time
      description: The date and time when URL List was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.List.modify_type
      description: The URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.List.pending
      description: The URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments: []
    description: Lists existing device classification tags. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-list-device-classification-tags
    outputs:
    - contextPath: Netskope.DeviceClassificationTag.id
      description: The device classification tag ID.
      type: number
    - contextPath: Netskope.DeviceClassificationTag.priority
      description: The device classification tag priority.
      type: number
    - contextPath: Netskope.DeviceClassificationTag.name
      description: The device classification tag name.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.description
      description: The device classification tag description.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.modifiedBy
      description: The user which last modified the tag.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.modifiedTime
      description: The time the tag was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.DeviceClassificationTag.policyNames
      description: The names of policies referencing this classification tag.
      type: unknown
  - arguments:
    - description: The name of the device classification tag.
      name: name
      required: true
    - description: The description of the device classification tag.
      name: description
    description: Creates a new device classification tag (label). Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-create-device-classification-tag
    outputs:
    - contextPath: Netskope.DeviceClassificationTag.ids
      description: The IDs of the created device classification tag(s).
      type: unknown
    - contextPath: Netskope.DeviceClassificationTag.name
      description: The device classification tag name.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.description
      description: The device classification tag description.
      type: string
  - arguments:
    - description: The name of the classification rule.
      name: name
      required: true
    - description: The name of the classification tag this rule applies (must already exist).
      name: label
      required: true
    - auto: PREDEFINED
      description: The operating system this rule applies to.
      name: os
      predefined:
      - windows
      - mac
      - linux
      - android
      - ios
      required: true
    - description: "The JSON object describing the rule conditions, e.g. {\"$and\": [{\"device_tag_check\": {\"tag_id\": 1137}}]}."
      name: conditions
      required: true
    description: Creates a device classification rule linking conditions (OS version, device tag presence, etc.) to a classification label. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-create-device-classification-rule
    outputs:
    - contextPath: Netskope.DeviceClassificationRule.ids
      description: The IDs of the created device classification rule(s).
      type: unknown
    - contextPath: Netskope.DeviceClassificationRule.name
      description: The device classification rule name.
      type: string
    - contextPath: Netskope.DeviceClassificationRule.label
      description: The device classification tag name this rule applies.
      type: string
    - contextPath: Netskope.DeviceClassificationRule.os
      description: The operating system this rule applies to.
      type: string
  - arguments:
    - description: The UNIX timestamp for the start of the query window.
      name: start_time
      required: true
    - description: The UNIX timestamp for the end of the query window.
      name: end_time
      required: true
    - description: The comma-separated list of fields to return.
      name: fields
    description: Finds devices by client status query, to resolve a device's nsdeviceuid before tagging it. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-find-device
    outputs:
    - contextPath: Netskope.Device.nsdeviceuid
      description: The Netskope device UID.
      type: string
    - contextPath: Netskope.Device.hostname
      description: The device hostname.
      type: string
    - contextPath: Netskope.Device.os
      description: The device operating system.
      type: string
    - contextPath: Netskope.Device.client_version
      description: The Netskope client version installed on the device.
      type: string
  - arguments:
    - description: The name of the device tag.
      name: name
      required: true
    - description: The description of the device tag.
      name: description
    description: Registers a new device tag. Check netskopev2-list-device-tags first to avoid creating a duplicate. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-create-device-tag
    outputs:
    - contextPath: Netskope.DeviceTag.id
      description: The device tag ID.
      type: number
    - contextPath: Netskope.DeviceTag.name
      description: The device tag name.
      type: string
    - contextPath: Netskope.DeviceTag.description
      description: The device tag description.
      type: string
  - arguments:
    - description: The Netskope device UID (nsdeviceuid) to look up tags for.
      name: device_id
      required: true
    description: Finds existing device tags applied to a device. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-list-device-tags
    outputs:
    - contextPath: Netskope.DeviceTag.id
      description: The device tag ID.
      type: number
    - contextPath: Netskope.DeviceTag.name
      description: The device tag name.
      type: string
  - arguments:
    - description: A comma-separated list of device tag IDs to apply. A device supports a maximum of 5 tags.
      isArray: true
      name: tag_id
      required: true
    - description: A comma-separated list of netskope device UIDs (nsdeviceuid) to apply the tags to.
      isArray: true
      name: nsdeviceuid
      required: true
    - description: The hostname to associate with the device entries.
      name: hostname
    - description: The user key to associate with the device entries. If omitted, the device UID is used.
      name: userkey
    description: Applies device tag(s) to one or more devices. This replaces all existing tags on the specified devices — it is not additive. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-apply-device-tags
    outputs:
    - contextPath: Netskope.DeviceTagApplication.affected_device_tags
      description: The number of device tags affected.
      type: number
    - contextPath: Netskope.DeviceTagApplication.affected_device_classification_tags
      description: The number of device classification tags affected.
      type: number
    - contextPath: Netskope.DeviceTagApplication.message
      description: The result message.
      type: string
  - name: netskopev2-list-destination-profiles
    description: Lists and filters destination profiles.
    arguments:
    - name: fields
      description: The comma-separated list of fields to return. The id field is always returned.
    - name: page
      description: The page number to return. Must be used with page_size.
    - name: page_size
      description: The number of items per page, from 1 through 100.
    - name: limit
      defaultValue: '10'
      description: The maximum number of items to return when page is not specified, up to 100.
    - name: sortby
      description: 'The field to sort by: name, create_time, or modify_time.'
    - name: sortorder
      description: The sort order.
      auto: PREDEFINED
      predefined:
      - asc
      - desc
    - name: filter
      description: The filter expression, e.g. name co "eng" or status in ("pending-update","pending-delete").
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: The profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: The profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: The profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: The profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: The profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: The number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: The label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: The profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: The user who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: The date and time when the profile was created, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: The user who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: The date and time when the profile was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
  - name: netskopev2-create-destination-profile
    description: Creates a new destination profile.
    arguments:
    - name: name
      description: The name of the profile. Must be unique, maximum 100 characters.
      required: true
    - name: description
      description: The description of the profile. Maximum 200 characters.
    - name: values
      description: A comma-separated list of values for the profile.
      isArray: true
    - name: type
      description: The profile match type.
      required: true
      auto: PREDEFINED
      predefined:
      - regex
      - sensitive
      - insensitive
    - name: label_ids
      description: A comma-separated list of label IDs to associate with the profile.
      isArray: true
    - name: id
      description: The client-supplied ID for the profile. Must be a UUID if provided.
    - name: interactive
      description: Whether to stage the change as pending instead of applying it immediately.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    - name: details
      description: Whether to omit the values array from the response.
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: The profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: The profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: The profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: The profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: The profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: The number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: The label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: The profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: The user who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: The date and time when the profile was created, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: The user who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: The date and time when the profile was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
  - name: netskopev2-get-destination-profile
    description: Gets a destination profile by ID.
    arguments:
    - name: id
      description: The ID of the profile.
      required: true
    - name: details
      description: Whether to omit the values array from the response.
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: The profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: The profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: The profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: The profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: The profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: The number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: The label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: The profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: The user who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: The date and time when the profile was created, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: The user who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: The date and time when the profile was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
  - name: netskopev2-update-destination-profile
    description: Partially updates a destination profile.
    arguments:
    - name: id
      description: The ID of the profile.
      required: true
    - name: name
      description: The new name for the profile.
    - name: description
      description: The new description for the profile.
    - name: values
      description: A comma-separated list of new values for the profile (replaces the full list).
      isArray: true
    - name: type
      description: The new profile match type. If provided, "values" must also be provided.
      auto: PREDEFINED
      predefined:
      - regex
      - sensitive
      - insensitive
    - name: label_ids
      description: A comma-separated list of new label IDs. An empty list clears existing labels.
      isArray: true
    - name: interactive
      description: Whether to stage the change as pending instead of applying it immediately.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: The profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: The profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: The profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: The profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: The profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: The number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: The label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: The profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: The user who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: The date and time when the profile was created, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: The user who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: The date and time when the profile was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
  - name: netskopev2-update-destination-profile-values
    description: Appends or removes values on a destination profile without replacing the full list.
    arguments:
    - name: id
      description: The ID of the profile.
      required: true
    - name: operation
      description: Whether to append or remove values.
      required: true
      auto: PREDEFINED
      predefined:
      - append
      - remove
    - name: values
      description: A comma-separated list of values to append or remove (1-10 per call). For remove, this is a case-sensitive exact match.
      isArray: true
    - name: indexes
      description: A comma-separated list of index positions to remove (1-10 per call). Only supported for remove.
      isArray: true
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: The profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: The profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: The profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: The profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: The profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: The number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: The label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: The profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: The user who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: The date and time when the profile was created, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: The user who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: The date and time when the profile was last modified, in ISO 8601 format (for example, 2026-01-01T12:00:00Z).
      type: date
  - name: netskopev2-delete-destination-profile
    description: Deletes a destination profile.
    arguments:
    - name: id
      description: The ID of the profile.
      required: true
    - name: interactive
      description: Whether to stage the deletion as pending instead of applying it immediately.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    outputs:
    - contextPath: Netskope.DestinationProfile.status
      description: The result status ('success' or 'pending-delete').
      type: string
  - name: netskopev2-deploy-destination-profiles
    description: Deploys staged (pending) changes for destination profiles. Maximum 50 profile IDs per call.
    arguments:
    - name: ids
      description: A comma-separated list of profile IDs to deploy (maximum 50).
      isArray: true
    - name: all
      description: Whether the all option is enabled. Deploy every pending profile. Requires ids to be empty. Only allowed when 50 or fewer profiles are pending.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    - name: change_note
