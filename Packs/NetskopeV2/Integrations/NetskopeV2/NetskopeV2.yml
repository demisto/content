category: Network Security
provider: Netskope
commonfields:
  id: Netskope (API v2)
  version: -1
configuration:
- display: URL of Netskope Tenant (e.g. https://tenant.goskope.com)
  name: url
  required: true
  type: 0
- display: API Key
  name: api_key
  required: false
  type: 4
  hidden: true
- name: api_key_credentials
  type: 9
  required: false
  displaypassword: API Key
  hiddenusername: true
- display: API v1 Token (for file hash list commands)
  name: api_v1_token
  type: 4
  required: false
  hidden: true
- name: api_v1_token_credentials
  required: false
  type: 9
  displaypassword: API v1 Token (for file hash list commands)
  hiddenusername: true
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
- display: Use system proxy settings
  name: proxy
  required: false
  type: 8
description: Manage Netskope policy enforcement workflows for URLs, domains, file hashes, destination and network profiles, device classification, private applications, file inspection, and URL reputation.
display: Netskope - Direct to Zero Trust
name: Netskope (API v2)
script:
  commands:
  - arguments:
    - description: Name of the URL list.
      name: list_name
      required: true
    - description: URLs to add to the list.
      isArray: true
      name: url
      required: true
    description: Add URLs to the Netskope URL block list.
    name: netskopev2-add-url
    outputs:
    - contextPath: Netskope.URLList.id
      description: URL List ID.
      type: number
    - contextPath: Netskope.URLList.name
      description: URL List name.
      type: string
    - contextPath: Netskope.URLList.data
      description: URL List contents.
    - contextPath: Netskope.URLList.data.urls
      description: List of URLs in URL List.
    - contextPath: Netskope.URLList.data.type
      description: URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.URLList.modify_by
      description: User which last modified URL List.
      type: string
    - contextPath: Netskope.URLList.modify_time
      description: Time which URL List was last modified.
      type: date
    - contextPath: Netskope.URLList.modify_type
      description: URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.URLList.pending
      description: URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments:
    - description: Name of the URL list.
      name: list_name
      required: true
    - description: URLs to remove from the list.
      isArray: true
      name: url
      required: true
    description: Remove URLs from the Netskope URL block list.
    name: netskopev2-remove-url
    outputs:
    - contextPath: Netskope.URLList.id
      description: URL List ID.
      type: number
    - contextPath: Netskope.URLList.name
      description: URL List name.
      type: string
    - contextPath: Netskope.URLList.data
      description: URL List contents.
    - contextPath: Netskope.URLList.data.urls
      description: List of URLs in URL List.
    - contextPath: Netskope.URLList.data.type
      description: URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.URLList.modify_by
      description: User which last modified URL List.
      type: string
    - contextPath: Netskope.URLList.modify_time
      description: Time which URL List was last modified.
      type: date
    - contextPath: Netskope.URLList.modify_type
      description: URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.URLList.pending
      description: URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments: []
    description: Get all applied and pending URL lists.
    name: netskopev2-get-lists
    outputs:
    - contextPath: Netskope.List.id
      description: URL List ID.
      type: number
    - contextPath: Netskope.List.name
      description: URL List name.
      type: string
    - contextPath: Netskope.List.data
      description: URL List contents.
    - contextPath: Netskope.List.data.urls
      description: List of URLs in URL List.
    - contextPath: Netskope.List.data.type
      description: URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.List.modify_by
      description: User which last modified URL List.
      type: string
    - contextPath: Netskope.List.modify_time
      description: Time which URL List was last modified.
      type: date
    - contextPath: Netskope.List.modify_type
      description: URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.List.pending
      description: URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments:
    - description: Name of the URL list.
      name: list_name
      required: true
    description: Get URL list by ID.
    name: netskopev2-get-list
    outputs:
    - contextPath: Netskope.List.id
      description: URL List ID.
      type: number
    - contextPath: Netskope.List.name
      description: URL List name.
      type: string
    - contextPath: Netskope.List.data
      description: URL List contents.
    - contextPath: Netskope.List.data.urls
      description: List of URLs in URL List.
    - contextPath: Netskope.List.data.type
      description: URL List type ('exact' or 'regex').
      type: string
    - contextPath: Netskope.List.modify_by
      description: User which last modified URL List.
      type: string
    - contextPath: Netskope.List.modify_time
      description: Time which URL List was last modified.
      type: date
    - contextPath: Netskope.List.modify_type
      description: URL List modification type ('Created', 'Edited' or 'Deleted').
      type: string
    - contextPath: Netskope.List.pending
      description: URL List pending status ('1' if pending, '0' if not).
      type: number
  - arguments: []
    description: View existing device classification tags. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-list-device-classification-tags
    outputs:
    - contextPath: Netskope.DeviceClassificationTag.id
      description: Device classification tag ID.
      type: number
    - contextPath: Netskope.DeviceClassificationTag.priority
      description: Device classification tag priority.
      type: number
    - contextPath: Netskope.DeviceClassificationTag.name
      description: Device classification tag name.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.description
      description: Device classification tag description.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.modifiedBy
      description: User which last modified the tag.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.modifiedTime
      description: Time the tag was last modified.
      type: date
    - contextPath: Netskope.DeviceClassificationTag.policyNames
      description: Names of policies referencing this classification tag.
      type: unknown
  - arguments:
    - description: Name of the device classification tag.
      name: name
      required: true
    - description: Description of the device classification tag.
      name: description
    description: Create a new device classification tag (label). Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-create-device-classification-tag
    outputs:
    - contextPath: Netskope.DeviceClassificationTag.ids
      description: IDs of the created device classification tag(s).
      type: unknown
    - contextPath: Netskope.DeviceClassificationTag.name
      description: Device classification tag name.
      type: string
    - contextPath: Netskope.DeviceClassificationTag.description
      description: Device classification tag description.
      type: string
  - arguments:
    - description: Name of the classification rule.
      name: name
      required: true
    - description: Name of the classification tag this rule applies (must already exist).
      name: label
      required: true
    - auto: PREDEFINED
      description: Operating system this rule applies to.
      name: os
      predefined:
      - windows
      - mac
      - linux
      - android
      - ios
      required: true
    - description: "JSON object describing the rule conditions, e.g. {\"$and\": [{\"device_tag_check\": {\"tag_id\": 1137}}]}."
      name: conditions
      required: true
    description: Create a device classification rule linking conditions (OS version, device tag presence, etc.) to a classification label. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-create-device-classification-rule
    outputs:
    - contextPath: Netskope.DeviceClassificationRule.ids
      description: IDs of the created device classification rule(s).
      type: unknown
    - contextPath: Netskope.DeviceClassificationRule.name
      description: Device classification rule name.
      type: string
    - contextPath: Netskope.DeviceClassificationRule.label
      description: Device classification tag name this rule applies.
      type: string
    - contextPath: Netskope.DeviceClassificationRule.os
      description: Operating system this rule applies to.
      type: string
  - arguments:
    - description: Unix timestamp for the start of the query window.
      name: start_time
      required: true
    - description: Unix timestamp for the end of the query window.
      name: end_time
      required: true
    - description: Comma-separated list of fields to return.
      name: fields
    description: Find devices by client status query, to resolve a device's nsdeviceuid before tagging it. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-find-device
    outputs:
    - contextPath: Netskope.Device.nsdeviceuid
      description: Netskope device UID.
      type: string
    - contextPath: Netskope.Device.hostname
      description: Device hostname.
      type: string
    - contextPath: Netskope.Device.os
      description: Device operating system.
      type: string
    - contextPath: Netskope.Device.client_version
      description: Netskope client version installed on the device.
      type: string
  - arguments:
    - description: Name of the device tag.
      name: name
      required: true
    - description: Description of the device tag.
      name: description
    description: Register a new device tag. Check netskopev2-list-device-tags first to avoid creating a duplicate. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-create-device-tag
    outputs:
    - contextPath: Netskope.DeviceTag.id
      description: Device tag ID.
      type: number
    - contextPath: Netskope.DeviceTag.name
      description: Device tag name.
      type: string
    - contextPath: Netskope.DeviceTag.description
      description: Device tag description.
      type: string
  - arguments:
    - description: Netskope device UID (nsdeviceuid) to look up tags for.
      name: device_id
      required: true
    description: Find existing device tags applied to a device. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-list-device-tags
    outputs:
    - contextPath: Netskope.DeviceTag.id
      description: Device tag ID.
      type: number
    - contextPath: Netskope.DeviceTag.name
      description: Device tag name.
      type: string
  - arguments:
    - description: Device tag ID(s) to apply. A device supports a maximum of 5 tags.
      isArray: true
      name: tag_id
      required: true
    - description: Netskope device UID(s) (nsdeviceuid) to apply the tag(s) to.
      isArray: true
      name: nsdeviceuid
      required: true
    - description: Hostname to associate with the device entries.
      name: hostname
    - description: User key to associate with the device entries. Defaults to the device UID if not provided.
      name: userkey
    description: Apply device tag(s) to one or more devices. This replaces all existing tags on the specified devices — it is not additive. Requires the Device Classification API (beta) to be enabled for the tenant.
    name: netskopev2-apply-device-tags
    outputs:
    - contextPath: Netskope.DeviceTagApplication.affected_device_tags
      description: Number of device tags affected.
      type: number
    - contextPath: Netskope.DeviceTagApplication.affected_device_classification_tags
      description: Number of device classification tags affected.
      type: number
    - contextPath: Netskope.DeviceTagApplication.message
      description: Result message.
      type: string
  - name: netskopev2-list-destination-profiles
    description: List and filter destination profiles.
    arguments:
    - name: fields
      description: Comma-separated list of fields to return. The id field is always returned.
    - name: offset
      description: Zero-based offset of the first item to return. Default is 0.
    - name: limit
      description: Maximum number of items to return. Default is 10, maximum is 100.
    - name: sortby
      description: 'Field to sort by: name, create_time, or modify_time.'
    - name: sortorder
      description: Sort order.
      auto: PREDEFINED
      predefined:
      - asc
      - desc
    - name: filter
      description: Filter expression, e.g. name co "eng" or status in ("pending-update","pending-delete").
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: Profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: Profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: Profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: Profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: Profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: Number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: Label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: Profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: Who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: When the profile was created.
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: Who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: When the profile was last modified.
      type: date
  - name: netskopev2-create-destination-profile
    description: Create a new destination profile.
    arguments:
    - name: name
      description: Name of the profile. Must be unique, maximum 100 characters.
      required: true
    - name: description
      description: Description of the profile. Maximum 200 characters.
    - name: values
      description: Values for the profile.
      isArray: true
    - name: type
      description: Profile match type.
      required: true
      auto: PREDEFINED
      predefined:
      - regex
      - sensitive
      - insensitive
    - name: label_ids
      description: Label IDs to associate with the profile.
      isArray: true
    - name: id
      description: Client-supplied ID for the profile. Must be a UUID if provided.
    - name: interactive
      description: If true, stage the change as pending instead of applying it immediately. Default is false.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    - name: details
      description: If false, omit the values array from the response.
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: Profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: Profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: Profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: Profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: Profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: Number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: Label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: Profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: Who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: When the profile was created.
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: Who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: When the profile was last modified.
      type: date
  - name: netskopev2-get-destination-profile
    description: Get a destination profile by ID.
    arguments:
    - name: id
      description: ID of the profile.
      required: true
    - name: details
      description: If false, omit the values array from the response.
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: Profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: Profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: Profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: Profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: Profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: Number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: Label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: Profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: Who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: When the profile was created.
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: Who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: When the profile was last modified.
      type: date
  - name: netskopev2-update-destination-profile
    description: Partially update a destination profile.
    arguments:
    - name: id
      description: ID of the profile.
      required: true
    - name: name
      description: New name for the profile.
    - name: description
      description: New description for the profile.
    - name: values
      description: New values for the profile (replaces the full list).
      isArray: true
    - name: type
      description: New profile match type. If provided, "values" must also be provided.
      auto: PREDEFINED
      predefined:
      - regex
      - sensitive
      - insensitive
    - name: label_ids
      description: New label IDs. An empty list clears existing labels.
      isArray: true
    - name: interactive
      description: If true, stage the change as pending instead of applying it immediately. Default is false.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: Profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: Profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: Profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: Profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: Profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: Number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: Label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: Profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: Who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: When the profile was created.
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: Who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: When the profile was last modified.
      type: date
  - name: netskopev2-update-destination-profile-values
    description: Append or remove values on a destination profile without replacing the full list.
    arguments:
    - name: id
      description: ID of the profile.
      required: true
    - name: operation
      description: Whether to append or remove values.
      required: true
      auto: PREDEFINED
      predefined:
      - append
      - remove
    - name: values
      description: Values to append or remove (1-10 per call). For remove, this is a case-sensitive exact match.
      isArray: true
    - name: indexes
      description: Index positions to remove (1-10 per call). Only supported for remove.
      isArray: true
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: Profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: Profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: Profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: Profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: Profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: Number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: Label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: Profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: Who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: When the profile was created.
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: Who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: When the profile was last modified.
      type: date
  - name: netskopev2-delete-destination-profile
    description: Delete a destination profile.
    arguments:
    - name: id
      description: ID of the profile.
      required: true
    - name: interactive
      description: If true, stage the deletion as pending instead of applying it immediately. Default is false.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    outputs:
    - contextPath: Netskope.DestinationProfile.status
      description: Result status ('success' or 'pending-delete').
      type: string
  - name: netskopev2-deploy-destination-profiles
    description: Deploy staged (pending) changes for destination profiles. Maximum 50 profile IDs per call.
    arguments:
    - name: ids
      description: Profile IDs to deploy (maximum 50).
      isArray: true
    - name: all
      description: Deploy every pending profile. Requires ids to be empty. Only allowed when 50 or fewer profiles are pending.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    - name: change_note
      description: Note describing the change. Maximum 100 characters.
    outputs:
    - contextPath: Netskope.DestinationProfileDeploy.applied
      description: IDs of the profiles that were applied.
      type: unknown
  - name: netskopev2-revert-destination-profile
    description: Revert a pending update or delete on a destination profile back to its applied version.
    arguments:
    - name: id
      description: ID of the profile.
      required: true
    - name: details
      description: If false, omit the values array from the response.
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: Profile ID.
      type: string
    - contextPath: Netskope.DestinationProfile.name
      description: Profile name.
      type: string
    - contextPath: Netskope.DestinationProfile.description
      description: Profile description.
      type: string
    - contextPath: Netskope.DestinationProfile.type
      description: Profile type ('regex', 'sensitive', or 'insensitive').
      type: string
    - contextPath: Netskope.DestinationProfile.values
      description: Profile values.
      type: unknown
    - contextPath: Netskope.DestinationProfile.values_count
      description: Number of values in the profile.
      type: number
    - contextPath: Netskope.DestinationProfile.label_ids
      description: Label IDs associated with the profile.
      type: unknown
    - contextPath: Netskope.DestinationProfile.status
      description: Profile status ('applied', 'pending-create', 'pending-update', or 'pending-delete').
      type: string
    - contextPath: Netskope.DestinationProfile.create_by
      description: Who created the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.create_time
      description: When the profile was created.
      type: date
    - contextPath: Netskope.DestinationProfile.modify_by
      description: Who last modified the profile.
      type: string
    - contextPath: Netskope.DestinationProfile.modify_time
      description: When the profile was last modified.
      type: date
  - name: netskopev2-get-destination-profile-applied-version
    description: Get the currently applied version of a destination profile, even if a pending change exists.
    arguments:
    - name: id
      description: ID of the profile.
      required: true
    outputs:
    - contextPath: Netskope.DestinationProfile.id
      description: Profile ID.
      type: string
