  - name: netskopev2-submit-file-scan
    description: 'Submit a password-protected .zip file for scan by the Netskope sandbox. Supported encryption: ZipCrypto. Supported member file types: .exe, .pdf, .doc, .xls, .ppt, .rtf. One file per zip, up to 16MB, up to 1000 requests per day.'
    arguments:
    - name: entry_id
      description: War Room entry ID of the .zip file to submit for scanning.
      required: true
    outputs:
    - contextPath: Netskope.FileScan.jobid
      description: Job ID to use with netskopev2-get-scan-report to retrieve the analysis report.
      type: string
    - contextPath: Netskope.FileScan.md5
      description: MD5 hash of the submitted file.
      type: string
    - contextPath: Netskope.FileScan.sha256
      description: SHA256 hash of the submitted file.
      type: string
    - contextPath: Netskope.FileScan.status
      description: Submission status.
      type: string
  - name: netskopev2-get-scan-report
    description: Get the sandbox analysis report for a file scan job. Up to 10,000 requests per day. Returns a 202-equivalent 'InProgress' status while the scan is still running.
    arguments:
    - name: jobid
      description: Job ID returned by netskopev2-submit-file-scan.
      required: true
    outputs:
    - contextPath: Netskope.FileScanReport.jobid
      description: Job ID of the scan.
      type: string
    - contextPath: Netskope.FileScanReport.md5
      description: MD5 hash of the scanned file.
      type: string
    - contextPath: Netskope.FileScanReport.sha256
      description: SHA256 hash of the scanned file.
      type: string
    - contextPath: Netskope.FileScanReport.status
      description: Scan status ('Ok' if the report is ready, 'InProgress' if the scan is still running).
      type: string
    - contextPath: Netskope.FileScanReport.verdict
      description: Sandbox verdict (e.g. 'malicious', 'benign'). Only present once status is 'Ok'.
      type: string
    - contextPath: Netskope.FileScanReport.av_detection
      description: Antivirus detection details.
      type: unknown
    - contextPath: Netskope.FileScanReport.dropped
      description: Files dropped by the sample during sandbox execution.
      type: unknown
    - contextPath: Netskope.FileScanReport.network
      description: Network activity observed during sandbox execution (DNS, HTTP, TCP/UDP, etc.).
      type: unknown
    - contextPath: Netskope.FileScanReport.observed_behavior
      description: Behavioral summary, grouped by MITRE-style category with severity scores.
      type: unknown
    - contextPath: Netskope.FileScanReport.process_tree
      description: Process tree observed during sandbox execution.
      type: unknown
  - name: netskopev2-url-lookup
    description: Bulk look up URL categorization/reputation info (up to 100 URLs per call). This is a licensed feature - Netskope returns an error if URL Lookup isn't enabled for the tenant.
    arguments:
    - name: urls
      description: URLs to look up (maximum 100 per call).
      isArray: true
      required: true
    - name: disable_dns_lookup
      description: If true, turn off DNS resolution and IP address matching on the queried URLs. Default is false.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: category
      description: Restrict which pre-defined category type is returned.
      auto: PREDEFINED
      predefined:
      - casb
      - swg
    outputs:
    - contextPath: Netskope.URLLookup.url
      description: The queried URL.
      type: string
    - contextPath: Netskope.URLLookup.site
      description: Site or app name associated with the URL.
      type: string
    - contextPath: Netskope.URLLookup.app
      description: Application name associated with the URL, if any (empty otherwise).
      type: string
    - contextPath: Netskope.URLLookup.dynamic_classification
      description: Whether the site was dynamically categorized based on website content.
      type: boolean
    - contextPath: Netskope.URLLookup.resolved_ip
      description: Resolved IP used for URL matching, if DNS resolution succeeded.
      type: string
    - contextPath: Netskope.URLLookup.categories.id
      description: Matched category ID.
      type: string
    - contextPath: Netskope.URLLookup.categories.name
