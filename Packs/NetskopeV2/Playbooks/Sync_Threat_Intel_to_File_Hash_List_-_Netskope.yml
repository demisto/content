inputs:
- key: Tags
  value: {}
  required: false
  description: Optional comma-separated indicator tags to further restrict which File indicators are pulled (e.g. "malware"). Leave empty to consider all File-type indicators.
  playbookInputQuery:
- key: ListName
  value: {}
  required: true
  description: Name of an existing Netskope file hash list. No tenant-specific fallback is used.
  playbookInputQuery:
- key: MaxIndicators
  value: {}
  required: false
  description: Maximum number of File indicators to pull from Cortex XSOAR per run (default 500 if left empty). Bounds how much work a single scheduled run does.
  playbookInputQuery:
- key: SkipTags
  value: {}
  required: false
  description: Optional comma-separated indicator tags to exclude.
  playbookInputQuery:
- key: IndicatorQuery
  value:
    simple: reputation:Bad and expirationStatus:active
  required: false
  description: Additional Cortex XSOAR indicator query. The default limits synchronization to active indicators with a Bad reputation.
  playbookInputQuery:
- key: AllowEmptyMirrorOverwrite
  value:
    simple: "false"
  required: false
  description: Whether to allow replacing the Netskope list when the Cortex XSOAR mirror is empty. Defaults to false.
  playbookInputQuery:
- key: CloseReason
  value:
    simple: Other
  required: false
  description: Close reason used for the recurring job incident.
  playbookInputQuery:
- key: CloseNotes
