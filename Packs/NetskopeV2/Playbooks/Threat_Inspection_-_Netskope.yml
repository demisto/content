inputs:
- key: EntryID
  value:
    simple: ${File.EntryID}
  required: true
  description: 'Entry ID of the file to submit for sandbox scanning. Defaults to ${File.EntryID} - the file already attached to the incident (via the War Room) - so no manual entry is needed if the incident has exactly one attached file. Must be one of: zip, exe, pdf, doc, xls, ppt, rtf (per the Netskope API spec, the file should be a password-protected .zip whose one member is exe/pdf/doc/xls/ppt/rtf - a plain .zip is also accepted directly). Anything else is rejected with a clear error by netskopev2-submit-file-scan itself.'
  playbookInputQuery:
- key: Interval
  value:
    simple: "1"
  required: false
  description: Minutes between each poll of the scan status.
  playbookInputQuery:
- key: Timeout
  value:
    simple: "15"
  required: false
  description: Maximum minutes to keep polling before giving up and resuming the playbook (sandbox scans can take a while).
  playbookInputQuery:
outputs: []
