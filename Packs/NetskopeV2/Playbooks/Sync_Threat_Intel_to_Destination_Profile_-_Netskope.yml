inputs:
- key: ProfileName
  value: {}
  required: true
  description: Name of the Netskope Destination Profile to sync indicators into. No tenant-specific fallback is used.
  playbookInputQuery:
- key: MatchType
  value:
    simple: regex
  required: false
  description: Match type to use only when creating a profile. One of sensitive, insensitive, or regex. Defaults to regex.
  playbookInputQuery:
- key: IndicatorTypes
  value:
    simple: Domain,URL,IP,CIDR
  required: false
  description: Comma-separated Cortex XSOAR indicator types to sync. One or more of Domain, URL, IP, and CIDR.
  playbookInputQuery:
- key: Tags
  value: {}
  required: false
  description: Optional comma-separated indicator tags to further restrict which indicators are pulled (e.g. "netskope-block"). Leave empty to consider all indicators regardless of tag.
  playbookInputQuery:
- key: SkipTags
  value: {}
  required: false
  description: Optional comma-separated indicator tags to exclude - any indicator carrying one of these tags is skipped even if it matches Tags. Leave empty to not exclude by tag.
  playbookInputQuery:
- key: MaxIndicators
  value: {}
  required: false
  description: Maximum number of indicators to pull from Cortex XSOAR per run (default 500 if left empty). Bounds how much work a single scheduled run does.
  playbookInputQuery:
- key: IndicatorQuery
  value:
    simple: reputation:Bad and expirationStatus:active
  required: false
  description: Additional Cortex XSOAR indicator query. The default limits synchronization to active indicators with a Bad reputation.
  playbookInputQuery:
- key: Deploy
  value:
    simple: "false"
  required: false
  description: Whether to deploy pending Destination Profile changes. Defaults to false.
  playbookInputQuery:
- key: ChangeNote
  value:
    simple: Threat Intel synchronization from Cortex XSOAR
  required: false
  description: Change note recorded when Deploy is true.
  playbookInputQuery:
- key: CloseReason
  value:
    simple: Other
  required: false
  description: Close reason used for the recurring job incident.
  playbookInputQuery:
- key: CloseNotes
  value:
    simple: Netskope Threat Intel synchronization completed.
  required: false
  description: Close notes used for the recurring job incident.
  playbookInputQuery:
