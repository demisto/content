inputs:
- key: ProfileName
  value:
    simple: Test02
  required: false
  description: Name of the Netskope Destination Profile to sync indicators into. Defaults to "Test02" - if this run's value ever comes through empty (e.g. a Job-triggered run on this instance, which doesn't apply this default automatically), the playbook falls back to the same "Test02" default set directly in task   #14, so keep both in sync if you change this.
  playbookInputQuery:
- key: MatchType
  value:
    simple: regex
  required: false
  description: Match type to use only if ProfileName doesn't exist yet and a new profile needs to be created - ignored when appending to an existing profile. One of "sensitive" (Exact - Case Sensitive), "insensitive" (Exact - Case Insensitive), or "regex" (RegEx). Defaults to "regex" - keep task   #14's fallback value in sync if you change this.
  playbookInputQuery:
- key: IndicatorTypes
  value:
    simple: Domain,URL,IP,CIDR
  required: false
  description: Comma-separated list of XSOAR indicator types to pull and sync into the profile. One or more of Domain, URL, IP, CIDR. Defaults to all four - keep task   #14's fallback value in sync if you change this.
  playbookInputQuery:
- key: Tags
  value: {}
  required: false
  description: Optional comma-separated indicator tags to further restrict which indicators are pulled (e.g. "netskope-block"). Leave empty to consider all indicators regardless of tag.
  playbookInputQuery:
- key: SkipTags
  value: {}
  required: false
  description: Optional comma-separated indicator tags to exclude - any indicator carrying one of these tags is skipped even if it matches Tags. Leave empty to not exclude by tag.
  playbookInputQuery:
- key: MaxIndicators
  value: {}
  required: false
  description: Maximum number of indicators to pull from XSOAR per run (default 500 if left empty). Bounds how much work a single scheduled run does.
  playbookInputQuery:
outputs: []
