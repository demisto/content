name: Grafana Cloud - New Service Account Token Without Expiry - by GoCortexIO
description: Detects a Grafana service account newly appearing in the inventory while holding a token that never expires, which is a persistent machine credential created outside the normal review cycle.
severity: SEV_030_MEDIUM
xql_query: |-
  // PROVENANCE
  //   Pattern:   a long-lived credential minted inside the tenant, turning temporary access
  //              into a durable one.
  //   ATT&CK:    T1098, T1098.001, T1136.003
  //   Basis:     library pattern. Corroborated by external rule sets, but no incident sits
  //              behind it. Those are different claims and only the second is evidence.
  //   References:
  //     https://attack.mitre.org/techniques/T1098/001/
  //     https://attack.mitre.org/techniques/T1136/003/
  //     SigmaHQ/sigma (Detection Rule License 1.1), splunk/security_content (Apache 2.0)
  //   Threshold: the age test is a window bounded by the collection interval, not a derived
  //              number. It carries a first-run burst, since on the first poll every token
  //              is newly observed.
  //   Sharper:   one principal creating a credential FOR ANOTHER. Not buildable here, as
  //              this feed is an inventory and does not name the creator. See FUTURE_PLANS.
  //   Suppression: on this polled snapshot the model sets xdm.target.resource.id = uid, the service account's stable OBJECT id, NOT a per-event id and NOT a log type id, so the single key uniquely identifies the account the finding is about and mutes only its own re-observation on the next poll.
  //   Category:  xdm.target.resource.type is in the `by` list only so user_defined_category can read it. The model assigns it as the bare literal "service_account" for every record of this dataset, so it is constant under this rule's own filter chain and adds no group, leaving min(_time) and the age filter below untouched.
  datamodel dataset = grafana_service_accounts_raw
  | filter xdm.target.resource.value contains "token_without_expiry"
  | comp min(_time) as first_seen, max(_time) as last_seen, count() as snapshots_seen, values(xdm.target.resource.name) as account_names, values(xdm.target.resource.sub_type) as account_roles, values(xdm.target.resource.value) as posture_markers by xdm.target.resource.id, xdm.target.resource.type, xdm.source.cloud.project, xdm.observer.name
  | alter first_seen_age_ms = subtract(to_epoch(current_time(), "MILLIS"), to_epoch(first_seen, "MILLIS"))
  | filter first_seen_age_ms < 10800000
  | fields xdm.target.resource.id, xdm.target.resource.type, xdm.source.cloud.project, xdm.observer.name, account_names, account_roles, posture_markers, first_seen, last_seen, snapshots_seen, first_seen_age_ms
alert_name: New Grafana service account with a non-expiring token
alert_category: User Defined
user_defined_category: xdm.target.resource.type
alert_description: A Grafana service account first appeared in the inventory of $xdm.observer.name within the last three hours, holding a token that never expires. The account is $account_names at role $account_roles, and its full posture is $posture_markers. Service accounts are Grafana's machine-credential surface and a token with no expiry is a permanent way back in, so a new one created outside the normal review cycle is worth confirming. Check who created it and why, whether the role is wider than the task needs, and whether the token should carry an expiry. Note this rule compares successive inventory snapshots rather than reading a creation event, because the Grafana instance API publishes no audit log, so it reports when the account first became visible to collection rather than when it was created.
alert_domain: DOMAIN_SECURITY
mitre_defs:
  TA0003 - Persistence:
  - T1098 - Account Manipulation
suppression_fields:
- xdm.target.resource.id
global_rule_id: c61791be-1907-4065-a11f-47a700b83ac1
is_enabled: true
alert_type: null
alert_fields: {}
execution_mode: SCHEDULED
search_window: 24 hours
timezone: Australia/Melbourne
crontab: '35 * * * *'
suppression_enabled: true
suppression_duration: 24 hours
dataset: alerts
investigation_query_link: dataset = grafana_service_accounts_raw | filter uid = $xdm.target.resource.id
drilldown_query_timeframe: ALERT
mapping_strategy: AUTO
action: ALERTS
fromversion: 8.4.0
