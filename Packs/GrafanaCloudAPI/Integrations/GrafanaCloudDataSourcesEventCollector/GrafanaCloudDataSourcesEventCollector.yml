commonfields:
  id: Grafana Cloud Data Sources Event Collector
  version: -1
name: Grafana Cloud Data Sources Event Collector
display: Grafana Cloud Data Sources Event Collector
category: Analytics & SIEM
description: Collect the Grafana data source inventory and ingest it into the Cortex Platform.
configuration:
- display: Grafana instance URL
  name: url
  type: 0
  required: true
  defaultvalue: https://your-stack.grafana.net
  additionalinfo: The Grafana instance base URL, for example https://your-stack.grafana.net.
- display: Service account token
  name: credentials
  type: 9
  required: true
  displaypassword: Service account token
  hiddenusername: true
  additionalinfo: 'A Grafana service account token (glsa_...) with the Admin role in the organisation being collected. Standalone API keys are deprecated in current Grafana and Grafana Cloud. Provide the token in the password field.'
- display: Events Fetch Interval
  name: eventFetchInterval
  type: 19
  required: false
  defaultvalue: "60"
  additionalinfo: How often the collector runs, in minutes. This is a snapshot of current configuration and changes rarely, so an hourly interval is appropriate and keeps ingestion proportionate.
- display: Maximum number of records per fetch
  name: max_fetch
  type: 0
  required: false
  defaultvalue: "5000"
  advanced: true
  additionalinfo: The maximum number of records to collect on each run.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  advanced: true
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.13.10404775
  isfetchevents: true
  commands:
  - name: grafana-datasources-get-events
    description: Manual command to retrieve and preview the Grafana data source inventory. Used for testing and development.
    arguments:
    - name: limit
      description: The maximum number of records to return.
      defaultValue: "50"
    - name: should_push_events
      description: If true, the fetched records are also pushed to the Cortex Platform dataset. Defaults to false.
      auto: PREDEFINED
      predefined:
      - "true"
      - "false"
      defaultValue: "false"
    outputs: []
fromversion: 6.8.0
marketplaces:
- marketplacev2
- platform
supportedModules:
- C1
- C3
- X1
- X3
- X5
- ENT_PLUS
tests:
- No tests (auto formatted)
