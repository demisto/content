inputs:
- key: NotificationTarget
  value:
    simple: ""
  required: false
  description: >-
    Recipient for Critical/High severity notifications (email address, Slack/Teams channel, or user - whichever
    matches the notification integration you have enabled). Leave empty to skip notification and rely on the
    manual remediation task alone.
  playbookInputQuery:
- key: AutoCloseReason
  value:
    simple: Resolved
  required: false
  description: >-
    closeReason used when auto-closing Low/Informational severity findings. Align this to your own close-reason
    taxonomy if needed.
  playbookInputQuery:
- key: AutoCloseNotes
  value:
    simple: Auto-closed by playbook - low/informational severity, no remediation required.
  required: false
  description: closeNotes used when auto-closing Low/Informational severity findings.
  playbookInputQuery:
- key: DuplicateCloseReason
  value:
    simple: Duplicate
  required: false
  description: closeReason used when auto-closing this incident as a duplicate of an already-open incident.
  playbookInputQuery:
- key: DuplicateCloseNotes
  value:
    simple: Auto-closed by playbook - duplicate of an already-open incident for Panorays Finding ID ${incident.panoraysfindingid}.
  required: false
  description: closeNotes used when auto-closing this incident as a duplicate of an already-open incident.
  playbookInputQuery:
