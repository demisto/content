    taskid: 82c18da9-78e5-4d8b-9106-ced25bf4ee49
    type: condition
    task:
      id: 82c18da9-78e5-4d8b-9106-ced25bf4ee49
      version: -1
      name: Is this a duplicate finding, and is this incident the newer one?
      description: >-
        PanoraysCheckOlderDuplicate only reports true if another open/pending incident exists for the same
        Finding ID with a lower incident ID. If true, this incident is the newer of the two and closes itself
        as a duplicate; the older incident is never touched, so two incidents created at nearly the same time
        can't both close in favor of the other.
      type: condition
      iscommand: false
      brand: ""
    conditions:
    - label: "yes"
      condition:
      - - operator: isEqualString
          left:
            value:
              simple: PanoraysDuplicateCheck.OlderDuplicateExists
            iscontext: true
          right:
            value:
              simple: "true"
          ignorecase: true
    nexttasks:
      "yes":
      - "3"
      '#default#':
      - "4"
    separatecontext: false
    view: |-
      {
        "position": {
          "x": 450,
          "y": 390
        }
      }

