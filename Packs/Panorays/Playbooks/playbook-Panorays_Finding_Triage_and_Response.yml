    task:
      id: b9d1f172-1cce-4d1e-841f-b1ca35a0eb28
      version: -1
      name: Check for an older open/pending duplicate incident
      description: >-
        Calls PanoraysCheckOlderDuplicate, which looks up other open/pending "Panorays Finding" incidents with
        the same Finding ID and a lower incident ID than this one, and returns a single explicit boolean output.
      script: '|||PanoraysCheckOlderDuplicate'
      type: regular
      iscommand: true
      brand: ""
    scriptarguments:
      finding_id:
        simple: ${incident.panoraysfindingid}
      incident_id:
        simple: ${incident.id}
    continueonerror: true
    nexttasks:
      '#none#':
      - "2"
    separatecontext: false
    view: |-
      {
        "position": {
          "x": 450,
          "y": 220
        }
      }

  "2":
