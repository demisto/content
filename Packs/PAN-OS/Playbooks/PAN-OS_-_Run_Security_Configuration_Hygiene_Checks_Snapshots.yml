description: 'POC (CRTX-291227). Same checks and outputs as ''PAN-OS - Run Security Configuration Hygiene Checks'', split into atomic commands: each pan-os-hygiene-get-snapshot task makes exactly one PAN-OS API call and stores the result as a file, and pan-os-hygiene-evaluate-snapshots runs the six existing hygiene checks on those files with no API calls.


  API calls: 2 + 2 per connected firewall.


  NOTE: This playbook is intended for use with a single PAN-OS Integration Instance connected to Panorama.'
id: PAN-OS - Run Security Configuration Hygiene Checks (Snapshots)
inputSections:
- description: Generic group for inputs
  inputs:
  - targetDevice
  name: General (Inputs group)
inputs:
- description: 'The serial number of a specific firewall to target (Used when connected to Panorama) [Optional].


    When connected to Panorama, leaving this blank will run the checks against Panorama configuration as well as all currently connected managed firewalls.'
  key: targetDevice
  playbookInputQuery:
  required: false
  value: {}
name: PAN-OS - Run Security Configuration Hygiene Checks (Snapshots)
outputSections:
- description: Generic group for outputs
  name: General (Outputs group)
  outputs:
  - PANOS.ConfigurationHygiene.Summary
  - PANOS.ConfigurationHygiene.Result
outputs:
- contextPath: PANOS.ConfigurationHygiene.Summary
  description: A list of hygiene check summaries (constructed as dictionaries) describing the overall result of hygiene checks and how many issues of each type were found, if any.
  type: unknown
- contextPath: PANOS.ConfigurationHygiene.Result
  description: A list of hygiene check results (constructed as dictionaries) including a description of the issue found, the configuration location (container name), and the name of the object affected by the issue.
  type: unknown
