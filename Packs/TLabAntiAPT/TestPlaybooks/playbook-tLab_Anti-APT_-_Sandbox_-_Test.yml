description: 'Smoke test for the tLab Anti-APT Sandbox integration.


  Deliberately submits nothing. A test that needs a malware sample needs one in the test environment too, and a build that fails for want of a sample teaches nobody anything. This exercises connectivity,
  authentication and the command surface, which is what breaks in practice.'
