inputs:
- key: File
  value:
    complex:
      root: File
      filters: []
      transformers: []
  required: false
  description: The file to detonate. Defaults to every file in the incident.
  playbookInputQuery: null
- key: Interval
  value:
    simple: '60'
  required: false
  description: How often to poll for the verdict, in seconds.
  playbookInputQuery: null
- key: Timeout
  value:
    simple: '1800'
  required: false
  description: How long to wait before giving up, in seconds.
  playbookInputQuery: null
- key: EnableNetwork
  value:
    simple: 'true'
  required: false
  description: Whether the sandbox may reach the internet during analysis.
  playbookInputQuery: null
- key: ResearchTime
  value: {}
  required: false
  description: Dynamic analysis duration in seconds. Empty uses the preset's own value.
  playbookInputQuery: null
- key: EnvPreset
  value: {}
  required: false
  description: Analysis environment preset. Empty uses the instance default.
  playbookInputQuery: null
- key: ArchivePassword
  value: {}
  required: false
  description: Password for a protected archive.
  playbookInputQuery: null
- key: EarlyVerdict
  value:
    simple: 'false'
  required: false
  description: Return as soon as a verdict is decided, without waiting for every stage to finish.
  playbookInputQuery: null
outputs:
- contextPath: TLabAntiAPT.Analysis
  description: The analysis result.
  type: Unknown
- contextPath: TLabAntiAPT.Analysis.Verdict
  description: Canonical verdict.
  type: String
- contextPath: TLabAntiAPT.Analysis.Score
  description: Sandbox score from 0 to 100.
  type: Number
- contextPath: TLabAntiAPT.Analysis.SampleReportId
  description: Sample report identifier.
  type: Number
- contextPath: TLabAntiAPT.Analysis.ReportUrl
  description: Link to the full report.
  type: String
- contextPath: DBotScore
  description: The DBot score object.
  type: Unknown
- contextPath: File
  description: The file object.
  type: Unknown
fromversion: 6.0.0
