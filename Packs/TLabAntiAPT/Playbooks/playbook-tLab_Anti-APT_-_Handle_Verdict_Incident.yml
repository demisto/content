inputs:
- key: SampleReportId
  value:
    complex:
      root: incident
      accessor: tlabsamplereportid
      filters: []
      transformers: []
  required: false
  description: Sample report to enrich. Defaults to the incident's own.
  playbookInputQuery: null
- key: AutoCloseBenign
  value:
    simple: 'true'
  required: false
  description: Whether an OK, CLEAN or WHITELIST verdict closes the incident automatically. Turn it off while tuning the verdict filter, so that what would have been closed stays visible.
  playbookInputQuery: null
