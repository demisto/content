args:
- name: dashboard_name
  required: true
  predefined:
  - Ingestion/Integration
  - Issues/Cases
  - Agent and Asset
  description: The dashboard to collect XQL query results from. Determines the expected widget count and the regex used to match widget names in the XQL query center history.
outputs:
- contextPath: HealthCheck.CollectResults
  description: Dictionary containing query results organized by xql_query_source_name. Each key represents a dashboard query, and its value contains the actual query results fetched via execution_id.
  type: Unknown
scripttarget: 0
polling: false
