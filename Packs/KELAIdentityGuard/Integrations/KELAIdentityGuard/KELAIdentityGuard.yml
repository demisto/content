display: KELA Identity Guard
name: KELAIdentityGuard
category: Data Enrichment & Threat Intelligence
provider: KELA
sectionorder:
- Connect
- Collect
commonfields:
  id: KELAIdentityGuard
  version: -1
configuration:
- defaultvalue: https://api.ke-la.com/bots-client-api/v1
  display: Server URL (e.g., https://api.ke-la.com/bots-client-api/v1)
  name: url
  required: true
  type: 0
  section: Connect
- displaypassword: API Key
  name: credentials
  required: true
  type: 9
  hiddenusername: true
  section: Connect
  additionalinfo: The KELA Identity Guard API token, generated through the platform. Sent as the "apiToken" query parameter on every request (not an auth header).
- display: Use system proxy settings
  name: proxy
  type: 8
  section: Connect
  advanced: true
  required: false
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  section: Connect
  advanced: true
  required: false
- display: Default Workspace ID
  name: workspace_id
  type: 0
  required: false
  section: Connect
  additionalinfo: Used when a command is called without an explicit workspace_id argument, and required for Fetch incidents.
- display: Fetch incidents
  name: isFetch
  type: 8
  section: Collect
  required: false
  supportedModules:
  - agentix
  - xsiam
- defaultvalue: '50'
  display: Maximum number of incidents per fetch (per source)
  name: max_fetch
  type: 0
  section: Collect
  required: false
  additionalinfo: Applied separately to each enabled source (general incidents, bot-market alerts, cookie incidents), so up to 3x this number of incidents can be created per fetch cycle.
  supportedModules:
  - agentix
  - xsiam
- defaultvalue: '3 days'
  display: First fetch time
  name: first_fetch
  additionalinfo: 'How far back to look for incidents on the very first fetch (applies to all enabled sources). Accepts a relative time, e.g. "3 days", "1 month", or an exact date.'
