id: IQ for TD Insight Response - Infoblox Cloud
version: -1
name: IQ for TD Insight Response - Infoblox Cloud
description: Collects the insight's full detail (including AI-generated recommendations), indicators, assets, and events. Executes the insight's pending recommendation actions along with undo option. If incident severity is Low, notifies the SOC and assigns an analyst; if severity is Medium, High, or Critical, creates a ServiceNow ticket. Updates the insight's workflow status on Infoblox at the end of the run.
