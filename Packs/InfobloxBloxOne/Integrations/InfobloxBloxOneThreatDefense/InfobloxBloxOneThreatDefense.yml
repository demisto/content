description: Infoblox Threat Defense with DDI integration leverages DNS as the first line of defense to detect and block cyber threats, while also using threat intelligence to manage SOC Insight incident response and enrich indicators.
display: 'Infoblox Threat Defense with DDI'
name: InfobloxBloxOneThreatDefense
script:
  commands:
  - arguments:
    - description: 'The type of indcator to search by. Available values: host, ip, url, hash, email.'
      name: indicator_type
      required: true
      auto: PREDEFINED
      predefined:
      - host
      - ip
      - url
      - hash
      - email
    - description: 'The indicator to search on.'
      name: value
      required: true
    - description: 'The sources to query. Multiple sources can be specified. If no source is specified, the call will search on all available sources. (You can see the list of the available sources by running bloxone-td-dossier-source-list).'
      isArray: true
      name: sources
    - description: 'The interval in seconds between each poll.'
      name: interval_in_seconds
      defaultValue: 10
    - description: 'The timeout in seconds until polling ends.'
      name: timeout
      defaultValue: 600
    - description: 'used for polling.'
      name: job_id
    description: 'The Dossier Lookup API returns detailed information on the specified indicator from the requested sources.'
    polling: true
    name: bloxone-td-dossier-lookup-get
    outputs:
    - contextPath: BloxOneTD.DossierLookup.source
      description: 'The Dossier source.'
      type: String
    - contextPath: BloxOneTD.DossierLookup.target
      description: The targeted indicator.
      type: String
    - contextPath: BloxOneTD.DossierLookup.task_id
      description: The Dossier task ID.
      type: String
    - contextPath: BloxOneTD.DossierLookup.type
      description: 'The indicator type.'
      type: String
  - name: bloxone-td-dossier-source-list
    description: Get available Dossier sources.
    outputs:
    - contextPath: BloxOneTD.DossierSource
      description: Available Dossier sources.
      type: String
  - arguments:
    - description: The free query filter argument.
      name: filter
    - description: Filter by target domain.
      name: target_domain
    - description: Filter by values that are greater than or equal to the given value. You can use ISO format (e.g. '2023-02-14T00:11:22Z') or use a relative time (e.g. "3 days").
      name: detected_at
    - description: Maximum number of results to return from the query.
      name: limit
      defaultValue: 50
    - description: Return results starting at this offset. Should be an integer. Default is 0.
      name: offset
    description: Get lookalike domain lists.
    polling: true
    name: bloxone-td-lookalike-domain-list
    outputs:
    - contextPath: BloxOneTD.LookalikeDomain.detected_at
      description: The date of the lookalike detection.
      type: Date
    - contextPath: BloxOneTD.LookalikeDomain.lookalike_domain
      description: The lookalike domain.
      type: String
    - contextPath: BloxOneTD.LookalikeDomain.lookalike_host
      description: 'The lookalike host.'
      type: String
    - contextPath: BloxOneTD.LookalikeDomain.reason
      description: The reason for the detection.
      type: String
    - contextPath: BloxOneTD.LookalikeDomain.target_domain
      description: The domain that was targeted by the lookalike domain.
      type: String
  - arguments:
    - description: |-
        Specify the IP addresses to block. Supports comma-separated values.
      name: ip
      isArray: true
      default: true
      required: true
    - description: Specify the name of the custom list to add the given IP addresses to.
      name: custom_list_name
      defaultValue: Default Block
      required: false
    - auto: PREDEFINED
      description: Specify the type of the custom list to add the given IP addresses to.
      name: custom_list_type
      predefined:
      - default_block
      - custom_list
      - threat_insight
      - dga
      - dnsm
      - zero_day_dns
      - threat_insight_nde
      defaultValue: default_block
      required: false
    description: The given IP addresses will be added to the provided block list.
    name: infobloxcloud-block-ip
    outputs:
    - contextPath: InfobloxCloud.CustomList.id
      description: The ID of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.name
      description: The name of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.type
      description: The type of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.items
      description: The items in the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.items_described
      description: The items described in the custom list.
      type: Array
    - contextPath: InfobloxCloud.CustomList.item_count
      description: The number of items in the custom list.
      type: Number
    - contextPath: InfobloxCloud.CustomList.confidence_level
      description: The confidence level of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.created_time
      description: The time the custom list was created.
      type: String
    - contextPath: InfobloxCloud.CustomList.last_updated_time
      description: The time the custom list was last updated.
      type: String
    - contextPath: InfobloxCloud.CustomList.description
      description: The description of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.policies
      description: The policies of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.tags
      description: The tags of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.type
      description: The type of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.threat_level
      description: The threat level of the custom list.
      type: String
  - arguments:
    - description: |-
        Specify the IP addresses to unblock. Supports comma-separated values.
      name: ip
      isArray: true
      default: true
      required: true
    - description: Specify the name of the custom list to add the given IP addresses to.
      name: custom_list_name
      defaultValue: Default Allow
      required: false
    - auto: PREDEFINED
      description: Specify the type of the custom list to add the given IP addresses to.
      name: custom_list_type
      predefined:
      - default_allow
      - custom_list
      - threat_insight
      - threat_insight_nde
      defaultValue: default_allow
      required: false
    description: The given IP addresses will be added to the provided allow list.
    name: infobloxcloud-unblock-ip
    outputs:
