      description: The type of the custom list.
      type: String
    - contextPath: InfobloxCloud.CustomList.threat_level
      description: The threat level of the custom list.
      type: String
  - arguments:
    - description: |-
        Specify the Domains to unblock. Supports comma-separated values.
      name: domain
