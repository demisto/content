commonfields:
  id: Gurucul-GRA
  version: -1
name: Gurucul-GRA
display: Gurucul-GRA
sectionorder:
- Connect
- Collect
category: Data Enrichment & Threat Intelligence
provider: Gurucul
description: Gurucul Risk Analytics (GRA) is a Unified Security and Risk Analytics platform.
configuration:
- display: Server URL (e.g. https://example.net)
  name: url
  defaultvalue: https://example.net
  type: 0
  section: Connect
  required: true
- display: Authorization Key
  name: apikey
  type: 4
  section: Connect
  required: true
- display: Trust any certificate (not secure)
  name: insecure
  defaultvalue: "false"
  type: 8
  section: Connect
  advanced: true
  required: false
- display: Use system proxy settings
  name: proxy
  defaultvalue: "false"
  type: 8
  section: Connect
  advanced: true
  required: false
- display: Fetch incidents
  name: isFetch
  type: 8
  section: Collect
  required: false
- display: Incident type
  name: incidentType
  type: 13
  section: Collect
  required: false
- display: Incidents Fetch Interval
  name: incidentFetchInterval
  defaultvalue: '1'
  required: false
  type: 19
  section: Collect
  advanced: true
- display: First fetch time
  name: first_fetch
  defaultvalue: 3 days
  type: 0
  section: Collect
  required: false
  additionalinfo: The first-fetch time window is used only when no maxIncidentId/maxAlertId cursor exists yet. Later fetches use the ID cursor only.
- display: Maximum number of incidents per fetch
  name: max_fetch
  defaultvalue: "25"
  type: 0
  section: Collect
  required: false
- display: Fetch type
  name: fetch_type
  type: 15
  section: Collect
  required: false
  defaultvalue: Incidents
  options:
  - Incidents
  - Alerts
  additionalinfo: The objects to import from GRA. Cases are no longer fetched. Legacy GRACase incidents remain actionable via gra-case-* commands. Use a separate instance for Alerts. Default Fetch type is Incidents. New instances default to Mapper (incoming) GRAIncident-Mapper and Incident type GRAIncident. On an Alerts instance, set Fetch type to Alerts, Mapper (incoming) to GRAAlert-Mapper, and Incident type to GRAAlert. After the first bootstrap, fetch continues with maxIncidentId or maxAlertId only.
- display: GRA server timezone
  name: gra_server_timezone
  defaultvalue: UTC
  type: 0
  section: Collect
  required: false
  additionalinfo: Timezone of the GRA server (IANA id, for example UTC). Used when fetching Incidents and Alerts. Not used for First fetch time. Default UTC.
