inputs:
- key: UserEmail
  value: {}
  required: true
  description: Sprinklr user email to investigate.
  playbookInputQuery: null
- key: AuthorID
  value: {}
  required: true
  description: Sprinklr authorId used to retrieve recent Reporting API activity.
  playbookInputQuery: null
- key: UserID
  value: {}
  required: true
  description: Sprinklr SCIM user ID for containment/deprovision actions.
  playbookInputQuery: null
- key: Lookback
