  required: true
  description: Activity lookback window.
  playbookInputQuery: null
- key: ConfirmDeactivate
  value:
    simple: 'False'
  required: true
  description: Set to True only after analyst approval to deactivate the user.
  playbookInputQuery: null
- key: ConfirmDeprovision
  value:
    simple: 'False'
  required: true
  description: Set to True to enable the destructive path. A separate interactive analyst confirmation is still required before SCIM deprovisioning.
  playbookInputQuery: null
