commonfields:
  id: CognyteLuminarV3
  version: -1
name: CognyteLuminarV3
display: Cognyte Luminar V3 Feed
category: Data Enrichment & Threat Intelligence
provider: Cognyte
sectionorder:
- Connect
- Collect
description: Fetches intelligence-based IOCs and customer-related leaked records identified by Luminar, using the Luminar TAXII 2.1 external API.
configuration:
- name: luminar_base_url
  display: Luminar Base URL
  defaultvalue: https://www.cyberluminar.com
  type: 0
  required: true
  section: Connect
  additionalinfo: The Luminar API base URL.
- name: luminar_account_id
  display: Luminar API Account ID
  type: 0
  required: true
  section: Connect
  additionalinfo: The Luminar API account ID (TAXII realm name).
- name: credentials
  display: Client ID
  displaypassword: Client Secret
  type: 9
  required: true
  section: Connect
  additionalinfo: The Luminar API client credentials. The Client ID goes in the identifier field and the Client Secret in the password field.
- name: proxy
  display: Use system proxy settings
  type: 8
  required: false
  section: Connect
  advanced: true
  additionalinfo: Whether to use the system proxy settings.
- name: insecure
  display: Trust any certificate (not secure)
  type: 8
  required: false
  section: Connect
  advanced: true
  additionalinfo: Whether to trust any certificate (not secure).
- name: first_fetch
  display: First Fetch Time
  defaultvalue: 7 days
  type: 0
  required: false
  section: Collect
  additionalinfo: The first fetch time range or date for incremental fetching (e.g. "7 days", "2026-01-01T00:00:00Z"). On the first fetch, indicators added to the collections after this time are ingested.
- name: feed
  display: Fetch indicators
  defaultvalue: 'true'
  type: 8
  required: false
  section: Collect
- name: feedReputation
  display: Indicator Reputation
  defaultvalue: feedInstanceReputationNotSet
  type: 18
  required: false
  section: Collect
  options:
  - None
  - Good
  - Suspicious
  - Bad
  additionalinfo: Indicators from this integration instance will be marked with this reputation
- name: feedReliability
  display: Source Reliability
  defaultvalue: F - Reliability cannot be judged
  type: 15
  required: true
  section: Collect
  options:
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
  additionalinfo: Reliability of the source providing the intelligence data
- name: feedExpirationPolicy
  display: ''
  type: 17
  required: false
  section: Collect
  options:
  - never
  - interval
  - indicatorType
  - suddenDeath
- name: feedExpirationInterval
  display: ''
  type: 1
  required: false
  section: Collect
- name: feedFetchInterval
  display: Feed Fetch Interval
  defaultvalue: "480"
  type: 19
  required: false
  section: Collect
  additionalinfo: The interval (in minutes) at which the feed fetches indicators.
- name: feedTags
  display: Tags
  type: 0
  required: false
  section: Collect
  additionalinfo: Supports CSV values.
- name: tlp_color
  display: Traffic Light Protocol Color
  type: 15
  required: false
  section: Collect
  options:
  - RED
  - AMBER
  - GREEN
  - WHITE
  additionalinfo: The Traffic Light Protocol (TLP) designation to apply to indicators fetched from the feed.
- name: include_leaked_credential
  display: Include Leaked Credentials
  type: 8
  required: false
  section: Collect
  advanced: true
  additionalinfo: Whether to store the plaintext leaked credential in the Account indicator's Luminar Leaked Credential field. When not selected, a masked value is stored so customer passwords are not exposed in TIM.
- name: feedBypassExclusionList
  display: Bypass exclusion list
  type: 8
  required: false
  section: Collect
  additionalinfo: Whether to bypass the exclusion list for indicators from this feed. When selected, the exclusion list is ignored for indicators from this feed. This means that if an indicator from this feed is on the exclusion list, the indicator might still be added to the system.
- name: feedIncremental
  display: Incremental Feed
  defaultvalue: 'true'
  type: 8
  hidden: true
  required: false
  section: Collect
  additionalinfo: Whether to use an incremental feed. Incremental feeds pull only new or modified indicators that have been sent from the integration. As the determination if the indicator is new or modified happens on the 3rd-party vendor's side, and only indicators that are new or modified are sent to Cortex XSOAR, all indicators coming from these feeds are labeled new or modified.
script:
  commands:
  - name: luminar-v3-get-indicators
    arguments:
    - name: limit
      defaultValue: '50'
      description: The maximum number of indicators to return.
    - name: from_date
      description: 'The date from which to return objects added to the collection (used as the TAXII "added_after" filter). Accepts a date range (e.g. "7 days") or an ISO date (e.g. "2026-01-01T00:00:00Z").'
    description: Gets Luminar indicators from the IOCs collection. Related objects' fields are appended as `<stix-type>-<field>` columns (e.g. malware-Value, threat-actor-aliases).
    outputs:
    - contextPath: LuminarV3.Indicators.Type
      description: The indicator type.
      type: String
    - contextPath: LuminarV3.Indicators.Value
      description: The indicator value.
      type: String
    - contextPath: LuminarV3.Indicators.Occurred
      description: The date the indicator occurred in ISO 8601 format (e.g. 2026-01-15T12:34:56Z).
      type: Date
    - contextPath: LuminarV3.Indicators.stixid
      description: The STIX ID of the indicator object.
      type: String
    - contextPath: LuminarV3.Indicators.tags
      description: The indicator tags.
      type: String
    - contextPath: LuminarV3.Indicators.luminarscore
      description: The Luminar score of the indicator.
      type: Number
    - contextPath: LuminarV3.Indicators.description
      description: The indicator description.
      type: String
    - contextPath: LuminarV3.Indicators.confidence
      description: The indicator confidence.
      type: String
    - contextPath: LuminarV3.Indicators.malwarefamily
      description: The malware family associated with the indicator.
      type: String
    - contextPath: LuminarV3.Indicators.actor
      description: The threat actors associated with the indicator.
      type: String
  - name: luminar-v3-get-leaked-records
    arguments:
    - name: limit
      defaultValue: '50'
      description: The maximum number of leaked records to return.
    - name: from_date
      description: 'The date from which to return objects added to the collection (used as the TAXII "added_after" filter). Accepts a date range (e.g. "7 days") or an ISO date (e.g. "2026-01-01T00:00:00Z").'
    description: Gets Luminar leaked records (leaked credentials) from the Leaked Records collection. Related objects' fields are appended as `<stix-type>-<field>` columns (e.g. incident-name, incident-luminarthreatscore).
    outputs:
    - contextPath: LuminarV3.LeakedCredentials.Type
      description: The indicator type (Account).
      type: String
    - contextPath: LuminarV3.LeakedCredentials.Value
      description: The account login of the leaked credential.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.Occurred
      description: The date the record occurred in ISO 8601 format (e.g. 2026-01-15T12:34:56Z).
      type: Date
    - contextPath: LuminarV3.LeakedCredentials.stixid
      description: The STIX ID of the user-account object.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.accounttype
      description: The account type (LEAKED CREDENTIAL).
      type: String
    - contextPath: LuminarV3.LeakedCredentials.username
      description: The account login.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.emailaddress
      description: The email address associated with the leaked account.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.luminarleakedcredential
      description: The leaked credential.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.luminarleaksource
      description: The source where the credential was leaked.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.luminarleakurl
      description: The URL associated with the leaked credential.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.luminarincidentname
      description: The name of the related Luminar incident.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.luminarincidentdescription
      description: The description of the related Luminar incident.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.luminarthreatscore
      description: The Luminar threat score of the related incident.
      type: Number
    - contextPath: LuminarV3.LeakedCredentials.luminarcomputername
      description: The computer name associated with the leaked record.
      type: String
    - contextPath: LuminarV3.LeakedCredentials.luminarcollectiondate
      description: The date the record was collected by Luminar in ISO 8601 format (e.g. 2026-01-15T12:34:56Z).
      type: Date
    - contextPath: LuminarV3.LeakedCredentials.tags
      description: The record tags.
      type: String
  - name: luminar-v3-reset-fetch-indicators
    description: Resets your fetch history.
  dockerimage: demisto/python3:3.12.13.10116658
  feed: true
  runonce: false
  script: '-'
  subtype: python3
  type: python
tests:
- No tests (auto formatted)
fromversion: 6.9.0
