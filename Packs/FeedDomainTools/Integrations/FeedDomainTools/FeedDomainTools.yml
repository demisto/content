- display: Top
  name: top
  defaultvalue: 5000
  required: false
  hidden: false
  type: 0
  additionalinfo: Limits the number of results in the response payload. Defaults to 5000.
  section: Collect
- display: Feed Type
  name: feed_type
  defaultvalue: ALL
