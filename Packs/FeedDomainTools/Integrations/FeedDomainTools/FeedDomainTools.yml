category: Data Enrichment & Threat Intelligence
commonfields:
  id: FeedDomainTools
  version: -1
configuration:
- additionalinfo: API Username and API Key
  display: API Username
  displaypassword: API Key
  name: credentials
  type: 9
  required: true
  section: Connect
- display: Session ID
  name: session_id
  defaultvalue: dt-cortex-feeds
  required: false
  hidden: false
  type: 0
  section: Collect
  additionalinfo: The session id to serve as unique identifier. On it's initial use, it will retrieve data from the past 5 days. Defaults to 'dt-cortex-feeds'.
- display: After
  name: after
  defaultvalue: "-3600"
  required: false
  hidden: false
