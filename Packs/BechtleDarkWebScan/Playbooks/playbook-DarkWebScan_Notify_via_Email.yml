          ID: ${inputs.IssueID}<br>
          <br>
          Severity: ${inputs.Severity}<br>
          <br>
          Description: ${inputs.Details}<br>
          Affected Username: ${issue.labels.username}<br>
          <br>
          Link to Incident: ${demistoUrls.investigation}<br>
          <br>

