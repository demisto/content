    type: regular
    task:
      id: b1111111-c222-4d33-8e44-f55555555503
      version: -1
      name: Get blast radius from Hydden
      description: Call hydden-blast-radius with the Cortex name or email from the alert. The command looks up a unique Hydden UUID via GET /accounts/lookup, then GET /blast-radius.
      script: 'Hydden Control|||hydden-blast-radius'
      type: regular
      iscommand: true
      brand: Hydden Control
    scriptarguments:
      account_id:
        complex:
          root: Hydden.Input
          accessor: AccountId
          transformers:
          - operator: uniq
          - operator: atIndex
            args:
              index:
                value:
                  simple: "0"
    separatecontext: false
    continueonerrortype: ""
    view: |-
