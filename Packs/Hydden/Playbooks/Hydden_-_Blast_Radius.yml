    isautoswitchedtoquietmode: false
  "1":
    id: "1"
    taskid: b1111111-c222-4d33-8e44-f55555555502
    type: regular
    task:
      id: b1111111-c222-4d33-8e44-f55555555502
      version: -1
      name: Set account ID
      description: Stage a single account identifier from the alert under Hydden.Input.AccountId.
      scriptName: SetAndHandleEmpty
      type: regular
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "2"
    scriptarguments:
      key:
        simple: Hydden.Input.AccountId
      value:
