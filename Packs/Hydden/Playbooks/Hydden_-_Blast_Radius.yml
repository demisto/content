id: Hydden - Blast Radius
version: -1
name: Hydden - Blast Radius
description: When a Cortex issue flags an account, take the account ID from the issue and get its blast radius from Hydden Control. Returns Hydden.Identity.blast_radius as a string.
starttaskid: "0"
fromversion: "6.10.0"
inputs:
- key: AccountId
  value:
    complex:
      root: alert
      accessor: username
  required: true
  description: Cortex account ID from the issue. Defaults to the alert username.
  playbookInputQuery:
- key: AccountIdFallback
  value:
    simple: ${incident.username}
  required: false
  description: Incident username when the alert username is empty.
  playbookInputQuery:
outputs:
- contextPath: Hydden.Identity.blast_radius
  description: Blast radius information from Hydden Control.
  type: string
tasks:
  "0":
    id: "0"
    taskid: b1111111-c222-4d33-8e44-f55555555501
    type: start
    task:
      id: b1111111-c222-4d33-8e44-f55555555501
      version: -1
      name: ""
      description: ""
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "1"
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 50
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "1":
    id: "1"
    taskid: b1111111-c222-4d33-8e44-f55555555502
    type: regular
    task:
      id: b1111111-c222-4d33-8e44-f55555555502
      version: -1
      name: Set account ID
      description: Use the alert username from the issue. Fall back to the incident username if that field is empty.
      scriptName: SetAndHandleEmpty
      type: regular
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "2"
    scriptarguments:
      key:
        simple: Hydden.Identity.id
      value:
        complex:
          root: inputs.AccountId
          transformers:
          - operator: SetIfEmpty
            args:
              defaultValue:
                simple: ${inputs.AccountIdFallback}
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 200
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "2":
    id: "2"
    taskid: b1111111-c222-4d33-8e44-f55555555503
    type: regular
    task:
      id: b1111111-c222-4d33-8e44-f55555555503
      version: -1
      name: Get blast radius from Hydden
      description: Call hydden-blast-radius with the account ID from the issue. Sets Hydden.Identity.blast_radius to the blast radius information string.
      script: 'Hydden Control|||hydden-blast-radius'
      type: regular
      iscommand: true
      brand: Hydden Control
    scriptarguments:
      account_id:
        simple: ${Hydden.Identity.id}
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 380
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
view: |-
