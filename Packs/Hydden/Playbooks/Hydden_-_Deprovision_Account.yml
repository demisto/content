    taskid: c1111111-d222-4e33-8f44-a55555555503
    type: regular
    task:
      id: c1111111-d222-4e33-8f44-a55555555503
      version: -1
      name: Deprovision account in Hydden
      description: Call hydden-deprovision-account with the Cortex name or email from the alert. The command looks up a unique Hydden UUID via GET /accounts/lookup, then POST /account-actions/deprovision. Sets Hydden.Identity.deprovisioned to true when Hydden accepts the request; deprovisioning then runs asynchronously.
      script: 'Hydden Control|||hydden-deprovision-account'
      type: regular
      iscommand: true
      brand: Hydden Control
    scriptarguments:
      account_id:
        complex:
          root: Hydden.Input
          accessor: AccountId
          transformers:
          - operator: uniq
    separatecontext: false
    continueonerrortype: ""
