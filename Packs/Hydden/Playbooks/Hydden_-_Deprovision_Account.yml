      version: -1
      name: Set account ID
      description: Stage a single account identifier from the alert under Hydden.Input.AccountId.
      scriptName: SetAndHandleEmpty
      type: regular
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "2"
    scriptarguments:
      key:
        simple: Hydden.Input.AccountId
      value:
        complex:
          root: inputs.AccountId
          transformers:
          - operator: uniq
