id: Hydden - Deprovision Account
version: -1
name: Hydden - Deprovision Account
description: When a Cortex issue indicates a compromised or otherwise high-risk account, take the account name or email from the alert and deprovision it with Hydden Control. The command looks up a unique Hydden UUID first. An analyst must confirm before deprovision unless RequireApproval is explicitly False.
starttaskid: "0"
fromversion: "8.3.0"
inputs:
- key: AccountId
  value:
    simple: ${alert.username}
  required: true
  description: Cortex account name or email from the alert. Defaults to ${alert.username}.
  playbookInputQuery:
- key: RequireApproval
  value:
    simple: "True"
  required: false
  description: Skip the confirmation task only when this is False. Any other value waits for an analyst to confirm.
  playbookInputQuery:
outputs:
- contextPath: Hydden.Identity.deprovisioned
  description: Whether Hydden Control deprovisioned the account.
  type: boolean
tasks:
  "0":
    id: "0"
    taskid: c1111111-d222-4e33-8f44-a55555555501
    type: start
    task:
      id: c1111111-d222-4e33-8f44-a55555555501
      version: -1
      name: ""
      description: ""
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "1"
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 50
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "1":
    id: "1"
    taskid: c1111111-d222-4e33-8f44-a55555555502
    type: regular
    task:
      id: c1111111-d222-4e33-8f44-a55555555502
      version: -1
      name: Set account ID
      description: Stage a single account identifier from the alert under Hydden.Input.AccountId.
      scriptName: SetAndHandleEmpty
      type: regular
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "2"
    scriptarguments:
      key:
        simple: Hydden.Input.AccountId
      value:
        complex:
          root: inputs.AccountId
          transformers:
          - operator: uniq
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 200
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "2":
    id: "2"
    taskid: c1111111-d222-4e33-8f44-a55555555505
    type: condition
    task:
      id: c1111111-d222-4e33-8f44-a55555555505
      version: -1
      name: Require approval?
      description: Skip confirmation only when RequireApproval is explicitly False.
      type: condition
      iscommand: false
      brand: ""
    nexttasks:
      '#default#':
      - "3"
      "no":
      - "4"
    separatecontext: false
    conditions:
    - label: "no"
      condition:
      - - ignorecase: true
          left:
            iscontext: true
            value:
              simple: inputs.RequireApproval
          operator: isEqualString
          right:
            value:
              simple: "False"
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 380
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
