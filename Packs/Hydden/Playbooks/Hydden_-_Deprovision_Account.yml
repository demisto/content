    taskid: c1111111-d222-4e33-8f44-a55555555505
    type: condition
    task:
      id: c1111111-d222-4e33-8f44-a55555555505
      version: -1
      name: Require approval?
      description: When RequireApproval is True, wait for an analyst to confirm before deprovisioning.
      type: condition
      iscommand: false
      brand: ""
    nexttasks:
      '#default#':
      - "4"
