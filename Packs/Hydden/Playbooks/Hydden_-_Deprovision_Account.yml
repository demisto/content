    type: condition
    task:
      id: c1111111-d222-4e33-8f44-a55555555504
      version: -1
      name: Confirm deprovision
      description: Analyst must confirm before Hydden deprovisions the account. The account to be deprovisioned is in context key Hydden.Input.AccountId.
      type: condition
      iscommand: false
      brand: ""
    nexttasks:
      "yes":
