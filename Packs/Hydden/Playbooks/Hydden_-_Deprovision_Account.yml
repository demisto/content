id: silent-Hydden - Deprovision Account
version: -1
name: silent-Hydden - Deprovision Account
description: When a Cortex issue indicates a compromised or otherwise high-risk account, take the account name or email from the alert and deprovision it with Hydden Control. The command looks up a unique Hydden UUID first. When RequireApproval is True, an analyst must confirm before deprovision runs.
starttaskid: "0"
fromversion: "8.9.0"
inputs:
- key: AccountId
  value:
    simple: ${alert.username}
  required: true
  description: Cortex account name or email from the alert. Defaults to ${alert.username}.
  playbookInputQuery:
- key: RequireApproval
  value:
    simple: "True"
  required: false
  description: When True, wait for an analyst to confirm before deprovisioning.
  playbookInputQuery:
outputs:
- contextPath: Hydden.Identity.deprovisioned
  description: Whether Hydden Control deprovisioned the account.
  type: boolean
tasks:
  "0":
    id: "0"
    taskid: c1111111-d222-4e33-8f44-a55555555501
    type: start
    task:
      id: c1111111-d222-4e33-8f44-a55555555501
      version: -1
      name: ""
      description: ""
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "1"
    separatecontext: false
    continueonerrortype: ""
    view: |-
