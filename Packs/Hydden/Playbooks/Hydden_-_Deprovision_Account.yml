      version: -1
      name: Deprovision account in Hydden
      description: Call hydden-deprovision-account with the Cortex name or email from the alert. The command looks up a unique Hydden UUID via GET /accounts/lookup, then POST /account-actions/deprovision. Sets Hydden.Identity.deprovisioned to true on success.
