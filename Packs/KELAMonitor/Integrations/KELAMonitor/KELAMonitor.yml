  - name: kela-monitor-incident-scroll
    description: Continues a kela-monitor-incident-list request using its scroll ID. Repeat until no incidents are returned. A scroll ID is valid for 2 minutes.
    arguments:
    - name: scroll_id
      required: true
      description: The scroll ID returned by kela-monitor-incident-list or by a previous scroll. It is valid for 2 minutes.
    - name: monitor_id
      description: Monitor ID. Defaults to the Monitor ID configured on the instance.
    outputs:
