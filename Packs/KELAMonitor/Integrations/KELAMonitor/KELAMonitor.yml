category: Data Enrichment & Threat Intelligence
provider: KELA
sectionorder:
- Connect
- Collect
commonfields:
  id: KELAMonitor
  version: -1
configuration:
- display: Server URL
  name: url
  type: 0
  defaultvalue: https://platform.ke-la.com/api/monitor
  required: true
  section: Connect
  additionalinfo: Base URL of the KELA Monitor API.
- displaypassword: API Token
  name: credentials
  type: 9
  hiddenusername: true
  required: true
  section: Connect
  additionalinfo: API token of a dedicated KELA platform user, generated under Settings (bottom-left) > API access. The token is per user and can be rotated. It is sent in the apiToken HTTP header (not in the URL) and is masked in the integration's logs and error messages.
- display: Monitor ID
  name: monitor_id
  type: 0
  required: true
  section: Connect
  additionalinfo: Numeric ID of the monitor to connect to. It appears in the Monitor module URL, under the monitorId parameter. Create one instance per monitor.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  section: Connect
  advanced: true
  additionalinfo: When selected, certificates are not checked (not secure). Use it only for testing.
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
  advanced: true
  additionalinfo: When selected, requests go through the proxy configured on the server or engine.
- display: Fetch incidents
  name: isFetch
  type: 8
  required: false
  section: Collect
  additionalinfo: Creates a Cortex incident for every new KELA Monitor incident of the selected incident types.
  supportedModules:
  - agentix
  - xsiam
- display: Incident type
  name: incidentType
  type: 13
  required: false
  section: Collect
  additionalinfo: Leave empty. The KELA Monitor classifier sets one Cortex incident type per KELA incident type.
  supportedModules:
  - agentix
  - xsiam
- display: Incidents Fetch Interval
  name: incidentFetchInterval
  type: 19
  defaultvalue: '1'
  required: false
  section: Collect
  additionalinfo: How often a fetch cycle runs. A cycle may take several minutes when it reads a large backlog.
  supportedModules:
  - agentix
  - xsiam
- display: Incident types to fetch
  name: incident_types
  type: 16
  required: false
  section: Collect
  options:
  - hacking_discussions
  - instant_messaging
  - leaked_credentials
  - network_vulnerabilities
  - credit_cards
  - botnets
  additionalinfo: Required when Fetch incidents is selected; select at least one type available in your Monitor license. botnets is the Compromised Accounts type of the KELA platform. Each type keeps its own fetch position.
- display: First fetch time
  name: first_fetch
  type: 0
  defaultvalue: 3 days
  required: false
  section: Collect
  additionalinfo: How far back to fetch the first time (e.g. "3 days", "12 hours", "2026-10-01T00:00:00Z"). Applied to the incident date. Only used on the first run of each incident type.
- display: Maximum number of incidents per fetch (per incident type)
  name: max_fetch
  type: 0
  defaultvalue: '50'
  required: false
  section: Collect
  additionalinfo: Between 1 and 200.
  supportedModules:
  - agentix
  - xsiam
- display: Fetch only these severities
  name: fetch_severities
  type: 16
  required: false
  section: Collect
  options:
  - low
  - medium
  - high
  - critical
  additionalinfo: Optional. Leave empty to fetch every severity.
- display: Mask sensitive data
  name: mask_sensitive_data
  type: 8
  defaultvalue: 'true'
  required: false
  section: Collect
  additionalinfo: When selected (recommended), the leaked email and compromised user name are shortened in incident names (j***@example.com), passwords, cookies, tokens, sessions, secrets and CVVs are replaced by ******** and credit card numbers keep only the BIN and the last 4 digits, both in fetched incidents and in command outputs. Clear it to store the data exactly as KELA returns it. The masked incident fields stay masked either way.
- display: Do not create incidents already handled in KELA
  name: skip_handled
  type: 8
  defaultvalue: 'false'
  required: false
  section: Collect
  additionalinfo: When selected, incidents that a user already marked as handled in the KELA platform are not created. They still move the fetch position forward, so they are not created later either.
description: Use the KELA Monitor integration to fetch the incidents of a KELA Monitor (hacking discussions, instant messaging, leaked credentials, network vulnerabilities, credit cards and compromised accounts) into Cortex and to list them by incident type.
defaultclassifier: KELA Monitor - Classifier
defaultmapperin: KELA Monitor - Incoming Mapper
display: KELA Monitor
name: KELAMonitor
script:
  commands:
  - name: kela-monitor-incident-list
    description: Returns a batch of incidents of one incident type, with optional filters. When more incidents may be available it also returns a scroll ID for kela-monitor-incident-scroll.
    arguments:
    - name: incident_type
      required: true
      auto: PREDEFINED
      predefined:
      - hacking_discussions
      - instant_messaging
      - leaked_credentials
      - network_vulnerabilities
      - credit_cards
      - botnets
      description: The type of incidents to query.
    - name: monitor_id
      description: Monitor ID to query. Defaults to the Monitor ID configured on the instance. Any monitor the token's user can access can be queried.
    - name: text
      description: Free text to filter results by (same as the free text search on the discovery page).
    - name: severities
      isArray: true
      auto: PREDEFINED
      predefined:
      - low
      - medium
      - high
      - critical
      description: A comma-separated list of severities to return.
    - name: from_date
      description: Minimal date. Accepts ISO dates, relative dates (e.g. "3 days") or a 10 digit epoch in seconds.
    - name: to_date
      description: Maximal date. Same formats as from_date.
    - name: first_appearance
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
      description: Whether to return only the first appearance of each credential as tracked by KELA (leaked credentials only). Best used with a date range.
    - name: limit
      defaultValue: '20'
      description: The maximal number of incidents to return in this batch (1-1000). Every incident is printed in the War Room, so keep it at 100 or less when you run the command manually.
    outputs:
    - contextPath: KELA.Monitor.Incident.id
      description: The ID of the incident in KELA Monitor.
      type: String
    - contextPath: KELA.Monitor.Incident.type
      description: Incident type; determines which type-specific fields are populated.
      type: String
    - contextPath: KELA.Monitor.Incident.sub_type
      description: Numeric sub type (integer, or string for some hacking_discussions).
      type: Unknown
    - contextPath: KELA.Monitor.Incident.sub_type_description
      description: Human-readable sub type.
      type: String
    - contextPath: KELA.Monitor.Incident.severity
      description: 1 = low, 2 = medium, 3 = high, 4 = critical.
      type: Number
    - contextPath: KELA.Monitor.Incident.incident_date
      description: The date and time (ISO 8601, UTC) at which the incident was reported in Monitor.
      type: Date
    - contextPath: KELA.Monitor.Incident.feed_property_id
      description: Aggregation ID the incident belongs to.
      type: String
    - contextPath: KELA.Monitor.Incident.feedPropertyId
      description: Same value as feed_property_id, returned by the API in camelCase as well (leaked_credentials, botnets).
      type: String
    - contextPath: KELA.Monitor.Incident.assets.id
      description: Related asset ID.
      type: Number
    - contextPath: KELA.Monitor.Incident.assets.name
      description: Related asset name.
      type: String
    - contextPath: KELA.Monitor.Incident.assets.type
      description: Related asset category.
      type: String
    - contextPath: KELA.Monitor.Incident.tags
      description: Tags of the incident.
      type: Unknown
    - contextPath: KELA.Monitor.Incident.categories
      description: Categories of the incident.
      type: Unknown
    - contextPath: KELA.Monitor.Incident.user_actions.read
      description: Whether the incident was read.
      type: Boolean
    - contextPath: KELA.Monitor.Incident.user_actions.star
      description: Whether the incident was starred.
      type: Boolean
    - contextPath: KELA.Monitor.Incident.user_actions.delete
      description: Whether the incident was deleted.
      type: Boolean
    - contextPath: KELA.Monitor.Incident.user_actions.handled
      description: Name of who handled the incident, or false.
      type: Unknown
    - contextPath: KELA.Monitor.Incident.user_actions.hide
      description: Whether the incident was hidden.
      type: Boolean
    - contextPath: KELA.Monitor.Incident.user_actions.publish
      description: Whether the incident was published.
      type: Boolean
    - contextPath: KELA.Monitor.Incident.user_actions.request
      description: Whether an RFI was requested.
      type: Boolean
    - contextPath: KELA.Monitor.Incident.actions.read
      description: Same flags as user_actions (not returned for hacking_discussions).
      type: Boolean
    - contextPath: KELA.Monitor.Incident.title
      description: '[hacking_discussions] Incident title.'
      type: String
    - contextPath: KELA.Monitor.Incident.publish_date
      description: '[hacking_discussions] The date and time (ISO 8601, UTC) of the original publication.'
