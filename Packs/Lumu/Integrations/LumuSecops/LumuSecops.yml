    - name: adversary_types
      isArray: true
      description: Filter by adversary type values.
    - name: labels
      isArray: true
      description: Filter by label IDs.
    - name: from_date
      description: Filter incidents from this date/time (ISO 8601).
    - name: to_date
      description: Filter incidents up to this date/time (ISO 8601).
