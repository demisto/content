commonfields:
  id: LumuSecops
  version: -1
name: LumuSecops
display: Lumu Secops
category: Utilities
provider: Lumu
description: SecOps operations for the new Lumu Defender API. Fetch, investigate, and manage Lumu incidents from Cortex XSOAR with bidirectional mirroring.
detaileddescription: NA
configuration:
- defaultvalue: https://defender.lumu.io
  display: Server URL
  name: url
  required: true
  type: 0
- defaultvalue: "false"
  display: Use system proxy settings
  name: proxy
  required: false
  type: 8
- defaultvalue: "false"
  display: Trust any certificate (not secure)
  name: insecure
  required: false
  type: 8
- display: API Key
  name: api_key
  required: true
  type: 4
- defaultvalue: 3 days
  display: First fetch timestamp (<number> <time unit>, e.g., 12 hours, 7 days)
  name: first_fetch
  required: false
  type: 0
- defaultvalue: "50"
  name: max_fetch
  required: false
  type: 0
- defaultvalue: "0"
  display: Incident Offset
  name: fetch_offset
  required: false
  type: 0
- defaultvalue: "30"
  display: Total incidents per fetch
  name: total_items_per_lumu_fetch
  required: false
  type: 0
- defaultvalue: "4"
  display: Max time in seconds per fetch
  name: max_time_fetching_lumu_incident
  required: false
  type: 0
- display: Fetch incidents
  name: isFetch
  required: false
  type: 8
- defaultvalue: LumuSecops
  display: Incident type
  name: incidentType
  required: false
  type: 13
- defaultvalue: "1"
  display: Incidents Fetch Interval
  name: incidentFetchInterval
  required: false
  type: 19
- additionalinfo: Comments and files tagged with this value are mirrored to Lumu.
  defaultvalue: mirror
  display: Mirror tags
  name: mirror_tags
  required: false
  type: 0
- additionalinfo: 'Choose the direction to mirror the incident: Incoming (from SentinelOne to Cortex XSOAR), Outgoing (from Cortex XSOAR to SentinelOne), or Incoming and Outgoing (from/to Cortex XSOAR and SentinelOne). Cortex XSOAR only parameter.'
  defaultvalue: None
  display: Incident Mirroring Direction
  type: 15
  required: false
  options:
  - None
  - Incoming
  - Outgoing
  - Incoming And Outgoing
  name: mirror_direction
script:
  script: ''
  type: python
  dockerimage: demisto/python3:3.12.8.3296088
  subtype: python3
  isfetch: true
  ismappable: true
  isremotesyncin: true
  isremotesyncout: true
  commands:
  - name: lumusecops-retrieve-labels
    arguments:
    - name: page
      description: "page requested."
    - name: limit
      defaultValue: 10
      description: "items limit requested."
    outputs:
    - contextPath: LumuSecops.RetrieveLabels.labels.id
      description: "label id."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.labels.name
      description: "label name."
      type: String
    - contextPath: LumuSecops.RetrieveLabels.labels.relevance
      description: "label relevance."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.page
      description: "current page."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.items
      description: "current items."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.next
      description: "next page."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.prev
      description: "previous page."
      type: Number
    description: Get a paginated list of all the labels created for the company and its details such as id, name and business relevance. The items are sorted by the label id in ascending order.
  - name: lumusecops-retrieve-a-specific-label
    arguments:
    - name: label_id
      description: "label id requested."
      required: true
    outputs:
    - contextPath: LumuSecops.RetrieveASpecificLabel.id
      description: "label id."
      type: Number
    - contextPath: LumuSecops.RetrieveASpecificLabel.name
      description: "label name."
      type: String
    - contextPath: LumuSecops.RetrieveASpecificLabel.relevance
      description: "label relevance."
      type: Number
    description: |-
      Get details such as id, name and business relevance from a specific label.

      | `{label-id}` | ID of the specific label |
      |---|---|.

  - name: lumusecops-get-all-incidents
    description: Get a paginated list of all incidents.
    arguments:
