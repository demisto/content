name: LumuSecops
display: Lumu Secops
commonfields:
  id: LumuSecops
  version: -1
category: Utilities
provider: Lumu
description: SecOps operations for the new Lumu Defender API. Fetch, investigate, and manage Lumu incidents from Cortex XSOAR with bidirectional mirroring.
detaileddescription: Lumu SecOps integration, including its capabilities for fetching, investigating, and managing Lumu incidents from Cortex XSOAR with bidirectional mirroring, visit the Lumu official documentation for more details https://docs.lumu.io/portal/en/kb/articles/palo-alto-cortex-xsoar-out-of-the-box-secops-integration.
configuration:
- defaultvalue: https://defender.lumu.io
  display: Server URL
  name: url
  required: true
  type: 0
  additionalinfo: "The URL of the Public Lumu Defender Base URL."
  section: Connect
- defaultvalue: "false"
  display: Use system proxy settings
  name: proxy
  required: false
  type: 8
  additionalinfo: "Whether to use the system proxy settings for network requests."
  section: Connect
- defaultvalue: "false"
  display: Trust any certificate (not secure)
  name: insecure
  required: false
  type: 8
  additionalinfo: "Whether to trust any SSL certificate, even if it is not secure."
  section: Connect
- display: API Key
  name: api_key
  required: true
  hiddenusername: true
  additionalinfo: "The API key used to authenticate with the Lumu Defender API."
  type: 9
  section: Connect
- defaultvalue: "0"
  display: Lumu incident fetch offset
  name: fetch_offset
  required: false
  type: 0
  additionalinfo: "The offset to start fetching Lumu incidents from."
  section: Collect
- defaultvalue: "30"
  display: Size of Lumu incident records per Lumu fetch
  additionalinfo: "The number of Lumu incident records to fetch per request."
  name: total_items_per_lumu_fetch
  required: false
  type: 0
  section: Collect
- defaultvalue: "4"
  display: Max Seconds waiting for fetching Lumu incidents
  additionalinfo: "The maximum number of seconds to wait for fetching Lumu incidents."
  name: max_time_fetching_lumu_incident
  required: false
  type: 0
  section: Collect
- display: Fetch incidents
  name: isFetch
  defaultvalue: "true"
  required: false
  type: 8
  section: Collect
- defaultvalue: LumuSecops
  display: Incident type
  name: incidentType
  required: false
  type: 13
  additionalinfo: "The incident type for Lumu SecOps incidents."
  section: Collect
- defaultvalue: "1"
  display: Incidents Fetch Interval
  name: incidentFetchInterval
  required: false
  type: 19
  additionalinfo: "The interval in minutes at which to fetch Lumu incidents."
  section: Collect
- additionalinfo: Comments and files tagged with this value are mirrored to Lumu.
  defaultvalue: mirror
  display: Mirror tags
  name: mirror_tags
  required: false
  type: 0
  section: Collect
- additionalinfo: 'Choose the direction to mirror the incident: Incoming (from Lumu to Cortex XSOAR), Outgoing (from Cortex XSOAR to Lumu), or Incoming and Outgoing (from/to Cortex XSOAR and Lumu). Cortex XSOAR only parameter.'
  defaultvalue: Incoming And Outgoing
  display: Incident Mirroring Direction
  type: 15
  section: Collect
  required: false
  options:
  - None
  - Incoming
  - Outgoing
  - Incoming And Outgoing
  name: mirror_direction
script:
  script: ''
  type: python
  dockerimage: demisto/python3:3.12.8.3296088
  subtype: python3
  isfetch: true
  ismappable: true
  isremotesyncin: true
  isremotesyncout: true
  commands:
  - name: lumusecops-retrieve-labels
    arguments:
    - name: page
      description: "The page requested."
    - name: limit
      defaultValue: 10
      description: "The items limit requested."
    outputs:
    - contextPath: LumuSecops.RetrieveLabels.labels.id
      description: "The label ID."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.labels.name
      description: "The label name."
      type: String
    - contextPath: LumuSecops.RetrieveLabels.labels.relevance
      description: "The label relevance."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.page
      description: "The current page."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.items
      description: "The current items."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.next
      description: "The next page."
      type: Number
    - contextPath: LumuSecops.RetrieveLabels.paginationInfo.prev
      description: "The previous page."
      type: Number
    description: Gets a paginated list of all the labels created for the company and its details such as ID, name, and business relevance. The items are sorted by the label ID in ascending order.
  - name: lumusecops-retrieve-a-specific-label
    arguments:
    - name: label_id
      description: "The label ID requested."
      required: true
    outputs:
    - contextPath: LumuSecops.RetrieveASpecificLabel.id
      description: "The label ID."
      type: Number
    - contextPath: LumuSecops.RetrieveASpecificLabel.name
      description: "The label name."
      type: String
    - contextPath: LumuSecops.RetrieveASpecificLabel.relevance
      description: "The label relevance."
      type: Number
    description: "Gets details such as id, name and business relevance from a specific label."

