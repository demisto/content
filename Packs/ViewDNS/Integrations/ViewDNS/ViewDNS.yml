category: Data Enrichment & Threat Intelligence
sectionorder:
- Connect
- Collect
commonfields:
  id: ViewDNS
  version: -1
configuration:
- display: Server URL
  name: url
  defaultvalue: https://api.viewdns.info
  type: 0
  required: true
  section: Connect
- displaypassword: API Key
  name: credentials
  type: 9
  hiddenusername: true
  required: true
  section: Connect
  additionalinfo: The API key of your ViewDNS.info account.
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
  advanced: true
  additionalinfo: When selected, requests to ViewDNS are sent through the system proxy.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  section: Connect
  advanced: true
  additionalinfo: When selected, the integration does not verify the SSL certificate of the ViewDNS server.
- display: Enable reputation commands (consumes API credits on every indicator)
  name: enable_reputation
  type: 8
  defaultvalue: 'false'
  required: false
  section: Collect
  additionalinfo: When selected, the generic domain and ip reputation commands query ViewDNS, consuming two API queries for every indicator enriched. When cleared, these commands return a message and consume nothing.
- display: Source Reliability
  name: integrationReliability
  type: 15
  required: false
  section: Collect
  defaultvalue: C - Fairly reliable
  additionalinfo: Reliability of the source providing the intelligence data.
  options:
  - A+ - 3rd party enrichment
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
description: Enrich and pivot on domains, IP addresses, and registrants with ViewDNS.info DNS, IP, and WHOIS intelligence, including reverse IP, reverse WHOIS, IP history, and DNS record lookups.
display: ViewDNS
name: ViewDNS
supportlevelheader: community
script:
  commands:
  - name: viewdns-account-balance
    description: Retrieves the query usage and remaining balance of the ViewDNS API key. This command does not consume API queries.
    arguments: []
    outputs:
    - contextPath: ViewDNS.Account.Plan
      description: The plan type of the API key (monthly or trial).
      type: String
    - contextPath: ViewDNS.Account.MonthlyLimit
      description: The number of queries included in the plan per month. A value of 0 means the plan is unlimited.
      type: Number
    - contextPath: ViewDNS.Account.MonthlyUsage
      description: The number of queries used in the current month.
      type: Number
    - contextPath: ViewDNS.Account.MonthlyRemaining
      description: The number of plan queries remaining in the current month. Not returned for unlimited plans.
      type: Number
    - contextPath: ViewDNS.Account.PrepaidBalance
      description: The number of prepaid queries remaining.
      type: Number
  - name: viewdns-reverse-ip
    description: Finds the domains hosted on the same server as a given domain or IP address. Each call consumes one API query.
    arguments:
    - name: host
      description: The domain or IP address to find co-hosted domains for.
      required: true
      default: true
    - &id002
      name: page
      description: The page of API results to retrieve. Each page holds up to 10,000 results and each page retrieved consumes one API query.
      defaultValue: '1'
    - &id001
      name: limit
      description: The maximum number of results to return from the retrieved page.
      defaultValue: '50'
    outputs:
    - contextPath: ViewDNS.ReverseIP.Host
      description: The domain or IP address that was searched for.
      type: String
    - contextPath: ViewDNS.ReverseIP.DomainCount
      description: The total number of domains hosted on the server.
      type: Number
    - contextPath: ViewDNS.ReverseIP.Page
      description: The result page that was retrieved.
      type: Number
    - contextPath: ViewDNS.ReverseIP.Domains.Name
      description: The domain hosted on the server.
      type: String
    - contextPath: ViewDNS.ReverseIP.Domains.LastResolved
      description: The date the domain was last seen resolving to the server in YYYY-MM-DD format (e.g., 2024-09-28).
      type: Date
  - name: viewdns-reverse-whois
    description: Finds the domains registered by a given person or organization, searching by registrant name or email address. Requires a paid ViewDNS API key. Each call consumes one API query.
    arguments:
    - name: query
      description: The registrant name or email address to search for. Must be at least five characters long.
      required: true
      default: true
    - name: page
      description: The page of API results to retrieve. Each page holds up to 1,000 results and each page retrieved consumes one API query.
      defaultValue: '1'
    - *id001
    outputs:
    - contextPath: ViewDNS.ReverseWhois.Query
      description: The registrant name or email address that was searched for.
      type: String
    - contextPath: ViewDNS.ReverseWhois.ResultCount
      description: The total number of matching domains.
      type: Number
    - contextPath: ViewDNS.ReverseWhois.TotalPages
      description: The total number of result pages available.
      type: Number
    - contextPath: ViewDNS.ReverseWhois.CurrentPage
      description: The result page that was retrieved.
      type: Number
    - contextPath: ViewDNS.ReverseWhois.Matches.Domain
      description: The domain that matches the search.
      type: String
    - contextPath: ViewDNS.ReverseWhois.Matches.CreatedDate
      description: The date the domain was registered in YYYY-MM-DD format (e.g., 2024-09-28).
      type: Date
    - contextPath: ViewDNS.ReverseWhois.Matches.Registrar
      description: The registrar of the domain.
      type: String
  - name: viewdns-ip-history
    description: Retrieves the IP addresses a domain has been hosted on over time. Only registered domains are tracked, not subdomains. Each call consumes one API query.
    arguments:
    - name: domain
      description: The domain to retrieve the IP history of, for example example.com.
      required: true
      default: true
    - name: limit
      description: The maximum number of records to return, starting from the most recent.
      defaultValue: '50'
    outputs:
    - contextPath: ViewDNS.IPHistory.Domain
      description: The domain that was searched for.
      type: String
    - contextPath: ViewDNS.IPHistory.RecordCount
      description: The total number of historical records available for the domain.
      type: Number
    - contextPath: ViewDNS.IPHistory.Records.IP
      description: The IP address the domain was hosted on.
      type: String
    - contextPath: ViewDNS.IPHistory.Records.Location
      description: The location of the IP address.
      type: String
    - contextPath: ViewDNS.IPHistory.Records.Owner
      description: The owner of the IP address.
      type: String
    - contextPath: ViewDNS.IPHistory.Records.LastSeen
      description: The date the domain was last seen on the IP address in YYYY-MM-DD format (e.g., 2024-09-28).
      type: Date
  - name: viewdns-dns-record
    description: Retrieves the DNS records of a domain or hostname. Each call consumes one API query.
    arguments:
    - name: domain
      description: The domain or hostname to retrieve DNS records for.
      required: true
      default: true
    - name: record_type
      description: The type of DNS record to retrieve. Other valid DNS record types can also be entered.
      defaultValue: ANY
      auto: PREDEFINED
      predefined:
      - ANY
      - A
      - AAAA
      - CAA
      - CNAME
      - DNSKEY
      - DS
      - MX
      - NS
      - PTR
      - SOA
      - SRV
      - TXT
    outputs:
    - contextPath: ViewDNS.DNSRecord.Domain
      description: The domain or hostname that was searched for.
      type: String
    - contextPath: ViewDNS.DNSRecord.RecordType
      description: The record type that was requested.
      type: String
    - contextPath: ViewDNS.DNSRecord.Records.Name
      description: The name of the record.
      type: String
    - contextPath: ViewDNS.DNSRecord.Records.TTL
      description: The time to live of the record, in seconds.
      type: Number
    - contextPath: ViewDNS.DNSRecord.Records.Class
      description: The class of the record.
      type: String
    - contextPath: ViewDNS.DNSRecord.Records.Type
      description: The type of the record.
      type: String
    - contextPath: ViewDNS.DNSRecord.Records.Priority
      description: The priority of the record (MX records only).
      type: Number
    - contextPath: ViewDNS.DNSRecord.Records.Data
      description: The data of the record.
      type: String
  - name: viewdns-whois
    description: Retrieves the WHOIS record of a domain or IP address. Requires a paid ViewDNS API key. Each call consumes one API query.
    arguments:
    - name: domain
      description: The domain or IP address to retrieve the WHOIS record of.
      required: true
      default: true
    outputs:
    - contextPath: ViewDNS.Whois.DomainName
      description: The domain name.
      type: String
    - contextPath: ViewDNS.Whois.RegistrarName
      description: The name of the registrar.
      type: String
    - contextPath: ViewDNS.Whois.RegistrarIANAID
      description: The IANA ID of the registrar.
      type: String
    - contextPath: ViewDNS.Whois.CreatedDate
      description: The date the domain was registered in ISO 8601 format (e.g., 2024-01-22T21:36:01Z).
      type: Date
    - contextPath: ViewDNS.Whois.UpdatedDate
      description: The date the domain registration was last updated in ISO 8601 format (e.g., 2024-01-22T21:36:01Z).
      type: Date
    - contextPath: ViewDNS.Whois.ExpiresDate
      description: The date the domain registration expires in ISO 8601 format (e.g., 2024-01-22T21:36:01Z).
      type: Date
    - contextPath: ViewDNS.Whois.AbuseEmail
      description: The abuse contact email address.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.Name
      description: The name of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.Organization
      description: The organization of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.Street
      description: The street address of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.City
      description: The city of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.State
      description: The state or province of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.PostalCode
      description: The postal code of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.Country
      description: The country of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.Phone
      description: The phone number of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.Fax
      description: The fax number of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Registrant.Email
      description: The email address of the registrant.
      type: String
    - contextPath: ViewDNS.Whois.Admin.Name
      description: The name of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Admin.Organization
      description: The organization of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Admin.Street
      description: The street address of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Admin.City
