  - name: viewdns-reverse-ns
    description: Finds the domains that use a given name server. Each call consumes one API query.
    arguments:
    - name: nameserver
      description: The name server to search for, for example ns1.example.com.
      required: true
      default: true
    - *id002
    - *id001
    outputs:
    - contextPath: ViewDNS.ReverseNS.Nameserver
      description: The name server that was searched for.
      type: String
    - contextPath: ViewDNS.ReverseNS.DomainCount
      description: The total number of domains that use the name server.
      type: Number
    - contextPath: ViewDNS.ReverseNS.TotalPages
      description: The total number of result pages available.
      type: Number
    - contextPath: ViewDNS.ReverseNS.CurrentPage
      description: The result page that was retrieved.
      type: Number
    - contextPath: ViewDNS.ReverseNS.Domains
      description: The domains that use the name server.
      type: String
  - name: viewdns-reverse-mx
    description: Finds the domains that use a given mail server. Each call consumes one API query.
    arguments:
    - name: mail_server
      description: The mail server to search for, for example mail.example.com.
      required: true
      default: true
    - *id002
    - *id001
    outputs:
    - contextPath: ViewDNS.ReverseMX.MailServer
      description: The mail server that was searched for.
      type: String
    - contextPath: ViewDNS.ReverseMX.DomainCount
      description: The total number of domains that use the mail server.
      type: Number
    - contextPath: ViewDNS.ReverseMX.TotalPages
      description: The total number of result pages available.
      type: Number
    - contextPath: ViewDNS.ReverseMX.CurrentPage
      description: The result page that was retrieved.
      type: Number
    - contextPath: ViewDNS.ReverseMX.Domains
      description: The domains that use the mail server.
      type: String
  - name: viewdns-port-scan
    description: 'Checks whether a set of common ports is open on a host. Each call consumes one API query. Use with care: this command makes ViewDNS servers actively connect to the target, which can be noticed by the target''s owner.'
    arguments:
    - name: host
      description: The domain or public IP address to scan.
      required: true
      default: true
    outputs:
    - contextPath: ViewDNS.PortScan.Host
      description: The host that was scanned.
      type: String
    - contextPath: ViewDNS.PortScan.OpenPorts
      description: The numbers of the ports found open.
      type: Number
    - contextPath: ViewDNS.PortScan.Ports.Number
      description: The port number.
      type: Number
    - contextPath: ViewDNS.PortScan.Ports.Service
      description: The service commonly run on the port.
      type: String
    - contextPath: ViewDNS.PortScan.Ports.Status
      description: The status of the port (open or closed).
      type: String
  - name: viewdns-ping
    description: 'Measures latency and packet loss to a host from multiple locations around the world. Each call consumes one API query. Use with care: this command makes ViewDNS servers actively connect to the target, which can be noticed by the target''s owner.'
    arguments:
    - name: host
      description: The domain or public IP address to ping.
      required: true
      default: true
    outputs:
    - contextPath: ViewDNS.Ping.Host
      description: The host that was pinged.
      type: String
    - contextPath: ViewDNS.Ping.Results.Region
      description: The region the ping was sent from.
      type: String
    - contextPath: ViewDNS.Ping.Results.Location
      description: The city and country the ping was sent from.
      type: String
    - contextPath: ViewDNS.Ping.Results.IPAddress
      description: The IP address the host resolved to at this location.
      type: String
    - contextPath: ViewDNS.Ping.Results.MinRTT
      description: The minimum round trip time, in milliseconds.
      type: Number
    - contextPath: ViewDNS.Ping.Results.MaxRTT
      description: The maximum round trip time, in milliseconds.
      type: Number
    - contextPath: ViewDNS.Ping.Results.AvgRTT
      description: The average round trip time, in milliseconds.
      type: Number
    - contextPath: ViewDNS.Ping.Results.PacketLoss
      description: The percentage of packets lost.
      type: String
  - name: viewdns-traceroute
    description: 'Traces the network path from a ViewDNS server to a host. Each call consumes one API query. Use with care: this command makes ViewDNS servers actively connect to the target, which can be noticed by the target''s owner.'
    arguments:
    - name: host
      description: The domain or IP address to trace the route to.
      required: true
      default: true
    outputs:
    - contextPath: ViewDNS.Traceroute.Host
      description: The host the route was traced to.
      type: String
    - contextPath: ViewDNS.Traceroute.Hops.Number
      description: The position of the hop in the route.
      type: Number
    - contextPath: ViewDNS.Traceroute.Hops.Hostname
      description: The hostname of the hop.
      type: String
    - contextPath: ViewDNS.Traceroute.Hops.IP
      description: The IP address of the hop.
      type: String
    - contextPath: ViewDNS.Traceroute.Hops.RTT
      description: The round trip time to the hop, in milliseconds.
      type: Number
  - name: domain
    description: Enriches a domain with its WHOIS record and IP history. ViewDNS does not provide a verdict, so the DBot score is always 0 (Unknown). Runs only when reputation commands are enabled in the instance settings. Consumes two API queries per domain.
    arguments:
    - name: domain
      description: A comma-separated list of domains to enrich.
      required: true
      default: true
      isArray: true
    outputs:
    - &id003
      contextPath: DBotScore.Indicator
      description: The indicator that was tested.
      type: String
    - &id004
      contextPath: DBotScore.Type
      description: The indicator type.
      type: String
    - &id005
      contextPath: DBotScore.Vendor
      description: The vendor used to calculate the score.
      type: String
    - &id006
      contextPath: DBotScore.Score
      description: The actual score.
      type: Number
    - &id007
      contextPath: DBotScore.Reliability
      description: Reliability of the source providing the intelligence data.
      type: String
    - contextPath: Domain.Name
      description: The domain name.
      type: String
    - contextPath: Domain.Organization
      description: The organization of the registrant.
      type: String
    - contextPath: Domain.CreationDate
      description: The date the domain was registered in ISO 8601 format (e.g., 2024-01-22T21:36:01Z).
      type: Date
    - contextPath: Domain.UpdatedDate
      description: The date the domain registration was last updated in ISO 8601 format (e.g., 2024-01-22T21:36:01Z).
      type: Date
    - contextPath: Domain.ExpirationDate
      description: The date the domain registration expires in ISO 8601 format (e.g., 2024-01-22T21:36:01Z).
      type: Date
    - contextPath: Domain.DomainStatus
      description: The EPP status codes of the domain.
      type: String
    - contextPath: Domain.NameServers
      description: The name servers of the domain.
      type: String
    - contextPath: Domain.Registrar.Name
      description: The name of the registrar.
      type: String
    - contextPath: Domain.Registrar.AbuseEmail
      description: The abuse contact email address of the registrar.
      type: String
    - contextPath: Domain.Registrant.Name
      description: The name of the registrant.
      type: String
    - contextPath: Domain.Registrant.Email
      description: The email address of the registrant.
      type: String
    - contextPath: Domain.Registrant.Phone
      description: The phone number of the registrant.
      type: String
    - contextPath: Domain.Registrant.Country
      description: The country of the registrant.
      type: String
    - contextPath: Domain.Admin.Name
      description: The name of the administrative contact.
      type: String
    - contextPath: Domain.Admin.Email
