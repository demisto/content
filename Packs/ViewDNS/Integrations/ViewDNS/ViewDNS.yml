      type: String
    - contextPath: ViewDNS.Whois.Admin.PostalCode
      description: The postal code of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Admin.Country
      description: The country of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Admin.Phone
      description: The phone number of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Admin.Fax
      description: The fax number of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Admin.Email
      description: The email address of the administrative contact.
      type: String
    - contextPath: ViewDNS.Whois.Tech.Name
      description: The name of the technical contact.
      type: String
    - contextPath: ViewDNS.Whois.Tech.Organization
