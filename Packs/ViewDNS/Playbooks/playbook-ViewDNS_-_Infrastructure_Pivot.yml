inputs:
- key: IP
  value:
    simple: ${IP.Address}
  required: false
  description: The IP address to find co-hosted domains for.
  playbookInputQuery:
- key: RegistrantEmail
  value: {}
  required: false
  description: The registrant email address to find registered domains for.
  playbookInputQuery:
- key: MaxResults
  value:
    simple: '50'
  required: false
  description: The maximum number of domains to return for each lookup. Only the first page of API results is retrieved, so each IP address and each email address consumes one API query regardless of this value.
  playbookInputQuery:
outputs:
- contextPath: ViewDNS.ReverseIP
  description: The reverse IP lookup results.
  type: unknown
- contextPath: ViewDNS.ReverseIP.Host
  description: The IP address that was searched for.
  type: string
- contextPath: ViewDNS.ReverseIP.DomainCount
  description: The total number of domains hosted on the server.
  type: number
- contextPath: ViewDNS.ReverseIP.Domains.Name
  description: A domain hosted on the server.
  type: string
- contextPath: ViewDNS.ReverseIP.Domains.LastResolved
  description: The date the domain was last seen resolving to the server.
  type: date
- contextPath: ViewDNS.ReverseWhois
  description: The reverse WHOIS lookup results.
  type: unknown
- contextPath: ViewDNS.ReverseWhois.Query
  description: The email address that was searched for.
  type: string
- contextPath: ViewDNS.ReverseWhois.ResultCount
  description: The total number of matching domains.
  type: number
- contextPath: ViewDNS.ReverseWhois.Matches.Domain
  description: A domain registered with the email address.
  type: string
- contextPath: ViewDNS.ReverseWhois.Matches.CreatedDate
  description: The date the domain was registered.
  type: date
- contextPath: ViewDNS.ReverseWhois.Matches.Registrar
  description: The registrar of the domain.
  type: string
