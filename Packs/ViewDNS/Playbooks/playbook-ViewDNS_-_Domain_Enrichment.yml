id: silent-ViewDNS - Domain Enrichment
version: -1
name: silent-ViewDNS - Domain Enrichment
description: 'Enriches a domain with ViewDNS.info data: the WHOIS record, the historical IP addresses the domain was hosted on, and its current DNS records. The results are written to the context. The playbook consumes three ViewDNS API queries for every domain provided, and the WHOIS lookup requires a paid ViewDNS API key. A failed lookup does not stop the other lookups.'
