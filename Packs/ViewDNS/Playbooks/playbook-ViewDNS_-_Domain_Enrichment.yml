inputs:
- key: Domain
  value:
    simple: ${Domain.Name}
  required: false
  description: The domain to enrich, for example example.com. IP history is only available for registered domains, not subdomains.
  playbookInputQuery:
- key: DNSRecordType
  value:
    simple: ANY
  required: false
  description: The type of DNS record to retrieve, for example A, MX, TXT, or ANY for all record types.
  playbookInputQuery:
- key: IPHistoryLimit
  value:
    simple: '50'
  required: false
  description: The maximum number of IP history records to return, starting from the most recent.
  playbookInputQuery:
outputs:
- contextPath: ViewDNS.Whois
  description: The WHOIS record of the domain.
  type: unknown
- contextPath: ViewDNS.Whois.DomainName
  description: The domain name.
  type: string
- contextPath: ViewDNS.Whois.RegistrarName
  description: The name of the registrar.
  type: string
- contextPath: ViewDNS.Whois.CreatedDate
  description: The date the domain was registered.
  type: date
- contextPath: ViewDNS.Whois.ExpiresDate
  description: The date the domain registration expires.
  type: date
- contextPath: ViewDNS.Whois.Registrant.Email
  description: The email address of the registrant.
  type: string
- contextPath: ViewDNS.Whois.NameServers
  description: The name servers of the domain.
  type: string
- contextPath: ViewDNS.IPHistory
  description: The IP history of the domain.
  type: unknown
- contextPath: ViewDNS.IPHistory.Domain
  description: The domain that was searched for.
  type: string
- contextPath: ViewDNS.IPHistory.RecordCount
  description: The total number of historical records available for the domain.
  type: number
- contextPath: ViewDNS.IPHistory.Records.IP
  description: An IP address the domain was hosted on.
  type: string
- contextPath: ViewDNS.IPHistory.Records.Owner
  description: The owner of the IP address.
  type: string
- contextPath: ViewDNS.IPHistory.Records.LastSeen
  description: The date the domain was last seen on the IP address.
  type: date
- contextPath: ViewDNS.DNSRecord
  description: The DNS records of the domain.
  type: unknown
- contextPath: ViewDNS.DNSRecord.Records.Type
  description: The type of the record.
  type: string
- contextPath: ViewDNS.DNSRecord.Records.Data
  description: The data of the record.
  type: string
