description: 'Respond to AI agent threats in NVIDIA OpenShell sandboxes: stop or suspend a sandbox, block its egress to a host, and detach its credentials.'
display: NVIDIA OpenShell
name: NVIDIA OpenShell
script:
  commands:
  - name: openshell-gateway-info
    description: Returns the OpenShell gateway version and information.
    arguments: []
    outputs:
    - contextPath: OpenShell.Gateway.Endpoint
      description: The gateway endpoint.
      type: String
    - contextPath: OpenShell.Gateway.Version
      description: The gateway version.
      type: String
    - contextPath: OpenShell.Gateway.Info
      description: The gateway information returned by the gateway.
      type: Unknown
  - name: openshell-sandbox-list
    description: Lists sandboxes and their phase.
    arguments:
    - &id001
      name: workspace
      description: The OpenShell workspace. Defaults to the instance workspace.
      required: false
    - name: all_workspaces
      description: Whether to list sandboxes across all workspaces.
      required: false
      defaultValue: 'false'
      auto: PREDEFINED
      predefined: &id004
      - 'true'
      - 'false'
    - name: label_selector
      description: A Kubernetes-style label selector, for example team=ml.
      required: false
    - name: limit
      description: The maximum number of sandboxes to return.
      required: false
      defaultValue: '50'
    outputs: &id002
    - &id005
      contextPath: OpenShell.Sandbox.ID
      description: The sandbox ID.
      type: String
    - &id006
      contextPath: OpenShell.Sandbox.Name
      description: The sandbox name.
      type: String
    - &id007
      contextPath: OpenShell.Sandbox.Workspace
      description: The sandbox workspace.
      type: String
    - &id008
      contextPath: OpenShell.Sandbox.Phase
      description: The sandbox phase, for example READY, STOPPED or SUSPENDED.
      type: String
    - &id009
      contextPath: OpenShell.Sandbox.PolicyVersion
      description: The active policy version.
      type: Number
    - &id010
      contextPath: OpenShell.Sandbox.Labels
      description: The sandbox labels.
      type: Unknown
  - name: openshell-sandbox-get
    description: Returns a single sandbox.
    arguments:
    - &id003
      name: name
      description: The sandbox name.
      required: true
    - *id001
    outputs: *id002
  - name: openshell-sandbox-stop
    description: Stops a sandbox. The agent stops running. Its identity and workspace are kept, so it can be started again after the investigation.
    arguments:
    - *id003
    - *id001
    - name: wait
      description: Whether to wait until the sandbox reports STOPPED.
      required: false
      defaultValue: 'true'
      auto: PREDEFINED
      predefined: *id004
    - name: timeout_seconds
      description: How long to wait for the sandbox to stop, in seconds.
      required: false
      defaultValue: '120'
    outputs: &id011
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - contextPath: OpenShell.Sandbox.Action
      description: The action that was requested.
      type: String
    execution: true
  - name: openshell-sandbox-start
    description: Starts a stopped sandbox.
    arguments:
    - *id003
    - *id001
    outputs: *id011
    execution: true
  - name: openshell-sandbox-suspend
    description: Suspends a sandbox and keeps its state. Requires a sandbox driver that supports suspend.
    arguments:
    - *id003
    - *id001
    outputs: *id011
    execution: true
  - name: openshell-sandbox-resume
    description: Resumes a suspended sandbox.
    arguments:
    - *id003
    - *id001
    outputs: *id011
    execution: true
  - name: openshell-sandbox-delete
    description: Deletes a sandbox. This action cannot be undone.
    arguments:
    - *id003
    - *id001
    - &id014
      name: confirm
      description: This action cannot be undone. Set to yes to confirm.
      required: true
      auto: PREDEFINED
      predefined:
      - 'yes'
      - 'no'
    - name: allow_missing
      description: Whether to succeed if the sandbox does not exist.
      required: false
      defaultValue: 'false'
      auto: PREDEFINED
      predefined: *id004
    outputs:
    - contextPath: OpenShell.Sandbox.Name
      description: The sandbox name.
      type: String
    - contextPath: OpenShell.Sandbox.ID
      description: The sandbox ID.
      type: String
    - contextPath: OpenShell.Sandbox.Outcome
      description: The deletion outcome.
      type: String
    - contextPath: OpenShell.Sandbox.Action
      description: The action that was requested.
      type: String
    execution: true
  - name: openshell-sandbox-logs
    description: Returns recent sandbox log lines, such as network decisions, process and policy events.
    arguments:
    - *id003
    - *id001
    - name: lines
      description: The number of log lines to return.
      required: false
      defaultValue: '200'
    - name: min_level
      description: The minimum log level, for example WARN.
      required: false
    - name: sources
      description: A comma-separated list of log sources to include.
      required: false
      isArray: true
    outputs:
    - contextPath: OpenShell.Log.Sandbox
      description: The sandbox name.
      type: String
    - contextPath: OpenShell.Log.Time
      description: The event time.
      type: Date
    - contextPath: OpenShell.Log.Level
      description: The log level.
      type: String
    - contextPath: OpenShell.Log.Source
      description: The log source.
      type: String
    - contextPath: OpenShell.Log.Target
      description: The log target.
      type: String
    - contextPath: OpenShell.Log.Message
      description: The log message.
      type: String
  - name: openshell-policy-get
    description: 'Returns the current network policy of a sandbox: rules, hosts, ports and allowed binaries.'
    arguments:
    - *id003
    - *id001
    outputs:
    - contextPath: OpenShell.Policy.Sandbox
      description: The sandbox name.
      type: String
    - contextPath: OpenShell.Policy.Version
      description: The policy version.
      type: Number
    - contextPath: OpenShell.Policy.PolicyHash
      description: The policy hash.
      type: String
    - contextPath: OpenShell.Policy.NetworkRules.Rule
      description: The network rule name.
      type: String
    - contextPath: OpenShell.Policy.NetworkRules.Host
      description: The allowed host.
      type: String
    - contextPath: OpenShell.Policy.NetworkRules.Ports
      description: The allowed ports.
      type: Number
    - contextPath: OpenShell.Policy.NetworkRules.Protocol
      description: The protocol.
      type: String
    - contextPath: OpenShell.Policy.NetworkRules.Path
      description: The allowed path.
      type: String
    - contextPath: OpenShell.Policy.NetworkRules.Binaries
      description: The binaries allowed to use the rule.
      type: String
  - name: openshell-policy-history
    description: Returns the policy revisions of a sandbox, newest first.
    arguments:
    - *id003
    - *id001
    - name: limit
      description: The maximum number of revisions to return.
      required: false
      defaultValue: '20'
    outputs:
    - contextPath: OpenShell.PolicyRevision.Sandbox
      description: The sandbox name.
      type: String
    - contextPath: OpenShell.PolicyRevision.Version
      description: The policy version.
      type: Number
    - contextPath: OpenShell.PolicyRevision.Status
      description: The revision status.
      type: String
    - contextPath: OpenShell.PolicyRevision.Hash
      description: The policy hash.
      type: String
    - contextPath: OpenShell.PolicyRevision.LoadError
      description: The load error, if the revision failed to load.
      type: String
    - contextPath: OpenShell.PolicyRevision.Created
      description: The time the revision was created.
      type: Date
  - name: openshell-egress-block-host
    description: Removes every allow entry for a host from the sandbox network policy, so the agent can no longer reach that host. The sandbox keeps running.
    arguments:
    - *id003
    - name: host
      description: The destination host, for example files.example.com.
      required: true
    - *id001
    - &id012
      name: reason
      description: Free text recorded on the new policy revision.
      required: false
      defaultValue: Cortex response
    outputs: &id013
    - contextPath: OpenShell.PolicyChange.Sandbox
      description: The sandbox name.
      type: String
    - contextPath: OpenShell.PolicyChange.NewVersion
      description: The new policy version.
      type: Number
    - contextPath: OpenShell.PolicyChange.PolicyHash
      description: The hash of the new policy.
      type: String
    - contextPath: OpenShell.PolicyChange.Change
      description: A summary of the change.
      type: String
    execution: true
  - name: openshell-policy-rule-remove
    description: Removes a network rule from the sandbox policy. All destinations of the rule are denied.
    arguments:
    - *id003
    - name: rule_name
      description: The network rule name.
      required: true
    - *id001
    - *id012
    outputs: *id013
    execution: true
  - name: openshell-policy-endpoint-remove
    description: Removes a single host and port from a network rule.
    arguments:
    - *id003
    - name: rule_name
      description: The network rule name.
      required: true
    - name: host
      description: The host to remove.
      required: true
    - name: port
      description: The port to remove. 0 removes the host on any port.
      required: false
      defaultValue: '0'
    - *id001
    - *id012
    outputs: *id013
    execution: true
  - name: openshell-policy-binary-remove
    description: Removes a binary, for example /usr/bin/curl, from a network rule so it can no longer use that rule.
    arguments:
    - *id003
    - name: rule_name
      description: The network rule name.
      required: true
    - name: binary_path
      description: The binary path.
      required: true
    - *id001
    - *id012
    outputs: *id013
    execution: true
  - name: openshell-provider-list
    description: Lists the credential providers attached to a sandbox.
    arguments:
    - *id003
    - *id001
    outputs:
    - contextPath: OpenShell.Provider.Sandbox
      description: The sandbox name.
      type: String
    - contextPath: OpenShell.Provider.Name
      description: The provider name.
      type: String
    - contextPath: OpenShell.Provider.Type
      description: The provider type.
      type: String
    - contextPath: OpenShell.Provider.Workspace
      description: The provider profile workspace.
      type: String
  - name: openshell-provider-detach
    description: Detaches a credential provider from a sandbox, so the agent no longer receives those credentials. This action cannot be undone.
    arguments:
    - *id003
    - name: provider
      description: The provider name.
      required: true
    - *id001
    - *id014
    outputs:
    - contextPath: OpenShell.Provider.Sandbox
      description: The sandbox name.
      type: String
    - contextPath: OpenShell.Provider.Name
      description: The provider name.
      type: String
    - contextPath: OpenShell.Provider.Action
      description: The action that was performed.
      type: String
    execution: true
  dockerimage: demisto/openshell:1.0.0.0
  isfetch: false
  runonce: false
  script: ''
  subtype: python3
  type: python
fromversion: 6.10.0
tests:
- No tests (auto formatted)
