name: Palo Alto Networks Device Security
display: Palo Alto Networks Device Security
provider: Palo Alto Networks
category: Network Security
sectionorder:
- Connect
- Collect
description: Use the Palo Alto Networks Device Security integration to fetch alerts and vulnerabilities, retrieve device details, and resolve security incidents (previously Zingbox).
defaultclassifier: Palo Alto Networks Device Security Classifier
defaultmapperin: Palo Alto Networks Device Security Incoming Mapper
