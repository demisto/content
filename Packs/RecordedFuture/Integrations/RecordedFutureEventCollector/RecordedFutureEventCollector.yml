  id: RecordedFutureEventCollector
  version: -1
configuration:
- displaypassword: API token
  additionalinfo: The API token to use for the connection.
  name: credentials
  required: true
  hiddenusername: true
  type: 9
  section: Connect
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  section: Connect
  required: false
- display: Use system proxy settings
  name: proxy
  type: 8
  section: Connect
  required: false
- defaultvalue: 3 days
  display: First fetch time
  name: first_fetch
  type: 0
  section: Collect
  required: false
- defaultvalue: 1000
  display: The maximum number of events per fetch. Default and maximum is 1000.
  name: max_fetch
  type: 0
  section: Collect
  required: false
- defaultvalue: legacy
  display: Debug cursor mode (XSUP-80326)
  additionalinfo: 'legacy - original behaviour (cursor taken from the first event in the response). newest - cursor taken from the newest event in the response.'
  name: debug_cursor_mode
  type: 15
  options:
  - legacy
  - newest
  section: Collect
  advanced: true
