inputs:
- key: Using
  value: {}
  required: false
  description: |-
    The name of the ANY.RUN Cloud Sandbox integration instance to use for running commands in this playbook.
    If left empty, and more than one instance is enabled, the playbook automatically selects the first active instance instead of running commands on every enabled instance.
  playbookInputQuery: null
- key: obj_url
  value:
    simple: ${issue.xdmtargeturl}
  required: false
  description: 'Target URL to submit to ANY.RUN. By default, this playbook uses the
    Cortex XDR normalized target URL field xdm.target.url (${issue.xdmtargeturl}).
    If your issue uses another URL field, such as xdm.network.http.url, override this
    input accordingly. Size range 5-512. Example: (http/https)://(your-link)'
  playbookInputQuery: null
- key: env_locale
  value:
    simple: en-US
  required: false
  description: 'Operation system language. Use locale identifier or country name (Ex:
    "en-US" or "Brazil"). Case insensitive.'
  playbookInputQuery: null
- key: env_os
  value:
    simple: ubuntu
  required: false
  description: Operation system. Possible values - ubuntu, debian
  playbookInputQuery: null
- key: opt_network_connect
  value:
    simple: "True"
  required: false
  description: Network connection state.
  playbookInputQuery: null
- key: opt_network_fakenet
  value:
