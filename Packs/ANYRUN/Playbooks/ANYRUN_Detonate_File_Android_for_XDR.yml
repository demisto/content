inputs:
- key: Using
  value: {}
  required: false
  description: |-
    The name of the ANY.RUN Cloud Sandbox integration instance to use for running commands in this playbook.
    If left empty, and more than one instance is enabled, the playbook automatically selects the first active instance instead of running commands on every enabled instance.
  playbookInputQuery: null
- key: file_entry_id
  value: {}
  required: false
  description: Existing War Room file EntryID to submit to ANY.RUN Android analysis.
  playbookInputQuery: null
- key: env_locale
  value:
    simple: en-US
  required: false
  description: 'Operation system language. Use locale identifier or country name (Ex:
    "en-US" or "Brazil"). Case insensitive.'
