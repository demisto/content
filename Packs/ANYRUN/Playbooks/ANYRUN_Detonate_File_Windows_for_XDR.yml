inputs:
- key: Using
  value: {}
  required: false
  description: |-
    The name of the ANY.RUN Cloud Sandbox integration instance to use for running commands in this playbook.
    If left empty, and more than one instance is enabled, the playbook automatically selects the first active instance instead of running commands on every enabled instance.
  playbookInputQuery: null
- key: file_entry_id
  value: {}
  required: false
  description: Existing War Room file EntryID. If provided, endpoint retrieval is
    skipped and this file is submitted to ANY.RUN.
  playbookInputQuery: null
- key: endpoint_id
  value:
    simple: ${issue.xdmsourceagentidentifier}
  required: false
  description: Cortex XDR endpoint/agent ID. Used only when file_entry_id is not provided.
  playbookInputQuery: null
- key: file_path
  value:
    simple: ${issue.initiatorpath}
  required: false
  description: Full path to the file on the endpoint. Used for retrieval and for extracting
    the filename used to select the original file after unzip.
  playbookInputQuery: null
- key: retrieve_timeout_seconds
  value:
    simple: "240"
  required: false
  description: Timeout for Cortex XDR file retrieve polling.
  playbookInputQuery: null
- key: retrieve_poll_interval_seconds
  value:
    simple: "30"
  required: false
  description: Polling interval for Cortex XDR file retrieve action status checks.
  playbookInputQuery: null
- key: env_locale
  value:
    simple: en-US
  required: false
  description: Operation system language. Use locale identifier or country name.
  playbookInputQuery: null
- key: env_bitness
  value:
    simple: "64"
  required: false
  description: Bitness of Operation System. Supports 32, 64.
  playbookInputQuery: null
- key: env_version
  value:
    simple: "10"
  required: false
  description: 'Version of OS. Supports: 7, 10, 11.'
  playbookInputQuery: null
- key: env_type
  value:
    simple: complete
  required: false
  description: Environment preset type. You can select development env for OS Windows
    10 x64. For all other cases, complete env is required.
  playbookInputQuery: null
- key: opt_network_connect
  value:
    simple: "True"
  required: false
  description: Network connection state.
  playbookInputQuery: null
- key: opt_network_fakenet
  value:
    simple: "False"
  required: false
  description: FakeNet feature status.
  playbookInputQuery: null
- key: opt_network_tor
  value:
    simple: "False"
  required: false
  description: TOR using.
  playbookInputQuery: null
- key: opt_network_geo
  value:
    simple: fastest
  required: false
  description: 'Tor geo location option. Example: US, AU.'
  playbookInputQuery: null
- key: opt_network_mitm
  value:
    simple: "False"
  required: false
  description: HTTPS MITM proxy option.
  playbookInputQuery: null
- key: opt_network_residential_proxy
  value:
    simple: "False"
  required: false
  description: Residential proxy using.
  playbookInputQuery: null
- key: opt_network_residential_proxy_geo
  value:
    simple: fastest
  required: false
  description: 'Residential proxy geo location option. Example: US, AU.'
  playbookInputQuery: null
- key: opt_privacy_type
  value:
    simple: bylink
  required: false
  description: 'Privacy settings. Supports: public, bylink, owner, byteam.'
  playbookInputQuery: null
- key: opt_timeout
  value:
    simple: "240"
  required: false
  description: 'Timeout option. Size range: 10-660.'
  playbookInputQuery: null
- key: opt_automated_interactivity
  value:
    simple: "True"
  required: false
  description: Automated interactivity.
  playbookInputQuery: null
- key: obj_ext_cmd
  value: {}
  required: false
  description: Optional command line.
  playbookInputQuery: null
- key: obj_ext_startfolder
  value:
    simple: temp
  required: false
  description: 'Start object from. Supports: desktop, home, downloads, appdata, temp,
    windows, root.'
  playbookInputQuery: null
- key: obj_force_elevation
  value:
    simple: "False"
  required: false
  description: Forces the file to execute with elevated privileges and an elevated
    token for PE files only.
  playbookInputQuery: null
- key: obj_ext_extension
  value:
    simple: "True"
  required: false
  description: Change extension to valid.
  playbookInputQuery: null
