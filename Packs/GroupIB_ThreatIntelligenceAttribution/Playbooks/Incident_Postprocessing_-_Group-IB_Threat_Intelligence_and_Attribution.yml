description: |-
  Enriches a Group-IB incident. The GIBTIEnrichIncidentIndicators automation reads the record again with the matching gibti-get-*-info command, so every observable of the record is created with the verdict, tags, malware family, TLP, geo data, ASN, file hashes and size, CVSS score and vector, CVE dates and description, and GIB Collection of the record, and related to the Malware / Threat Actor objects it names (the automation creates those objects). A Cryptocurrency Address indicator gets no tags, malware family or TLP, and an Email or CVE indicator no malware family. The names on a GIB Data Breach incident (the leak's publishers) and on a defacement incident (the defacer's handle) make no object. A phishing group that Group-IB flags as a false positive or allow-listed gives no indicator and no object. In an incident of a legacy type (a renamed or removed collection), the automation returns a note and enriches nothing.
  Incidents that name threat actors then get every actor profile (hi/threat_actor or apt/threat_actor; the incident's APT flag picks the collection searched first, and an actor missing there is read from the other one) and the first threat report each kind of profile lists (hi/threat, apt/threat). An actor that neither actor collection publishes (a defacer known from attacks/deface only, or a profile Group-IB has not published) is noted in the War Room and the playbook goes on.
  It is the default playbook of every Group-IB incident type, and none of them runs it automatically: start it from the incident, or turn on Run playbook automatically in the incident type. Incidents without a threat actor finish after the indicator enrichment. A failed lookup never stops the playbook.
id: Incident Postprocessing - Group-IB Threat Intelligence & Attribution
inputs: []
name: Incident Postprocessing - Group-IB Threat Intelligence & Attribution
outputs:
- contextPath: GIBTI.GIBCybercriminalThreatActorProfile
  description: Cybercriminal threat actor profile (hi/threat_actor).
  type: unknown
- contextPath: GIBTI.Nation-StateCybercriminalsThreatActorProfile
  description: Nation-state threat actor profile (apt/threat_actor).
  type: unknown
- contextPath: GIBTI.GIBCybercriminalThreatReport
  description: Cybercriminal threat report (hi/threat).
  type: unknown
- contextPath: GIBTI.Nation-StateCybercriminalsThreatReport
  description: Nation-state threat report (apt/threat).
  type: unknown
