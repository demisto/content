description: 'Responds to the leak incidents: GIB Data Breach (your users'' credentials in a breach dump), GIB OSI Git Leak (your secrets in a public repository) and GIB OSI Public Leak (your data on a paste or code-sharing site). For a breach the playbook checks that the e-mail domains are yours and looks the accounts up in your directory, then resets their passwords and ends their sessions, with or without an analyst''s decision as the inputs say. For a git leak with a detected secret it rotates the credentials (Cloud Credentials Rotation - Generic), mails the committers and opens a ticket for the developers, each as the inputs allow. For a public leak it routes payment card data to the fraud team and leaves the rest to the analyst. The sub-playbooks and the mail steps use whichever directory, IAM, cloud, mail and ticketing integrations are enabled on your Cortex XSOAR. Containment Plan - Clear User Sessions, Eradication Plan - Reset Password and Ticket Management - Generic ship only for Cortex XSIAM and the Cortex platform; on a tenant without them, the steps that call them are skipped.'
id: Group-IB TI - Leaked Credentials and Secrets
inputs:
- description: The leaked e-mail addresses of a breach.
  key: Emails
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibemails
- description: The domains of the leaked e-mail addresses.
  key: EmailDomains
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibemaildomains
- description: 'Comma-separated e-mail domains of your organization. A breach of other domains is left to the analyst. Empty: every domain counts as yours.'
  key: CorporateDomains
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: The names your directory and IAM know the leaked accounts by; the e-mail addresses by default.
  key: Username
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibemails
- description: The domain suffix of the account in your IAM, with its @ (@example.com), for a Username without a domain; Account Enrichment - Generic v2.1 appends it for the IAM lookup. Leave it empty when Username is an e-mail address.
  key: IAMUserDomain
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: True resets the passwords and ends the sessions without asking the analyst.
  key: AutoResetPassword
  playbookInputQuery: null
  required: false
  value:
    simple: 'False'
- description: The secret types Group-IB detected in the leaked files (password, api_key, bearer, ...).
  key: SecretTypes
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibosigitrepositoryfilestable.datafound
- description: The e-mail addresses of the committers of the leaked files.
  key: CommitterEmails
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibosigitrepositoryfilestable.authoremail
- description: True mails the committers through the mail sender integration.
  key: NotifyCommitters
  playbookInputQuery: null
  required: false
  value:
    simple: 'False'
- description: 'What to do with the leaked cloud credentials: Ask (an analyst decides), True (rotate) or False (never).'
  key: RotateCredentials
  playbookInputQuery: null
  required: false
  value:
    simple: Ask
- description: 'The cloud provider of the leaked credentials for Cloud Credentials Rotation - Generic: AWS, AZURE or GCP.'
  key: CloudProvider
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: The remediation Cloud Credentials Rotation - Generic applies (see its inputs).
  key: CloudRemediationType
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: The identity type of the leaked credentials (IAM, SERVICE_ACCOUNT, ...).
  key: CloudIdentityType
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: True opens a ticket for the developers of a leaked repository.
  key: CreateTicket
  playbookInputQuery: null
  required: false
  value:
    simple: 'False'
- description: The ServiceNow assignment group of the ticket.
  key: TicketAssignmentGroup
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: The address the card data of a public leak is reported to. Empty leaves it to the analyst.
  key: FraudTeamEmail
  playbookInputQuery: null
  required: false
  value:
    simple: ''
name: Group-IB TI - Leaked Credentials and Secrets
