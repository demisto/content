description: 'Responds to a GIB Compromised Account Group incident: a login of your organization that a stealer log or a combolist exposed. The playbook checks that the login belongs to one of your domains and enriches the incident''s indicators. It looks the account up in your directory (Account Enrichment - Generic v2.1) and, when a directory knows it, searches your SIEM for failed logins and lists the user''s devices. Then it resets the password, ends the sessions and disables the account, each at once or after an analyst agrees, as AutoResetPassword and AutoDisableAccount say. When CreateTicket is True and the stealer log names the device, it opens a ticket for that device. The remediation goes through the generic sub-playbooks, which use the directory, SIEM, EDR and ticketing integrations enabled on your Cortex XSOAR; a step whose integration is missing is skipped. Containment Plan - Clear User Sessions, Eradication Plan - Reset Password and Ticket Management - Generic ship only for Cortex XSIAM and the Cortex platform; on a tenant without them, the steps that call them are skipped.'
id: Group-IB TI - Compromised Account Response
inputs:
- description: The compromised login as Group-IB serves it, usually an e-mail address.
  key: Login
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibcompromisedlogin
- description: The domain of the login's e-mail address.
  key: LoginDomain
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibparsedlogindomain
- description: 'Comma-separated e-mail domains of your organization. A login outside them is left to the analyst. Empty: every login counts as yours.'
  key: CorporateDomains
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: The name your directory, SIEM and IAM know the account by; the login itself by default.
  key: Username
  playbookInputQuery: null
  required: false
  value:
    complex:
      root: incident
      accessor: gibcompromisedlogin
- description: The domain suffix of the account in your IAM, with its @ (@example.com), for a Username without a domain; Account Enrichment - Generic v2.1 appends it for the IAM lookup. Leave it empty when Username is an e-mail address.
  key: IAMUserDomain
  playbookInputQuery: null
  required: false
  value:
    simple: ''
- description: True resets the password and ends the sessions without asking the analyst.
  key: AutoResetPassword
  playbookInputQuery: null
  required: false
  value:
    simple: 'False'
- description: True disables the account without asking the analyst.
  key: AutoDisableAccount
  playbookInputQuery: null
  required: false
  value:
    simple: 'False'
- description: True opens a ticket (Ticket Management - Generic) for the compromised device when the stealer log names one.
  key: CreateTicket
  playbookInputQuery: null
  required: false
  value:
    simple: 'False'
- description: The ServiceNow assignment group of the ticket.
  key: TicketAssignmentGroup
  playbookInputQuery: null
  required: false
  value:
    simple: ''
name: Group-IB TI - Compromised Account Response
