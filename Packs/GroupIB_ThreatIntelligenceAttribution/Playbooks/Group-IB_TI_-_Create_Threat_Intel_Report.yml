description: |-
  Creates a Cortex XSOAR Threat Intel Report from the Group-IB record behind an incident, through the GIBTICreateThreatIntelReport automation. The report type follows the collection: threat reports (GIB Cybercriminal Threat, GIB Nation-State Cybercriminals Threat) become Campaign reports, actor profiles Threat Actor reports, GIB Malware incidents Malware reports and GIB OSI Vulnerability incidents Vulnerability reports. Any other incident type finishes immediately.
  The playbook ships attached to no incident type: the default playbook of every Group-IB incident type is "Incident Postprocessing - Group-IB Threat Intelligence & Attribution". Attach this playbook to the types above, call it from your own playbook, or run the automation by hand inside one of those incidents.
id: Group-IB TI - Create Threat Intel Report
