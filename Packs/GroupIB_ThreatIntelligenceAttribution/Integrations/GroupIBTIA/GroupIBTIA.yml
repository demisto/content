  - name: domain
    description: Returns the Group-IB reputation of one or more domains. The Group-IB risk score (scoring/domain) and ioc/primary decide the verdict. Bad for a risk score of 80-100. Suspicious for a risk score of 40-79, or when ioc/primary lists the domain, whatever its risk score there. Good for a risk score of 0-39 when ioc/primary does not list it. Unknown without a risk score or a listing. The setting Collections that keep an IP at least Suspicious does not apply to a domain. Records of apt/threat and hi/open_threats give tags, names, relationships and publications, and a defacement of the value in attacks/deface gives its collection tag and TLP; they never decide. When the risk score makes the verdict Suspicious or Bad, the collections of the matched records become tags, the threat and actor names of every matched record but the defacements become tags too, the malware names of those records become Malware Family, the most restrictive TLP of the matched records becomes the TLP, and the apt/threat and hi/open_threats records become publications; when ioc/primary makes it Suspicious, the tags, Malware Family and TLP come from the ioc/primary records only, and there are no publications. With Create relationships enabled, the malware families and actors also become relationships. The value is refanged, lowercased and stripped of a final dot first. A refused key (HTTP 401) fails the command; a value whose requests all fail, HTTP 403 and 404 included, or do not answer in time gets an error entry of its own, and the other values still return. When the risk score or ioc/primary fails or does not answer within Lookup timeout (seconds), GIBTI.Reputation.partial is true, and a verdict is set only if no missing answer could have raised it. A missing risk score could make it Bad, so only a Bad verdict is set; a missing ioc/primary could make it Suspicious, so a Suspicious or Bad verdict is set and a lower one is not. Without a verdict, the indicator keeps the one it has. A request answered with HTTP 403 (the key has no access) is named in the War Room note; HTTP 403 and HTTP 404 (no record) do not make the result partial, and the verdict comes from the others. With Add WHOIS to ip and domain enabled, the indicator also carries the registrar and its abuse contact, the registrant's organization and country, the registrant's name and e-mail address unless WHOIS personal data is Drop, and the dates, statuses and name servers from the WHOIS record.
