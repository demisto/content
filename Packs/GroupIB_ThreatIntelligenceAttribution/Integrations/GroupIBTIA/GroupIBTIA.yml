      description: Number of records matching the query.
      type: Number
    - contextPath: GIBTI.search.global.supportedByPack
      description: Whether the pack has a lookup command for the collection.
      type: Boolean
    - contextPath: GIBTI.search.global.GIBLink
      description: Link to the matches in the Group-IB portal or API.
      type: String
    - contextPath: GIBTI.search.global.query
      description: The collection's search path for the value (its apiPath followed by ?q= and the query); unique per row.
      type: String
  - arguments:
    - description: |-
        Collection you want to search.
      name: collection_name
      required: true
      auto: PREDEFINED
      predefined:
      - compromised/account_group
      - compromised/bank_card_group
      - compromised/masked_card
      - compromised/breacheddb
      - compromised/spd
      - osi/git_repository
      - osi/public_leak
      - osi/vulnerability
      - attacks/ddos
      - attacks/deface
      - attacks/phishing_group
      - attacks/phishing_kit
      - suspicious_ip/tor_node
      - suspicious_ip/open_proxy
      - suspicious_ip/socks_proxy
      - suspicious_ip/vpn
      - suspicious_ip/scanner
      - malware/cnc
      - malware/malware
      - hi/threat
      - hi/threat_actor
      - apt/threat_actor
      - apt/threat
      - compromised/access
      - compromised/messenger
      - compromised/discord
      - darkweb/forums
      - hi/open_threats
    - name: query
      required: false
      description: |-
        Value or field query to filter the collection by, e.g. 203.0.113.7. Without it the command returns the records it reads in update order: from the oldest record, from date_from or from seq_update; compromised/discord without seq_update or date_from returns its newest records first.
    - name: date_from
      description: Start of the search window (e.g. 2024-01-01 or "30 days"); on a trial or POC account, some collections serve only the last 30 days. It does not narrow compromised/spd, compromised/breacheddb, compromised/messenger, osi/git_repository or darkweb/forums, and on osi/vulnerability it filters on the record's own date. The window applies to the first page; a later page follows the cursor and can hold records outside it.
    - name: date_to
      description: End of the search window (e.g. 2024-06-30); requires date_from.
    - name: seq_update
      description: seqUpdate cursor to resume the collection's update feed from (for example the highest seqUpdate among the rows of a previous call).
    - name: requests_limit
      description: Maximum number of API requests (pages) sent to the collection; darkweb/forums reads one page whatever the value.
      defaultValue: "1"
    - name: page_size_limit
      description: Maximum number of entries per API response (page size). A collection with a smaller page size of its own is read in pages of that size.
      defaultValue: "100"
    - name: include_raw_feed
      description: |-
        If set to true, each row also carries its parsed record, masked as the instance settings say, as 'raw_feed'.
        Use with caution: can increase context size.
      defaultValue: "false"
    description: Deprecated. Use gibti-local-search instead. Searches one collection by a bare value, or by id:<id> on the collections whose API takes it (threat reports and actor profiles among them). A value matches the text of the records your account's feed of that collection serves; gibti-get-threat-actor-info and gibti-get-threat-info read a profile or a report outside the feed by its id. An optional date window or a seqUpdate cursor, which takes the place of the window when both are set, narrows the walk; without a cursor or a date window, the collection is walked from its oldest record. On darkweb/forums the command reads one page per call (pass the highest seqUpdate of its rows as seq_update for the next one), and compromised/discord without a cursor or a date window returns its newest records.
    name: gibtia-local-search
    deprecated: true
    outputs:
    - contextPath: GIBTI.search.local.id
      description: Id of a matching record.
      type: String
    - contextPath: GIBTI.search.local.additional_info
      description: 'The record''s name, as Name: <name>.'
      type: String
    - contextPath: GIBTI.search.local.seqUpdate
      description: The record's own seqUpdate (a cursor to resume from with seq_update).
      type: Number
    - contextPath: GIBTI.search.local.raw_feed
      description: The matching record as a one-line JSON string, masked as the instance settings say (only when include_raw_feed=true).
      type: String
