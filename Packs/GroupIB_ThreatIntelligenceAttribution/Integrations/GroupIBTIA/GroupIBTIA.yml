  - name: gibti-ip-whois
    description: 'Returns the registry (WHOIS) record of one or more IP addresses from the Group-IB Graph WHOIS: the address range and its CIDR, the regional registry, the network name, the holder organization and its country of registration, the ASN that announces the range, the owner of the AS when the registry names it, and the abuse e-mail addresses and phones. Each field comes from the newest record that has it, and texts a registry puts in place of a value, such as a placeholder phone number, are left out. Unless Look up internal and reserved IP addresses is enabled, a private, shared or reserved address gets a note and no request. The value is refanged first. A refused key (HTTP 401 or 403) fails the command; any other failed request is the error entry of its value, and the other values still return. history=true adds up to history_limit earlier records. The command sets no verdict.'
    arguments:
    - name: ip
      default: true
      isArray: true
      required: true
      description: A comma-separated list of IP addresses.
    - name: history
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
      description: true adds up to history_limit earlier WHOIS records.
    - name: history_limit
      defaultValue: '10'
      description: How many earlier records history=true adds, the newest first; 1 or more.
    outputs:
    - contextPath: GIBTI.IPWhois.ip
      description: 'The IP address.'
      type: String
    - contextPath: GIBTI.IPWhois.rangeStart
      description: 'First address of the registered range.'
      type: String
    - contextPath: GIBTI.IPWhois.rangeEnd
      description: 'Last address of the registered range.'
      type: String
    - contextPath: GIBTI.IPWhois.cidr
      description: 'CIDR of the registered range.'
      type: String
    - contextPath: GIBTI.IPWhois.registry
      description: 'Regional registry of the range (ARIN, RIPE, APNIC, LACNIC or AFRINIC).'
      type: String
    - contextPath: GIBTI.IPWhois.netname
      description: 'Network name of the range.'
      type: String
    - contextPath: GIBTI.IPWhois.organization
      description: 'Organization that holds the range.'
      type: String
    - contextPath: GIBTI.IPWhois.country
      description: Country of the organization that holds the range (else of the range), as an ISO code; not the location of the address.
      type: String
    - contextPath: GIBTI.IPWhois.asn
      description: 'ASN that announces the range.'
      type: String
    - contextPath: GIBTI.IPWhois.asOwner
      description: 'Owner of the AS, when the registry names it.'
      type: String
    - contextPath: GIBTI.IPWhois.abuseEmails
      description: 'Abuse e-mail addresses of the range.'
      type: String
    - contextPath: GIBTI.IPWhois.abusePhones
      description: 'Phones of the abuse contact of the range.'
      type: String
    - contextPath: GIBTI.IPWhois.status
      description: 'Registration status of the range.'
      type: String
    - contextPath: GIBTI.IPWhois.firstSeen
      description: 'When Group-IB first saw the newest record.'
      type: Date
    - contextPath: GIBTI.IPWhois.lastSeen
      description: 'When Group-IB last saw the newest record.'
      type: Date
    - contextPath: GIBTI.IPWhois.history.firstSeen
      description: 'With history=true, when Group-IB first saw an earlier record.'
      type: Date
    - contextPath: GIBTI.IPWhois.history.lastSeen
      description: 'With history=true, when Group-IB last saw an earlier record.'
      type: Date
    - contextPath: GIBTI.IPWhois.history.organization
      description: 'With history=true, the holder organization of an earlier record.'
      type: String
    - contextPath: GIBTI.IPWhois.history.netname
      description: 'With history=true, the network name of an earlier record.'
      type: String
    - contextPath: GIBTI.IPWhois.history.asn
      description: 'With history=true, the ASN of an earlier record.'
      type: String
    - contextPath: GIBTI.IPWhois.history.cidr
      description: 'With history=true, the CIDR of an earlier record.'
