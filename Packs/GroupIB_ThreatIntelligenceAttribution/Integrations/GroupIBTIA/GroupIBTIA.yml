    compliantpolicies:
    - IP Blockage
  - name: gibti-domain-whois
    description: 'Returns the registration (WHOIS) record of one or more domains from the Group-IB Graph WHOIS: the registrar with its IANA ID and abuse contact, the registrant''s organization and country, the registrant''s name and e-mail address unless WHOIS personal data is Drop, the statuses, the creation, update and expiration dates and the name servers. A subdomain is answered with the record of the registered domain under its zone, and an internationalized domain is looked up in its ASCII form. The registrar, the registrant''s organization and country, the statuses, the dates and the name servers come from the newest record that has them; the IANA ID, the abuse contact and the registrant''s name and e-mail address come from the current record only. Texts a registry puts in place of a value, such as REDACTED FOR PRIVACY, are left out. The value is refanged, lowercased and stripped of a final dot first. A refused key (HTTP 401 or 403) fails the command; any other failed request is the error entry of its value, and the other values still return. history=true adds up to history_limit earlier records. The command sets no verdict.'
    arguments:
    - name: domain
      default: true
      isArray: true
      required: true
      description: A comma-separated list of domains.
    - name: history
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
      description: true adds up to history_limit earlier WHOIS records.
    - name: history_limit
      defaultValue: '10'
      description: How many earlier records history=true adds, the newest first; 1 or more.
