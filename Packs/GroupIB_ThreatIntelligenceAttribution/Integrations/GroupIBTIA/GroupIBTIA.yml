  - arguments:
    - description: |-
        One or more Group-IB threat actor ids, comma-separated, for example 0123456789abcdef0123456789abcdef01234567.
      name: id
      required: true
      isArray: true
    - name: isAPT
      auto: PREDEFINED
      predefined:
      - "true"
      - "false"
      description: Whether to read the ids from apt/threat_actor (true) or from hi/threat_actor (false) first. An id the first collection does not have is read from the other one.
      defaultValue: "false"
    description: Deprecated. Use gibti-get-threat-actor-info instead. Reads one or more threat actor profiles by id from hi/threat_actor, or from apt/threat_actor when isAPT is true. An id missing from the selected collection is read from the other one, since the actors a malware profile names carry no APT flag. Ids that neither collection publishes, such as a defacer Group-IB tracks only in attacks/deface or an actor profile it has not published, are listed in the War Room and do not fail the command. Profiles from apt/threat_actor go to GIBTI.Nation-StateCybercriminalsThreatActorProfile, profiles from hi/threat_actor to GIBTI.GIBCybercriminalThreatActorProfile. The description is returned as text. A report Group-IB lists as a bare id fills only the id column of the reports table.
    name: gibtia-get-threat-actor-info
    deprecated: true
