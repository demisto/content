      required: true
      default: true
      isArray: true
    description: Scores CVEs from the osi/vulnerability collection. The DBotScore combines exploit evidence, EPSS and CVSS with Group-IB's own severity. Bad for an exploit available (or a non-zero exploit count), seen in the wild, EPSS >= 0.5, EPSS percentile >= 0.95, CVSS >= 9.0 (Group-IB's merged cross-version CVSS, the legacy CVSS score only without it) or Group-IB severity red; Suspicious for every other CVE Group-IB has a record of, whatever its CVSS; Unknown when Group-IB has no record of the CVE. The CVE indicator is returned with its CVSS score and vector, publication and modification dates, description, TLP and the osi/vulnerability tag; the full scoring detail is written to GIBTI.CVEScoring.
