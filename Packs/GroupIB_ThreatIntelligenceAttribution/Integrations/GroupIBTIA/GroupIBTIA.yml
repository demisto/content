      type: Number
    - contextPath: GIBTI.Reputation.riskScore
      description: The Group-IB risk score (0-100) of an IPv4 address or a domain, the highest risk score of the matching ioc/primary records of a file hash, or the highest risk score with which ioc/primary lists a URL; empty without one.
      type: Number
    - contextPath: GIBTI.Reputation.collections
      description: The Group-IB collections whose records list the URL.
      type: String
    - contextPath: GIBTI.Reputation.sources.collection
      description: A Group-IB collection with records of the value.
      type: String
    - contextPath: GIBTI.Reputation.sources.count
      description: How many records of the collection list the URL, counted on the one page the lookup reads (up to 100 records).
      type: Number
    - contextPath: GIBTI.Reputation.sources.firstSeen
      description: Earliest dateFirstSeen of those records; empty when they carry none.
