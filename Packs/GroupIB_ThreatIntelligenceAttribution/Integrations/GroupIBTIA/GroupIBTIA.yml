    - description: |-
        One or more Group-IB threat report ids, comma-separated, for example 0123456789abcdef0123456789abcdef01234567.
      name: id
      required: true
      isArray: true
    - name: isAPT
      auto: PREDEFINED
      predefined:
      - "true"
      - "false"
      description: Whether to read the ids from apt/threat (true) or from hi/threat (false) first. An id the first collection does not have is read from the other one.
      defaultValue: "false"
    description: Reads one or more threat reports by id from hi/threat, or from apt/threat when isAPT is true. An id missing from the selected collection is read from the other one, and the ids neither collection publishes are listed in the War Room instead of failing the command. Reports from apt/threat go to GIBTI.Nation-StateCybercriminalsThreatReport, reports from hi/threat to GIBTI.GIBCybercriminalThreatReport. The description is returned as text, as the incident shows it.
