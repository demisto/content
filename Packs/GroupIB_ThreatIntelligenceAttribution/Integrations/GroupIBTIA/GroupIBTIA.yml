  - name: url
    description: Returns the Group-IB reputation of one or more URLs. Group-IB scores IPv4 addresses and domains only, so the verdict comes from ioc/primary, read directly; only a record that lists the URL itself counts. Bad when ioc/primary lists the URL with a risk score of 80 or more; Suspicious when it lists the URL with a lower risk score or none; otherwise Unknown. The collection and the threat and actor names of its records become tags, and, with Create relationships enabled, the malware families and actors become relationships. The result carries the attributed malware families as Malware Family and the most restrictive TLP of the matched records. The value is refanged first, and the indicator carries the refanged URL. A refused key (HTTP 401) fails the command. When ioc/primary fails, HTTP 403 (the key has no access) and HTTP 404 (no record) included, or does not answer within Lookup timeout (seconds), the value gets an error entry of its own and no verdict, so the indicator keeps the verdict it has, and the other values still return.
