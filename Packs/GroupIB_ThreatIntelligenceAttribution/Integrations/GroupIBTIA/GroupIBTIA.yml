  - name: ip
    description: Returns the Group-IB reputation of one or more IPs. The Group-IB risk score (scoring/ip), ioc/primary and the suspicious_ip/* collections selected in Collections that keep an IP at least Suspicious decide the verdict. Bad for a risk score of 80-100. Suspicious for a risk score of 40-79, or when ioc/primary lists the IP, whatever its risk score there, or a selected suspicious_ip/* collection lists the IP itself, at any age unless Suspicious IP listing recency (days) sets a window. Good for a risk score of 0-39 without such a listing. Unknown without a risk score or a listing. Records of apt/threat and hi/open_threats give tags, names, relationships and publications, and a defacement of the value in attacks/deface gives its collection tag and TLP; they never decide. When the risk score makes the verdict Suspicious or Bad, the collections of the matched records become tags, the threat and actor names of every matched record but the defacements become tags too, the malware names of those records become Malware Family, the most restrictive TLP of the matched records becomes the TLP, and the apt/threat and hi/open_threats records become publications; when ioc/primary makes it Suspicious, the tags, Malware Family and TLP come from the ioc/primary records only, and there are no publications; a suspicious_ip/* listing adds only its collection as a tag, and its TLP. With Create relationships enabled, the malware families and actors also become relationships. The value is refanged first. Unless Look up internal and reserved IP addresses is enabled, a private, shared or reserved address, the documentation ranges included, gets a note and no request. An IPv6 address gets no risk score, since Group-IB scores IPv4 addresses only. A refused key (HTTP 401) fails the command; a value whose requests all fail, HTTP 403 and 404 included, or do not answer in time gets an error entry of its own, and the other values still return. When the risk score, ioc/primary or a selected suspicious_ip/* collection fails or does not answer within Lookup timeout (seconds), GIBTI.Reputation.partial is true, and a verdict is set only if no missing answer could have raised it. A missing risk score could make it Bad, so only a Bad verdict is set; a missing ioc/primary or suspicious_ip/* collection could make it Suspicious, so a Suspicious or Bad verdict is set and a lower one is not. Without a verdict, the indicator keeps the one it has. A request answered with HTTP 403 (the key has no access) is named in the War Room note; HTTP 403 and HTTP 404 (no record) do not make the result partial, and the verdict comes from the others. With Add WHOIS to ip and domain enabled, the indicator also carries the ASN, the holder organization, the owner of the AS when the registry names it, and the abuse e-mail and phone from the WHOIS record.
    arguments:
    - name: ip
      default: true
      isArray: true
      description: A comma-separated list of IPs.
      required: true
    outputs:
    - contextPath: DBotScore.Indicator
      description: The indicator that was tested.
      type: String
    - contextPath: DBotScore.Type
      description: The indicator type.
      type: String
    - contextPath: DBotScore.Vendor
      description: The vendor used to calculate the score.
      type: String
    - contextPath: DBotScore.Score
      description: The actual score.
      type: Number
    - contextPath: DBotScore.Reliability
      description: Reliability of the source.
      type: String
    - contextPath: IP.Address
      description: IP address.
      type: String
    - contextPath: IP.ASN
      description: 'ASN that announces the address range (WHOIS).'
      type: String
    - contextPath: IP.ASOwner
      description: 'Owner of the autonomous system, when the registry names it (WHOIS).'
      type: String
    - contextPath: IP.Organization.Name
      description: 'Organization that holds the address range (WHOIS).'
      type: String
    - contextPath: IP.Registrar.Abuse.Phone
      description: 'Phones of the abuse contact of the address range, comma-separated (WHOIS).'
      type: String
    - contextPath: IP.Registrar.Abuse.Email
      description: 'Abuse e-mail addresses of the address range, comma-separated (WHOIS).'
      type: String
    - contextPath: IP.Tags
      description: Collections of the matched ioc/primary, apt/threat, hi/open_threats and attacks/deface records, with the threat names and actors of all but the defacements, when the risk score makes the IP Suspicious or Bad; when ioc/primary makes it Suspicious, those of the ioc/primary records only. A suspicious_ip/* collection selected in Collections that keep an IP at least Suspicious adds its name when it lists the IP within Suspicious IP listing recency (days), and is the only tag when it raised the verdict. Below Suspicious, with Collection tags at every verdict enabled, the collections in GIBTI.Reputation.collections, without names, and never a collection selected in Collections that keep an IP at least Suspicious.
      type: String
    - contextPath: IP.MalwareFamily
      description: Malware families of the records the tags come from; empty below Suspicious.
      type: String
    - contextPath: IP.TrafficLightProtocol
      description: Most restrictive TLP of the records the tags come from; empty below Suspicious.
      type: String
    - contextPath: IP.FirstSeenBySource
      description: Earliest first sighting (dateFirstSeen) of the Group-IB records that list or mention the IP.
      type: Date
    - contextPath: IP.LastSeenBySource
      description: Latest last sighting (dateLastSeen) of the Group-IB records that list or mention the IP.
      type: Date
    - contextPath: IP.Publications.source
      description: Publisher of a Group-IB threat report (Group-IB Threat Intelligence) or a public post that names the IP, on a result the risk score makes Suspicious or Bad.
      type: String
    - contextPath: IP.Publications.title
      description: Title of the report or post.
