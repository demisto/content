category: Data Enrichment & Threat Intelligence
provider: Group-IB
commonfields:
  id: Group-IB Threat Intelligence & Attribution
  version: -1
defaultclassifier: Group-IB Threat Intelligence (classifier)
defaultmapperin: Group-IB Threat Intelligence (mapper)
configuration:
- additionalinfo: The Group-IB TI API URL (default https://tap.group-ib.com/api/v2/).
  defaultvalue: https://tap.group-ib.com/api/v2/
  display: GIB TI URL
  name: url
  required: true
  type: 0
  section: Connect
- additionalinfo: The e-mail address you log in to the Group-IB portal with. Enter your API token (Personal token) as the password.
  display: Username
  name: credentials
  required: true
  type: 9
  section: Connect
- additionalinfo: Whether to allow connections without verifying the SSL certificate's validity.
  display: Trust any certificate (not secure)
  name: insecure
  required: false
  type: 8
  section: Connect
- additionalinfo: Whether to use Cortex XSOAR system proxy settings to connect to the API.
  display: Use system proxy settings
  name: proxy
  required: false
  type: 8
  section: Connect
- display: Source Reliability
  name: integration_reliability
  required: true
  type: 15
  section: Connect
  additionalinfo: Reliability of the source providing the intelligence data. Every DBotScore the integration writes carries it, except the reputation results that Ignore Source Reliability override gives a computed reliability. Default C - Fairly reliable.
  defaultvalue: C - Fairly reliable
  options:
  - A+ - 3rd party enrichment
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
- additionalinfo: Give the ip, domain, file and url reputation results the reliability of the most reliable matched collection (A for ioc/primary, ioc/common and apt/threat; B for hi/open_threats and attacks/deface) instead of Source Reliability. A result that none of these collections matched, the CVE indicators of gibti-cve-scoring and the indicators of the lookup commands keep Source Reliability. Disabled by default.
  display: Ignore Source Reliability override
  section: Connect
  name: disable_integration_reliability_override
  required: false
  type: 8
  defaultvalue: "false"
- additionalinfo: |-
    Select which reputation commands should be enabled for this integration instance (ip, domain, file, url).
    Default is none enabled. Only the selected commands perform enrichment and return a DBotScore.
    To keep this instance from answering the generic !ip/!domain/!file/!url commands, also select "Do not use by default" on the instance and call it explicitly with using="<instance name>".
  section: Connect
  display: Enable reputation commands
  name: enabled_reputation_commands
  required: false
  type: 16
  options:
  - ip
  - domain
  - file
  - url
- additionalinfo: The ip reputation command returns at least Suspicious for an IP that one of the selected suspicious_ip/* collections lists, whatever its Group-IB risk score, and tags it with the collection (without malware or actor names). It applies to ip only; the verdict of a domain comes from its risk score and ioc/primary. A listed IP can still score below 40, for example a Tor exit without malicious history. A collection counts only when one of its records is the IP itself, at any age unless Suspicious IP listing recency (days) sets a window. Each selected collection is one more request per IP. Every suspicious_ip/* collection is selected by default; clear one to leave the verdict to the risk score and ioc/primary. Select only the none option so that no listing keeps an IP at least Suspicious; an empty selection uses the default.
  display: Collections that keep an IP at least Suspicious
  name: reputation_floor_collections
  required: false
  type: 16
  section: Collect
  defaultvalue: suspicious_ip/tor_node,suspicious_ip/open_proxy,suspicious_ip/socks_proxy,suspicious_ip/vpn,suspicious_ip/scanner
  options:
  - suspicious_ip/tor_node
  - suspicious_ip/open_proxy
  - suspicious_ip/socks_proxy
  - suspicious_ip/vpn
  - suspicious_ip/scanner
  - none
- additionalinfo: How many days after Group-IB last saw it (dateLastSeen) a suspicious_ip/* listing still keeps an IP at least Suspicious in the ip reputation command and passes its TLP to the result. Empty (default) or 0 counts a listing of any age. A number applies to every suspicious_ip/* collection; a listing last seen longer ago, or without a last-seen date, leaves the IP to its risk score and ioc/primary. Set a window when an address that served as a proxy, relay or gateway should not stay Suspicious after it stops.
  display: Suspicious IP listing recency (days)
  name: reputation_floor_max_age_days
  required: false
  type: 0
  section: Collect
  advanced: true
- additionalinfo: 'What happens to passwords and other leaked secrets before they reach Cortex XSOAR (incident fields, the lookup commands and gibti-local-search). It covers the passwords of compromised/account_group and compromised/breacheddb records (GIB Password, GIB Passwords), and the columns of a breached record''s leak (GIB Breach Record Details), at any depth, whose name says they hold a password, a secret, a salt, a token, a session ID, a password hash or a secret key such as an API, access, private or SSH key (user_pass, userPw, usersalt, accessToken, sessionId, apiKey, passwordHash, md5, senha, sshKey). It also covers the values Group-IB''s detectors extracted from an osi/public_leak record (GIB Matches Table) and the record''s raw text (GIB Leaked Data). In these records and in dark web posts, it masks a secret written after such a name (password: ..., accessToken=..., "clientSecret": "...", <dbPassword>...</dbPassword>), the password of an e-mail:password pair, a url:login:password line or a user:password@host URL, an Authorization header, a Bearer or Basic credential, a crypt hash, the LM and NT hashes of an NTLM dump line, a private key, a GitHub, GitLab, Slack or Stripe token, and every other copy of a password or secret the record names or a text quotes, where it stands apart from other letters and digits (from six characters, or from four in a sentence for a value the record names). A login:password line without an e-mail address or URL is not recognized, and the C&C address of a compromised account keeps its credentials, which are the attacker''s. A login, a parsed login domain, a service domain or a breached record''s e-mail address or e-mail domain stays as it is when the password is part of its name (`sample@example.com`, the user of `CORP\sample`) or the whole of it, so the incident keeps naming its account: a password equal to the login stays readable there under Partial and Full. In those fields, a `login:password`, a URL, a password in the domain of a `DOMAIN\user` login or a password written beside a login is masked. A hash of anything else (emailHash), a passport number (passportNumber) and a column that dates a credential, names its type or describes it (passwordChangedAt, hashType, passwordLength) do not count as credentials. A breached record that holds a credential makes the incident High under every setting; a credential column holding only a flag (true/false, 0/1), a placeholder (null, -) or nothing does not count. Off (default) keeps everything as Group-IB delivers it. Partial keeps the first half of each password or secret followed by **** (of each part, for a value split by spaces, commas, semicolons or pipes), enough to recognize a reused password. Full drops the passwords and credential columns, puts [withheld] in place of every other secret and withholds the raw text of a public leak. A change applies to what is fetched or looked up afterward; when Group-IB re-sends the record of an open incident, the incident takes the new value, except that a password or column Full drops can stay on an incident that already holds it; clear it yourself.'
  display: Mask passwords and leaked secrets
  name: mask_passwords
  required: false
  type: 15
  section: Collect
  defaultvalue: 'Off'
  options:
  - 'Off'
  - Partial
  - Full
- additionalinfo: Masks the card data of compromised/bank_card_group records and the cardholder of compromised/masked_card records before they reach Cortex XSOAR (incidents, gibti-get-compromised-card-group-info, gibti-get-compromised-masked-card-info and gibti-local-search). The card number keeps its first six and last four digits, in the incident name too; the CVV is dropped; the cardholder's name and phone read [redacted]. The BIN, issuer, expiry and the shop the card was offered in stay. A masked card arrives with its number masked by Group-IB and its owner in plaintext; with the setting on, the owner's name, address, birthday, e-mail, phone, city, ZIP code, passport and tax number read [redacted], while the owner's state and country stay. Disabled (default) keeps the card data as Group-IB delivers it. A change applies to what is fetched or looked up afterward; when Group-IB re-sends the record of an open incident, the incident takes the masked number, while a CVV it already holds stays.
  display: Mask card data
  name: mask_card_data
  required: false
  type: 8
  section: Collect
  defaultvalue: "false"
- display: Mask dark web post text
  name: mask_post_text
  section: Collect
  required: false
  type: 15
  defaultvalue: 'Off'
  options:
  - 'Off'
  - Partial
  - Full
  additionalinfo: What happens to the text of compromised/messenger, compromised/discord and darkweb/forums posts before it reaches Cortex XSOAR (GIB Post Text, GIB Post Translation, GIB Reply Text, GIB Image Text, GIB Post Edits Table, the lookup commands and gibti-local-search). A post is free text that can quote anything its author wrote, card numbers and credentials included. Off (default) keeps the text as Group-IB delivers it. Partial keeps the last four digits of each card number (13 to 19 digits in one run, or groups of three or more digits on one line that pass the card check digit) outside IPv4 addresses. It clears each CVV code labeled CVV, CVC, CV2 or CID or written on the card's line beside its expiry, and the magnetic stripe data after a card number. Partial covers the text and a forum post's topic and URL. In a URL, a number counts as a card only by the check digit and only apart from other digits, and `cid=` stays as an id. Passwords and other secrets follow the Mask passwords and leaked secrets setting. Full withholds the text and a forum post's topic, names the incident after the forum, masks its URL as Partial does and keeps the post's metadata (channel, author, dates, attachment, hash). A change applies to what is fetched or looked up afterward.
- additionalinfo: 'Longest wait, in seconds, for the Group-IB requests of one value of the ip, domain, file and url reputation commands, which run up to Parallel requests per lookup at a time. A request that has not answered by then is left out, and the War Room note names it. A verdict is then set only if no missing answer could have raised it. A missing risk score or ioc/common, or the ioc/primary of a file, could make it Bad, so only a Bad verdict is set; a missing ioc/primary of an IP or domain or a missing suspicious_ip/* collection could make it Suspicious, so a Suspicious or Bad verdict is set and a lower one is not. Without a verdict, the indicator keeps the one it has. A url sends one request, so a url without an answer gets an error entry. A list of IPs or domains first waits up to the same time for its risk scores. 0 waits without a limit. Default 20.'
  display: Lookup timeout (seconds)
  name: search_timeout
  required: false
  type: 0
  section: Collect
  advanced: true
  defaultvalue: '20'
- additionalinfo: 'How many Group-IB requests one value of a reputation command sends at once (default 4, at least 1): the collections it reads, the risk score, the WHOIS record and the global search. A higher number answers sooner and sends more requests at the same time; 1 sends them one after another.'
  display: Parallel requests per lookup
  name: parallel_requests
  required: false
  type: 0
  section: Collect
  advanced: true
  defaultvalue: '4'
- additionalinfo: 'Disabled by default. Enabled, ip, domain and file also ask the Group-IB global search which other collections mention the value, and list them in GIBTI.Reputation.collections; they do not decide the verdict. A result below Suspicious also lists them in its War Room note and, with Collection tags at every verdict enabled, in its tags; a Bad result lists them in Malicious.Description. The global search is one more request per value, and a lookup waits for it up to Lookup timeout (seconds).'
  display: Use the Group-IB global search
  name: use_global_search
  required: false
  type: 8
  section: Collect
  advanced: true
  defaultvalue: 'false'
- additionalinfo: 'Enabled by default: a reputation result below Suspicious carries as tags the collections in GIBTI.Reputation.collections, without their malware or actor names; for an ip result, a collection selected in Collections that keep an IP at least Suspicious is never among them. Disabled, such a result carries no tags. Disable it when tags on Good and Unknown indicators would start tag-based playbooks or searches.'
  display: Collection tags at every verdict
  name: collection_tags_always
  required: false
  type: 8
  section: Collect
  advanced: true
  defaultvalue: 'true'
- additionalinfo: 'Enabled by default: ip and domain also read the Group-IB WHOIS record of the value and write its registry data to the indicator. For an IP: the ASN, the holder organization, the owner of the AS when the registry names it, and the abuse e-mail and phone. For a domain: the registrar and its abuse contact, the registrant''s organization and country, the registrant''s name and e-mail address unless WHOIS personal data is Drop, and the dates, statuses and name servers. One more request per value, two for a subdomain; it never decides the verdict.'
  display: Add WHOIS to ip and domain
  name: reputation_whois
  required: false
  type: 8
  section: Collect
  advanced: true
  defaultvalue: 'true'
- additionalinfo: 'Show (default) keeps a registrant''s name and e-mail address as the public WHOIS gives them; Drop leaves them out of gibti-domain-whois and of the domain indicator. Many registries already hide them.'
  display: WHOIS personal data
  name: whois_personal_data
  required: false
  type: 15
  section: Collect
  advanced: true
  defaultvalue: Show
  options:
  - Show
  - Drop
- additionalinfo: 'Disabled by default: the ip, gibti-ip-whois and gibti-ip-scoring commands answer a private, loopback, link-local, shared (100.64.0.0/10) or reserved address, the documentation ranges included, with a note and ask Group-IB nothing, since Group-IB has no intelligence on such an address and its registry data describes another network. Enable it to look such addresses up.'
  display: Look up internal and reserved IP addresses
  name: lookup_internal_addresses
  required: false
  type: 8
  section: Collect
  advanced: true
  defaultvalue: 'false'
- additionalinfo: Relate the indicators of the lookup commands, and the Suspicious or Bad results of the reputation commands, to the Malware and Threat Actor objects their records name (indicator-of / related-to). A result made Suspicious only by Collections that keep an IP at least Suspicious gets none, and the defacer of an attacks/deface record is never related. The objects themselves are created by the feed integration or by the GIBTIEnrichIncidentIndicators automation. Enabled by default; disable it to keep the commands to plain observables.
  display: Create relationships
  name: create_relationships
  required: false
  type: 8
  defaultvalue: 'true'
  section: Collect
- section: Collect
  display: Fetch incidents
  name: isFetch
  additionalinfo: Enable to fetch incidents from the selected collections.
  required: false
  type: 8
- display: Collections to fetch
  name: incident_collections
  section: Collect
  required: false
  type: 16
  additionalinfo: The Group-IB collections to fetch incidents from; none by default.
  hidden: false
  options:
  - compromised/account_group
  - compromised/bank_card_group
  - compromised/masked_card
  - compromised/breacheddb
  - compromised/spd
  - osi/git_repository
  - osi/public_leak
  - osi/vulnerability
  - attacks/ddos
  - attacks/deface
  - attacks/phishing_group
  - attacks/phishing_kit
  - suspicious_ip/tor_node
  - suspicious_ip/open_proxy
  - suspicious_ip/socks_proxy
  - suspicious_ip/vpn
  - suspicious_ip/scanner
  - malware/cnc
  - malware/malware
  - hi/threat
  - hi/threat_actor
  - apt/threat_actor
  - apt/threat
  - compromised/access
  - compromised/messenger
  - compromised/discord
  - darkweb/forums
  - hi/open_threats
- display: Incidents first fetch
  name: first_fetch
  section: Collect
  defaultvalue: "3 days"
  type: 0
  required: false
  additionalinfo: Date to start fetching incidents from (default 3 days). Each collection starts at the Group-IB cursor for that date (attacks/ddos and attacks/phishing_kit start from the date itself when no cursor is available). Any other collection without a cursor for that date is not read yet; the instance health names it, the cursor is requested again on the next fetch, and the other collections are fetched. If a collection keeps waiting, set a later date. Changing this value after the first run restarts every selected collection from the new date (the stored cursors are dropped). The value is recorded from the first fetch on 4.0.0, so an instance upgraded from an older version detects a change only after that fetch.
  hidden: false
- display: Exclude All with Combolist type
  name: exclude_combolist
  section: Collect
  required: false
  type: 8
  defaultvalue: "false"
  hidden: true
  additionalinfo: Deprecated and ignored; use "Include combolist type in data" / "Include unique type in data".
- display: Include combolist type in data
  name: combolist
  section: Collect
  defaultvalue: "false"
  type: 8
  required: false
  additionalinfo: Works only for compromised/account_group. Disabled by default. Enabled alone, only combolist records are fetched; with Include unique type in data also enabled, or with both disabled, records of both types are fetched.
- display: Include unique type in data
  name: unique
  section: Collect
  defaultvalue: "false"
  type: 8
  required: false
  additionalinfo: Works only for compromised/account_group. Disabled by default. Enabled alone, only unique records are fetched; with Include combolist type in data also enabled, or with both disabled, records of both types are fetched.
- display: Enable filter "Probable Corporate Access"
  name: enable_probable_corporate_access
  section: Collect
  required: false
  type: 8
  defaultvalue: "false"
  additionalinfo: 'Works only for compromised/account_group. Disabled by default: every account is fetched. When enabled, the API returns only the accounts it marks as probable corporate access. It combines with the unique and combolist filters.'
- display: Minimum severity
  name: min_severity
  section: Collect
  required: false
  type: 15
  defaultvalue: Low
  options:
  - Low
  - Medium
  - High
  additionalinfo: 'The lowest Group-IB severity a record needs to become an incident, for every collection that carries an evaluation. Low (default) fetches every record, and a record without a rating counts as Low. A record below the minimum is skipped when it arrives and is not fetched later. Group-IB rates every record of some collections the same, so Medium or High keeps all or none of them: suspicious_ip/* listings and breached records are green, DDoS attacks and defacements orange, masked cards red. For malware/malware it is the threat level. Telegram, Discord and forum posts, C&C records and actor profiles carry no rating and are not held to it.'
- display: Skip records older than (days)
  name: max_record_age_days
  section: Collect
  required: false
  type: 0
  additionalinfo: 'A record older than this many days at the fetch is skipped and not fetched later, by the date that matters for its collection: the post date of a dark web post, the publication date of a vulnerability, the last sighting of a suspicious IP listing or C&C, the compromise date of an account, card or access listing (the README lists every collection''s date). Group-IB re-sends old records when it updates them, so a fetch can bring records years old. malware/malware has no such date and is not filtered by it. Empty or 0 (default) keeps every record.'
- display: Vulnerability types to fetch
  name: vulnerability_types
  section: Collect
  required: false
  type: 0
  additionalinfo: 'Works only for osi/vulnerability. A comma-separated list of record types to fetch, such as cve, mscve, nessus or redhat; case does not matter. The types are asked of the API as well, and every record is checked when it arrives. Empty (default) fetches every type.'
- display: Vulnerability types to skip
  name: vulnerability_excluded_types
  section: Collect
  required: false
  type: 0
  additionalinfo: 'Works only for osi/vulnerability. A comma-separated list of record types to skip, such as nessus. A single skip type is also excluded in the API request when no types to fetch are set; every record is checked when it arrives. Empty (default) skips none.'
- display: Vulnerabilities with an exploit only
  name: vulnerability_has_exploit
  section: Collect
  required: false
  type: 8
  defaultvalue: 'false'
  additionalinfo: 'Works only for osi/vulnerability. Disabled by default. Enabled, only the records with a known exploit are fetched: the API is asked for them, and every record is checked when it arrives.'
- display: Breached records to fetch
  name: breacheddb_records
  section: Collect
  required: false
  type: 15
  defaultvalue: All
  options:
  - All
  - With a password
  - With a password or a credential column
  additionalinfo: 'Works only for compromised/breacheddb. All (default) fetches every record. With a password asks the API for the records that carry a password; on a recent cursor that request can return nothing for a while, since the password-bearing records are older than that cursor. Both With a password and With a password or a credential column check every record when it arrives and keep only the records that carry a password, a credential column or a secret that one of their columns quotes (see Mask passwords and leaked secrets), under every password-masking mode.'
- display: Payment detail types to fetch
  name: spd_types
  section: Collect
  required: false
  type: 16
  options:
  - Cryptocurrency Wallet
  - Bank Account Number
  - Mobile Number
  - Bank Card
  - IBAN
  - Email
  - QR Payment String
  - Unknown
  additionalinfo: 'Works only for compromised/spd. The payment detail types to fetch; empty (default) fetches every type. A single selected type is also sent to the API; every record is checked when it arrives.'
- display: Dark web forum categories to fetch
  name: darkweb_forum_categories
  section: Collect
  required: false
  type: 0
  additionalinfo: Works only for darkweb/forums. A comma-separated list of the categories Group-IB gives forum posts, such as Access, Sale, Database, Exploit, Leak; case does not matter. When set, only a post with at least one of them is fetched, and a post without categories is skipped. Empty (default) fetches every post. The category list is open, and a post's categories can include your organization's monitoring label.
- display: Dark web forum categories to skip
  name: darkweb_forum_excluded_categories
  section: Collect
  required: false
  type: 0
  additionalinfo: Works only for darkweb/forums. A comma-separated list of categories; a post with any of them is skipped, whatever the categories to fetch say. Empty (default) skips nothing.
- display: Open threat source types
  name: open_threats_source_types
  section: Collect
  required: false
  type: 16
  options:
  - Blog
  - Social Network
  additionalinfo: 'Works only for hi/open_threats. The kinds of public posts to fetch; empty (default) fetches both. Blog posts are long articles and carry most of the extracted CVEs; social network posts are short messages, with indicators extracted the same way.'
- display: Collection filters
  name: collection_filters
  section: Collect
  required: false
  type: 12
  additionalinfo: 'Every other filter of this integration, one per line as collection: filter = value, for example osi/vulnerability: min_cvss = 7 or suspicious_ip/*: excluded_countries = US, DE. The collection is a name or a pattern (suspicious_ip/*, *); the value is a comma-separated list, a number, true, a severity (Low, Medium or High), addresses or CIDR networks, a word such as all, password or credentials, or a query text, as the README says for each filter; an empty value removes the filter the settings above set for that collection; a line that starts with # is a comment. A line the integration cannot apply fails the instance test and every command, naming the line. The README lists the filters of each collection and their values.'
- display: Number of requests per collection
  name: max_fetch
  section: Collect
  defaultvalue: '3'
  type: 15
  required: false
  additionalinfo: Number of pages read per collection in one fetch iteration (default 3); each page asks for up to "Limit (items per request)" records. On suspicious_ip/*, compromised/spd, malware/cnc, osi/public_leak and darkweb/forums, a page that one cursor position fills is read again larger, up to 1,000 records (100 on osi/public_leak); each larger read is one more request and does not count as a further page. Lower the value if fetches time out. darkweb/forums reads one page per fetch whatever this value is.
  hidden: false
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
- display: Skip updated incidents (prevent duplicates)
  name: skip_updated_incidents
  section: Collect
  defaultvalue: "false"
  type: 8
  required: false
  additionalinfo: 'Disabled by default. Enable it on Cortex XSIAM and the Cortex platform, where the pack does not install the pre-processing rule GIB Rule All Types: without that rule, every update Group-IB makes to a record arrives as a new alert. Where GIB Rule All Types runs, leave it disabled so that the rule updates the existing incidents, and enable it if you do not use that rule. Enabled, the integration skips Group-IB records it already fetched when they are sent again after an update, so the update does not arrive. The integration remembers a record by its collection and ID, an open proxy by its address and port, and a breached record by its ID, leak name and upload time.'
- display: Deduplication lookback (days)
  name: dedup_lookback_days
  section: Collect
  defaultvalue: "365"
  type: 0
  required: false
  additionalinfo: 'Days a fetched record stays in the duplicate cache while Skip updated incidents (prevent duplicates) is enabled (default and recommended: 365); an older entry hides nothing. Group-IB can re-send a record long after it was fetched; a shorter window lets it open a new incident. 0 turns the cache off; a negative value fails every fetch, whatever Skip updated incidents (prevent duplicates) says.'
- display: Pass flagged phishing groups to the pre-processing rule
  name: pass_flagged_phishing_groups
  section: Collect
  defaultvalue: "false"
  type: 8
  required: false
  additionalinfo: 'Disabled by default: a phishing group that Group-IB flags as a false positive or allow-listed is dropped at fetch and never opens an incident, and an incident opened before Group-IB set the flag never shows it. Enabled, flagged groups go to the pre-processing rule GIB Rule All Types, which sets GIB False Positive or GIB Allow Listed on the open incident of the group and drops the record; a flagged group without an open incident is dropped there too. While Skip updated incidents (prevent duplicates) is enabled and Deduplication lookback (days) is above 0, only a group the integration already made an incident of is handed on. Enable it only while GIB Rule All Types runs; the pack does not install that rule on Cortex XSIAM and the Cortex platform. Without that rule, every flagged group handed on opens an incident of its own, a second one when the group already has an incident.'
- display: Limit (items per request)
  name: limit
  section: Collect
  defaultvalue: '100'
  type: 0
  required: false
  additionalinfo: Number of items requested per API page, for every collection of the instance (default 100). Larger values reduce API round-trips but may increase response size. A collection with a smaller page size of its own is read in pages of that size whatever this value is. On suspicious_ip/*, compromised/spd, malware/cnc, osi/public_leak and darkweb/forums, a page that one cursor position fills is read again larger, up to 1,000 records (100 on osi/public_leak; see the README's Limit Parameter section).
- display: Delay between API requests (seconds)
  name: rate_limit_delay
  type: 0
  required: false
  defaultvalue: "1.2"
  advanced: true
  additionalinfo: Minimum number of seconds between consecutive requests to the same collection while a fetch or gibti-local-search pages through it (default 1.2; the first request is never delayed; 0 disables the delay). Raise it if the API answers HTTP 429.
  section: Collect
- display: Incident type
  name: incidentType
  additionalinfo: Default incident type for incidents that the classifier does not map (leave empty to use the pack classifier).
  section: Collect
  required: false
  type: 13
- display: Incidents Fetch Interval
  name: incidentFetchInterval
  additionalinfo: Minutes between two fetch runs (default 1).
  defaultvalue: '1'
  required: false
  type: 19
  section: Collect
  advanced: true
- display: Hunting Rules
  name: hunting_rules
  section: Collect
  defaultvalue: "false"
  type: 8
  required: false
  additionalinfo: Disabled by default. Enabled, it fetches only the records that match your Group-IB hunting rules from the collections where the filter is optional and your API user has hunting rules enabled (hi/threat, hi/threat_actor, apt/threat, apt/threat_actor, hi/open_threats, osi/vulnerability, attacks/phishing_kit, attacks/phishing_group, suspicious_ip/*). The API always filters the compromised/* collections (compromised/access, compromised/messenger and compromised/discord included), darkweb/forums, osi/git_repository, osi/public_leak and attacks/ddos by your hunting rules, whatever this setting says; the other collections are fetched unfiltered. A filtered collection with no matching hunting rule returns no records while this is enabled. hi/open_threats without this setting is the whole public feed; with it, only the posts your hunting rules matched. Turning the setting on or off restarts the selected collections from Incidents first fetch (the stored cursors are dropped). The setting is recorded from the first fetch on 4.0.0, so an instance upgraded from an older version detects a change only after that fetch.
description: Fetches Group-IB Threat Intelligence records as incidents (compromised accounts, cards and payment details, data breaches, git and public leaks, dark web listings and posts from Telegram, Discord and forums, public posts about threats, vulnerabilities, DDoS, defacement and phishing attacks, phishing kits, threat reports and actor profiles, malware profiles and C&C, suspicious IPs) and provides lookup and search commands over them, plus scoring, WHOIS and reputation commands.
display: Group-IB Threat Intelligence
name: Group-IB Threat Intelligence & Attribution
