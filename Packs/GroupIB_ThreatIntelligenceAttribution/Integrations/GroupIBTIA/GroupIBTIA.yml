  - name: file
    description: Returns the Group-IB reputation of one or more file hashes (MD5, SHA-1, SHA-256 or SHA-512). The verdict comes from ioc/common and ioc/primary, from a record of the hash itself. Bad when ioc/common lists the hash or ioc/primary lists it with a risk score of 80 or more; Suspicious when only ioc/primary lists it, with a lower risk score or none; otherwise Unknown. An ioc/common record carries no TLP of its own and counts as AMBER. The indicator carries the hash looked up and one hash of each other kind found in the records of both collections, each under its own kind. The collections and the threat and actor names of the matched records become tags and their malware names Malware Family; with Create relationships enabled, the malware families and actors also become relationships. A refused key (HTTP 401) fails the command; a value whose requests all fail, HTTP 403 and 404 included, or do not answer in time gets an error entry of its own, and the other values still return. When ioc/primary or ioc/common fails or does not answer within Lookup timeout (seconds), GIBTI.Reputation.partial is true, and a verdict is set only if no missing answer could have raised it. A missing ioc/common or ioc/primary could make it Bad, so only a Bad verdict is set. Without a verdict, the indicator keeps the one it has. A request answered with HTTP 403 (the key has no access) is named in the War Room note; HTTP 403 and HTTP 404 (no record) do not make the result partial, and the verdict comes from the others.
    arguments:
    - name: file
      default: true
      isArray: true
      description: A comma-separated list of file hashes (MD5, SHA-1, SHA-256 or SHA-512).
      required: true
    outputs:
