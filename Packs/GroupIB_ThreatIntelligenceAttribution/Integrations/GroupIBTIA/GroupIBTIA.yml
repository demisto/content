  - arguments:
    - description: List of IPv4 addresses to score (comma-separated).
      name: ip
      required: true
      default: true
      isArray: true
    description: 'Returns the Group-IB risk score (0-100) of one or more IPv4 addresses from scoring/ip, with its verdict band in GIBTI.Scoring.score: 0-39 good, 40-79 suspicious, 80-100 bad, unknown when Group-IB has no score. The command sets no verdict on the indicator: the ip and domain reputation commands set it. A list is scored in requests of up to 100 values; when one of these requests fails, every value is asked alone. A refused key (HTTP 401 or 403) fails the command; any other failed request is the error entry of its value, and the other values still return. Group-IB scores IPv4 addresses only: a host name, a CIDR or an IPv6 address gets a War Room note and no request. Unless Look up internal and reserved IP addresses is enabled, a private, shared or reserved address gets a note and no request. Use gibti-domain-scoring for domains.'
    name: gibti-ip-scoring
    outputs:
    - contextPath: GIBTI.Scoring.indicator
