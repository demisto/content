      type: String
    - contextPath: GIBTI.Scoring.type
      description: 'The kind of the scored value: ip.'
      type: String
    - contextPath: GIBTI.Scoring.riskScore
      description: Group-IB risk score (0-100); 0 when Group-IB has no data on the value, empty when it returns no score. A value the command does not send to Group-IB gets a War Room note and no GIBTI.Scoring entry.
      type: Number
    - contextPath: GIBTI.Scoring.score
      description: The verdict band of the risk score (0 unknown, 1 good, 2 suspicious, 3 bad). A risk score of 0-39 is good, 40-79 suspicious and 80-100 bad; without a score it is unknown. The command sets no verdict on the indicator.
      type: Number
