category: Data Enrichment & Threat Intelligence
commonfields:
  id: Haseen Threat Intel
  version: -1
configuration:
- defaultvalue: 'true'
  display: Fetch indicators
  name: feed
  type: 8
  required: false
  section: Collect
- additionalinfo: Indicators from this integration instance will be marked with this reputation.
  display: Indicator Reputation
  name: feedReputation
  type: 18
  options:
  - None
  - Good
  - Suspicious
  - Bad
  required: false
  section: Collect
- additionalinfo: Reliability of the source providing the intelligence data.
  display: Source Reliability
  name: feedReliability
  type: 15
  options:
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
  required: true
  defaultvalue: B - Usually reliable
  section: Collect
- additionalinfo: 'The Traffic Light Protocol (TLP) designation to apply to indicators fetched from the feed.'
  display: Traffic Light Protocol Color
  name: tlp_color
  type: 15
  options:
  - RED
  - AMBER
  - GREEN
  - WHITE
  defaultvalue: WHITE
  required: false
  section: Collect
- additionalinfo: Supports CSV values.
  display: Tags
  name: feedTags
  type: 0
  required: false
  section: Collect
  advanced: true
- display: Bypass exclusion list
  name: feedBypassExclusionList
  type: 8
  required: false
  additionalinfo: When selected, the exclusion list is ignored for indicators from this feed. This means that if an indicator from this feed is on the exclusion list, the indicator might still be added to the system.
  section: Collect
  advanced: true
- additionalinfo: Incremental feeds pull only new or modified indicators that have been sent from the integration.
  defaultvalue: 'false'
  display: Incremental Feed
  name: feedIncremental
  type: 8
  required: false
  section: Collect
  advanced: true
- additionalinfo: The maximum number of indicators to fetch per iteration. Leave empty to fetch all indicators (no limit).
  display: The maximum number of indicators that can be fetched per fetch. If this field is left empty, there will be no limit on the number of indicators fetched.
  name: limit
  type: 0
  defaultvalue: '1000'
  required: false
  section: Collect
- additionalinfo: The time interval for the first retroactive fetch, formatted as <number> and <time unit> of type minute/hour/day. For example, 1 minute, 12 hours.
  display: First Fetch Time
  name: first_fetch
  defaultvalue: 7 days
  type: 0
  required: false
  section: Collect
- display: Feed Fetch Interval
  name: feedFetchInterval
  type: 19
  defaultvalue: '60'
  required: false
  section: Collect
  advanced: true
  additionalinfo: How often to fetch indicators in minutes. Haseen rate-limits the feed to 2 requests per hour, so set this to 60 or higher (the minimum) to avoid 429 throttling.
- display: Server URL
  name: url
  defaultvalue: https://share.haseen.gov.sa/api/v1/threat-intelligence/export/{export_id}
  type: 0
  required: true
  section: Connect
  additionalinfo: The full STIX export URL, including the export ID (e.g. https://share.haseen.gov.sa/api/v1/threat-intelligence/export/1234).
- display: API Token
  name: api_token
  type: 4
  required: true
  section: Connect
  additionalinfo: The API token from Haseen (settings page). Sent as a `token` query parameter on every request, per the Haseen API guide. Enter it in the password field.
- display: Basic Auth Credentials (optional)
  name: credentials
  type: 9
  required: false
  section: Connect
  additionalinfo: For exports that require Basic authentication in addition to the token. Username is the account email; password is the API token.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  section: Connect
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
  advanced: true
- name: feedExpirationInterval
  display: ''
  type: 1
description: Fetches indicators of compromise from a STIX 2.x threat-intelligence feed and parses them into Cortex XSOAR indicators.
display: Haseen Threat Intel
name: Haseen Threat Intel
script:
  commands: []
  dockerimage: demisto/python3:3.12.13.10116658
  feed: true
  runonce: false
  script: '-'
  subtype: python3
  type: python
fromversion: 6.10.0
tests:
- No tests (auto formatted)
