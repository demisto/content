name: NodeZero MCP
display: NodeZero MCP
category: Vulnerability Management
provider: Horizon3
sectionorder:
  - Connect
commonfields:
  id: NodeZero MCP
  version: -1
configuration:
  - name: base_url
    section: Connect
    display: MCP Server URL
    defaultvalue: https://mcp.horizon3ai.com/mcp
    additionalinfo: The NodeZero MCP server endpoint. Select the region that matches your NodeZero deployment.
    type: 15
    required: true
    options:
      - https://mcp.horizon3ai.com/mcp
      - https://mcp.horizon3ai.eu/mcp
      - https://mcp.horizon3ai.au/mcp
  - name: auth_code
    type: 9
    displaypassword: Authorization Code
    hiddenusername: true
    section: Connect
    additionalinfo: The authorization code that the !nodezero-mcp-generate-login-url command returns. Paste it here, and then run !nodezero-mcp-auth-test to complete the authentication.
description: Use the *NodeZero MCP* integration to connect to the NodeZero MCP server and automatically discover its available pentesting tools.
script:
  commands:
    - arguments: []
      description: Retrieves a list of available tools on the NodeZero MCP server.
      name: list-tools
      hidden: true
      outputs: []
    - arguments:
        - name: name
          description: The name of the tool to call.
        - name: arguments
          description: The parameters for the tool execution.
      description: Calls a specific tool on the NodeZero MCP server with optional input parameters.
      name: call-tool
      hidden: true
      outputs: []
    - description: Registers this integration with your NodeZero portal and generates a login URL. To authenticate through the NodeZero portal, follow the instructions that the command returns.
      name: nodezero-mcp-generate-login-url
    - description: Tests the OAuth authentication configuration with the NodeZero MCP server.
      name: nodezero-mcp-auth-test
  script: "-"
  type: python
  subtype: python3
  dockerimage: demisto/mcp:1.0.0.13526390
  mcp: true
fromversion: 8.13.0
tests:
  - No tests (auto formatted)
supportedModules:
  - agentix
  - xsiam
