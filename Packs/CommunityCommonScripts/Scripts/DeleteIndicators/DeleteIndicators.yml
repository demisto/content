args:
- description: Query for indicators to delete. The query is used as-is, so make sure it is scoped to only the indicators you intend to delete.
  name: indicator_query
- description: Comma-separated list of indicator values to delete. Values are matched literally, so a value containing a comma must be supplied as a list rather than as a single comma-separated string.
  name: indicator_values
- description: Comma-separated list of indicator IDs to delete.
  name: indicator_ids
- auto: PREDEFINED
  defaultValue: "false"
  description: Whether to add the deleted indicator to the Exclusion List.
  name: exclude
  predefined:
  - "true"
  - "false"
- description: Reason for indicator exclusion.
  name: exclusion_reason
comment: Delete indicators based on query, values, or IDs.
commonfields:
  id: 'DeleteIndicators'
  version: -1
