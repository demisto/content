args:
- defaultValue: collect
  description: 'collect, assess, prepare_ai, unpack_ai, wrap_ai, apply_ai, publish, install, review, pack_detail (read-only pack review details), or close_review (resolve a linked review issue and case after verifying the exact installed target).'
  name: action
  predefined:
  - collect
  - assess
  - prepare_ai
  - unpack_ai
  - wrap_ai
  - apply_ai
  - publish
  - install
  - review
  - pack_detail
  - close_review
  required: true
- description: The Core REST API integration instance name. Required for actions that access tenant APIs.
  name: core_instance
- defaultValue: jev-1.13.0
  description: Expected TypeSafe Jev model alias for prepared and validated review batches.
  name: jev_model
- description: Marketplace snapshot returned by the collect action.
  name: snapshot
- description: Validated Marketplace assessment returned by the assess or apply_ai action.
  name: assessment
- defaultValue: 'true'
  description: Whether state-changing actions should only report the changes they would make.
  name: dry_run
  predefined:
  - 'true'
  - 'false'
- description: Release review plan returned by the prepare_ai action.
  name: review_plan
- isArray: true
  description: A list of JSON-serialized Jev response objects, one per analysis batch. A single response can also be passed as a JSON string.
  name: analysis_response
- description: Serialized release evidence batch supplied to the analysis sub-playbook.
  name: batch_json
- description: TypeSafeJevMarketplace.Installation result (for action=review).
  name: installation
- description: Pack ID (e.g. HelloWorld, Core). Required for pack_detail and close_review.
  name: pack
- description: Target pack version. Optional for pack_detail (defaults to latest); required for close_review (must equal the installed version).
  name: target_version
- description: 'close_review: numeric review issue ID. Optional; if blank the review ledger entry for this pack and target is used.'
  name: issue_id
- description: 'close_review: case ID to close. Optional; defaults to the case linked to the review issue.'
  name: case_id
- description: 'close_review: resolution comment for issue and case. Optional; default "Marketplace Guard: <pack> updated to <target_version>, verified".'
  name: comment
comment: Reviews Cortex Marketplace updates with Jev and installs eligible updates after dependency checks and verified results.
commonfields:
  id: TypeSafeJevMarketplaceAssessment
  version: -1
contentitemexportablefields:
  contentitemfields:
    fromServerVersion: ''
enabled: true
engineinfo: {}
name: TypeSafeJevMarketplaceAssessment
dependson:
  must:
  - Core REST API|||core-api-get
  - Core REST API|||core-api-post
  - CommonScripts|||ContentPackInstaller
outputs:
- contextPath: TypeSafeJevMarketplace.Snapshot
  description: Current pack versions, newer release notes and observed enabled integrations.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.Assessment
  description: Publisher breaking flags, explicit notices and environment evidence.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.Routing
  description: Issue routing results.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.ReviewPlan
  description: Prepared release batches and immutable finding keys.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.Batch
  description: Evidence for the current Jev analysis batch.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.AnalystBatch
  description: Wrapped AI result returned by the analysis sub-playbook.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.Installation
  description: Verified installations, held updates and failed or unverified outcomes.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.Review
  description: Manual review issues created or retained for held or failed updates.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.PackDetail
  description: 'Read-only pack review detail (action=pack_detail): installed/latest/target versions, intervening release notes and declared dependencies.'
  type: Unknown
- contextPath: TypeSafeJevMarketplace.PackDetail.pack_id
  description: Pack ID.
  type: String
- contextPath: TypeSafeJevMarketplace.PackDetail.pack_name
  description: Pack display name.
  type: String
- contextPath: TypeSafeJevMarketplace.PackDetail.installed
  description: Whether the pack is installed.
  type: Boolean
- contextPath: TypeSafeJevMarketplace.PackDetail.installed_version
  description: Currently installed version (null if not installed).
  type: String
- contextPath: TypeSafeJevMarketplace.PackDetail.latest_version
  description: Latest version available in Marketplace.
  type: String
- contextPath: TypeSafeJevMarketplace.PackDetail.target_version
  description: Version under review (input target_version or latest).
  type: String
- contextPath: TypeSafeJevMarketplace.PackDetail.update_available
  description: True if Marketplace has a newer version than installed.
  type: Boolean
- contextPath: TypeSafeJevMarketplace.PackDetail.target_in_marketplace
  description: True if target version exists in the Marketplace changelog.
  type: Boolean
- contextPath: TypeSafeJevMarketplace.PackDetail.releases
  description: 'Versions after installed up to target: version, released, breaking, breaking_notes, release_notes, github_url.'
  type: Unknown
- contextPath: TypeSafeJevMarketplace.PackDetail.marketplace_url
  description: Marketplace page link.
  type: String
- contextPath: TypeSafeJevMarketplace.PackDetail.dependencies
  description: 'Declared Marketplace dependencies: pack_id, mandatory, required_min_version.'
  type: Unknown
- contextPath: TypeSafeJevMarketplace.PackDetail.gaps
  description: Data that could not be retrieved.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.CloseReview
  description: Verified closure result for a Marketplace review issue and its linked case.
  type: Unknown
- contextPath: TypeSafeJevMarketplace.CloseReview.dry_run
  description: Whether the action returned a preview without changing tenant state.
  type: Boolean
- contextPath: TypeSafeJevMarketplace.CloseReview.would_resolve
  description: Whether the verified issue and case would be resolved when dry_run is false.
  type: Boolean
- contextPath: TypeSafeJevMarketplace.CloseReview.pack
  description: Pack ID whose review was closed.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.target_version
  description: Verified installed target version.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.installed_version
  description: Installed version verified before closing the review.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.issue_id
  description: Resolved Marketplace review issue ID.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.case_id
  description: Resolved case ID linked to the review issue.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.issue_comment
  description: Resolution comment applied to the issue and case.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.issue_status
  description: Verified issue status after resolution.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.case_status
  description: Verified case status after resolution.
  type: String
- contextPath: TypeSafeJevMarketplace.CloseReview.list_updated
  description: Whether the review ledger was updated.
  type: Boolean
- contextPath: TypeSafeJevMarketplace.CloseReview.completed_at
  description: Completion time of the verified closure.
  type: Date
