description: Daily Jev Marketplace assessment with recursive mandatory dependency planning, platform-catalog installation, verified versions, and deduplicated issues for evidenced breaking impact. Held, unresolved or failed updates get one deduplicated manual-review case each.
id: silent-TypeSafe Jev - Marketplace Daily Assessment
