description: Daily Jev Marketplace assessment with recursive mandatory dependency
  planning, supported ContentPackInstaller execution, verified versions, and deduplicated
  issues for evidenced breaking impact. Held, unresolved or failed updates get one
  deduplicated manual-review case each.
