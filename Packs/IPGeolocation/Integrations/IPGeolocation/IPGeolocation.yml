  - name: ipgeolocation-asn
    description: Gets Autonomous System details from the ASN API (/v3/asn), looked up either by ASN or by IP address. Beyond the organization, type, registry and allocation data it can return the announced routes, peers, upstream and downstream Autonomous Systems and the raw WHOIS record.
    arguments:
    - name: asn
      description: A comma-separated list of Autonomous System Numbers to look up. Both 24940 and AS24940 are accepted. Mutually exclusive with the ip argument.
      isArray: true
    - name: ip
      description: A comma-separated list of IPv4 or IPv6 addresses to resolve to their Autonomous System. Mutually exclusive with the asn argument.
      isArray: true
      default: true
    - name: include
      description: A comma-separated list of additional routing objects to add to the response.
      isArray: true
      predefined:
      - peers
      - downstreams
      - upstreams
      - routes
      - whois_response
      auto: PREDEFINED
    - *id001
    - *id002
    outputs:
    - contextPath: IPGeolocation.ASN.IP
      description: The IP address that was looked up.
      type: String
    - contextPath: IPGeolocation.ASN.ASNumber
      description: The Autonomous System Number of the network, in AS notation, for example AS15169.
      type: String
    - contextPath: IPGeolocation.ASN.Organization
      description: The organization that operates the Autonomous System.
      type: String
    - contextPath: IPGeolocation.ASN.Country
      description: The country in which the Autonomous System is registered.
      type: String
    - contextPath: IPGeolocation.ASN.Type
      description: The Autonomous System category, for example ISP, HOSTING, BUSINESS, EDUCATION or GOVERNMENT.
      type: String
    - contextPath: IPGeolocation.ASN.Domain
      description: The domain name submitted, returned only for domain based lookups.
      type: String
    - contextPath: IPGeolocation.ASN.DateAllocated
      description: The date on which the Autonomous System Number was allocated, in YYYY-MM-DD format (e.g., 2024-01-15).
      type: String
    - contextPath: IPGeolocation.ASN.RIR
      description: The Regional Internet Registry that allocated the Autonomous System Number.
      type: String
    - contextPath: IPGeolocation.ASN.ASNName
      description: The official Autonomous System handle.
      type: String
    - contextPath: IPGeolocation.ASN.AllocationStatus
      description: The current allocation status of the Autonomous System Number.
      type: String
    - contextPath: IPGeolocation.ASN.NumOfIPv4Routes
      description: The number of distinct IPv4 prefixes announced by the Autonomous System.
      type: String
    - contextPath: IPGeolocation.ASN.NumOfIPv6Routes
      description: The number of distinct IPv6 prefixes announced by the Autonomous System.
      type: String
    - contextPath: IPGeolocation.ASN.Routes
