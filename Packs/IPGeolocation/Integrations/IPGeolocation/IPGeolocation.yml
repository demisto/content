  - name: ipgeolocation-asn
    description: Returns Autonomous System details from the ASN API (/v3/asn), looked up either by ASN or by IP address. Beyond
      the organization, type, registry and allocation data it can return the announced routes, peers, upstream and downstream
      Autonomous Systems and the raw WHOIS record.
    arguments:
    - name: asn
      description: Comma separated list of Autonomous System Numbers to look up. Both 24940 and AS24940 are accepted. Mutually
        exclusive with the ip argument.
      isArray: true
    - name: ip
      description: Comma separated list of IPv4 or IPv6 addresses to resolve to their Autonomous System. Mutually exclusive
        with the asn argument.
      isArray: true
      default: true
    - name: include
      description: Comma separated list of additional routing objects to add to the response.
      isArray: true
      predefined:
      - peers
      - downstreams
      - upstreams
      - routes
      - whois_response
      auto: PREDEFINED
    - *id001
    - *id002
    outputs:
    - contextPath: IPGeolocation.ASN.IP
      description: The IP address that was looked up.
      type: String
    - contextPath: IPGeolocation.ASN.ASNumber
      description: Autonomous System Number of the network, in AS notation, for example AS15169.
      type: String
    - contextPath: IPGeolocation.ASN.Organization
      description: Organization that operates the Autonomous System.
      type: String
    - contextPath: IPGeolocation.ASN.Country
      description: Country in which the Autonomous System is registered.
      type: String
    - contextPath: IPGeolocation.ASN.Type
      description: Autonomous System category, for example ISP, HOSTING, BUSINESS, EDUCATION or GOVERNMENT.
      type: String
    - contextPath: IPGeolocation.ASN.Domain
      description: The domain name submitted, returned only for domain based lookups.
      type: String
    - contextPath: IPGeolocation.ASN.DateAllocated
      description: Date on which the Autonomous System Number was allocated.
      type: String
    - contextPath: IPGeolocation.ASN.RIR
      description: Regional Internet Registry that allocated the Autonomous System Number.
      type: String
    - contextPath: IPGeolocation.ASN.ASNName
      description: Official Autonomous System handle.
      type: String
    - contextPath: IPGeolocation.ASN.AllocationStatus
      description: Current allocation status of the Autonomous System Number.
      type: String
    - contextPath: IPGeolocation.ASN.NumOfIPv4Routes
      description: Number of distinct IPv4 prefixes announced by the Autonomous System.
      type: String
    - contextPath: IPGeolocation.ASN.NumOfIPv6Routes
      description: Number of distinct IPv6 prefixes announced by the Autonomous System.
      type: String
    - contextPath: IPGeolocation.ASN.Routes
      description: IPv4 and IPv6 prefixes announced by the Autonomous System.
      type: Unknown
    - contextPath: IPGeolocation.ASN.Peers
