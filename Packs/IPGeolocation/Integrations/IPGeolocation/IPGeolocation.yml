  - name: ipgeolocation-ip-security
    description: Returns the IP Security API (/v3/security) threat signals for one or more IP addresses, including the threat
      score, VPN, proxy, residential proxy, Tor, relay, bot, spam, known attacker and cloud provider flags with their provider
      names and confidence scores. This command does not set a reputation, use the ip command when a DBotScore is required.
    arguments:
    - name: ip
      description: Comma separated list of IPv4 or IPv6 addresses. Domain names are not supported by this endpoint.
      required: true
      isArray: true
      default: true
    - *id001
    - *id002
    outputs:
    - contextPath: IPGeolocation.IP.IP
