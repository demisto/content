category: Data Enrichment & Threat Intelligence
commonfields:
  id: IPGeolocation
  version: -1
name: IPGeolocation
display: IPGeolocation.io
description: Enrich IP addresses with geolocation, network, ASN, abuse contact and threat intelligence data from the IPGeolocation.io
  v3 APIs.
configuration:
- display: Server URL
  name: url
  defaultvalue: https://api.ipgeolocation.io
  type: 0
  required: true
  additionalinfo: Base URL of the IPGeolocation.io API. Change this only when you route traffic through a gateway.
  section: Connect
- display: ''
  displaypassword: API Key
  name: credentials
  type: 9
  required: true
  hiddenusername: true
  additionalinfo: The API key issued in the IPGeolocation.io dashboard. Sent as the documented apiKey query parameter.
  section: Connect
- display: HTTP timeout (seconds)
  name: timeout
  defaultvalue: '30'
  type: 0
  required: false
  additionalinfo: Per request timeout, between 1 and 300 seconds. A timeout that is too short causes the API to return HTTP
    499.
  section: Connect
  advanced: true
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  section: Connect
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
  advanced: true
- display: Source Reliability
  name: integrationReliability
  defaultvalue: B - Usually reliable
  type: 15
  required: false
  options:
  - A+ - 3rd party enrichment
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
  additionalinfo: Reliability of the source providing the intelligence data.
  section: Collect
- display: Include geolocation context in the ip command
  name: reputation_with_geolocation
  defaultvalue: 'true'
  type: 8
  required: false
  additionalinfo: When enabled the ip command calls /v3/ipgeo with include=security and costs 3 credits per IP address. When
    disabled it calls /v3/security only and costs 2 credits per IP address.
  section: Collect
- display: Malicious threat score threshold
  name: malicious_threshold
  defaultvalue: '70'
  type: 0
  required: false
  additionalinfo: Threat score, from 0 to 100, at which the ip command marks an IP address as Malicious.
  section: Collect
- display: Suspicious threat score threshold
  name: suspicious_threshold
  defaultvalue: '40'
  type: 0
  required: false
  additionalinfo: Threat score, from 0 to 100, at which the ip command marks an IP address as Suspicious. Must be lower than
    or equal to the malicious threshold.
  section: Collect
- display: Treat known attackers as Malicious
  name: malicious_on_known_attacker
  defaultvalue: 'true'
  type: 8
  required: false
  additionalinfo: When enabled, is_known_attacker marks an IP address as Malicious regardless of its threat score.
  section: Collect
  advanced: true
- display: Treat anonymizing networks as Suspicious
  name: suspicious_on_anonymizer
  defaultvalue: 'true'
  type: 8
  required: false
  additionalinfo: When enabled, a detected VPN, proxy, residential proxy, Tor exit node or relay marks an IP address as Suspicious.
    Disable this if your users legitimately connect over a VPN.
  section: Collect
  advanced: true
- display: Treat bot and spam activity as Suspicious
  name: suspicious_on_bot_or_spam
  defaultvalue: 'true'
  type: 8
  required: false
  additionalinfo: When enabled, is_bot or is_spam marks an IP address as Suspicious.
  section: Collect
  advanced: true
script:
  commands:
  - name: ip
    description: Returns the IPGeolocation.io reputation of one or more IP addresses. The threat score and the security flags
      returned by the IP Security API drive the DBotScore, using the thresholds configured on the integration instance. Requires
      a paid subscription because IP Security data is not available on the Free plan.
    arguments:
    - name: ip
      description: Comma separated list of IPv4 or IPv6 addresses to check.
      required: true
      isArray: true
      default: true
    outputs:
    - contextPath: DBotScore.Indicator
      description: The indicator that was tested.
      type: String
    - contextPath: DBotScore.Type
      description: The indicator type.
      type: String
    - contextPath: DBotScore.Vendor
      description: The vendor used to calculate the score.
      type: String
    - contextPath: DBotScore.Score
      description: The reputation score, where 0 is Unknown, 1 is Good, 2 is Suspicious and 3 is Bad.
      type: Number
    - contextPath: DBotScore.Reliability
      description: The reliability of the source providing the score.
      type: String
    - contextPath: IP.Address
      description: The IP address.
      type: String
    - contextPath: IP.ASN
      description: The Autonomous System Number of the IP address.
      type: String
    - contextPath: IP.ASOwner
      description: The owner of the Autonomous System.
      type: String
    - contextPath: IP.Hostname
      description: The reverse DNS hostname of the IP address.
      type: String
    - contextPath: IP.Region
      description: The region in which the IP address is located.
      type: String
    - contextPath: IP.Geo.Location
      description: The latitude and longitude of the IP address.
      type: String
    - contextPath: IP.Geo.Country
      description: The country in which the IP address is located.
      type: String
    - contextPath: IP.Geo.Description
      description: The city, region and country of the IP address.
      type: String
    - contextPath: IP.Organization.Name
      description: The organization that owns the IP address.
      type: String
    - contextPath: IP.Organization.Type
      description: The category of the owning organization.
      type: String
    - contextPath: IP.Tags
      description: Security signals detected for the IP address, such as vpn or tor.
      type: Unknown
    - contextPath: IP.Malicious.Vendor
      description: The vendor that flagged the IP address as malicious.
      type: String
    - contextPath: IP.Malicious.Description
      description: The reason the IP address was flagged as malicious.
      type: String
    - contextPath: IPGeolocation.IP.IP
      description: The IP address that was looked up.
      type: String
    - contextPath: IPGeolocation.IP.Domain
      description: The domain name submitted, returned only for domain based lookups.
      type: String
    - contextPath: IPGeolocation.IP.Hostname
      description: Reverse DNS hostname of the IP address. The API echoes the IP address when no hostname resolves.
      type: String
    - contextPath: IPGeolocation.IP.Location.ContinentCode
      description: Two letter continent code, for example EU.
      type: String
    - contextPath: IPGeolocation.IP.Location.ContinentName
      description: Continent name, for example Europe.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryCode2
      description: ISO 3166-1 alpha-2 country code, for example SE.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryCode3
      description: ISO 3166-1 alpha-3 country code, for example SWE.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryName
      description: Common country name.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryNameOfficial
      description: Official country name, when it differs from the common name.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryCapital
      description: Capital city of the country.
      type: String
    - contextPath: IPGeolocation.IP.Location.StateProv
      description: State, province or region name.
      type: String
    - contextPath: IPGeolocation.IP.Location.StateCode
      description: State, province or region code.
      type: String
    - contextPath: IPGeolocation.IP.Location.District
      description: District or county name.
      type: String
    - contextPath: IPGeolocation.IP.Location.City
      description: City name.
      type: String
    - contextPath: IPGeolocation.IP.Location.Locality
      description: Neighborhood or suburb within the city. Requires include=geo_accuracy.
      type: String
    - contextPath: IPGeolocation.IP.Location.AccuracyRadius
      description: Estimated accuracy radius in kilometers around the coordinates. Requires include=geo_accuracy.
      type: String
    - contextPath: IPGeolocation.IP.Location.Confidence
      description: Confidence in the accuracy radius, one of low, medium or high. Requires include=geo_accuracy.
      type: String
    - contextPath: IPGeolocation.IP.Location.DMACode
      description: Designated Market Area code. Populated for United States IP addresses only, and requires include=dma_code.
      type: String
    - contextPath: IPGeolocation.IP.Location.Zipcode
      description: Postal or ZIP code.
      type: String
    - contextPath: IPGeolocation.IP.Location.Latitude
      description: Latitude in decimal degrees.
      type: String
    - contextPath: IPGeolocation.IP.Location.Longitude
      description: Longitude in decimal degrees.
      type: String
    - contextPath: IPGeolocation.IP.Location.IsEU
      description: Whether the country is a member of the European Union.
      type: Boolean
    - contextPath: IPGeolocation.IP.Location.CountryFlag
      description: URL of the country flag image.
      type: String
    - contextPath: IPGeolocation.IP.Location.GeonameID
      description: GeoNames identifier of the place.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryEmoji
      description: Unicode flag emoji of the country.
      type: String
    - contextPath: IPGeolocation.IP.CountryMetadata.CallingCode
      description: International dialing prefix of the country.
      type: String
    - contextPath: IPGeolocation.IP.CountryMetadata.TLD
      description: Country code top level domain.
      type: String
    - contextPath: IPGeolocation.IP.CountryMetadata.Languages
      description: Language codes commonly spoken in the country.
      type: Unknown
    - contextPath: IPGeolocation.IP.Currency.Code
      description: ISO 4217 currency code.
      type: String
    - contextPath: IPGeolocation.IP.Currency.Name
      description: Currency name.
      type: String
    - contextPath: IPGeolocation.IP.Currency.Symbol
      description: Currency symbol.
      type: String
    - contextPath: IPGeolocation.IP.Network.ConnectionType
      description: Network access type, for example Cable or Mobile, when available.
      type: String
    - contextPath: IPGeolocation.IP.Network.Route
      description: Network prefix in CIDR notation that contains the IP address.
      type: String
    - contextPath: IPGeolocation.IP.Network.IsAnycast
      description: Whether the IP address is announced from multiple locations as anycast.
      type: Boolean
    - contextPath: IPGeolocation.IP.ASN.ASNumber
      description: Autonomous System Number of the network, in AS notation, for example AS15169.
      type: String
    - contextPath: IPGeolocation.IP.ASN.Organization
      description: Organization that operates the Autonomous System.
      type: String
    - contextPath: IPGeolocation.IP.ASN.Country
      description: Country in which the Autonomous System is registered.
      type: String
    - contextPath: IPGeolocation.IP.ASN.Type
      description: Autonomous System category, for example ISP, HOSTING, BUSINESS, EDUCATION or GOVERNMENT.
      type: String
    - contextPath: IPGeolocation.IP.ASN.Domain
      description: Domain name of the Autonomous System operator.
      type: String
    - contextPath: IPGeolocation.IP.ASN.DateAllocated
      description: Date on which the Autonomous System Number was allocated.
      type: String
    - contextPath: IPGeolocation.IP.ASN.RIR
      description: Regional Internet Registry that allocated the Autonomous System Number.
      type: String
    - contextPath: IPGeolocation.IP.Company.Name
      description: Company mapped to the IP address, often the ISP or network operator.
      type: String
    - contextPath: IPGeolocation.IP.Company.Type
      description: Company category, for example ISP, HOSTING, BUSINESS, EDUCATION or GOVERNMENT.
      type: String
    - contextPath: IPGeolocation.IP.Company.Domain
      description: Company domain name.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.Name
      description: Time zone name in IANA format, for example Europe/Stockholm.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.Offset
      description: Standard UTC offset in hours.
      type: Number
    - contextPath: IPGeolocation.IP.TimeZone.OffsetWithDST
      description: Effective UTC offset in hours, including daylight saving time when active.
      type: Number
    - contextPath: IPGeolocation.IP.TimeZone.CurrentTime
      description: Current local date and time at the IP location.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.CurrentTimeUnix
      description: Current local time as Unix epoch seconds.
      type: Number
    - contextPath: IPGeolocation.IP.TimeZone.CurrentTZAbbreviation
      description: Current time zone abbreviation, for example CET.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.CurrentTZFullName
      description: Current time zone full name.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.StandardTZAbbreviation
      description: Standard, non daylight saving, time zone abbreviation.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.StandardTZFullName
      description: Standard, non daylight saving, time zone full name.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.IsDST
      description: Whether daylight saving time is currently active.
      type: Boolean
    - contextPath: IPGeolocation.IP.TimeZone.DSTSavings
      description: Daylight saving time shift in hours.
      type: Number
    - contextPath: IPGeolocation.IP.TimeZone.DSTExists
      description: Whether the time zone observes daylight saving time at any point in the year.
      type: Boolean
    - contextPath: IPGeolocation.IP.TimeZone.DSTTZAbbreviation
      description: Time zone abbreviation used while daylight saving time is active.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTTZFullName
      description: Time zone full name used while daylight saving time is active.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTStart.UTCTime
      description: Moment in UTC at which daylight saving time starts.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTStart.Duration
      description: Clock change applied when daylight saving time starts.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTStart.Gap
      description: Whether local time jumps forward, leaving local times that do not exist.
      type: Boolean
    - contextPath: IPGeolocation.IP.TimeZone.DSTStart.DateTimeAfter
      description: Local date and time immediately after the transition.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTStart.DateTimeBefore
      description: Local date and time immediately before the transition.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTStart.Overlap
      description: Whether local times repeat at the transition.
      type: Boolean
    - contextPath: IPGeolocation.IP.TimeZone.DSTEnd.UTCTime
      description: Moment in UTC at which daylight saving time ends.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTEnd.Duration
      description: Clock change applied when daylight saving time ends.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTEnd.Gap
      description: Whether local time jumps forward at the transition.
      type: Boolean
    - contextPath: IPGeolocation.IP.TimeZone.DSTEnd.DateTimeAfter
      description: Local date and time immediately after the transition.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTEnd.DateTimeBefore
      description: Local date and time immediately before the transition.
      type: String
    - contextPath: IPGeolocation.IP.TimeZone.DSTEnd.Overlap
      description: Whether local times repeat at the transition.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.ThreatScore
      description: Aggregate risk score from 0 to 100, where 100 is the highest risk.
      type: Number
    - contextPath: IPGeolocation.IP.Security.IsTor
      description: Whether the IP address is a Tor exit node.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.IsProxy
      description: Whether the IP address belongs to a proxy network.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.ProxyProviderNames
      description: Names of the detected proxy providers.
      type: Unknown
    - contextPath: IPGeolocation.IP.Security.ProxyConfidenceScore
      description: Confidence from 0 to 100 in the proxy detection. Defaults to 0 when not detected.
      type: Number
    - contextPath: IPGeolocation.IP.Security.ProxyLastSeen
      description: Date on which proxy activity was last observed, in YYYY-MM-DD format.
      type: String
    - contextPath: IPGeolocation.IP.Security.IsResidentialProxy
      description: Whether the IP address belongs to a residential proxy network.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.IsVPN
      description: Whether the IP address belongs to a VPN network.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.VPNProviderNames
      description: Names of the detected VPN providers.
      type: Unknown
    - contextPath: IPGeolocation.IP.Security.VPNConfidenceScore
      description: Confidence from 0 to 100 in the VPN detection. Defaults to 0 when not detected.
      type: Number
    - contextPath: IPGeolocation.IP.Security.VPNLastSeen
      description: Date on which VPN activity was last observed, in YYYY-MM-DD format.
      type: String
    - contextPath: IPGeolocation.IP.Security.IsRelay
      description: Whether the IP address belongs to a privacy relay network.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.RelayProviderName
      description: Name of the detected relay provider.
      type: String
    - contextPath: IPGeolocation.IP.Security.IsAnonymous
      description: Whether any anonymizing route was detected, that is a VPN, proxy, Tor or relay.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.IsKnownAttacker
      description: Whether the IP address is flagged for known attacker behavior.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.IsBot
      description: Whether the IP address is associated with suspicious automated activity.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.IsSpam
      description: Whether the IP address is associated with spam activity.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.IsCloudProvider
      description: Whether the IP address belongs to a cloud or hosting provider range.
      type: Boolean
    - contextPath: IPGeolocation.IP.Security.CloudProviderName
      description: Name of the cloud or hosting provider.
      type: String
    - contextPath: IPGeolocation.IP.Abuse.Route
      description: Abuse handling IP range in CIDR notation.
      type: String
    - contextPath: IPGeolocation.IP.Abuse.Country
      description: ISO 3166-1 alpha-2 country code in which the abuse contact is registered.
      type: String
    - contextPath: IPGeolocation.IP.Abuse.Name
      description: Name of the abuse contact role, team or person.
      type: String
    - contextPath: IPGeolocation.IP.Abuse.Organization
      description: Organization that manages the IP address range.
      type: String
    - contextPath: IPGeolocation.IP.Abuse.Kind
      description: Contact type reported by the registry, either group or individual.
      type: String
    - contextPath: IPGeolocation.IP.Abuse.Address
      description: Registered postal address of the organization that owns the IP address.
      type: String
    - contextPath: IPGeolocation.IP.Abuse.Emails
      description: Email addresses for reporting abuse.
      type: Unknown
    - contextPath: IPGeolocation.IP.Abuse.PhoneNumbers
      description: Phone numbers for reporting abuse.
      type: Unknown
    - contextPath: IPGeolocation.IP.UserAgent.UserAgentString
      description: Raw User-Agent string that was parsed.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Name
      description: Detected user agent product name.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Type
      description: User agent category, for example Browser, Robot or Hacker.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Version
      description: Full product version.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.VersionMajor
      description: Major product version.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Device.Name
      description: Detected device label.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Device.Type
      description: Device category, for example Desktop, Mobile or Tablet.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Device.Brand
      description: Device vendor or brand.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Device.CPU
      description: Detected CPU or architecture.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Engine.Name
      description: Rendering engine name.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Engine.Type
      description: Rendering engine category.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Engine.Version
      description: Full rendering engine version.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.Engine.VersionMajor
      description: Major rendering engine version.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.OperatingSystem.Name
      description: Operating system name.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.OperatingSystem.Type
      description: Operating system category.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.OperatingSystem.Version
      description: Operating system version.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.OperatingSystem.VersionMajor
      description: Major operating system version.
      type: String
    - contextPath: IPGeolocation.IP.UserAgent.OperatingSystem.Build
      description: Operating system build identifier.
      type: String
  - name: ipgeolocation-ip-lookup
    description: Looks up an IPv4 address, an IPv6 address or a domain name with the IP Geolocation API (/v3/ipgeo). Returns
      location, network, ASN, company, currency, country metadata and time zone data by default, and optionally the security,
      abuse contact, user agent, geolocation accuracy, DMA code and hostname modules through the include argument.
    arguments:
    - name: ip
      description: Comma separated list of IPv4 addresses, IPv6 addresses or domain names to look up. Domain lookups require
        a paid subscription.
      required: true
      isArray: true
      default: true
    - name: include
      description: Comma separated list of optional modules to add to the response. Each module has its own credit cost, security
        adds 2 credits and abuse adds 1 credit on top of the base lookup. All modules require a paid subscription. When more
        than one hostname option is supplied the API applies the precedence liveHostname, hostname, hostnameFallbackLive.
      isArray: true
      predefined:
      - geo_accuracy
      - dma_code
      - user_agent
      - security
      - abuse
      - hostname
      - liveHostname
      - hostnameFallbackLive
      - '*'
      auto: PREDEFINED
    - name: lang
      description: Language of the response. Only English is available on the Free plan.
      predefined:
      - en
      - de
      - ru
      - ja
      - fr
      - cn
      - es
      - cs
      - it
      - ko
      - fa
      - pt
      - ar
      auto: PREDEFINED
    - &id001
      name: fields
      description: Comma separated list of response fields to return, using the documented dot notation, for example location.city.
        Reduces the response size without changing the credit cost.
      isArray: true
    - &id002
      name: excludes
      description: Comma separated list of response fields or objects to omit, using the documented dot notation, for example
        currency or location.continent_code. The ip field is always returned.
      isArray: true
    outputs:
    - contextPath: IPGeolocation.IP.IP
      description: The IP address that was looked up.
      type: String
    - contextPath: IPGeolocation.IP.Domain
      description: The domain name submitted, returned only for domain based lookups.
      type: String
    - contextPath: IPGeolocation.IP.Hostname
      description: Reverse DNS hostname of the IP address. The API echoes the IP address when no hostname resolves.
      type: String
    - contextPath: IPGeolocation.IP.Location.ContinentCode
      description: Two letter continent code, for example EU.
      type: String
    - contextPath: IPGeolocation.IP.Location.ContinentName
      description: Continent name, for example Europe.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryCode2
      description: ISO 3166-1 alpha-2 country code, for example SE.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryCode3
      description: ISO 3166-1 alpha-3 country code, for example SWE.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryName
      description: Common country name.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryNameOfficial
      description: Official country name, when it differs from the common name.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryCapital
      description: Capital city of the country.
      type: String
    - contextPath: IPGeolocation.IP.Location.StateProv
      description: State, province or region name.
      type: String
    - contextPath: IPGeolocation.IP.Location.StateCode
      description: State, province or region code.
      type: String
    - contextPath: IPGeolocation.IP.Location.District
      description: District or county name.
      type: String
    - contextPath: IPGeolocation.IP.Location.City
      description: City name.
      type: String
    - contextPath: IPGeolocation.IP.Location.Locality
      description: Neighborhood or suburb within the city. Requires include=geo_accuracy.
      type: String
    - contextPath: IPGeolocation.IP.Location.AccuracyRadius
      description: Estimated accuracy radius in kilometers around the coordinates. Requires include=geo_accuracy.
      type: String
    - contextPath: IPGeolocation.IP.Location.Confidence
      description: Confidence in the accuracy radius, one of low, medium or high. Requires include=geo_accuracy.
      type: String
    - contextPath: IPGeolocation.IP.Location.DMACode
      description: Designated Market Area code. Populated for United States IP addresses only, and requires include=dma_code.
      type: String
    - contextPath: IPGeolocation.IP.Location.Zipcode
      description: Postal or ZIP code.
      type: String
    - contextPath: IPGeolocation.IP.Location.Latitude
      description: Latitude in decimal degrees.
      type: String
    - contextPath: IPGeolocation.IP.Location.Longitude
      description: Longitude in decimal degrees.
      type: String
    - contextPath: IPGeolocation.IP.Location.IsEU
      description: Whether the country is a member of the European Union.
      type: Boolean
    - contextPath: IPGeolocation.IP.Location.CountryFlag
      description: URL of the country flag image.
      type: String
    - contextPath: IPGeolocation.IP.Location.GeonameID
      description: GeoNames identifier of the place.
      type: String
    - contextPath: IPGeolocation.IP.Location.CountryEmoji
      description: Unicode flag emoji of the country.
      type: String
    - contextPath: IPGeolocation.IP.CountryMetadata.CallingCode
      description: International dialing prefix of the country.
      type: String
    - contextPath: IPGeolocation.IP.CountryMetadata.TLD
      description: Country code top level domain.
      type: String
    - contextPath: IPGeolocation.IP.CountryMetadata.Languages
