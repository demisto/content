inputs:
- key: IP
  value:
    complex:
      root: IP
      accessor: Address
  required: false
  description: The IP address or addresses to enrich. Defaults to the IP indicators already in the incident context.
  playbookInputQuery: null
- key: SuspiciousThreshold
  value:
    simple: "2"
  required: false
  description: The minimum IPGeolocation.io DBotScore (2 = Suspicious, 3 = Malicious) at which the playbook resolves the abuse contact of the owning network. Defaults to 2 (Suspicious). Set to 3 to restrict abuse-contact resolution to Malicious verdicts only.
  playbookInputQuery: null
outputs:
- contextPath: DBotScore
