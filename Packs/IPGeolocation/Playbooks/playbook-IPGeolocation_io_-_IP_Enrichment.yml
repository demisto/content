id: IPGeolocation.io - IP Enrichment
version: -1
name: IPGeolocation.io - IP Enrichment
description: |-
  Enriches one or more IP addresses with IPGeolocation.io data.

  The playbook scores the address with the generic ip command, which writes a DBotScore derived from the
  IPGeolocation.io IP Security threat score and detection flags. It then adds Autonomous System context to support
  infrastructure pivoting. When the resulting verdict is Suspicious or Malicious, it resolves the abuse contact of
  the owning network so a notification or takedown task can use it.

  All tasks tolerate errors, so a private, bogon or unresolvable address does not stop the playbook.

  This playbook requires a paid IPGeolocation.io subscription, because IP Security, ASN and Abuse Contact data are
  not available on the Free plan.
