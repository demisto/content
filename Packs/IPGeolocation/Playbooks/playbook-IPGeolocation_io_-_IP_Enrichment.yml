  type: unknown
- contextPath: IP
  description: The standard IP indicator context, including geolocation, Autonomous System and abuse contact fields.
  type: unknown
- contextPath: IPGeolocation.IP
  description: The IPGeolocation.io geolocation, security and abuse contact data for the IP address.
  type: unknown
- contextPath: IPGeolocation.ASN
  description: The IPGeolocation.io Autonomous System data for the IP address.
  type: unknown
