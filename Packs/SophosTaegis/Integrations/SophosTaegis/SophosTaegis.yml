    def close_investigation_command(client: Client, xdr_base_url: str, args=None):
        """
        Close a Taegis investigation using the closeInvestigation mutation.
        Input: id (required), reason (required), status (required, e.g. CLOSED_INCONCLUSIVE),
        alertsResolutionStatus (required by Taegis; e.g. TRUE_POSITIVE_BENIGN, OTHER). Defaults to OTHER if not provided.
        """
        if not args.get("id"):
            raise ValueError("Cannot close investigation without id defined")
        if not args.get("status") or str(args.get("status", "")).strip() == "":
            raise ValueError("Cannot close investigation without status (e.g. CLOSED_INCONCLUSIVE)")
        if args.get("status") not in INVESTIGATION_STATUSES:
            raise ValueError(f"status must be one of: {INVESTIGATION_STATUSES}")
        reason = args.get("reason")
        if reason is None or str(reason).strip() == "":
            reason = "Closed from Cortex XSOAR"
        else:
            reason = str(reason).strip()
        alerts_resolution = args.get("alertsResolutionStatus") or args.get("taegisxdrdetectionstatus") or args.get("alertstatus")
        if not alerts_resolution or str(alerts_resolution).strip() == "":
            alerts_resolution = "OTHER"
        else:
            alerts_resolution = str(alerts_resolution).strip()
        variables = {
            "input": {
                "id": args.get("id"),
                "reason": reason,
                "status": args.get("status"),
                "alertsResolutionStatus": alerts_resolution,
            }
        }
        result = client.graphql_run(query=MUTATION_CLOSE_INVESTIGATION, variables=variables)
        try:
            investigation = result["data"]["closeInvestigation"]
            investigation["url"] = generate_id_url(xdr_base_url, "investigations", investigation["id"])
        except (KeyError, TypeError):
            raise ValueError(f"Failed to close investigation: {result.get('errors', [{}])[0].get('message', 'Unknown error')}")
        return CommandResults(
            outputs_prefix="TaegisXDR.InvestigationClose",
            outputs_key_field="id",
            outputs=investigation,
            readable_output=tableToMarkdown("Taegis Investigation Closed", investigation, removeNull=True, url_keys=("url",)),
            raw_response=result,
        )
    
    
    def update_investigation_command(client: Client, xdr_base_url: str, args=None):
        if not args.get("id"):
            raise ValueError("Cannot fetch investigation without id defined")
    
        fields: str = args.get("fields") or "id shortId"
    
        query = """
        mutation updateInvestigationV2($input: UpdateInvestigationV2Input!) {
            updateInvestigationV2(input: $input) {
                %s
            }
        }
        """ % (fields)
    
        variables = {"input": {"id": args.get("id")}}
    
        for field in INVESTIGATION_UPDATE_FIELDS:
            # Allow keyFindings when present in args even if empty (so clearing details in XSOAR clears Taegis Key Findings)
            if field != "keyFindings" and not args.get(field):
                continue
            if field == "keyFindings" and field not in args:
                continue

            if field == "assigneeId" and not _is_valid_assignee_id(args["assigneeId"]):
                raise ValueError("assigneeId MUST be '@secureworks', '@customer', '@sophos', 'auth0|...', or a tenant user UUID")
            if field == "priority" and not 0 < int(args.get("priority", 0)) < 5:
                raise ValueError("Priority must be between 1-4")
            if field == "status" and args.get("status") not in INVESTIGATION_STATUSES:
                raise ValueError(
                    f"The provided status, {args['status']}, is not valid for updating an investigation. "
                    f"Supported Status Values: {INVESTIGATION_STATUSES}")
            if field == "type" and args.get("type") not in INVESTIGATION_TYPES:
                raise ValueError(
                    f"The provided type, {args['type']}, is not valid for updating an investigation. "
                    f"Supported Type Values: {INVESTIGATION_TYPES}")
    
            if field == "tags":
                variables["input"]["tags"] = argToList(args["tags"])
            else:
                variables["input"][field] = args.get(field)
    
        if len(variables["input"]) < 2:
            raise ValueError(f"No valid investigation fields provided. Supported Update Fields: {INVESTIGATION_UPDATE_FIELDS}")
    
        result = client.graphql_run(query=query, variables=variables)
    
        try:
            investigation = result["data"]["updateInvestigationV2"]
            investigation["url"] = generate_id_url(xdr_base_url, "investigations", investigation["id"])
        except (KeyError, TypeError):
            raise ValueError(f"Failed to locate/update investigation: {result['errors'][0]['message']}")
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.InvestigationUpdate",
            outputs_key_field="id",
            outputs=investigation,
            readable_output=tableToMarkdown(
                "Taegis Investigation",
                investigation,
                removeNull=True,
                url_keys=("url"),
            ),
            raw_response=result,
        )
    
        return results
    
    
