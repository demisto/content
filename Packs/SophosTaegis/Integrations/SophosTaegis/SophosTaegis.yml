        }
        pageInfo {
          endRange
          hasNext
          startRange
          __typename
        }
        __typename
      }
    }
    """
    
    
    def fetch_entity_context_associated_entities(client: Client, investigation_id: str, page_size: int = 100):
        """
        Fetch entities associated with an investigation via entityContextAssociatedEntities.
        Uses the Entity Context API (entryPoint type INVESTIGATION). Paginates until all entities are retrieved.
        Returns a list of entity objects (each with id, displayName, type, identifiers, etc.).
        """
        all_entities: list = []
        start_range = 0
        while True:
            variables = {
                "entryPoint": {
                    "ids": [investigation_id],
                    "type": "INVESTIGATION"
                },
                "page": {
                    "startRange": start_range,
                    "endRange": start_range + page_size
                },
                "filters": {
                    "filter": {},
                    "sortBy": "lastSeen",
                    "sortOrder": "DESC"
                }
            }
            result = client.graphql_run(query=QUERY_ENTITY_CONTEXT_ASSOCIATED_ENTITIES, variables=variables)
            if result.get("errors") and result["errors"]:
                raise ValueError(result["errors"][0].get("message", "entityContextAssociatedEntities failed"))
            data = result.get("data", {}).get("entityContextAssociatedEntities") or {}
            entities = data.get("entities") or []
            all_entities.extend(entities)
            page_info = data.get("pageInfo") or {}
            if not page_info.get("hasNext"):
                break
            start_range = (page_info.get("endRange") or start_range) + 1
        return all_entities
    
    
    def get_remote_data_command(client: Client, xdr_base_url: str, args: dict = None, params: dict = None):
        """
        getRemoteData command for XSOAR mirroring
        Fetches the latest investigation data from Taegis and returns it in XSOAR mirroring format
        
        This command is automatically called by XSOAR when mirroring is enabled.
        Uses GetRemoteDataArgs from CommonServerPython for structured argument parsing.
        
        Args:
            client: Taegis XDR client
            xdr_base_url: XDR base URL for investigation/alert links
            args: Command arguments (if None, will get from demisto.args())
            params: Integration parameters (if None, will get from demisto.params())
        
        Returns:
            List[Dict]: First element is the investigation data, subsequent elements are entries (comments, etc.)
        """
        demisto.debug("getRemoteData command called for mirroring")
        demisto.debug(f"getRemoteData - integration instance: {demisto.integrationInstance()}")
        
        # Get args and params if not provided (XSOAR may call without passing them)
        if args is None:
            try:
                args = demisto.args()
                demisto.debug(f"getRemoteData: Got args from demisto.args(): {args}")
            except Exception as e:
                demisto.debug(f"getRemoteData: demisto.args() failed: {str(e)}")
                args = {}
        
        if params is None:
            try:
                params = demisto.params()
                demisto.debug(f"getRemoteData: Got params from demisto.params()")
            except Exception as e:
                demisto.debug(f"getRemoteData: demisto.params() failed: {str(e)}")
                params = {}
        
        # Ensure args is a dict (it might be None or empty)
        if not args or not isinstance(args, dict):
            args = {}
            demisto.debug("getRemoteData: args was None or not a dict, using empty dict")
        
        # Parse arguments - XSOAR passes 'id' and 'lastUpdate' when calling get-remote-data automatically
        # Try GetRemoteDataArgs first, but fallback to manual parsing if it fails
        investigation_id = None
        last_update = None
        
        try:
            parsed_args = GetRemoteDataArgs(args)
            investigation_id = parsed_args.remote_incident_id
            last_update = parsed_args.last_update
            demisto.debug(f"getRemoteData: Using GetRemoteDataArgs - remote_incident_id={investigation_id}, last_update={last_update}")
        except Exception as e:
            # Fallback to manual parsing if GetRemoteDataArgs fails (e.g., if 'id' is not mapped to remote_incident_id)
            demisto.debug(f"getRemoteData: GetRemoteDataArgs failed ({str(e)}), using manual parsing")
            # XSOAR passes 'id' (not 'remote_incident_id') when calling automatically
            investigation_id = args.get("id") or args.get("remoteId") or args.get("remote_incident_id")
            last_update = args.get("lastUpdate") or args.get("last_update")
            demisto.debug(f"getRemoteData: Manual parsing - id={investigation_id}, lastUpdate={last_update}")
        
        if not investigation_id:
            # Try to get investigation ID from incident context (dbotMirrorId)
            # Context Data stores dbotMirrorId on the incident object - check both top-level and CustomFields
            demisto.debug("getRemoteData: investigation_id not in args, trying to get from incident context")
            try:
                incident = demisto.incident()
                if incident and isinstance(incident, dict):
                    # Check top-level first (Context Data shows incident.dbotMirrorId)
                    investigation_id = incident.get("dbotMirrorId", "") or incident.get("dbotmirrorid", "")
                    if investigation_id:
                        demisto.debug(f"getRemoteData: Got investigation ID from incident.dbotMirrorId: {investigation_id}")
                    if not investigation_id:
                        custom_fields = incident.get("CustomFields", {})
                        if isinstance(custom_fields, dict):
                            investigation_id = custom_fields.get("dbotMirrorId", "") or custom_fields.get("dbotmirrorid", "")
                            if investigation_id:
                                demisto.debug(f"getRemoteData: Got investigation ID from incident.CustomFields.dbotMirrorId: {investigation_id}")
            except Exception as e:
                import traceback
                demisto.debug(f"getRemoteData: Could not get incident context: {str(e)}\nTraceback: {traceback.format_exc()}")
        
        if not investigation_id:
            # Provide more helpful error message with debug info
            error_details = f"Args keys: {list(args.keys()) if args else 'None'}, Args values: {args if args else 'None'}"
            demisto.error(f"getRemoteData: Missing investigation ID. {error_details}")
            raise ValueError(f"Investigation ID is required for getRemoteData. Provide 'id' parameter or ensure incident has 'dbotMirrorId' set. {error_details}")
        
        # Get lastUpdate timestamp if provided (XSOAR passes this to only fetch changes since last update)
        if last_update:
            demisto.debug(f"getRemoteData: lastUpdate={last_update}")
        
        # Get tenant_id from args, params, or incident context
        tenant_id = args.get("tenant_id", "")
        if not tenant_id:
            # Try to get from params (integration instance configuration)
            tenant_id = params.get("tenant_id", "")
        if not tenant_id:
            # Try to get from incident context if available
            try:
                incident = demisto.incident()
                if incident and isinstance(incident, dict):
                    custom_fields = incident.get("CustomFields", {})
                    if isinstance(custom_fields, dict):
                        tenant_id = custom_fields.get("tenantid", "")
            except Exception:
                pass
        
        demisto.debug(f"getRemoteData: investigation_id={investigation_id}, tenant_id={tenant_id}")
        
        # Fetch investigation details
        investigation_args = {"id": investigation_id}
        if tenant_id:
            investigation_args["tenant_id"] = tenant_id
        
        # Fetch investigation details - ensure we get keyFindings
        investigation_result = fetch_investigation_command(client, xdr_base_url, investigation_args)
        investigation = investigation_result.outputs[0] if investigation_result.outputs else {}
        
        if not investigation:
            demisto.debug(f"getRemoteData: Investigation {investigation_id} not found")
            return f"Investigation {investigation_id} was not found."
        
        # Debug: Log what we got from the investigation
        demisto.debug(f"getRemoteData: Investigation fetched - keyFindings present: {'keyFindings' in investigation or 'key_findings' in investigation}")
        if investigation.get("keyFindings") or investigation.get("key_findings"):
            key_findings_value = investigation.get("keyFindings") or investigation.get("key_findings", "")
            demisto.debug(f"getRemoteData: keyFindings value length: {len(str(key_findings_value))}")
        
        # Log when investigation was last updated (for debugging). We always return mirrored_data below
        # so XSOAR can update Source Status and other fields (e.g. after we pushed status from update_remote_system).
        # Previously we returned [{}] when lastUpdate >= investigation_updated_ts, but that prevented Source Status
        # from ever updating when the only change was our push to Taegis (lastUpdate could be after investigation_updated_ts).
        if last_update:
            try:
                dateparse = dateparser.parse
                timestamp_field = (params.get("mirror_timestamp_field") or "updated_at").strip() or "updated_at"
                investigation_updated = investigation.get(timestamp_field) or investigation.get("updated_at") or investigation.get("updatedAt")
                if investigation_updated:
                    demisto.debug(f"getRemoteData: Investigation {investigation_id} updated_at={investigation_updated}, lastUpdate={last_update}; returning current state so XSOAR can sync (e.g. Source Status)")
            except Exception as e:
                demisto.debug(f"getRemoteData: Error checking timestamps: {str(e)}")
        
        # Fetch case entities via Entity Context Associated Entities API
        entities_data = []
        try:
            entities_data = fetch_entity_context_associated_entities(client, investigation_id, page_size=100)
        except Exception as e:
            demisto.debug(f"getRemoteData: Could not fetch entity context associated entities: {e}")
        
        # Transform entities to grid format (supports new entityContextAssociatedEntities shape)
        entities_grid = transform_entities_to_grid(entities_data)
        
        # Fetch investigation alerts (detections) for grid display
        alerts_grid = []
        try:
            alerts_grid = fetch_investigation_alerts_for_grid(client, xdr_base_url, investigation_id)
        except Exception as e:
            demisto.debug(f"getRemoteData: Could not fetch investigation alerts for grid: {e}")
        
        # Fetch comments (used to add new comments as War Room notes and for synced-IDs dedup)
        comments_result = fetch_comments_command(client, xdr_base_url, investigation_args)
        comments = comments_result.outputs if comments_result.outputs else []
        
        # Use sharelink as Incident Link; avoid unnecessarily updating XSOAR with a new sharelink if the incident
        # already has a sharelink (e.g. from initial fetch) that hasn't expired). Defensive: incident() may be None in mirroring.
        sharelink_url = ""
        try:
            current_incident = demisto.incident()
            if current_incident is None or not isinstance(current_incident, dict):
                pass
            else:
                # XSOAR may return incident nested under "incident" or "Incident"; use inner dict only if it is a dict to avoid NoneType subscript
                data = current_incident.get("incident") or current_incident.get("Incident")
                if data is None or not isinstance(data, dict):
                    data = current_incident
                current_url = ""
                if isinstance(data, dict):
                    current_url = (data.get("url") or "").strip()
                    if not current_url:
                        cf = data.get("CustomFields")
                        if isinstance(cf, dict):
                            current_url = (cf.get("url") or cf.get("incidentlink") or cf.get("Incident Link") or "").strip()
                if current_url and "/share/" in str(current_url):
                    sharelink_url = current_url
                    demisto.debug("getRemoteData: Keeping existing sharelink URL (not expired / no unnecessary update)")
        except Exception as e:
            demisto.debug(f"getRemoteData: Could not get current incident URL: {e}")
        if not sharelink_url:
            try:
                sharelink_args = {"id": investigation_id, "type": "investigationId"}
                sharelink_result = create_sharelink_command(client, xdr_base_url, sharelink_args)
                if sharelink_result.outputs:
                    sharelink_url = sharelink_result.outputs.get("url", "")
            except Exception as e:
                demisto.debug(f"Could not create share link (may already exist): {str(e)}")
            if not sharelink_url:
                sharelink_url = investigation.get("url", "")
        
        # Build the mirrored data structure matching the mapper format
        # The mapper expects: status, priority, description, key_findings, assignee, assignee_id, tags, tenant_id, created_at, url, id
        # key_findings maps to XSOAR "Taegis XDR Key Findings" (taegisxdrkeyfindings) via incoming mapper
        # Taegis XDR Assignee (taegisxdrassignee) is set below from assignee_id/friendly label; ensure assignee has name for fallback.
        assignee_id = investigation.get("assignee_id") or investigation.get("assigneeId")
        assignee = investigation.get("assignee") or {}
        if not isinstance(assignee, dict):
            assignee = {}
        # When assignee_id is @customer or @secureworks, always use it for assignee/display (API may still return previous user in assignee object).
        # Otherwise when assignee_id is set but assignee.name is missing, derive name from assignee_id.
        if assignee_id and str(assignee_id).strip().lower() in ("@customer", "@secureworks", "@sophos"):
            assignee = {"name": str(assignee_id).strip(), "id": assignee_id}
        elif assignee_id and not (assignee.get("name") or assignee.get("displayName")):
            assignee = {"name": str(assignee_id).strip(), "id": assignee_id}
        inv_status = investigation.get("status", "")
        mirrored_data = {
            "id": investigation.get("id"),
            "status": inv_status,
            "taegisxdrcasestatus": inv_status,
            "priority": investigation.get("priority"),
            "description": investigation.get("title", investigation.get("description", "")),
            "key_findings": investigation.get("keyFindings", investigation.get("key_findings", "")),
            "tenant_id": investigation.get("tenant_id", tenant_id),
            "shortId": investigation.get("shortId", ""),
            "assignee": assignee,
            "assignee_id": assignee_id,
            "tags": investigation.get("tags", []),
            "created_at": investigation.get("created_at", ""),
            "created_by": investigation.get("created_by", ""),
            "updated_at": investigation.get("updatedAt") or investigation.get("updated_at", ""),  # Prefer updatedAt (v2 API) with fallback to updated_at
            "url": sharelink_url or investigation.get("url", ""),
            "taegisxdr_type": "case",
        }
        # Set taegisxdrassignee: Taegis assignee_id is source of truth. Resolve display name so it always matches
        # the current assignee (avoid showing stale name when assignee was changed in Taegis after XSOAR push).
        try:
            assignee_id_str = str(assignee_id).strip() if assignee_id else ""
            if assignee_id_str.lower() in ("@customer", "@secureworks", "@sophos"):
                mirrored_data["taegisxdrassignee"] = assignee_id_str
            else:
                display_value = ""
                current_inc = demisto.incident()
                raw = None
                if current_inc is not None and isinstance(current_inc, dict):
                    data = current_inc.get("incident") or current_inc.get("Incident")
                    data = data if isinstance(data, dict) else current_inc
                    if isinstance(data, dict):
                        raw = data.get("taegisxdrassigneeoptionsdata")
                        if not raw:
                            cf = data.get("CustomFields")
                            if isinstance(cf, dict):
                                raw = cf.get("taegisxdrassigneeoptionsdata")
                if raw and assignee_id_str:
                    try:
                        if isinstance(raw, str) and raw.strip().startswith("taegis_users:"):
                            import base64
                            s = raw.strip()[len("taegis_users:"):]
                            b = base64.b64decode(s)
                            raw = b.decode("utf-8") if isinstance(b, bytes) else b
                        data = json.loads(raw) if not isinstance(raw, dict) else raw
                        if isinstance(data, dict) and "label_to_id" in data:
                            id_to_label = {v: k for k, v in data["label_to_id"].items()}
                            friendly = id_to_label.get(assignee_id_str)
                            if friendly:
                                display_value = str(friendly).strip()
                    except (ValueError, TypeError):
                        pass
                if not display_value and assignee_id_str:
                    user_dict = _fetch_tenant_user_by_id(client, assignee_id_str)
                    if user_dict:
                        display_value = _friendly_owner_label(user_dict)
                mirrored_data["taegisxdrassignee"] = display_value or assignee_id_str or ""
        except (ValueError, TypeError, KeyError):
            assignee_id_str_ex = str(assignee_id).strip() if assignee_id else ""
            if assignee_id_str_ex and assignee_id_str_ex.lower() not in ("@customer", "@secureworks", "@sophos"):
                try:
                    user_dict = _fetch_tenant_user_by_id(client, assignee_id_str_ex)
                    if user_dict:
                        mirrored_data["taegisxdrassignee"] = _friendly_owner_label(user_dict)
                    else:
                        mirrored_data["taegisxdrassignee"] = assignee_id_str_ex
                except Exception:
                    mirrored_data["taegisxdrassignee"] = assignee_id_str_ex
            else:
                mirrored_data["taegisxdrassignee"] = assignee_id_str_ex or (assignee_id or "")

        # Force assignee display to match assignee_id when @customer, @secureworks, or @sophos (handles API returning
        # "customer"/"secureworks"/"sophos" without @, or mapper/merge overwriting taegisxdrassignee with stale assignee name).
        aid_final = str(assignee_id).strip() if assignee_id else ""
        if aid_final:
            a_lower = aid_final.lower()
            if a_lower in ("@customer", "customer"):
                mirrored_data["assignee_id"] = "@customer"
                mirrored_data["taegisxdrassignee"] = "@customer"
                mirrored_data["assignee"] = {"name": "@customer", "id": "@customer"}
            elif a_lower in ("@secureworks", "secureworks"):
                mirrored_data["assignee_id"] = "@secureworks"
                mirrored_data["taegisxdrassignee"] = "@secureworks"
                mirrored_data["assignee"] = {"name": "@secureworks", "id": "@secureworks"}
            elif a_lower in ("@sophos", "sophos"):
                mirrored_data["assignee_id"] = "@sophos"
                mirrored_data["taegisxdrassignee"] = "@sophos"
                mirrored_data["assignee"] = {"name": "@sophos", "id": "@sophos"}
            elif a_lower in ("@sophos", "sophos"):
                mirrored_data["assignee_id"] = "@sophos"
                mirrored_data["taegisxdrassignee"] = "@sophos"
                mirrored_data["assignee"] = {"name": "@sophos", "id": "@sophos"}
            elif a_lower in ("@sophos", "sophos"):
                mirrored_data["assignee_id"] = "@sophos"
                mirrored_data["taegisxdrassignee"] = "@sophos"
                mirrored_data["assignee"] = {"name": "@sophos", "id": "@sophos"}

        # Ensure assignee object matches assignee_id and resolved display name so the incoming mapper
        # does not overwrite taegisxdrassignee with stale assignee.name from the API (e.g. API returns
        # assignee_id=Sam but assignee/assigneeSubject still has Ryan).
        if assignee_id and str(assignee_id).strip().lower() not in ("@customer", "@secureworks"):
            display_for_assignee = mirrored_data.get("taegisxdrassignee") or str(assignee_id).strip()
            mirrored_data["assignee"] = {"id": assignee_id, "name": display_for_assignee}

        # Force status/taegisxdrcasestatus from investigation so Taegis is source of truth (e.g. user changed status in Taegis to ACTIVE; XSOAR must show ACTIVE).
        current_status = (investigation.get("status") or investigation.get("Status") or inv_status or "").strip()
        if current_status and current_status in INVESTIGATION_STATUSES:
            mirrored_data["status"] = current_status
            mirrored_data["taegisxdrcasestatus"] = current_status

        # Map priority to XSOAR severity (for severity field mapping)
        if mirrored_data.get("priority"):
            mirrored_data["severity"] = map_priority_from_taegis(mirrored_data["priority"])
        
        # Add entities to the context for field mapping
        if entities_grid:
            mirrored_data["taegisxdrcaseentities"] = entities_grid
        # Add investigation alerts (detections) for grid display
        if alerts_grid:
            mirrored_data["taegisxdrcasedetections"] = alerts_grid
        
        # Add new Taegis comments as War Room notes (first-class Notes). Dedup by lastUpdate: only add comments
        # created *after* last_update so we never duplicate even when demisto.incident() is None in mirroring.
        entries = []
        last_update_dt = None
        if last_update:
            try:
                last_update_dt = dateparser.parse(str(last_update), settings={"TIMEZONE": "UTC"})
                if last_update_dt and getattr(last_update_dt, "tzinfo", None) is None:
                    from datetime import timezone
                    last_update_dt = last_update_dt.replace(tzinfo=timezone.utc)
            except Exception as e:
                demisto.debug(f"getRemoteData: Could not parse lastUpdate for comment dedup: {e}")
        comment_tag_from_taegis = params.get("comment_tag_from_taegis", "CommentFromTaegis")
        all_comment_ids = []
        for comment in (comments or []):
            cid_raw = comment.get("id")
            cid = (str(cid_raw).strip() if cid_raw is not None else "")
            if cid:
                all_comment_ids.append(cid)
            created_str = comment.get("createdAt") or comment.get("created_at") or ""
            comment_dt = None
            if created_str:
                try:
                    comment_dt = dateparser.parse(str(created_str), settings={"TIMEZONE": "UTC"})
                    if comment_dt and getattr(comment_dt, "tzinfo", None) is None:
                        from datetime import timezone
                        comment_dt = comment_dt.replace(tzinfo=timezone.utc)
                except Exception:
                    pass
            # When lastUpdate is missing/unparseable, add all (initial sync). Otherwise only add comments created after last sync.
            if comment_dt is None:
                add_note = False
            elif last_update_dt is None:
                add_note = True
            else:
                add_note = comment_dt > last_update_dt
            if add_note:
                entries.append({
                    "Type": 1,
                    "ContentsFormat": "markdown",
                    "Contents": _format_single_comment_for_note(comment),
                    "Tags": [comment_tag_from_taegis],
                })
        mirrored_data["taegisxdrcasecommentsyncedids"] = ",".join(sorted(all_comment_ids))
        if comments and last_update_dt and len(entries) < len(comments):
            demisto.debug(f"getRemoteData: adding {len(entries)} new comment note(s), skipping {len(comments) - len(entries)} (created before lastUpdate)")
        
        # Check if investigation is closed and close_incident is enabled
        close_incident = params.get("close_incident", "true")
        investigation_status = investigation.get("status", "")
        
        if close_incident and close_incident != "false" and investigation_status and investigation_status.startswith("CLOSED_"):
            # Investigation is closed - add entry to close XSOAR incident unless we might be in a "recently reopened" race
            # (user reopened XSOAR, set ACTIVE; we might still see stale CLOSED_ from Taegis; skip close entry to avoid re-closing)
            REOPEN_GRACE_SECONDS = 90
            skip_close_entry = False
            try:
                current_inc = demisto.incident()
                if current_inc is not None and isinstance(current_inc, dict):
                    # XSOAR may return incident nested under "incident" or "Incident"; use inner dict if present
                    data = current_inc.get("incident") or current_inc.get("Incident")
                    data = data if isinstance(data, dict) else current_inc
                    if not isinstance(data, dict):
                        data = None
                    inc_status = data.get("status") if data else None
                    # XSOAR status 2 = Closed; if open (not 2), check if modified recently
                    if inc_status is not None:
                        try:
                            inc_status_int = int(inc_status)
                        except (TypeError, ValueError):
                            inc_status_int = 2
                        if inc_status_int != 2 and data:
                            modified_raw = data.get("modified") or data.get("modifiedDate") or ""
                            if modified_raw:
                                from datetime import datetime, timezone
                                try:
                                    mod_dt = dateparser.parse(str(modified_raw), settings={"TIMEZONE": "UTC"})
                                    if mod_dt:
                                        now_utc = datetime.now(timezone.utc)
                                        if mod_dt.tzinfo is None:
                                            mod_dt = mod_dt.replace(tzinfo=timezone.utc)
                                        age_seconds = (now_utc - mod_dt).total_seconds()
                                        if 0 <= age_seconds <= REOPEN_GRACE_SECONDS:
                                            skip_close_entry = True
                                            demisto.debug(f"getRemoteData: Skipping close entry - incident is open and modified {int(age_seconds)}s ago (reopen grace period {REOPEN_GRACE_SECONDS}s)")
                                except Exception as e:
                                    demisto.debug(f"getRemoteData: Could not parse modified for grace check: {e}")
            except Exception as e:
                demisto.debug(f"getRemoteData: Could not get current incident for reopen grace check: {e}")
            if not skip_close_entry:
                close_reason = investigation_status.replace("CLOSED_", "").replace("_", " ").title()
                close_notes = f"Investigation closed in Taegis XDR with status: {investigation_status}"
                taegis_close_reason = investigation.get("closeReason") or investigation.get("close_reason")
                if taegis_close_reason and str(taegis_close_reason).strip():
                    close_notes += f"\n\nTaegis XDR close reason: {taegis_close_reason}"
                entries.append({
                    "Type": 1,  # EntryType.NOTE
                    "Contents": {
                        "dbotIncidentClose": True,
                        "closeReason": close_reason,
                        "closeNotes": close_notes,
                    },
                    "ContentsFormat": "json",
                })
                demisto.debug(f"getRemoteData: Investigation is closed ({investigation_status}), adding close entry to XSOAR incident")
        elif investigation_status and not investigation_status.startswith("CLOSED_"):
            # Investigation is open/active - add entry to reopen XSOAR incident if it was closed (e.g. case reopened in Taegis)
            entries.append({
                "Type": 1,  # EntryType.NOTE
                "Contents": {
                    "dbotIncidentReopen": True,
                },
                "ContentsFormat": "json",
            })
            demisto.debug(f"getRemoteData: Investigation is open ({investigation_status}), adding reopen entry for XSOAR incident")
        
        # Return mirrored object data - XSOAR will use this with the mapper to update the incident
        # XSOAR expects: [incident_data] + [entries...]
        # First element is the investigation data, subsequent elements are entries
        demisto.debug(f"getRemoteData returning: investigation data with key_findings='{mirrored_data.get('key_findings', '')[:50]}...' + {len(entries)} entries")
        demisto.debug(f"getRemoteData full mirrored_data keys: {list(mirrored_data.keys())}")
        
        # Ensure we return a list with the investigation data as first element
        result = [mirrored_data] + entries
        return result
    
    
    def get_modified_remote_data_command(client: Client, xdr_base_url: str, args: dict = None, params: dict = None):
        """
        get-modified-remote-data command for XSOAR mirroring
        Queries for investigations that were modified since the last update.
        This optimizes mirroring by only calling get-remote-data on modified investigations.

        Single Taegis investigationsSearch: tenant_id (if configured) and mirror_timestamp_field >= last sync.
        No deleted_at predicate - same row set as (deleted_at is null OR deleted_at is not null) with the same
        time bound, so archived/soft-deleted investigations are included and incoming mirror can close XSOAR.

        This command is executed every 1 minute for each integration instance.
        If not implemented, XSOAR will call get-remote-data on all mirrored incidents.

        Returns:
            GetModifiedRemoteDataResponse: Response containing list of modified investigation IDs
        """
        demisto.debug("get-modified-remote-data command called")
        
        # Get args and params if not provided
        if args is None:
            try:
                args = demisto.args()
            except Exception:
                args = {}
        if params is None:
            try:
                params = demisto.params()
            except Exception:
                params = {}
        
        if not args or not isinstance(args, dict):
            args = {}
        
        # Parse last_update from args using GetModifiedRemoteDataArgs
        try:
            parsed_args = GetModifiedRemoteDataArgs(args)
            last_update_str = parsed_args.last_update
            demisto.debug(f"get-modified-remote-data: Using GetModifiedRemoteDataArgs - last_update={last_update_str}")
        except Exception as e:
            # Fallback to manual parsing
            demisto.debug(f"get-modified-remote-data: GetModifiedRemoteDataArgs failed ({str(e)}), using manual parsing")
            last_update_str = args.get("lastUpdate") or args.get("last_update")
        
        if not last_update_str:
            # When XSOAR calls automatically it always passes lastUpdate.
            # For manual testing, use a default (1 day ago) so the command returns useful results.
            from datetime import datetime, timezone, timedelta
            default_dt = datetime.now(timezone.utc) - timedelta(days=1)
            last_update_str = default_dt.isoformat().replace("+00:00", "Z")
            demisto.debug(f"get-modified-remote-data: No lastUpdate in args (manual call?), using default: {last_update_str}")
        
        # Parse last_update timestamp to Taegis query format
        try:
            from dateparser import parse as dateparse  # type: ignore
            from datetime import timedelta
            last_update_dt = dateparse(str(last_update_str), settings={"TIMEZONE": "UTC"})
            if not last_update_dt:
                demisto.debug(f"get-modified-remote-data: Could not parse last_update: {last_update_str}")
                return GetModifiedRemoteDataResponse([])
            # Subtract 10s buffer so status/assignee changes in Taegis are not missed at the boundary
            last_update_dt = last_update_dt - timedelta(seconds=10)
            last_update_iso = last_update_dt.strftime("%Y-%m-%dT%H:%M:%SZ")
            demisto.debug(f"get-modified-remote-data: Parsed last_update to: {last_update_iso} (with 10s buffer)")
        except Exception as e:
            demisto.error(f"get-modified-remote-data: Error parsing last_update: {str(e)}")
            return GetModifiedRemoteDataResponse([])
        
        # Get mirror_limit from params (default 100)
        mirror_limit = int(params.get("mirror_limit", "100"))
        
        # Timestamp field for "when was the investigation last updated" (like ServiceNow sys_updated_on)
        # investigationsSearch uses Investigation type and OrderFieldInput enum: both require snake_case (updated_at).
        # Normalize so "updatedAt" from config is sent as "updated_at" to avoid GRAPHQL_VALIDATION_FAILED.
        _raw = (params.get("mirror_timestamp_field") or "updated_at").strip() or "updated_at"
        timestamp_field = "updated_at" if _raw.lower() == "updatedat" else _raw
        
        # Get tenant_id from params
        tenant_id = params.get("tenant_id", "")
        
        # Query Taegis for investigations modified since last_update
        # investigationsSearch returns type Investigation which has updated_at (snake_case); OrderFieldInput enum accepts updated_at only
        query = """
        query investigationsSearch(
            $page: Int,
            $perPage: Int,
            $orderByField: OrderFieldInput,
            $orderDirection: OrderDirectionInput,
            $query: String
        ) {
            investigationsSearch(
                page: $page
                perPage: $perPage
                orderByField: $orderByField
                orderDirection: $orderDirection
                query: $query
            ) {
                totalCount
                investigations {
                    id
                    updated_at
                }
            }
        }
        """
        
        # CQL: tenant + updated_at (or mirror_timestamp_field) only - includes archived rows (deleted_at set).
        query_parts = []
        if tenant_id:
            query_parts.append(f"tenant_id = '{tenant_id}'")
        query_parts.append(f"{timestamp_field} >= '{last_update_iso}'")
        query_filter = "WHERE " + " AND ".join(query_parts)
        demisto.debug(
            f"get-modified-remote-data: timestamp_field={timestamp_field}, filter: {query_filter}, perPage: {mirror_limit}"
        )

        modified_investigation_ids = []
        page = 0
        max_pages = 50
        try:
            while page < max_pages:
                variables = {
                    "page": page,
                    "perPage": mirror_limit,
                    "orderByField": timestamp_field,
                    "orderDirection": "asc",
                    "query": query_filter,
                }
                result = client.graphql_run(query=query, variables=variables)
                if result.get("errors") and result["errors"]:
                    error_msg = result["errors"][0].get("message", "Unknown error")
                    demisto.error(f"get-modified-remote-data: GraphQL error: {error_msg}")
                    if "rate limit" in error_msg.lower() or "rate_limit" in error_msg.lower():
                        return_error("API rate limit")
                    return_error(f"skip update: {error_msg}")
                search_result = result.get("data", {}).get("investigationsSearch", {})
                investigations = search_result.get("investigations", [])
                total_count = search_result.get("totalCount", 0)
                ids_page = [inv.get("id") for inv in investigations if inv.get("id")]
                modified_investigation_ids.extend(ids_page)
                if len(investigations) < mirror_limit or len(modified_investigation_ids) >= total_count:
                    break
                page += 1
            demisto.debug(f"get-modified-remote-data: Found {len(modified_investigation_ids)} modified investigations")
            return GetModifiedRemoteDataResponse(modified_investigation_ids)
        except Exception as e:
            error_msg = str(e)
            demisto.error(f"get-modified-remote-data: Error querying Taegis: {error_msg}")
            if "rate limit" in error_msg.lower() or "rate_limit" in error_msg.lower():
                return_error("API rate limit")
            return_error(f"skip update: {error_msg}")
    
    
    def taegis_push_assignee_status_command(client: Client, xdr_base_url: str, args: dict = None, params: dict = None):
        """
        Push current XSOAR incident assignee and Taegis case status to Taegis (explicit sync).
        Reads assignee and status from the current incident (CustomFields). Use this after changing
        assignee or status in XSOAR to update Taegis; next mirror refresh will reflect the update in XSOAR.
        """
        args = args or demisto.args()
        incident = demisto.incident()
        if not incident or not isinstance(incident, dict):
            raise ValueError("No current incident context. Run this action from an incident.")
        inner = incident.get("incident") or incident.get("Incident") or incident
        if not isinstance(inner, dict):
            inner = incident
        custom = inner.get("CustomFields") or inner.get("customFields") or {}
        if not isinstance(custom, dict):
            custom = {}
        investigation_id = args.get("id") or inner.get("dbotMirrorId") or custom.get("dbotMirrorId")
        if not investigation_id or str(investigation_id).strip() == "":
            raise ValueError("Investigation ID is required. This incident must be mirrored from Taegis (dbotMirrorId set).")
        investigation_id = str(investigation_id).strip()
        tenant_id = args.get("tenant_id") or inner.get("tenant_id") or custom.get("tenantid") or ""
        if tenant_id:
            tenant_id = str(tenant_id).strip()
        # Prefer form/args over incident so layout button form can drive the update (display fields stay read-only and never dirty)
        assignee_from_args = args.get("assignee_id") or args.get("assignee")
        assignee_raw = assignee_from_args if assignee_from_args and str(assignee_from_args).strip() else (inner.get("taegisxdrassignee") or custom.get("taegisxdrassignee") or inner.get("assignee"))
        assignee = str(assignee_raw).strip() if assignee_raw else None
        status_from_args = args.get("status")
        status_raw = (
            (status_from_args if status_from_args and str(status_from_args).strip() in INVESTIGATION_STATUSES else None)
            or inner.get("taegisxdrcaseclosereason") or custom.get("taegisxdrcaseclosereason")
            or inner.get("taegisxdrcasestatus") or custom.get("taegisxdrcasestatus")
            or inner.get("status")
        )
        status = str(status_raw).strip() if status_raw and str(status_raw).strip() in INVESTIGATION_STATUSES else None
        if not assignee and not status:
            raise ValueError("Enter Assignee and/or Status in the form, or set Taegis XDR Assignee and/or Taegis XDR Case Status on the incident, then run this action.")
        label_to_id = None
        options_raw = inner.get("taegisxdrassigneeoptionsdata") or custom.get("taegisxdrassigneeoptionsdata")
        if options_raw and isinstance(options_raw, str) and options_raw.strip().startswith("taegis_users:"):
            import base64
            import json
            try:
                b = base64.b64decode(options_raw.strip()[len("taegis_users:"):])
                data = json.loads(b.decode("utf-8") if isinstance(b, bytes) else b)
                if isinstance(data, dict) and data.get("label_to_id"):
                    label_to_id = data["label_to_id"]
            except Exception:
                pass
        if not label_to_id and assignee:
            try:
                tenant_users = _fetch_all_tenant_users(client, page_size=100)
                label_to_id = {"@customer": "@customer", "@secureworks": "@secureworks", "@sophos": "@sophos"}
                for u in tenant_users:
                    uid = u.get("id")
                    if uid:
                        label_to_id[_friendly_owner_label(u)] = uid
            except Exception as e:
                demisto.debug(f"taegis-push-assignee-status: Could not build label_to_id: {e}")
        def _resolve_assignee(val):
            if not val:
                return val
            if label_to_id and val in label_to_id:
                return label_to_id[val]
            s = str(val).strip().lower()
            if s == "customer":
                return "@customer"
            if s == "secureworks":
                return "@secureworks"
            if s == "sophos":
                return "@sophos"
            return val
        assignee_id = _resolve_assignee(assignee) if assignee else None
        update_args = {"id": investigation_id}
        if tenant_id:
            update_args["tenant_id"] = tenant_id
        if assignee_id:
            if not _is_valid_assignee_id(assignee_id):
                raise ValueError("assigneeId MUST be '@secureworks', '@customer', 'auth0|...', or a tenant user UUID")
            update_args["assigneeId"] = assignee_id
        if status:
            update_args["status"] = status
        if len(update_args) <= 2 and "assigneeId" not in update_args and "status" not in update_args:
            raise ValueError("No valid assignee or status to push. Set Taegis XDR Assignee and/or Taegis XDR Case Status.")
        update_investigation_command(client, xdr_base_url, update_args)
        parts = []
        if assignee_id:
            parts.append(f"Assignee = {assignee_id}")
        if status:
            parts.append(f"Status = {status}")
        readable = "Request change confirmed. Assignee and status updated in Taegis: " + "; ".join(parts) + ". Refresh the incident to see the update reflected in XSOAR."
        return CommandResults(
            readable_output=readable,
            outputs_prefix="TaegisXDR.PushAssigneeStatus",
            outputs_key_field="id",
            outputs={"id": investigation_id, "assigneeId": assignee_id, "status": status, "message": readable},
        )
    
    
    def update_remote_system_command(client: Client, xdr_base_url: str, args: dict = None, params: dict = None):
        """
        updateRemoteSystem command for XSOAR mirroring
        Updates Taegis investigation based on changes made in XSOAR
        
        This command is automatically called by XSOAR when mirroring is enabled and changes are made in XSOAR.
        Uses UpdateRemoteSystemArgs from CommonServerPython for structured argument parsing.
        
        Returns:
            str: The remote investigation ID
        """
        demisto.debug("updateRemoteSystem command called for mirroring")
        demisto.debug(f"updateRemoteSystem - integration instance: {demisto.integrationInstance()}")
        
        if not args:
            args = {}
        if not params:
            params = {}
        
        # Use UpdateRemoteSystemArgs for structured argument parsing (from CommonServerPython)
        try:
            parsed_args = UpdateRemoteSystemArgs(args)
            investigation_id = parsed_args.remote_incident_id
            incident_data = parsed_args.data
            entries = parsed_args.entries
            incident_changed = parsed_args.incident_changed
            delta = parsed_args.delta
            inc_status = parsed_args.inc_status  # Incident status (2 = Closed in XSOAR)
            demisto.debug(f"updateRemoteSystem: Using UpdateRemoteSystemArgs - remote_incident_id={investigation_id}, incident_changed={incident_changed}, inc_status={inc_status}, delta_keys={list(delta.keys()) if delta else []}")
        except (AttributeError, NameError):
            # Fallback to manual parsing if UpdateRemoteSystemArgs is not available
            investigation_id = args.get("remoteId") or args.get("remote_incident_id")
            incident_data = args.get("data", {})
            entries = args.get("entries", [])
            incident_changed = args.get("incident_changed", True)
            delta = args.get("delta", {})
            inc_status = args.get("inc_status")  # Try to get from args directly
            demisto.debug(f"updateRemoteSystem: Using manual parsing - remoteId={investigation_id}, inc_status={inc_status}")
        
        # Parse incident_data if it's a string (JSON)
        if isinstance(incident_data, str):
            import json
            try:
                incident_data = json.loads(incident_data)
                demisto.debug(f"updateRemoteSystem: parsed JSON data={incident_data}")
            except json.JSONDecodeError as e:
                demisto.debug(f"updateRemoteSystem: Failed to parse JSON data: {str(e)}")
                incident_data = {}
        
        demisto.debug(f"updateRemoteSystem: incident_data type={type(incident_data)}, keys={list(incident_data.keys()) if isinstance(incident_data, dict) else 'not a dict'}")
        demisto.debug(f"updateRemoteSystem: delta={delta}")
        
        # If investigation_id not in args, try to get from incident data
        if not investigation_id:
            if isinstance(incident_data, dict):
                investigation_id = incident_data.get("dbotMirrorId")
        
        if not investigation_id:
            raise ValueError("Investigation ID is required for updateRemoteSystem. Provide 'remoteId' or 'remote_incident_id' in args.")
        
        # Get tenant_id from various possible locations
        tenant_id = args.get("tenant_id", "")
        if not tenant_id and isinstance(incident_data, dict):
            custom_fields = incident_data.get("CustomFields", {})
            if isinstance(custom_fields, dict):
                tenant_id = custom_fields.get("tenantid", "")
            if not tenant_id:
                tenant_id = incident_data.get("tenant_id", "")
        
        # Track what needs to be updated
        update_args = {"id": investigation_id}
        if tenant_id:
            update_args["tenant_id"] = tenant_id
        
        updates_made = []
        
        # Helper to get current severity from a dict (delta or incident_data).
        # We use the built-in severity field for commonality (incoming mapper maps Taegis priority -> severity).
        # Also accept "Severity", "priority" (outgoing mapper), and CustomFields["External Severity"] for backward compatibility.
        def get_severity_from_dict(d: dict):
            if not isinstance(d, dict):
                return None
            v = d.get("severity") or d.get("Severity") or d.get("priority")
            if v is not None and v != "":
                return v
            cf = d.get("CustomFields") or {}
            if isinstance(cf, dict):
                return cf.get("severity") or cf.get("Severity") or cf.get("External Severity")
            return None

        # Helper to get current Key Findings from a dict (delta or incident_data).
        # XSOAR uses custom field taegisxdrkeyfindings (Taegis XDR Key Findings, markdown). Fallback to details/key_findings for backward compat.
        def get_details_from_dict(d: dict):
            if not isinstance(d, dict):
                return None
            v = d.get("taegisxdrkeyfindings") or d.get("details") or d.get("Details") or d.get("keyFindings") or d.get("key_findings")
            if v is not None:
                return v if isinstance(v, str) else str(v)
            cf = d.get("CustomFields") or {}
            if isinstance(cf, dict):
                v = cf.get("taegisxdrkeyfindings") or cf.get("details") or cf.get("Details") or cf.get("key_findings")
                if v is not None:
                    return v if isinstance(v, str) else str(v)
            return None

        # Helper to get alert/detection resolution status from incident (XSOAR field taegisxdrdetectionstatus -> Taegis alertsResolutionStatus).
        def get_alert_resolution_status_from_dict(d: dict):
            if not isinstance(d, dict):
                return None
            v = (
                d.get("taegisxdrdetectionstatus")
                or d.get("alertsResolutionStatus")
                or d.get("alertstatus")
                or d.get("alert_status")
            )
            if v is not None and str(v).strip() != "":
                return str(v).strip()
            cf = d.get("CustomFields") or {}
            if isinstance(cf, dict):
                v = (
                    cf.get("taegisxdrdetectionstatus")
                    or cf.get("alertsResolutionStatus")
                    or cf.get("alertstatus")
                )
                if v is not None and str(v).strip() != "":
                    return str(v).strip()
            return None

        # Helper to get close notes/reason from incident (when XSOAR is source of close - we send to Taegis as closeReason).
        # Accept closenotes, close_notes, closeNotes, close_reason, closeReason (payload may use different keys).
        # Defensive: never raises; returns None on any error so caller can fall back to delta/incident_data/args.
        def get_close_notes_from_dict(d):
            if d is None or not isinstance(d, dict):
                return None
            try:
                v = (
                    d.get("close_notes")
                    or d.get("closeNotes")
                    or d.get("closenotes")
                    or d.get("CloseNotes")
                    or d.get("Close Notes")
                    or d.get("close_reason")
                    or d.get("closeReason")
                )
                if v is not None and str(v).strip() != "":
                    return str(v).strip()
                cf = d.get("CustomFields")
                if cf is not None and isinstance(cf, dict):
                    v = (
                        cf.get("close_notes")
                        or cf.get("closeNotes")
                        or cf.get("closenotes")
                        or cf.get("CloseNotes")
                        or cf.get("Close Notes")
                        or cf.get("close_reason")
                        or cf.get("closeReason")
                    )
                    if v is not None and str(v).strip() != "":
                        return str(v).strip()
            except Exception:
                pass
            return None

        # Helper to get Service Desk ID and Type from incident (XSOAR is source of truth; we push to Taegis so Taegis users see XSOAR values).
        # No custom fields required: we use XSOAR incident id for serviceDeskId and default serviceDeskType to "Cortex XSOAR".
        # Only reads top-level keys (e.g. from delta); caller falls back to incident_data["id"] and "Cortex XSOAR".
        def get_service_desk_from_dict(d: dict):
            if not isinstance(d, dict):
                return None, None
            sid = d.get("serviceDeskId") or d.get("investigationId")
            stype = d.get("serviceDeskType")
            if sid is not None and sid != "":
                sid = str(sid).strip()
            else:
                sid = None
            if stype is not None and stype != "":
                stype = str(stype).strip()
            else:
                stype = None
            return sid, stype

        # Helper to get assignee from incident/delta (outgoing mapper may map taegisxdrassignee -> assignee; Taegis API expects assigneeId).
        def get_assignee_from_dict(d: dict):
            if not isinstance(d, dict):
                return None
            v = d.get("assignee") or d.get("assigneeId")
            if v is not None and str(v).strip() != "":
                return str(v).strip()
            cf = d.get("CustomFields") or {}
            if isinstance(cf, dict):
                v = cf.get("taegisxdrassignee") or cf.get("assignee")
                if v is not None and str(v).strip() != "":
                    return str(v).strip()
            return None

        # Helper to decode taegisxdrassigneeoptionsdata (may be "taegis_users:" + base64 to avoid indicator extraction).
        def _decode_options_data(raw):
            if not raw or not isinstance(raw, str) or not raw.strip():
                return raw
            s = raw.strip()
            if s.startswith("taegis_users:"):
                import base64
                try:
                    b = base64.b64decode(s[len("taegis_users:"):])
                    return b.decode("utf-8") if isinstance(b, bytes) else b
                except Exception:
                    return None
            return raw

        # Helper to get label_to_id from incident (taegisxdrassigneeoptionsdata). Resolves friendly label -> Taegis user id.
        def get_label_to_id_from_incident(d: dict):
            import json
            if not isinstance(d, dict):
                return None
            raw = d.get("taegisxdrassigneeoptionsdata")
            if not raw and isinstance(d.get("CustomFields"), dict):
                raw = d["CustomFields"].get("taegisxdrassigneeoptionsdata")
            if not raw:
                return None
            raw = _decode_options_data(raw)
            if raw is None:
                return None
            try:
                data = json.loads(raw) if not isinstance(raw, dict) else raw
                if isinstance(data, dict) and "label_to_id" in data:
                    return data["label_to_id"]
            except (ValueError, TypeError):
                pass
            return None

        # Helper to get Taegis case status from incident/delta. Uses taegisxdrcaseclosereason (Close panel), then taegisxdrcasestatus, then status.
        # Checks both top-level and CustomFields so close-form data is picked up even when delta does not include the close reason field.
        def get_taegis_status_from_dict(d: dict):
            if not isinstance(d, dict):
                return None
            v = (
                d.get("taegisxdrcaseclosereason")
                or d.get("taegisxdrcasestatus")
                or d.get("status")
            )
            if v is not None and str(v).strip() != "" and v in INVESTIGATION_STATUSES:
                return str(v).strip()
            cf = d.get("CustomFields") or {}
            if isinstance(cf, dict):
                v = (
                    cf.get("taegisxdrcaseclosereason")
                    or cf.get("taegisxdrcasestatus")
                    or cf.get("status")
                )
                if v is not None and str(v).strip() != "" and v in INVESTIGATION_STATUSES:
                    return str(v).strip()
            return None

        # Resolve friendly label -> Taegis assigneeId using incident's case owner options (label_to_id).
        # incident_data may not include CustomFields; demisto.incident() may be None in mirror context; fall back to fetching tenant users.
        label_to_id = get_label_to_id_from_incident(incident_data)
        if not label_to_id:
            try:
                current_inc = demisto.incident()
                if current_inc is not None and isinstance(current_inc, dict):
                    label_to_id = get_label_to_id_from_incident(current_inc)
                    if not label_to_id:
                        inner = current_inc.get("incident") or current_inc.get("Incident")
                        if inner is not None and isinstance(inner, dict):
                            label_to_id = get_label_to_id_from_incident(inner)
            except Exception as e:
                demisto.debug(f"updateRemoteSystem: Could not get label_to_id from demisto.incident(): {e}")
        if not label_to_id:
            try:
                tenant_users = _fetch_all_tenant_users(client, page_size=100)
                label_to_id = {"@customer": "@customer", "@secureworks": "@secureworks", "@sophos": "@sophos"}
                for u in tenant_users:
                    uid = u.get("id")
                    if uid:
                        label_to_id[_friendly_owner_label(u)] = uid
                if len(label_to_id) > 2:
                    demisto.debug(f"updateRemoteSystem: Built label_to_id from tenant users ({len(label_to_id)} entries) for assignee resolution")
            except Exception as e:
                demisto.debug(f"updateRemoteSystem: Could not build label_to_id from tenant users: {e}")
        def resolve_assignee_to_id(label_or_id):
            if not label_or_id:
                return label_or_id
            if label_to_id and label_or_id in label_to_id:
                return label_to_id[label_or_id]
            # Normalize friendly "customer"/"secureworks"/"sophos" (no @) to API form "@customer"/"@secureworks"/"@sophos"
            s = str(label_or_id).strip().lower()
            if s == "customer":
                return "@customer"
            if s == "secureworks":
                return "@secureworks"
            if s == "sophos":
                return "@sophos"
            return label_or_id

        # Helper: fetch current assignee from Taegis so we can avoid overwriting when XSOAR has stale data (e.g. after user changed assignee in Taegis).
        def get_taegis_current_assignee_id():
            out = None
            try:
                inv_args = {"id": investigation_id}
                if tenant_id:
                    inv_args["tenant_id"] = tenant_id
                inv_result = fetch_investigation_command(client, xdr_base_url, inv_args)
                if inv_result and inv_result.outputs and len(inv_result.outputs) > 0:
                    inv = inv_result.outputs[0]
                    out = inv.get("assignee_id") or inv.get("assigneeId") or (inv.get("assignee") or {}).get("id")
                    if out is not None:
                        out = str(out).strip()
            except Exception as e:
                demisto.debug(f"updateRemoteSystem: Could not fetch current investigation for assignee check: {e}")
            return out

        # Use delta if available (from UpdateRemoteSystemArgs) - it contains only changed fields
        # Otherwise, check incident_data for changes
        if delta:
            demisto.debug(f"updateRemoteSystem: Processing delta fields: {list(delta.keys())}")
            # Assignee and status are NOT pushed here; use the "Update assignee & status in Taegis" action (taegis-push-assignee-status) to push from XSOAR to Taegis.
            # Check delta for severity changes (then fall back to incident_data so we always push current severity)
            current_severity = get_severity_from_dict(delta) or get_severity_from_dict(incident_data)
            if current_severity is not None:
                priority = map_priority_to_taegis(current_severity)
                update_args["priority"] = priority
                updates_made.append(f"Priority: {priority} (from severity {current_severity})")
                demisto.debug(f"updateRemoteSystem: Mapped severity {current_severity} to priority {priority}")
            
            # Key Findings: only push when user explicitly changed details in XSOAR (delta contains details/key_findings),
            # unless details_master_xsoar is set (XSOAR is master - always push).
            details_master_xsoar = params.get("details_master_xsoar", False)
            if isinstance(details_master_xsoar, str):
                details_master_xsoar = details_master_xsoar.lower() in ("true", "1", "yes")
            current_details = get_details_from_dict(delta) if delta else None
            if current_details is None and details_master_xsoar:
                current_details = get_details_from_dict(incident_data)
            if current_details is not None:
                update_args["keyFindings"] = current_details
                updates_made.append("Key Findings updated")
                demisto.debug(f"updateRemoteSystem: Pushing Key Findings to Taegis (length={len(str(current_details))})")
        else:
            # Fallback: when delta is not available (e.g. XSOAR called us after getRemoteData with pre-merge incident_data),
            # do not push status to Taegis so we don't overwrite Taegis with stale XSOAR status (e.g. user set ACTIVE in Taegis,
            # getRemoteData returns ACTIVE but incident_data still has AWAITING_ACTION; we must not push AWAITING_ACTION).
            # Status is only pushed when delta is present (explicit user change) or from close-form/inc_is_closed logic below.
            # Check for severity/priority changes (use helper for severity/Severity/priority and CustomFields)
            current_severity = get_severity_from_dict(incident_data)
            demisto.debug(f"updateRemoteSystem: current_severity={current_severity}")
            if current_severity is not None:
                priority = map_priority_to_taegis(current_severity)
                update_args["priority"] = priority
                updates_made.append(f"Priority: {priority} (from severity {current_severity})")
                demisto.debug(f"updateRemoteSystem: Mapped severity {current_severity} to priority {priority}")
            
            # Assignee is NOT pushed here; use the "Update assignee & status in Taegis" action to push from XSOAR to Taegis.
            # When delta is not available: only push Key Findings if details_master_xsoar is set (XSOAR is master).
            # Otherwise skip so we don't overwrite Taegis (bidirectional-friendly).
            details_master_xsoar_fallback = params.get("details_master_xsoar", False)
            if isinstance(details_master_xsoar_fallback, str):
                details_master_xsoar_fallback = details_master_xsoar_fallback.lower() in ("true", "1", "yes")
            if details_master_xsoar_fallback:
                current_details_fb = get_details_from_dict(incident_data)
                if current_details_fb is not None:
                    update_args["keyFindings"] = current_details_fb
                    updates_made.append("Key Findings updated")
                    demisto.debug(f"updateRemoteSystem: Pushing Key Findings to Taegis (details_master_xsoar) (length={len(str(current_details_fb))})")
        
        demisto.debug(f"updateRemoteSystem: incident_changed={incident_changed}")
        
        # When XSOAR incident is closed (inc_status 2), get Taegis close status from delta or incident_data first (XSOAR
        # passes these into updateRemoteSystem with close-form fields). Fall back to demisto.incident() only if needed
        # (demisto.incident() can be None or raise in the integration sandbox, which prevented Taegis from being closed).
        inc_is_closed = inc_status in (2, "2") if inc_status is not None else False
        if not update_args.get("status") or (isinstance(update_args.get("status"), str) and not update_args["status"].startswith("CLOSED_")):
            if inc_is_closed:
                close_reason_status = None
                if delta:
                    close_reason_status = get_taegis_status_from_dict(delta)
                if (not close_reason_status or not str(close_reason_status).startswith("CLOSED_")) and incident_data:
                    close_reason_status = get_taegis_status_from_dict(incident_data)
                if (not close_reason_status or not str(close_reason_status).startswith("CLOSED_")):
                    try:
                        current_incident = demisto.incident()
                        if current_incident is not None and isinstance(current_incident, dict):
                            data = current_incident.get("incident") or current_incident.get("Incident")
                            data = data if isinstance(data, dict) else current_incident
                            close_reason_status = get_taegis_status_from_dict(data) if isinstance(data, dict) else None
                    except Exception as e:
                        demisto.debug(f"updateRemoteSystem: Could not get current incident for close reason: {e}")
                if close_reason_status and str(close_reason_status).strip().startswith("CLOSED_"):
                    update_args["status"] = close_reason_status.strip()
                    updates_made.append(f"Status: {close_reason_status} (from delta/incident_data/current incident)")
                    demisto.debug(f"updateRemoteSystem: Got Taegis close status for closeInvestigation: {close_reason_status}")
        
        # Assignee and status are only pushed via the "Update assignee & status in Taegis" action; update_args["status"] here is only from close form below.
        # When XSOAR incident is open (inc_status 1), payload may still have stale taegisxdrcaseclosereason (CLOSED_*).
        # Do not push closed status when incident is open - push ACTIVE so Taegis reopens and we avoid re-closing.
        status_to_push = update_args.get("status")
        if not inc_is_closed and status_to_push and isinstance(status_to_push, str) and status_to_push.startswith("CLOSED_"):
            update_args["status"] = "ACTIVE"
            status_to_push = "ACTIVE"
            updates_made.append("Status: ACTIVE (incident is open; ignoring stale closed status)")
            demisto.debug("updateRemoteSystem: XSOAR incident is open (inc_status=1); pushing ACTIVE instead of stale CLOSED_*")

        # Push Service Desk fields from XSOAR to Taegis (XSOAR is source of truth; Taegis users see XSOAR values).
        # Computed here (before close/archive) so the values are available when we need to update before archiving.
        # Prefer delta for latest, then incident_data; default serviceDeskType to "Cortex XSOAR" when pushing.
        service_desk_id_delta, service_desk_type_delta = get_service_desk_from_dict(delta) if delta else (None, None)
        service_desk_id_inc, service_desk_type_inc = get_service_desk_from_dict(incident_data) if incident_data else (None, None)
        service_desk_id = service_desk_id_delta if service_desk_id_delta is not None else service_desk_id_inc
        service_desk_type = service_desk_type_delta if service_desk_type_delta is not None else service_desk_type_inc
        if service_desk_type is None or service_desk_type == "":
            service_desk_type = "Cortex XSOAR"
        if (service_desk_id is None or service_desk_id == "") and isinstance(incident_data, dict):
            xsoar_incident_id = incident_data.get("id")
            if xsoar_incident_id is not None and str(xsoar_incident_id).strip() != "":
                service_desk_id = str(xsoar_incident_id).strip()
        if service_desk_id is not None and service_desk_id != "":
            update_args["serviceDeskId"] = service_desk_id
            updates_made.append(f"Service Desk ID: {service_desk_id}")
        if service_desk_type:
            update_args["serviceDeskType"] = service_desk_type
            updates_made.append(f"Service Desk Type: {service_desk_type}")

        # Only close Taegis when XSOAR incident is actually closed (inc_status 2). When user reopens (inc_status 1),
        # payload can still contain taegisxdrcaseclosereason; we must not call closeInvestigation.
        close_out = params.get("close_out", "true")
        taegis_close_requested = (
            inc_is_closed
            and status_to_push is not None
            and isinstance(status_to_push, str)
            and status_to_push.startswith("CLOSED_")
        )
        
        if close_out and close_out != "false" and taegis_close_requested:
            # User set taegisxdrcasestatus to a closed value - close the Taegis investigation via closeInvestigation mutation
            current_status = status_to_push
            if current_status not in ["CLOSED_AUTHORIZED_ACTIVITY", "CLOSED_CONFIRMED_SECURITY_INCIDENT", 
                                                              "CLOSED_FALSE_POSITIVE_ALERT", "CLOSED_INCONCLUSIVE", 
                                                              "CLOSED_INFORMATIONAL", "CLOSED_NOT_VULNERABLE", "CLOSED_THREAT_MITIGATED"]:
                current_status = "CLOSED_INCONCLUSIVE"
            # Resolve close notes: try current incident first (net-new incidents often have close notes only there after close form).
            # XSOAR context can be root.incident.closeNotes or root.incident.CustomFields.closenotes - try both top-level and nested "incident".
            xsoar_close_notes = None
            try:
                current_inc = demisto.incident()
                if current_inc is not None and isinstance(current_inc, dict):
                    xsoar_close_notes = get_close_notes_from_dict(current_inc)
                    if not xsoar_close_notes:
                        inner = current_inc.get("incident") or current_inc.get("Incident")
                        if inner is not None and isinstance(inner, dict):
                            xsoar_close_notes = get_close_notes_from_dict(inner)
            except Exception:
                pass
            if xsoar_close_notes is None and delta:
                xsoar_close_notes = get_close_notes_from_dict(delta)
            if xsoar_close_notes is None and incident_data:
                xsoar_close_notes = get_close_notes_from_dict(incident_data)
            if not xsoar_close_notes and args:
                xsoar_close_notes = (
                    (args.get("closenotes") or args.get("closeNotes") or args.get("close_notes"))
                )
                if xsoar_close_notes is not None and str(xsoar_close_notes).strip() != "":
                    xsoar_close_notes = str(xsoar_close_notes).strip()
                else:
                    xsoar_close_notes = None
            close_reason = xsoar_close_notes if xsoar_close_notes else "Closed from Cortex XSOAR"
            if not xsoar_close_notes:
                demisto.debug("updateRemoteSystem: No close notes found in current incident, delta, incident_data, or args; using default close reason.")
            demisto.debug(f"updateRemoteSystem: close_reason for Taegis (len={len(close_reason)}): {close_reason[:80]}..." if len(close_reason) > 80 else f"updateRemoteSystem: close_reason for Taegis: {close_reason}")
            alerts_resolution = get_alert_resolution_status_from_dict(delta) if delta else None
            if alerts_resolution is None and incident_data:
                alerts_resolution = get_alert_resolution_status_from_dict(incident_data)
            if not alerts_resolution or str(alerts_resolution).strip() == "":
                alerts_resolution = "OTHER"
            else:
                alerts_resolution = str(alerts_resolution).strip()
            try:
                close_args = {
                    "id": investigation_id,
                    "reason": close_reason,
                    "status": current_status,
                    "alertsResolutionStatus": alerts_resolution,
                }
                if tenant_id:
                    close_args["tenant_id"] = tenant_id
                close_investigation_command(client, xdr_base_url, close_args)
                updates_made.append(f"Investigation closed via closeInvestigation (status={current_status})")
                demisto.debug(f"updateRemoteSystem: Taegis case status set to closed - called closeInvestigation with status={current_status}, reason length={len(close_reason)}")
                update_args.pop("status", None)
                update_args.pop("closeReason", None)
                # Apply all pending field updates (priority, serviceDeskId, etc.) before archive.
                # Archived Taegis cases are immutable; updateInvestigationV2 after archive will fail.
                # The investigation is now closed but not yet archived, so updates are still accepted.
                _pre_archive_fields = set(update_args.keys()) - {"id", "tenant_id"}
                if _pre_archive_fields:
                    try:
                        demisto.debug(f"updateRemoteSystem: Applying pending updates before archive: {_pre_archive_fields}")
                        update_investigation_command(client, xdr_base_url, update_args)
                        updates_made.append(f"Investigation updated before archive ({', '.join(sorted(_pre_archive_fields))})")
                        for _k in list(_pre_archive_fields):
                            update_args.pop(_k, None)
                    except Exception as _ue:
                        demisto.debug(f"updateRemoteSystem: Pre-archive update failed (non-fatal): {_ue}")
                # Archive the Taegis case if the user checked "Taegis XDR Archive on Close" on the close form,
                # or if the integration-level default is enabled.
                _archive_val = None
                for _src in [delta, incident_data]:
                    if _src and _archive_val is None:
                        _cf = _src.get("CustomFields") or _src.get("customFields") or {}
                        _v = _cf.get("taegisxdrcasearchiveonclose")
                        if _v is None:
                            _v = _src.get("taegisxdrcasearchiveonclose")
                        if _v is not None:
                            _archive_val = _v
                if _archive_val is None:
                    try:
                        _cur_inc = demisto.incident()
                        if _cur_inc and isinstance(_cur_inc, dict):
                            _cf = _cur_inc.get("CustomFields") or _cur_inc.get("customFields") or {}
                            _archive_val = _cf.get("taegisxdrcasearchiveonclose")
                    except Exception:
                        pass
                # Do NOT fall back to the archive_on_close_default integration parameter here.
                # archive_on_close_default is used only at incident creation (fetch_incidents) to stamp
                # the initial checkbox value. At close time, if the field is absent from all sources
                # (XSOAR silently drops false boolean close-form values), the safe default is to not archive.
                _do_archive = str(_archive_val).lower() in ("true", "1", "yes") if _archive_val is not None else False
                demisto.debug(f"updateRemoteSystem: archive_on_close check: _archive_val={_archive_val!r}, _do_archive={_do_archive}")
                if _do_archive:
                    try:
                        archive_investigation_command(client, xdr_base_url, {"id": investigation_id})
                        updates_made.append("Investigation archived")
                        demisto.debug(f"updateRemoteSystem: Taegis case archived after close (investigation_id={investigation_id})")
                    except Exception as _ae:
                        demisto.debug(f"updateRemoteSystem: Failed to archive Taegis case after close: {_ae}")
            except Exception as e:
                demisto.debug(f"updateRemoteSystem: closeInvestigation failed ({e}), falling back to updateInvestigationV2 for close (status only; closeReason not supported on update)")
                update_args["status"] = current_status
                updates_made.append(f"Status: {current_status} (fallback)")
        
        # Check for new comments (XSOAR -> Taegis)
        # XSOAR passes entries in the args when new comments are added
        # Use comment tags to prevent loops - only sync comments that don't have the "from Taegis" tag
        comment_tag = params.get("comment_tag", "comments")
        comment_tag_from_taegis = params.get("comment_tag_from_taegis", "CommentFromTaegis")
        
        war_room_entries = entries if entries else []
        if war_room_entries:
            for entry in war_room_entries:
                # Only sync user-created notes (not system entries). Accept both Type/type, Contents/contents, Tags/tags (XSOAR may pass lowercase).
                if not isinstance(entry, dict):
                    continue
                entry_type = entry.get("Type") or entry.get("type")
                contents = entry.get("Contents") or entry.get("contents") or ""
                entry_tags = entry.get("Tags") or entry.get("tags") or []
                
                # Skip entries that came from Taegis (to prevent loops)
                if comment_tag_from_taegis in entry_tags:
                    demisto.debug(f"updateRemoteSystem: Skipping entry with tag '{comment_tag_from_taegis}' (from Taegis)")
                    continue
                
                # Type 1 = Note, Type 4 = Error (skip), Type 8 = Entry (skip)
                if entry_type == 1 and contents:
                    # Skip if it's a system-generated entry or already synced
                    contents_str = str(contents)
                    # Skip JSON entries (like close entries) and system messages.
                    # NOTE: loop prevention for Taegis-origin comments is the CommentFromTaegis
                    # tag guard above (and inbound lastUpdate dedup) - do NOT also filter on a
                    # "**" prefix here: that silently drops legitimate user comments that start
                    # with markdown bold (e.g. "**URGENT**") and author-attributed outbound notes.
                    if (contents_str and
                        not contents_str.startswith("{") and  # Skip JSON entries
                        not contents_str.startswith("Incident") and
                        len(contents_str.strip()) >= 1):  # Taegis disallows empty; allows single character
                        try:
                            comment_args = {
                                "id": investigation_id,
                                "comment": contents_str[:5000]  # Limit comment length
                            }
                            if tenant_id:
                                comment_args["tenant_id"] = tenant_id
                            create_comment_command(client, xdr_base_url, comment_args)
                            updates_made.append("Comment added to Taegis")
                        except Exception as e:
                            demisto.debug(f"Could not add comment to Taegis: {str(e)}")
        
        # Reopen + archived-case guard: runs AFTER all update_args fields are accumulated.
        # Fetches the live Taegis case to determine if it is archived or still CLOSED_* - both indicate
        # that the XSOAR user is reopening the incident and the case must transition back to active.
        #
        # Archived cases (allow_reopen_archived=true):
        #   unarchive first, then push ACTIVE + any queued field updates
        # Archived cases (allow_reopen_archived=false, default):
        #   clear all pending updates; getRemoteData will keep re-closing the XSOAR incident
        #   until the admin manually unarchives the case in Taegis XDR
        # Non-archived CLOSED_* cases:
        #   push ACTIVE to complete the reopen
        # All reopen paths (both archived and non-archived):
        #   if the current Taegis assignee is '@secureworks', transfer ownership to '@customer'
        #   so the case is unambiguously back in the customer's hands
        if not inc_is_closed:
            _allow_reopen_archived = params.get("allow_reopen_archived", False)
            if isinstance(_allow_reopen_archived, str):
                _allow_reopen_archived = _allow_reopen_archived.lower() in ("true", "1", "yes")
            try:
                _inv_check_result = fetch_investigation_command(client, xdr_base_url, {"id": investigation_id})
                _inv_check = _inv_check_result.outputs[0] if _inv_check_result and _inv_check_result.outputs else {}
                _inv_archived_at = _inv_check.get("archivedAt") or _inv_check.get("archived_at")
                _is_archived = bool(_inv_archived_at and str(_inv_archived_at).strip() not in ("", "None", "null"))
                _inv_current_status = str(_inv_check.get("status") or "")
                _is_closed_in_taegis = _inv_current_status.startswith("CLOSED_")
                _current_assignee_id = str(_inv_check.get("assigneeId") or _inv_check.get("assignee_id") or "").strip().lower()
            except Exception as _check_err:
                demisto.debug(f"updateRemoteSystem: Could not check archived/status for reopen: {_check_err}")
                _is_archived = False
                _is_closed_in_taegis = False
                _current_assignee_id = ""
            if _is_archived:
                if _allow_reopen_archived:
                    try:
                        unarchive_investigation_command(client, xdr_base_url, {"id": investigation_id})
                        updates_made.append("Investigation unarchived for reopen")
                        demisto.debug("updateRemoteSystem: Investigation unarchived (allow_reopen_archived=true)")
                        update_args["status"] = "ACTIVE"
                        updates_made.append("Status: ACTIVE (reopen after unarchive)")
                        if _current_assignee_id == "@secureworks":
                            update_args["assigneeId"] = "@customer"
                            updates_made.append("Assignee: @customer (transferring from @secureworks on reopen)")
                            demisto.debug("updateRemoteSystem: Assigning @customer on reopen (was @secureworks)")
                    except Exception as _unarchive_err:
                        demisto.debug(f"updateRemoteSystem: Failed to unarchive investigation before reopen: {_unarchive_err}")
                else:
                    # Block ALL updates: pop every field except id/tenant_id from update_args so the
                    # update_investigation_command call is skipped entirely for this sync cycle.
                    _fields_to_clear = [k for k in list(update_args.keys()) if k not in ("id", "tenant_id")]
                    for _k in _fields_to_clear:
                        update_args.pop(_k, None)
                    updates_made.append("All updates blocked: Taegis case is archived (allow_reopen_archived=false)")
                    demisto.debug(
                        "updateRemoteSystem: All updates blocked for archived case; "
                        "'Allow reopen of archived cases' is disabled in integration settings"
                    )
            elif _is_closed_in_taegis:
                # Non-archived case still showing CLOSED_* in Taegis: the XSOAR user reopened the incident.
                # Push ACTIVE to reopen the case; also transfer ownership from @secureworks to @customer
                # so it is unambiguously back in the customer's hands.
                update_args["status"] = "ACTIVE"
                updates_made.append("Status: ACTIVE (reopening closed investigation)")
                demisto.debug(f"updateRemoteSystem: Pushing ACTIVE for reopen (Taegis status was {_inv_current_status!r})")
                if _current_assignee_id == "@secureworks":
                    update_args["assigneeId"] = "@customer"
                    updates_made.append("Assignee: @customer (transferring from @secureworks on reopen)")
                    demisto.debug("updateRemoteSystem: Assigning @customer on reopen (was @secureworks)")

        # Update investigation if there are changes
        # Check if there are any fields to update beyond just 'id' (and optionally 'tenant_id')
        fields_to_update = set(update_args.keys()) - {"id", "tenant_id"}
        demisto.debug(f"updateRemoteSystem: update_args={update_args}, len={len(update_args)}, fields_to_update={fields_to_update}, updates_made={updates_made}")
        
        if fields_to_update:  # There are fields to update beyond id and tenant_id
            demisto.debug(f"updateRemoteSystem: Calling update_investigation_command with args: {update_args}")
            try:
                update_result = update_investigation_command(client, xdr_base_url, update_args)
                if update_result.outputs:
                    updates_made.append("Investigation updated successfully")
                    demisto.debug(f"updateRemoteSystem: Investigation updated successfully. Result: {update_result.outputs}")
                else:
                    demisto.debug(f"updateRemoteSystem: update_investigation_command returned no outputs")
            except Exception as e:
                demisto.error(f"Failed to update investigation: {str(e)}")
                import traceback
                demisto.error(f"Traceback: {traceback.format_exc()}")
                raise
        else:
            demisto.debug(f"updateRemoteSystem: No updates to apply (only id and tenant_id in update_args)")
        
        # Return the investigation ID for XSOAR mirroring
        # XSOAR expects the remote ID to be returned
        return investigation_id
    
    
    def get_mapping_fields_command():
        """
        get-mapping-fields command for XSOAR mirroring
        Returns the list of fields available for mapping from Taegis investigations to XSOAR incidents.
        This command is called when selecting "Select schema" in the mapper configuration.
        
        Returns:
            GetMappingFieldsResponse: Response containing the schema mapping
        """
        demisto.debug("get-mapping-fields command called")
        
        # Define the incident type scheme for Taegis cases
        # These classes are available from CommonServerPython
        incident_type_scheme = SchemeTypeMapping(type_name="Taegis XDR - Case")
        
        # Add all available investigation fields that can be mapped
        # These fields match what we return in get_remote_data_command (status / taegisxdrcasestatus for Taegis case status)
        investigation_fields = [
            "id",
            "status",
            "taegisxdrcasestatus",
            "priority",
            "description",
            "key_findings",
            "tenant_id",
            "shortId",
            "assignee",
            "assignee_id",
            "tags",
            "created_at",
            "created_by",
            "updated_at",
            "url",
            "severity",  # Mapped from priority
            "serviceDeskId",
            "serviceDeskType",
            "closeNotes",  # XSOAR close notes -> Taegis close reason (must be in schema for outgoing mapper to include it)
        ]
        
        for field in investigation_fields:
            incident_type_scheme.add_field(field)
        
        # Create and return the mapping response
        mapping_response = GetMappingFieldsResponse()
        mapping_response.add_scheme_type(incident_type_scheme)
        
        return mapping_response
    
    
