    def _taegis_severity_to_label(severity_num):
        """Map Taegis severity score (0-1) to human-readable label per Taegis glossary."""
        if severity_num is None:
            return "-"
        try:
            s = float(severity_num)
        except (TypeError, ValueError):
            return "-"
        if s < 0.2:
            return "Info"
        if s < 0.4:
            return "Low"
        if s < 0.6:
            return "Medium"
        if s < 0.8:
            return "High"
        return "Critical"
    
    
    def _taegis_threat_score_from_severity(severity_num):
        """Compute Threat Score (0-10) from severity (0-1); return string with one decimal (1.0, 0.1, 7.4) for grid display."""
        if severity_num is None:
            return ""
        try:
            s = float(severity_num)
        except (TypeError, ValueError):
            return ""
        score = round(s * 10, 1)
        return format(score, ".1f")
    
    
    def fetch_investigation_alerts_for_grid(client: Client, xdr_base_url: str, investigation_id: str, page_size: int = 200):
        """
        Fetch investigation alerts and return a grid-friendly list for the Detections section.
        Calls investigationAlerts to get IDs, then alertsServiceRetrieveAlertsById for details.
        """
        query_ids = """
        query investigationAlerts($investigation_id: ID!, $page: Int, $perPage: Int) {
            investigationAlerts(investigation_id: $investigation_id, page: $page, perPage: $perPage) {
                alerts { id }
                totalCount
            }
        }
        """
        result = client.graphql_run(query=query_ids, variables={
            "investigation_id": investigation_id,
            "page": 0,
            "perPage": page_size,
        })
        try:
            alerts_list = result.get("data", {}).get("investigationAlerts", {}).get("alerts") or []
        except (TypeError, AttributeError):
            alerts_list = []
        if not alerts_list:
            return []
        alert_ids = [a.get("id") for a in alerts_list if a.get("id")]
        if not alert_ids:
            return []
        # Retrieve full alert details for table columns. Do not query creator { title severity } - Creator type may not have those fields in this API.
        fields_alerts = """
            status
            reason
            alerts {
                total_results
                list {
                    id
                    status
                    resolution_reason
                    sensor_types
                    metadata {
                        title
                        severity
                        created_at {
                            seconds
                        }
                        engine {
                            name
                        }
                        creator {
                            detector {
                                detector_name
                            }
                        }
                    }
                }
            }
        """
        query_retrieve = """
        query alertsServiceRetrieveAlertsById($ids: [String!]) {
            alertsServiceRetrieveAlertsById(in: { iDs: $ids }) {
                %s
            }
        }
        """ % (fields_alerts)
        result2 = client.graphql_run(query=query_retrieve, variables={"ids": alert_ids})
        try:
            alert_list = result2.get("data", {}).get("alertsServiceRetrieveAlertsById", {}).get("alerts", {}).get("list") or []
        except (TypeError, AttributeError):
            alert_list = []
        grid_rows = []
        for alert in alert_list:
            aid = alert.get("id") or ""
            meta = alert.get("metadata") if isinstance(alert.get("metadata"), dict) else {}
            title = (meta.get("title") or "").strip() if isinstance(meta.get("title"), str) else "-"
            title = title or "-"
            severity_raw = meta.get("severity")
            try:
                severity_num = float(severity_raw) if severity_raw is not None else None
            except (TypeError, ValueError):
                severity_num = None
            severity = _taegis_severity_to_label(severity_num)
            threat_score = _taegis_threat_score_from_severity(severity_num)
            status = (alert.get("status") or "").strip() or "-"
            sensor_types_raw = alert.get("sensor_types")
            if isinstance(sensor_types_raw, list) and sensor_types_raw:
                sensor_type = str(sensor_types_raw[0]) if sensor_types_raw[0] is not None else "-"
            elif isinstance(sensor_types_raw, str) and sensor_types_raw:
                sensor_type = sensor_types_raw.strip() or "-"
            else:
                sensor_type = "-"
            creator = meta.get("creator") if isinstance(meta.get("creator"), dict) else {}
            detector_obj = creator.get("detector") if isinstance(creator.get("detector"), dict) else {}
            detector_name = (detector_obj.get("detector_name") or "").strip() if isinstance(detector_obj.get("detector_name"), str) else None
            if not detector_name:
                engine = meta.get("engine") if isinstance(meta.get("engine"), dict) else {}
                detector_name = (engine.get("name") or "").strip() if isinstance(engine.get("name"), str) else "-"
            detector_name = detector_name or "-"
            created_at_seconds = None
            created_at_obj = meta.get("created_at") if isinstance(meta.get("created_at"), dict) else {}
            if created_at_obj and "seconds" in created_at_obj:
                try:
                    created_at_seconds = int(created_at_obj["seconds"])
                except (TypeError, ValueError):
                    pass
            if created_at_seconds is not None:
                from datetime import datetime, timezone
                created_at_dt = datetime.fromtimestamp(created_at_seconds, tz=timezone.utc)
                created_at = created_at_dt.strftime("%Y-%m-%d %H:%M:%S UTC")
            else:
                created_at = "-"
            url = generate_id_url(xdr_base_url, "alerts", aid) if aid else ""
            grid_rows.append({
                "created_at": created_at,
                "title": title,
                "severity": severity,
                "threat_score": threat_score,
                "detector_name": detector_name,
                "sensor_type": sensor_type,
                "status": status,
                "url": url,
            })
        return grid_rows
    
    
