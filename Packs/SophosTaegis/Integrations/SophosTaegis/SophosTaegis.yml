    def _is_valid_assignee_id(value: str) -> bool:
        """True if value is @secureworks, @customer, @sophos, auth0|..., or a UUID (tenant user id)."""
        if not value or not isinstance(value, str):
            return False
        s = value.strip()
        if s in ("@secureworks", "@customer", "@sophos"):
            return True
        if s.startswith("auth0|"):
            return True
        if len(s) == 36 and s.count("-") == 4:
            parts = s.split("-")
            if len(parts) == 5 and all(len(p) in (8, 4, 4, 4, 12) for p in parts):
                if all(all(c in "0123456789abcdefABCDEF" for c in part) for part in parts):
                    return True
        return False


    def _friendly_owner_label(user: dict) -> str:
        """Build human-friendly label for a user: 'Given Family (email)' or email or id."""
        given = (user.get("given_name") or "").strip()
        family = (user.get("family_name") or "").strip()
        email = (user.get("email") or "").strip()
        name = " ".join([given, family]).strip()
        if name and email:
            return f"{name} ({email})"
        if name:
            return name
        return email or (user.get("id") or user.get("user_id") or "Unknown")
    
    
    def _fetch_all_tenant_users(client: Client, page_size: int = 100) -> list:
        """Fetch active tenant users via tdrUsersSearch (paginated). Returns list of user dicts with id, given_name, family_name, email. Excludes deactivated users."""
        users: list = []
        page = 0
        fields = "id given_name family_name email status"
        while True:
            variables: dict[str, Any] = {
                "filters": {"status": "", "perPage": page_size, "pageOffset": page_size * page},
            }
            query = """
            query ($filters: TDRUsersSearchInput) {
                tdrUsersSearch (filters: $filters) {
                    results { %s }
                }
            }
            """ % (fields)
            result = client.graphql_run(query=query, variables=variables)
            try:
                batch = result["data"]["tdrUsersSearch"]["results"]
            except (KeyError, TypeError):
                break
            if not batch:
                break
            for u in batch:
                if not isinstance(u, dict):
                    continue
                status = (u.get("status") or "").strip().lower()
                if status == "deactivated":
                    continue
                users.append(u)
            if len(batch) < page_size:
                break
            page += 1
        return users
    
    
    def _fetch_tenant_user_by_id(client: Client, user_id: str):
        """Fetch a single tenant user by ID (UUID or auth0|...). Returns dict with id, given_name, family_name, email or None on error."""
        if not user_id or not str(user_id).strip():
            return None
        user_id = str(user_id).strip()
        fields = "id given_name family_name email"
        try:
            query = """
            query ($ids: [String!]) {
                tdrusersByIDs (userIDs: $ids) {
                    %s
                }
            }
            """ % (fields)
            result = client.graphql_run(query=query, variables={"ids": [user_id]})
            raw = (result.get("data") or {}).get("tdrusersByIDs")
            if isinstance(raw, list) and len(raw) > 0 and isinstance(raw[0], dict):
                return raw[0]
            if isinstance(raw, dict) and raw.get("id"):
                return raw
            return None
        except Exception as e:
            demisto.debug(f"_fetch_tenant_user_by_id: Failed to fetch user {user_id}: {e}")
