    def generate_id_url(xdr_base_url: str, endpoint: str, element_id: str):
        element_id = element_id.replace('/', '%2F')
        return f"{xdr_base_url}/{endpoint}/{element_id}"
    
    
    def transform_entities_to_grid(entities_data: list) -> list:
        """
        Transform Taegis entity data to XSOAR grid format.
        Supports: (1) entityContextAssociatedEntities response (list of { type, displayName, identifiers, id });
        (2) legacy alert entities (list of { entities: [...] } or type:value strings).
        """
        import re
        
        if not entities_data:
            return []
        
        # Entity Context Associated Entities format: list of { type, displayName, identities, identifiers, id }
        # identifiers is array of key names e.g. [["ip_address"]]; identities is e.g. ["ip_address:166.199.165.65"]
        if isinstance(entities_data[0], dict) and "type" in entities_data[0]:
            grid_rows = []
            seen_keys = set()
            for entity in entities_data:
                etype = entity.get("type") or ""
                value = entity.get("displayName")
                if value is None or value == "":
                    identities = entity.get("identities")
                    if isinstance(identities, list) and identities:
                        value = identities[0]  # e.g. "ip_address:166.199.165.65"
                    else:
                        value = entity.get("id") or ""
                key = (etype, str(value))
                if key not in seen_keys:
                    seen_keys.add(key)
                    # XSOAR grid column keys are "type" and "value" (lowercase) per incident field definition
                    val_str = str(value)
                    grid_rows.append({
                        "type": etype,
                        "value": val_str,
                        "Type": etype,
                        "Value": val_str,
                        "columnheader1": etype,
                        "columnheader2": val_str,
                    })
            return grid_rows
        
        # Legacy: extract all entities from the nested structure (alerts entities)
        all_entities = []
        for entity_item in entities_data:
            if isinstance(entity_item, dict) and "entities" in entity_item:
                entities_list = entity_item.get("entities", [])
                if isinstance(entities_list, list):
                    all_entities.extend(entities_list)
                elif isinstance(entities_list, str):
                    # Handle string format like "type:value,type:value"
                    # Split by comma and process each entity
                    entity_strings = entities_list.split(',')
                    for entity_str in entity_strings:
                        entity_str = entity_str.strip()
                        if ':' in entity_str:
                            all_entities.append(entity_str)
            elif isinstance(entity_item, str):
                # Direct string format
                if ':' in entity_item:
                    all_entities.append(entity_item)
        
        # Deduplicate entities
        seen = set()
        unique_entities = []
        for entity in all_entities:
            if entity not in seen:
                seen.add(entity)
                unique_entities.append(entity)
        
        # Transform entities using regex: "type:value" -> {"Type": "type", "Value": "value"}
        grid_rows = []
        for entity in unique_entities:
            if isinstance(entity, str):
                # Match pattern: type:value
                match = re.match(r'(\w+):([^,]+)', entity.strip())
                if match:
                    entity_type = match.group(1)
                    entity_value = match.group(2).strip()
                    grid_rows.append({
                        "type": entity_type,
                        "value": entity_value,
                        "Type": entity_type,
                        "Value": entity_value,
                        "columnheader1": entity_type,
                        "columnheader2": entity_value,
                    })
            elif isinstance(entity, dict):
                # Already in dict format, use it directly
                etype = entity.get("type", entity.get("Type", ""))
                evalue = entity.get("value", entity.get("Value", ""))
                grid_rows.append({
                    "type": etype,
                    "value": evalue,
                    "Type": etype,
                    "Value": evalue,
                    "columnheader1": etype,
                    "columnheader2": evalue,
                })
        
        return grid_rows
    
    
    def map_priority_to_taegis(xsoar_severity) -> int:
        """
        Map XSOAR severity to Taegis priority (1-4).
        Accepts string (Low/Medium/High/Critical) or numeric (0=Unknown, 1=Low, 2=Medium, 3=High, 4=Critical).
        """
        if xsoar_severity is None:
            return 3  # Default to High (3)
        if isinstance(xsoar_severity, (int, float)):
            v = int(xsoar_severity)
            if 1 <= v <= 4:
                return v
            return 3  # 0 (Unknown) or out of range -> High (3)
        priority_map = {
            "Low": 1,
            "Medium": 2,
            "High": 3,
            "Critical": 4,
            "low": 1,
            "medium": 2,
            "high": 3,
            "critical": 4,
        }
        return priority_map.get(str(xsoar_severity).strip(), 3)  # Default to High (3)
    
    
    def map_priority_from_taegis(taegis_priority: int) -> str:
        """
        Map Taegis priority to XSOAR severity
        1 -> Low, 2 -> Medium, 3 -> High, 4 -> Critical
        """
        priority_map = {
            1: "Low",
            2: "Medium",
            3: "High",
            4: "Critical",
        }
        return priority_map.get(taegis_priority, "Medium")  # Default to Medium
    
    
    def _format_single_comment_for_note(comment: dict) -> str:
        """Format one Taegis comment as markdown for a War Room note (author, date, body)."""
        if not isinstance(comment, dict):
            return "(no content)"
        author = comment.get("author", {})
        if isinstance(author, dict):
            given_name = author.get("given_name", "")
            family_name = author.get("family_name", "")
            author_name = f"{given_name} {family_name}".strip()
            if not author_name:
                author_name = author.get("email_normalized", "Unknown")
        else:
            author_name = "Unknown"
        comment_text = comment.get("comment", "")
        created_at = comment.get("createdAt", comment.get("created_at", ""))
        if not comment_text:
            comment_text = "(no content)"
        return f"**{author_name}** - {created_at}\n\n{comment_text}"
    
    
    def format_comments_for_mirroring(comments: list) -> str:
        """
        Format Taegis comments as markdown (legacy; used by taegis-fetch-comments readable output).
        Produces a clear markdown structure: section header, then each comment with author and date.
        """
        if not comments:
            return ""
        lines = ["### Taegis XDR Case Comments", ""]
        for comment in comments:
            if not isinstance(comment, dict):
                continue
            lines.append(_format_single_comment_for_note(comment))
            lines.append("")
            lines.append("---")
            lines.append("")
        return "\n".join(lines).strip()
    
    
