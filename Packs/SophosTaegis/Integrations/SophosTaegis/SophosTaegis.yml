  display: Close XSOAR incident when Taegis investigation is closed
  name: close_incident
  defaultvalue: 'true'
  type: 8
  required: false
  additionalinfo: When enabled, closing a Taegis investigation (status starting with CLOSED_) will close the mirrored incident in Cortex XSOAR.
- section: Collect
  advanced: true
  display: Use closeInvestigation when Taegis XDR Case Status is set to closed
  name: close_out
  defaultvalue: 'true'
  type: 8
  required: false
  additionalinfo: When enabled, setting Taegis XDR Case Status (taegisxdrcasestatus) to a closed value (e.g. CLOSED_INCONCLUSIVE) will close the investigation in Taegis via the closeInvestigation mutation (with reason). XSOAR incident status is not used to close Taegis.
- section: Collect
  advanced: true
  display: How many investigations to mirror incoming each time
  name: mirror_limit
  defaultvalue: '100'
  type: 0
  required: false
  additionalinfo: If a greater number of investigations than the limit were modified, then they won't all be mirrored in a single run.
- section: Collect
  advanced: true
  display: Timestamp field to query for updates as part of the mirroring flow
  name: mirror_timestamp_field
  defaultvalue: updated_at
  type: 0
  required: false
  additionalinfo: 'Field used to determine when an investigation was last updated for mirroring. Default is updated_at. The investigationsSearch GraphQL API uses the Investigation type with snake_case (updated_at). Taegis v2 docs may show updatedAt for investigationV2/investigationsV2; use updated_at for investigationsSearch.'
- section: Collect
  advanced: true
  display: XSOAR Taegis XDR Key Findings is master
  name: details_master_xsoar
  defaultvalue: 'false'
  type: 8
  required: false
  additionalinfo: 'When enabled, XSOAR "Taegis XDR Key Findings" (taegisxdrkeyfindings) is always pushed to Taegis Key Findings on every update (XSOAR is master). When disabled (default), Key Findings are only pushed when the user explicitly changes that field in XSOAR, so Taegis edits are not overwritten (bidirectional-friendly).'
- section: Collect
  advanced: true
  display: Assign case to Sophos MDR team after comment
  name: comment_assign_to_sophos_default
  defaultvalue: 'false'
  type: 8
  required: false
  additionalinfo: 'When enabled, the "Assign case to Sophos MDR team" field in the Add Comment form defaults to "Yes". When disabled (default), the field defaults to "No". Users can still override per comment to "Yes" or "No".'
- section: Collect
  advanced: true
  display: Archive Taegis XDR case on close
  name: archive_on_close_default
  defaultvalue: 'false'
  type: 8
  required: false
  additionalinfo: 'When enabled, the "Taegis XDR Archive on Close" checkbox defaults to checked in the Close Incident panel. When disabled (default), the checkbox is unchecked. Archiving removes the case from the active Taegis XDR case list. Users can override this per incident at close time.'
- section: Collect
  advanced: true
  display: Allow reopen of archived Taegis XDR cases
  name: allow_reopen_archived
  defaultvalue: 'false'
  type: 8
  required: false
  additionalinfo: 'When enabled, reopening a closed XSOAR incident will automatically unarchive the associated Taegis XDR case before setting it back to ACTIVE. When disabled (default), archived cases cannot be reopened via XSOAR; the case must be unarchived manually in Taegis XDR first.'
- section: Collect
  advanced: true
  display: Retry on Taegis API rate limit (429)
  name: api_rate_limit_retry_enabled
  defaultvalue: 'true'
  type: 8
  required: false
  additionalinfo: 'When enabled, GraphQL and auth requests that receive HTTP 429 (rate limit) are retried with backoff. Helps when closing many mirrored incidents at once. Uses Retry-After when Taegis returns it.'
- section: Collect
  advanced: true
  display: Max retries on API rate limit
  name: api_rate_limit_max_retries
  defaultvalue: '3'
  type: 0
  required: false
  additionalinfo: 'Retry attempts after a 429 (in addition to the first request). Range 0-10. Each wait uses Retry-After or exponential backoff.'
- section: Collect
  advanced: true
  display: Base delay (seconds) for rate-limit backoff
  name: api_rate_limit_base_delay_seconds
  defaultvalue: '5'
  type: 0
  required: false
  additionalinfo: 'When Retry-After is absent, wait base x 2^attempt seconds before each retry (capped per wait).'
script:
  script: |
    register_module_line('SophosTaegis', 'start', __line__())
    CONSTANT_PACK_VERSION = '5.3.0'
    demisto.debug('pack id = Secureworks, pack version = 5.3.0')
    from typing import Any
    import json
    import time
    import dateparser  # type: ignore
    
    
    def _taegis_rate_limit_params_from_dict(params):
        """Parse integration params for API rate-limit retry behavior."""
        if not isinstance(params, dict):
            return True, 3, 5
        en = params.get("api_rate_limit_retry_enabled", True)
        if isinstance(en, str):
            en = str(en).lower() in ("true", "1", "yes")
        try:
            mr = max(0, min(10, int(params.get("api_rate_limit_max_retries", 3))))
        except (ValueError, TypeError):
            mr = 3
        try:
            bd = max(1, min(60, int(params.get("api_rate_limit_base_delay_seconds", 5))))
        except (ValueError, TypeError):
            bd = 5
        return bool(en), mr, bd
    
    
    def _taegis_status_code_from_exc(exc):
        res = getattr(exc, "res", None)
        if res is not None:
            sc = getattr(res, "status_code", None) or getattr(res, "status", None)
            if sc is not None:
                try:
                    return int(sc)
                except (ValueError, TypeError):
                    pass
        return None
    
    
    def _taegis_is_rate_limit_error(exc):
        if _taegis_status_code_from_exc(exc) == 429:
            return True
        msg = str(exc).lower()
        if " 429" in msg or "429 " in msg or "status code 429" in msg or "status=429" in msg:
            return True
        if "rate limit" in msg or "rate_limit" in msg or "too many requests" in msg:
            return True
        return False
    
    
    def _taegis_rate_limit_sleep_seconds(exc, base_delay, attempt_index):
        """Seconds to wait before retry attempt_index (0 = first retry after first failure)."""
        res = getattr(exc, "res", None)
        if res is not None and hasattr(res, "headers"):
            ra = res.headers.get("Retry-After") or res.headers.get("retry-after")
            if ra:
                try:
                    return max(1, min(120, int(str(ra).strip().split(".")[0])))
                except (ValueError, TypeError):
                    pass
        return max(1, min(60, base_delay * (2**attempt_index)))
    
    
    """ CONSTANTS """
    
    
    AUTH_ENDPOINT = "/auth/api/v2/auth/token"
    GRAPHQL_ENDPOINT = "/graphql"
    
    ALERT_STATUSES = {
        "FALSE_POSITIVE",
        "NOT_ACTIONABLE",
        "OPEN",
        "TRUE_POSITIVE_BENIGN",
        "TRUE_POSITIVE_MALICIOUS",
        "OTHER",
        "SUPPRESSED",
    }
    ASSET_SEARCH_FIELDS = ((
        "endpoint_type",
        "host_id",
        "hostname",
        "investigation_id",
        "ip_address",
        "mac_address",
        "os_family",
        "os_version",
        "sensor_version",
        "username",
    ))
    COMMENT_TYPES = {
        "investigation",
    }
    INVESTIGATION_STATUSES = {
        "OPEN",
        "ACTIVE",
        "AWAITING_ACTION",
        "SUSPENDED",
        "CLOSED_AUTHORIZED_ACTIVITY",
        "CLOSED_CONFIRMED_SECURITY_INCIDENT",
        "CLOSED_FALSE_POSITIVE_ALERT",
        "CLOSED_INCONCLUSIVE",
        "CLOSED_INFORMATIONAL",
        "CLOSED_NOT_VULNERABLE",
        "CLOSED_THREAT_MITIGATED",
    }
    INVESTIGATION_TYPES = {
        "SECURITY_INVESTIGATION",
        "INCIDENT_RESPONSE",
        "THREAT_HUNT",
        "MANAGED_XDR_THREAT_HUNT",
        "CTU_THREAT_HUNT",
        "MANAGED_XDR_ELITE_THREAT_HUNT",
        "SECUREWORKS_INCIDENT_RESPONSE",
    }
    # closeReason is not in UpdateInvestigationV2Input; use closeInvestigation mutation for close + reason
    INVESTIGATION_UPDATE_FIELDS = {
        "keyFindings",
        "priority",
        "status",
        "assigneeId",
        "title",
        "type",
        "serviceDeskId",
        "serviceDeskType",
        "tags",
    }
    SHARELINK_TYPES = {
        "alertId",
        "connectorId",
        "connectionId",
        "endpointDetails",
        "eventId",
        "investigationId",
        "queryId",
        "playbookTemplateId",
        "playbookInstanceId",
        "playbookExecutionId",
    }
    
    DEFAULT_FIRST_FETCH_INTERVAL = "1 day"
    
    # Mirroring direction mapping - matches XSOAR mirroring options
    MIRROR_DIRECTION = {
        "None": None,
        "Incoming": "In",
        "Outgoing": "Out",
        "Incoming And Outgoing": "Both"
    }
    
    
    """ CLIENT """
    
    
    class Client(BaseClient):
        """
        Secureworks Taegis XDR Client class for implementing API logic with Taegis
        """
        _auth_header = {"access_token": "None"}
    
        def __init__(
            self,
            client_id: str,
            client_secret: str,
            base_url: str,
            proxy: bool = False,
            verify: bool = True,
            tenant_id: str = "",
            rate_limit_retry_enabled: bool = True,
            rate_limit_max_retries: int = 3,
            rate_limit_base_delay: int = 5,
        ) -> None:
            super().__init__(base_url=base_url, verify=verify, proxy=proxy)
            self.base_url = base_url
            self._client_id = client_id
            self._client_secret = client_secret
            self.verify = verify
            self.tenant_id = tenant_id
            self._rate_limit_retry_enabled = bool(rate_limit_retry_enabled)
            self._rate_limit_max_retries = max(0, min(10, int(rate_limit_max_retries)))
            self._rate_limit_base_delay = max(1, min(60, int(rate_limit_base_delay)))
    
        def _http_request_with_rate_limit_retry(self, *args, **kwargs):
            """Call _http_request; on HTTP 429 retry with Retry-After or exponential backoff."""
            if not self._rate_limit_retry_enabled or self._rate_limit_max_retries <= 0:
                return self._http_request(*args, **kwargs)
            max_attempts = 1 + self._rate_limit_max_retries
            last_exc = None
            for attempt in range(max_attempts):
                try:
                    return self._http_request(*args, **kwargs)
                except Exception as e:
                    last_exc = e
                    if attempt >= max_attempts - 1:
                        break
                    if not _taegis_is_rate_limit_error(e):
                        raise
                    wait_s = _taegis_rate_limit_sleep_seconds(e, self._rate_limit_base_delay, attempt)
                    demisto.debug(
                        f"SophosTaegis: API rate limit (attempt {attempt + 1}/{max_attempts}), sleeping {wait_s}s before retry"
                    )
                    time.sleep(wait_s)
            raise DemistoException(
                "Taegis XDR API rate limit (HTTP 429) after "
                f"{max_attempts} attempt(s). Wait several minutes or close fewer incidents at once. "
                "Adjust **Retry on Taegis API rate limit**, **Max retries**, or **Base delay** in integration settings "
                f"(Collect, advanced). Original error: {last_exc}"
            )
    
        def auth(self) -> None:
            """Authenticate to the Taegis API using client_id and client_secret
    
            See the documentation for obtaining the client ID and secret: https://docs.ctpx.secureworks.com/apis/api_authenticate/
            """
            response = self._http_request_with_rate_limit_retry(
                "POST",
                AUTH_ENDPOINT,
                headers={"Content-Type": "application/json"},
                json_data={"grant_type": "client_credentials"},
                auth=(self._client_id, self._client_secret),
            )
    
            token = response.get("access_token", None)
            self._auth_header = {
                "Authorization": f"Bearer {token}",
                "x-tenant-context": self.tenant_id,
            }
    
        def graphql_run(self, query: str, variables: dict[str, Any] = None):
            """Perform a GraphQL query
    
            :type query: ``str``
            :param query: The GraphQL query
    
            :type variables: ``Dict[str, Any]``
            :param variables: The variables to utilize with the query
            """
            json_data: dict[str, Any] = {"query": query}
    
            if variables:
                json_data["variables"] = variables
    
            response = self._http_request_with_rate_limit_retry(
                method="POST",
                url_suffix=GRAPHQL_ENDPOINT,
                json_data=json_data,
                headers=self._auth_header,
            )
            return response
    
        def test(self) -> dict[str, Any]:
            """
            Get the current API/asset version for testing auth and connectivity
            """
            response = self._http_request_with_rate_limit_retry(
                method="GET",
                url_suffix="/assets/version",
                headers=self._auth_header,
            )
            return response
    
    
    """ COMMANDS """
    
    
    def add_evidence_to_investigation_command(client: Client, xdr_base_url: str, args=None):
        """
        Add events or alert evidence to an investigation
        """
    
        if not args.get("id"):
            raise ValueError("Cannot add evidence to investigation, id cannot be empty")
        if not args.get("alerts") and not args.get("events") and not args.get("alert_query"):
            raise ValueError("Cannot add evidence to investigation. alerts, events, or alert_query must be defined")
    
        variables: dict = {
            "input": {
                "investigationId": args.get("id"),
                "alerts": argToList(args.get("alerts")),
                "events": argToList(args.get("events")),
                "alertsSearchQuery": args.get("alert_query", ""),
            }
        }
    
        fields: str = args.get("fields") or "investigationId"
    
        query = """
        mutation addEvidenceToInvestigation($input: AddEvidenceToInvestigationInput!) {
          addEvidenceToInvestigation(input: $input) {
            %s
          }
        }
        """ % (fields)
    
        result = client.graphql_run(query=query, variables=variables)
        try:
            investigation = result["data"]["addEvidenceToInvestigation"]
            investigation["url"] = generate_id_url(xdr_base_url, "investigations", investigation["investigationId"])
        except (KeyError, TypeError):
            raise ValueError(f"Failed to create investigation: {result['errors'][0]['message']}")
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.InvestigationEvidenceUpdate",
            outputs_key_field="investigationId",
            outputs=investigation,
            readable_output=tableToMarkdown(
                "Taegis Investigation Evidence",
                investigation,
                removeNull=True,
                url_keys=("url"),
            ),
            raw_response=result,
        )
    
        return results
    
    
    def create_comment_command(client: Client, xdr_base_url: str, args=None):
        if not args.get("comment"):
            raise ValueError("Cannot create comment, comment cannot be empty")
    
        if not args.get("id"):
            raise ValueError("Cannot create comment, id cannot be empty")
    
        fields: str = args.get("fields") or "id"
    
        query = """
        mutation addCommentToInvestigation($input: AddCommentToInvestigationInput!) {
            addCommentToInvestigation(input: $input) {
                %s
            }
        }
        """ % (fields)
    
        variables = {
            "input": {
                "comment": args.get("comment"),
                "investigationId": args.get("id"),
            }
        }
    
        result = client.graphql_run(query=query, variables=variables)
    
        try:
            comment = result["data"]["addCommentToInvestigation"]
        except (KeyError, TypeError):
            raise ValueError(f"Failed to create comment: {result['errors'][0]['message']}")
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.CommentCreate",
            outputs_key_field="id",
            outputs=comment,
            readable_output=tableToMarkdown(
                "Taegis Comment",
                comment,
                removeNull=True,
            ),
            raw_response=result,
        )
    
        return results
    
    
    def create_investigation_command(client: Client, xdr_base_url: str, args=None):
        fields: str = args.get("fields") or "id shortId"
        query = """
        mutation ($input: CreateInvestigationInput!) {
        createInvestigationV2(input: $input) {
                %s
            }
        }
        """ % (fields)
    
        variables = {
            "input": {
                "title": args.get("title"),
                "priority": arg_to_number(args.get("priority", 3)),
                "status": args.get("status", "OPEN"),
                "alerts": argToList(args.get("alerts")),
                "keyFindings": args.get("key_findings", ""),
                "type": args.get("type", "SECURITY_INVESTIGATION"),
                "assigneeId": args.get("assignee_id", "@secureworks"),
                "tags": argToList(args.get("tags")),
            }
        }
    
        if not _is_valid_assignee_id(variables["input"]["assigneeId"]):
            raise ValueError("assigneeId MUST be '@secureworks', '@customer', '@sophos', 'auth0|...', or a tenant user UUID")
        if variables["input"]["priority"] and not 0 < variables["input"]["priority"] < 5:
            raise ValueError("Priority must be between 1-4")
        if variables["input"]["status"] not in INVESTIGATION_STATUSES:
            raise ValueError(
                f"The provided status, {variables['input']['status']}, is not valid for updating an investigation. "
                f"Supported Status Values: {INVESTIGATION_STATUSES}")
        if variables["input"]["type"] not in INVESTIGATION_TYPES:
            raise ValueError(
                f"The provided type, {variables['input']['type']}, is not valid for updating an investigation. "
                f"Supported Type Values: {INVESTIGATION_TYPES}")
        if not variables["input"]["title"]:
            raise ValueError("Title must be defined")
    
        result = client.graphql_run(query=query, variables=variables)
    
        try:
            investigation = result["data"]["createInvestigationV2"]
            investigation["url"] = generate_id_url(xdr_base_url, "investigations", investigation["id"])
        except (KeyError, TypeError):
            raise ValueError(f"Failed to create investigation: {result['errors'][0]['message']}")
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.Investigation",
            outputs_key_field="id",
            outputs=investigation,
            readable_output=tableToMarkdown(
                "Taegis Investigation",
                investigation,
                removeNull=True,
                url_keys=("url"),
            ),
            raw_response=result,
        )
    
        return results
    
    
    def create_sharelink_command(client: Client, xdr_base_url: str, args=None):
        """
        Create a ShareLink to an investigation or alert
        """
    
        if not args.get("id"):
            raise ValueError("Cannot create ShareLink, id cannot be empty")
        if not args.get("type"):
            raise ValueError("Cannot create ShareLink, type cannot be empty")
        if args["type"] not in SHARELINK_TYPES:
            raise ValueError(
                f"The provided ShareLink type, {args['type']}, is not valid for creating a ShareLink. "
                f"Supported Type Values: {SHARELINK_TYPES}")
    
        variables: dict = {
            "sharelink": {
                "linkRef": args["id"],
                "linkType": args["type"],
            }
        }
    
        if args.get("tenant_id"):
            variables["tenant_id"] = args["tenant_id"]
    
        fields: str = args.get("fields") or "id createdTime"
    
        query = """
        mutation ($sharelink: ShareLinkCreateInput!) {
            createShareLink (input: $sharelink) {
                %s
            }
        }
        """ % (fields)
    
        result = client.graphql_run(query=query, variables=variables)
        try:
            link_result = result["data"]["createShareLink"]
        except (KeyError, TypeError):
            raise ValueError(f"Failed to create ShareLink: {result['errors'][0]['message']}")
    
        link_result.update({"url": generate_id_url(xdr_base_url, "share", link_result["id"])})
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.ShareLink",
            outputs_key_field="id",
            outputs=link_result,
            readable_output=tableToMarkdown(
                "Taegis ShareLink",
                link_result,
                url_keys=("url"),
            ),
            raw_response=result,
        )
    
        return results
    
    
    def execute_playbook_command(client: Client, xdr_base_url: str, args=None):
        playbook_id = args.get("id")
        if not playbook_id:
            raise ValueError("Cannot execute playbook, missing playbook_id")
    
        fields: str = args.get("fields") or "id"
        query = """
        mutation executePlaybookInstance(
            $playbookInstanceId: ID!
            $parameters: JSONObject
        ) {
            executePlaybookInstance(
                playbookInstanceId: $playbookInstanceId
                parameters: $parameters
            ) {
                %s
            }
        }
        """ % (fields)
    
        playbook_inputs = args.get("inputs", {})
    
        variables = {
            "playbookInstanceId": playbook_id,
            "parameters": playbook_inputs,
        }
    
        result = client.graphql_run(query=query, variables=variables)
    
        if not result.get("data"):
            raise ValueError(f"Failed to execute playbook: {result['errors'][0]['message']}")
    
        execution = result["data"]["executePlaybookInstance"]
        execution["url"] = generate_id_url(xdr_base_url, "automations/playbook-executions", execution["id"])
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.Execution",
            outputs_key_field="id",
            outputs=execution,
            readable_output=tableToMarkdown(
                "Taegis Playbook Execution",
                execution,
                removeNull=True,
                url_keys=("url"),
            ),
            raw_response=result,
        )
    
        return results
    
    
    def fetch_alerts_command(client: Client, xdr_base_url: str, args=None):
        """
        Fetch a specific alert or a list of alerts based on a CQL Taegis query
        """
        variables: dict = {
            "cql_query": args.get("cql_query", "from alert severity >= 0.4 and status='OPEN'"),
            "limit": arg_to_number(args.get("limit", 10)),
            "offset": arg_to_number(args.get("offset", 0)),
            "ids": args.get("ids", []),  # ["alert://id1", "alert://id2"]
        }
        fields: str = args.get("fields") or """
            status
            reason
            alerts {
                total_results
                list {
                    id
                    tenant_id
                    status
                    suppressed
                    suppression_rules {
                      id
                      version
                    }
                    resolution_reason
                    attack_technique_ids
                    entities{
                      entities
                      relationships{
                        from_entity
                        relationship
                        to_entity
                      }
                    }
                    metadata {
                      engine {
                        name
                      }
                      creator {
                        detector {
                          version
                          detector_id
                        }
                        rule {
                          rule_id
                          version
                        }
                      }
                      title
                      description
                      confidence
                      severity
                      created_at {
                        seconds
                      }
                    }
                    investigation_ids {
                      id
                    }
                    event_ids {
                      id
                      event_data
                    }
                    sensor_types
                }
            }
        """
    
        if args.get("ids"):
            field = "alertsServiceRetrieveAlertsById"
            query = """
            query alertsServiceRetrieveAlertsById($ids: [String!]) {
                alertsServiceRetrieveAlertsById(
                    in: {
                        iDs: $ids
                    }
                ) {
                    %s
                }
            }
            """ % (fields)
    
            variables["ids"] = argToList(variables["ids"])
        else:
            field = "alertsServiceSearch"
            query = """
            query alertsServiceSearch($cql_query: String, $limit: Int, $offset: Int) {
                alertsServiceSearch(
                    in: {
                        cql_query:$cql_query,
                        offset:$offset,
                        limit:$limit
                    }
                ) {
                    %s
                }
            }
            """ % (fields)
    
        result = client.graphql_run(query=query, variables=variables)
        alerts = result["data"][field]["alerts"]["list"]
    
        for alert in alerts:
            alert.update({"url": generate_id_url(xdr_base_url, "alerts", alert["id"])})
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.Alerts",
            outputs_key_field="id",
            outputs=alerts,
            readable_output=tableToMarkdown(
                "Taegis Alerts",
                alerts,
                removeNull=True,
                url_keys=("url"),
            ),
            raw_response=result,
        )
    
        return results
    
    
    def fetch_assets_command(client: Client, xdr_base_url: str, args=None):
        page = arg_to_number(args.get("page")) or 0
        page_size = arg_to_number(args.get("page_size")) or 10
    
        variables: dict[str, Any] = {
            "input": {},
            "pagination_input": {
                "limit": page_size,
                "offset": page_size * page,
            }
        }
    
        # Loop over allowed search fields and add valid search options to the query variables
        for field in ASSET_SEARCH_FIELDS:
            if args.get(field):
                variables["input"][field] = args.get(field).strip()
    
        fields: str = args.get("fields") or """
            id
            ingestTime
            createdAt
            updatedAt
            deletedAt
            biosSerial
            firstDiskSerial
            systemVolumeSerial
            sensorVersion
            endpointPlatform
            architecture
            osFamily
            osVersion
            osDistributor
            osRelease
            systemType
            osCodename
            kernelRelease
            kernelVersion
            hostnames {
                id
                hostname
            },
            tags {
                key
                tag
            }
            endpointType
            hostId
            sensorId
            """
        query = """
        query searchAssetsV2($input: SearchAssetsInput!, $pagination_input: SearchAssetsPaginationInput!) {
             searchAssetsV2(input: $input, paginationInput:$pagination_input) {
