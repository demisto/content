            if investigation.get("createdBySubject") and "created_by" not in investigation:
                cbs = investigation.get("createdBySubject", {})
                investigation["created_by"] = cbs.get("displayName") or cbs.get("name") or investigation.get("createdById", "")
            investigation.update({"url": generate_id_url(xdr_base_url, "investigations", investigation.get("id", ""))})
    
        results = CommandResults(
            outputs_prefix="TaegisXDR.Investigations",
            outputs_key_field="id",
            outputs=investigations,
            readable_output=tableToMarkdown(
                "Taegis Investigations",
                investigations,
                removeNull=True,
                url_keys=("url"),
            ),
            raw_response=result,
        )
    
        return results
    
    
