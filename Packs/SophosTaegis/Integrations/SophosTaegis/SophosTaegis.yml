detaileddescription: "### Partner Contributed Integration\n#### Integration Author: Sophos\nSupport and maintenance for this integration are provided by the author. Please use the following contact details:\n- **Email**: [support@secureworks.com](mailto:support@secureworks.com)\n- **URL**: [https://www.sophos.com/en-us/products/taegis](https://www.sophos.com/en-us/products/taegis)\n***\n## Configure the integration\n\nA client ID and client secret will need to be generated to utilize this integration. \n\nSee the [Taegis XDR Documentation](https://docs.ctpx.secureworks.com/apis/api_authenticate/) for more information on gathering these credentials and region URLs.\n\n---\n[View Integration Documentation](https://xsoar.pan.dev/docs/reference/integrations/taegis-xd-rv2)"
