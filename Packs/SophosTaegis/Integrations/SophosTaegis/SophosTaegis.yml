    def fetch_incidents(
        client: Client,
        xdr_base_url: str,
        fetch_type: str = "investigations",
        max_fetch: int = 15,
        include_assets: bool = True,
        first_fetch_interval: str = DEFAULT_FIRST_FETCH_INTERVAL,
        params: dict = None,
    ):
        """
        Fetch Taegis Investigations or Alerts for the use with "Fetch Incidents"
        """
        if not 0 < int(max_fetch) < 201:
            raise ValueError("Max Fetch must be between 1 and 200")
    
        if fetch_type not in ["alerts", "investigations"]:
            raise ValueError("Incident Type is invalid. Supported types: ['alerts', 'investigations']")
    
        last_run = demisto.getLastRun()
        demisto.debug(f"Last Fetch Incident Run: {last_run}")
        now = datetime.now()
        start_time = str(dateparser.parse(first_fetch_interval))  # type: ignore  # Default start if first ever run
        known_mirror_ids_list = []
        if last_run:
            if isinstance(last_run, dict) and "start_time" in last_run:
                start_time = last_run.get("start_time")
                known_mirror_ids_list = list(last_run.get("known_mirror_ids") or [])
            elif isinstance(last_run, str):
                start_time = last_run
        known_mirror_ids = set(known_mirror_ids_list)
        # For investigations: normalize start_time to ISO for updated_at query (so reassigned cases are re-fetched)
        start_time_iso = None
        if fetch_type == "investigations":
            try:
                _parsed = dateparser.parse(str(start_time), settings={"TIMEZONE": "UTC"})  # type: ignore
                start_time_iso = _parsed.strftime("%Y-%m-%dT%H:%M:%SZ") if _parsed else start_time
            except Exception:
                start_time_iso = start_time
    
        if fetch_type == "alerts":
            query = """
              query alertsServiceSearch($cql_query: String, $limit: Int) {
                alertsServiceSearch(
                  in: {
                    cql_query:$cql_query,
                    limit:$limit
                  }
                ) {
                      status
                  reason
                  alerts {
                    list {
                      id
                      status
                      tenant_id
                      suppressed
                      resolution_reason
                      attack_technique_ids
                      entities{
                        entities
                        relationships{
                          from_entity
                          relationship
                          to_entity
                        }
                      }
                      metadata {
                        engine {
                          name
                        }
                        creator {
                          detector {
                            version
                            detector_id
                            detector_name
                          }
                          rule {
                            rule_id
                            version
                          }
                        }
                        title
                        description
                        confidence
                        severity
                        created_at {
                          seconds
                        }
                        began_at {
                          seconds
                        }
                        ended_at {
                          seconds
                        }
                      }
                      event_ids {
                          id
                          event_data
                      }
                      investigation_ids {
                        id
                      }
                      sensor_types
                    }
                    total_results
                  }
                }
              }
            """
    
            variables = {
                "limit": arg_to_number(max_fetch),
                # We only support Medium, High, Critical
                "cql_query": f"from alert where severity >=0.4 AND earliest = '{start_time}'",
            }
        elif fetch_type == "investigations":
            asset_query = ""
            if include_assets:
                demisto.debug("include_assets=True, fetching assets with investigation")
                # Assets to be deprecated in the future
                asset_query = "assets {id hostnames {id hostname} tags {tag}} assetsEvidence {id assetId}"
    
            query = """
            query investigationsSearch(
                $page: Int,
                $perPage: Int,
                $orderByField: OrderFieldInput,
                $orderDirection: OrderDirectionInput,
                $query: String
            ) {
              investigationsSearch(
                page: $page,
                perPage: $perPage,
                orderByField: $orderByField,
                orderDirection: $orderDirection,
                query: $query
              ) {
                totalCount
                investigations {
                    id
                    shortId
                    tenant_id
                    description
                    key_findings
                    assignee {
                        id
                        name
                        email
                        family_name
                        given_name
                        user_id
                        email_normalized
                        email_verified
                        status
                        roles
                        tenants { id name }
                    }
                    assignee_user {
                        id
                        family_name
                        given_name
                        email
                    }
                    assignee_id
                    alerts2 {
                        id
                        suppressed
                        status
                        priority {
                            value
                        }
                        entities {
                            entities
                        }
                        metadata {
                            title
                            description
                            created_at {
                                seconds
                            }
                            severity
                            confidence
                        }
                    }
                    alerts { id }
                    genesis_alerts { id }
                    genesis_alerts2 { id }
                    created_by
                    created_by_scwx
                    created_by_partner
                    created_by_user { id }
                    contributors
                    contributed_users { id }
                    service_desk_id
                    service_desk_type
                    latest_activity
                    priority
                    status
                    type
                    investigationType
                    created_at
                    updated_at
                    archived_at
                    first_notified_at
                    first_notified_at_scwx
                    notified_at
                    deleted_at
                    rn
                    tags
                    auth_credentials
                    search_queries { id }
                    transition_state {
                        handed_off
                        acknowledge_time
                        resolved_at_least_once
                        handoff_time
                        initial_handoff_time
                        resolution_time
                        initial_resolution_time
                        acknowledged
                        initial_acknowledge_time
                        acknowledged_at_least_once
                        resolved
                        handed_off_at_least_once
                    }
                    events_count
                    genesis_events_count
                    genesis_alerts_count
                    alerts_count
                    assets_count
                    files_count
                    genesis_events { id }
                    events { id }
                    activity_logs {
                        id
                        target
                        comment
                        tenant_id
                        investigation_id
                        description
                        user_id
                        created_at
                        type
                        updated_at
                    }
                    processing_status {
                        events
                        alerts
                        assets
                    }
                    access_vectors {
                        id
                        name
                        investigation_id
                        created_at
                        updated_at
                        mitre_info {
                            data_sources
                            tactics
                            technique
                            description
                            platform
                            technique_id
                            system_requirements
                            defence_bypassed
                            contributors
                            url
                            version
                            type
                        }
                    }
                    comments_count {
                        parent_id
                        unread
                        parent_type
                        total
                    }
                    alertsEvidence { id alertId }
                    %s
                }
              }
            }
            """ % (asset_query)
    
            # Build CQL query: WHERE-style (matches Taegis investigationsSearch). Include tenant_id when configured, exclude deleted.
            tenant_id_fetch = (params or {}).get("tenant_id", "") or ""
            query_parts = []
            if tenant_id_fetch:
                query_parts.append(f"tenant_id = '{tenant_id_fetch}'")
            query_parts.append("deleted_at is null")
            query_parts.append("status in ('Open', 'Active', 'Awaiting Action')")
            query_parts.append(f"updated_at >= '{start_time_iso or start_time}'")
            investigations_query = "WHERE " + " AND ".join(query_parts)
            variables = {
                "orderByField": "updated_at",
                "orderDirection": "asc",
                "page": 0,
                "perPage": arg_to_number(max_fetch),
                "query": investigations_query
            }
        else:
            query = ""
            variables = {}
            demisto.debug(f"No condition was met -> {query=} {variables=}")
    
        result = client.graphql_run(query=query, variables=variables)
        if result.get("errors") and result["errors"]:
            raise DemistoException(f"Error when fetching incidents: {result['errors'][0]['message']}")
    
        try:
            results = result["data"]["investigationsSearch"]["investigations"] \
                if fetch_type == "investigations" \
                else result["data"]["alertsServiceSearch"]["alerts"]["list"]
        except (TypeError, KeyError):
            results = []
    
        incidents = []
        max_updated_at_iso = None  # For investigations: track max updated_at in batch (including skipped) for last_run
        created_mirror_ids_this_run = []  # For investigations: ids we create incidents for this run (avoid duplicates next run)
        for incident in results:
            # For investigations: track updated_at for last_run (so reassigned cases are re-fetched next run)
            if fetch_type == "investigations":
                _ut = incident.get("updated_at")
                if _ut:
                    _ut_str = str(_ut).strip()
                    if _ut_str and (max_updated_at_iso is None or _ut_str > max_updated_at_iso):
                        max_updated_at_iso = _ut_str
            # createdAfter really means createdAtOrAfter so skip the duplicate (alerts / legacy)
            created_date = incident["created_at"] if fetch_type == "investigations" else \
                datetime.fromtimestamp(int(incident["metadata"]["created_at"]["seconds"])).strftime("%Y-%m-%d %H:%M:%S.%f")
            if start_time == created_date:
                continue
    
            # Skip archived, if necessary
            if fetch_type == "investigations" and incident["archived_at"]:
                demisto.debug(f"Skipping Archived Investigation: {incident['description']} ({incident['id']})")
                continue
    
            # Exclusion list by assignee email or name (only investigations): skip when assignee matches list
            if fetch_type == "investigations":
                exclude_param = (params or {}).get("fetch_investigations_exclude_assignee_emails") or ""
                exclude_param = str(exclude_param).strip()
                if exclude_param:
                    exclusion_list = {e.strip().lower() for e in exclude_param.split(",") if e.strip()}
                    assignee_user = incident.get("assignee_user") or {}
                    assignee = incident.get("assignee") or {}
                    assignee_subject = incident.get("assignee_subject") or incident.get("assigneeSubject") or {}
                    assignee_id_raw = (incident.get("assignee_id") or assignee.get("id") or assignee_user.get("id") or "")
                    assignee_id_str = str(assignee_id_raw).strip() if assignee_id_raw else ""
                    assignee_email = (assignee_user.get("email") or assignee.get("email") or "")
                    assignee_email = str(assignee_email).strip().lower() if assignee_email else ""
                    assignee_name = (assignee.get("name") or "").strip() or ""
                    subject_name = (assignee_subject.get("name") or assignee_subject.get("displayName") or assignee_subject.get("display_name") or "").strip()
                    given = (assignee_user.get("given_name") or "").strip()
                    family = (assignee_user.get("family_name") or "").strip()
                    full_name = " ".join([given, family]).strip() if (given or family) else assignee_name
                    # Build set of assignee identifiers to match (email, names, assignee_id)
                    assignee_identifiers = set()
                    if assignee_email:
                        assignee_identifiers.add(assignee_email)
                    if assignee_name:
                        assignee_identifiers.add(assignee_name.lower())
                    if subject_name:
                        assignee_identifiers.add(subject_name.lower())
                    if given:
                        assignee_identifiers.add(given.lower())
                    if family:
                        assignee_identifiers.add(family.lower())
                    if full_name:
                        assignee_identifiers.add(full_name.lower())
                    if assignee_id_str:
                        assignee_identifiers.add(assignee_id_str.lower())
                    if assignee_identifiers & exclusion_list:
                        demisto.debug(f"Skipping Investigation (assignee in exclusion list): [{incident['id']}] assignee_id={assignee_id_str or 'N/A'} assignee_email={assignee_email or 'N/A'} assignee_name={assignee_name or subject_name or full_name or 'N/A'}")
                        continue
                    demisto.debug(f"Exclusion list active; investigation [{incident['id']}] assignee_id={assignee_id_str or 'N/A'} assignee_email={assignee_email or 'N/A'} assignee_name={assignee_name or subject_name or full_name or 'N/A'} (not in list, will create incident)")
    
            # For investigations: skip if we already created an XSOAR incident for this id (avoid duplicate on each fetch)
            if fetch_type == "investigations" and incident.get("id") in known_mirror_ids:
                demisto.debug(f"Skipping Investigation (already have XSOAR incident): [{incident['id']}]")
                continue
    
            incident_name: str = incident['description'] if fetch_type == "investigations" else incident['metadata']['title']
            demisto.debug(f"Found New Incident: [{incident['id']}] {incident_name}")
    
            # Use sharelink URL as Incident Link for investigations (friendly to external users); fallback to Taegis url field
            incident_url = generate_id_url(xdr_base_url, fetch_type, incident["id"])
            if fetch_type == "investigations":
                try:
                    sharelink_args = {"id": incident["id"], "type": "investigationId"}
                    sharelink_result = create_sharelink_command(client, xdr_base_url, sharelink_args)
                    if sharelink_result.outputs and sharelink_result.outputs.get("url"):
                        incident_url = sharelink_result.outputs.get("url", incident_url)
                        demisto.debug(f"fetch_incidents: Using sharelink for investigation {incident['id']}")
                except Exception as e:
                    demisto.debug(f"fetch_incidents: Could not create sharelink for {incident['id']}, using default url: {e}")
            incident.update({"url": incident_url})
            
            # Get mirroring once if enabled (used for both rawJSON and incident_data)
            mirroring = None
            if params and params.get("mirror_direction", "None") not in ("", "None"):
                mirroring = get_mirroring()
                if mirroring.get("mirror_direction") is None:
                    mirroring = None
            
            # Build payload for rawJSON: include mirror fields and taegisxdr_type for classifier (no regex on url).
            # XSOAR passes parsed rawJSON to the mapper, not the root incident dict, so mirror_* must be inside rawJSON.
            raw_payload = dict(incident)
            # Remove API "entities" so it doesn't map to labels.entities; we use taegisxdrcaseentities only.
            raw_payload.pop("entities", None)
            # Remove assignee_user so it doesn't become incident.labels.assignee_user (email/domain would be parsed into Indicators).
            raw_payload.pop("assignee_user", None)
            entities_grid_fetch = []
            alerts_grid_fetch = []
            if fetch_type == "investigations":
                raw_payload["taegisxdr_type"] = "case"
                # Include Taegis entities for new incidents (Entity Context Associated Entities)
                try:
                    entities_data = fetch_entity_context_associated_entities(client, incident["id"], page_size=100)
                    if entities_data:
                        entities_grid_fetch = transform_entities_to_grid(entities_data)
                        raw_payload["taegisxdrcaseentities"] = entities_grid_fetch
                except Exception as e:
                    demisto.debug(f"fetch_incidents: Could not fetch entities for investigation {incident.get('id')}: {e}")
                # Include investigation alerts (detections) for new incidents
                try:
                    alerts_grid_fetch = fetch_investigation_alerts_for_grid(client, xdr_base_url, incident["id"], page_size=200)
                    if alerts_grid_fetch:
                        raw_payload["taegisxdrcasedetections"] = alerts_grid_fetch
                except Exception as e:
                    demisto.debug(f"fetch_incidents: Could not fetch alerts for investigation {incident.get('id')}: {e}")
            if mirroring:
                raw_payload["mirror_instance"] = mirroring["mirror_instance"]
                raw_payload["mirror_direction"] = mirroring["mirror_direction"]
                raw_payload["mirror_tags"] = mirroring.get("mirror_tags", [])
            
            # Build incident data
            incident_data = {
                "name": incident_name,
                "occured": created_date,
                "dbotMirrorId": incident["id"],
                "rawJSON": json.dumps(raw_payload),
            }
            # Set taegisxdrcaseentities on the incident so the grid is populated at creation (mapper may run later)
            if entities_grid_fetch:
                incident_data["taegisxdrcaseentities"] = entities_grid_fetch
            # Set taegisxdrcasedetections on the incident at creation
            if alerts_grid_fetch:
                incident_data["taegisxdrcasedetections"] = alerts_grid_fetch
            if mirroring:
                incident_data.update(mirroring)
                incident_data["dbotMirrorDirection"] = mirroring["mirror_direction"]
                incident_data["dbotMirrorInstance"] = mirroring["mirror_instance"]
                incident_data["dbotMirrorTags"] = mirroring.get("mirror_tags", [])
                demisto.debug(f"Setting mirroring for incident {incident['id']}: direction={mirroring.get('mirror_direction')}, instance={mirroring.get('mirror_instance')}, tags={mirroring.get('mirror_tags')}")
            if fetch_type == "investigations":
                assignee = incident.get("assignee") or {}
                assignee_id = incident.get("assignee_id") or incident.get("assigneeId") or (assignee.get("id") if isinstance(assignee, dict) else None)
                incident_data["taegisxdrassignee"] = assignee_id or ""
                # Stamp archive-on-close from the integration parameter so the close-form checkbox
                # reflects the administrator's default. Survives pack upgrades because integration
                # instance configuration is preserved by XSOAR across upgrades (unlike field defaultValue).
                # Use CustomFields dict (not top-level key) so XSOAR reliably stores both True and False -
                # XSOAR silently drops top-level falsy boolean values at incident creation.
                _archive_default = (params or {}).get("archive_on_close_default", False)
                _archive_bool = str(_archive_default).lower() in ("true", "1", "yes")
                incident_data.setdefault("CustomFields", {})["taegisxdrcasearchiveonclose"] = _archive_bool
            incidents.append(incident_data)
            if fetch_type == "investigations" and incident.get("id"):
                created_mirror_ids_this_run.append(incident["id"])
    
        if fetch_type == "investigations" and len(incidents) > 0:
            try:
                tenant_users = _fetch_all_tenant_users(client, page_size=100)
                options = ["@customer", "@secureworks", "@sophos"]
                label_to_id = {"@customer": "@customer", "@secureworks": "@secureworks", "@sophos": "@sophos"}
                for u in tenant_users:
                    uid = u.get("id")
                    if not uid:
                        continue
                    label = _friendly_owner_label(u)
                    options.append(label)
                    label_to_id[label] = uid
                for k, v in list(label_to_id.items()):
                    if " (" in str(k):
                        name_only = str(k).split(" (")[0].strip()
                        if name_only and name_only not in label_to_id:
                            label_to_id[name_only] = v
                id_to_label = {v: k for k, v in label_to_id.items()}
                options_data = json.dumps({"options": options, "label_to_id": label_to_id})
                import base64
                options_data_encoded = "taegis_users:" + base64.b64encode(options_data.encode("utf-8")).decode("ascii")
                for inc in incidents:
                    inc["taegisxdrassigneeoptionsdata"] = options_data_encoded
                    inc.setdefault("CustomFields", {})["taegisxdrassigneeoptionsdata"] = options_data_encoded
                    current_id = inc.get("taegisxdrassignee") or ""
                    friendly = id_to_label.get(current_id, current_id) if current_id else ""
                    if friendly == current_id and current_id:
                        try:
                            raw = json.loads(inc.get("rawJSON") or "{}")
                            assignee = raw.get("assignee") or {}
                            if isinstance(assignee, dict):
                                name = (assignee.get("name") or "").strip()
                                if name:
                                    friendly = name
                                # Do not use assignee.email here: storing an email in taegisxdrassignee/rawJSON would be parsed into Indicators.
                        except (ValueError, TypeError):
                            pass
                    # Store name-only for display: strip " (email)" so the field/rawJSON never contains email (avoids indicator extraction).
                    display_friendly = friendly
                    if friendly and " (" in str(friendly):
                        display_friendly = str(friendly).split(" (")[0].strip() or friendly
                    inc["taegisxdrassignee"] = display_friendly if current_id else ""
                    if display_friendly and current_id:
                        try:
                            raw = json.loads(inc.get("rawJSON") or "{}")
                            if isinstance(raw, dict):
                                raw["taegisxdrassignee"] = display_friendly
                                inc["rawJSON"] = json.dumps(raw)
                        except (ValueError, TypeError):
                            pass
                    # Stored as taegis_users:<base64> so Context Data is not parsed into Indicators (emails/domains).
                demisto.debug(f"fetch_incidents: Attached assignee options ({len(options)} options) to {len(incidents)} new incident(s)")
            except Exception as e:
                demisto.debug(f"fetch_incidents: Could not fetch tenant users for assignee options: {e}")
    
        demisto.debug(f"Located {len(incidents)} Incidents")
    
        if fetch_type == "investigations":
            # Use max updated_at from batch (including skipped) so reassigned cases are re-fetched next run
            if results:
                last_run_value = max_updated_at_iso or start_time_iso or str(start_time)
            else:
                last_run_value = start_time
            # Persist investigation ids we've created incidents for (avoid duplicate incident per fetch)
            known_mirror_ids_list = known_mirror_ids_list + created_mirror_ids_this_run
            if len(known_mirror_ids_list) > 5000:
                known_mirror_ids_list = known_mirror_ids_list[-5000:]
            demisto.setLastRun({"start_time": last_run_value, "known_mirror_ids": known_mirror_ids_list})
            demisto.debug(f"Setting New Last Run Time: {last_run_value}, known_mirror_ids count: {len(known_mirror_ids_list)}")
        else:
            last_run = str(now) if not incidents else incidents[-1]["occured"]
            demisto.debug(f"Setting New Last Run Time: {last_run}")
            demisto.setLastRun({"start_time": last_run})
    
        return incidents
    
    
    def fetch_investigation_alerts_command(client: Client, xdr_base_url: str, args=None):
