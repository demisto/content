description: Collects learning activity reports from LinkedIn Learning for Cortex XSIAM.
display: LinkedIn Learning Event Collector
name: LinkedInLearning
script:
  commands:
  - name: linkedin-learning-get-events
    description: Retrieves learning activity reports from LinkedIn Learning. Use this command for development and debugging only.
    arguments:
    - description: Maximum number of events to retrieve.
      name: limit
      defaultValue: '50'
    - description: Whether to push events to Cortex XSIAM.
      name: should_push_events
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
      required: true
  dockerimage: demisto/fastapi:0.125.0.7194517
  isfetchevents: true
  isfetchevents:xsoar: false
  runonce: false
  script: '-'
  subtype: python3
  type: python
marketplaces:
- marketplacev2
- platform
fromversion: 8.4.0
tests:
- No tests (auto formatted)
supportedModules:
- xsiam
