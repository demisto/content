id: Doppel - Sync Alerts
version: -1
name: Doppel - Sync Alerts
description: Keeps Doppel incidents/issues in sync with the Doppel platform on deployments without native mirroring, such as Cortex XSIAM. Runs DoppelSyncAlerts to apply Doppel-side changes (queue state, entity state, severity, notes, and audit logs) to the matching incidents/issues, then runs DoppelPushUpdates to archive Doppel alerts whose incidents/issues were closed by analysts. Intended to run on a schedule via the bundled "Doppel - Sync Alerts" job.
