inputs:
- key: lookback
  value:
    simple: 1 hour
  required: false
  description: How far back the sync and push sweeps look on their first run, before a cursor exists. Accepts durations such as '1 hour' or '2 days', or an ISO 8601 timestamp.
  playbookInputQuery:
- key: close_archived
  value:
    simple: 'false'
  required: false
  description: Whether to close the Cortex incident/issue when the corresponding Doppel alert has been archived in Doppel. Disabled by default, which matches the behavior of native mirroring.
  playbookInputQuery:
- key: push_close_notes
  value:
    simple: 'true'
  required: false
  description: Whether to send the incident close notes to Doppel as the alert comment when archiving.
  playbookInputQuery:
- key: instance_name
  value: {}
  required: false
  description: The Doppel integration instance to use when more than one instance is configured.
  playbookInputQuery:
