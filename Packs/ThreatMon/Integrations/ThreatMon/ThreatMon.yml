commonfields:
  id: Threatmon
  version: -1
name: Threatmon
display: ThreatMon Incident Management
sectionorder:
- Connect
- Collect
category: Data Enrichment & Threat Intelligence
description: Fetches ThreatMon alarms as incidents, mirrors their status in both directions, and submits takedown and data removal requests.
provider: ThreatMon
configuration:
- display: API URL
  name: url
  type: 0
  required: true
  section: Connect
  defaultvalue: https://external.threatmonit.io/api/threatmon/external
  additionalinfo: The ThreatMon External API URL. A URL that ends with /v1 also works.
- displaypassword: API Key
  additionalinfo: The External API Key. In ThreatMon, open Settings, then Integrations, then Settings.
  name: credentials
  required: true
  hiddenusername: true
  type: 9
  section: Connect
- display: Customer Name (MSSP)
  name: customer_name
  type: 0
  required: false
  section: Connect
  advanced: true
  additionalinfo: For MSSP accounts, the exact name of the sub company to work with, as shown in ThreatMon. Leave empty to use the account of the API key.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  section: Connect
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
- display: Source Reliability
  name: integrationReliability
  type: 15
  required: false
  section: Connect
  advanced: true
  defaultvalue: B - Usually reliable
  options:
  - A+ - 3rd party enrichment
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
  additionalinfo: The reliability of ThreatMon for the file verdicts of the sandbox.
- display: Fetch incidents
  name: isFetch
  type: 8
  required: false
  section: Collect
  supportedModules:
  - xsiam
  - agentix
- display: Incident type
  name: incidentType
  type: 13
  required: false
  section: Collect
  defaultvalue: ThreatMon Alert
  supportedModules:
  - xsiam
  - agentix
- display: First Fetch Time
  name: first_fetch
  type: 0
  required: false
  section: Collect
  defaultvalue: 3 days
  additionalinfo: How far back to look for alarms on the first fetch, for example "3 days", "12 hours" or "2026-11-01".
  supportedModules:
  - xsiam
  - agentix
- display: Maximum number of incidents per fetch
  name: max_fetch
  type: 0
  required: false
  section: Collect
  defaultvalue: '50'
  additionalinfo: The maximum number of incidents to create in one fetch (1-200). The next fetch continues from the same position.
  supportedModules:
  - xsiam
  - agentix
- display: Alarm Statuses to Fetch
  name: fetch_statuses
  type: 16
  required: false
  section: Collect
  defaultvalue: Open,In Progress
  options:
  - Open
  - In Progress
  - Resolved
  - Ignore
  additionalinfo: Only alarms with one of these statuses are created as incidents. An alarm that moves to one of them later is created then.
  supportedModules:
  - xsiam
  - agentix
- display: Minimum Severity to Fetch
  name: min_severity
  type: 15
  required: false
  section: Collect
  defaultvalue: Information
  options:
  - Information
  - Low
  - Medium
  - High
  - Critical
  additionalinfo: Alarms with a lower severity are not fetched.
  supportedModules:
  - xsiam
  - agentix
- display: Alarm Categories to Fetch
  name: categories
  type: 16
  required: false
  section: Collect
  options:
  - Attack Surface Intelligence
  - Brand Intelligence
  - Dark Web Intelligence
  - Strategic Intelligence
  - VIP Intelligence
  additionalinfo: Only alarms in these categories are fetched. Leave empty to fetch every category.
  supportedModules:
  - xsiam
  - agentix
- display: Mask Secrets in Findings
  name: mask_secrets
  type: 8
  required: false
  section: Collect
  defaultvalue: 'true'
  additionalinfo: When selected, passwords, tokens and cookies in leak findings are shortened (for example "Wi******") before they are stored in Cortex.
  supportedModules:
  - xsiam
  - agentix
- display: Attach Screenshots
  name: attach_screenshots
  type: 8
  required: false
  section: Collect
  defaultvalue: 'true'
  additionalinfo: When selected, the screenshots of the findings (for example of a phishing page) are attached to the incident, up to 3 per alarm.
  supportedModules:
  - xsiam
  - agentix
- display: Look-back Window (minutes)
  name: lookback_minutes
  type: 0
  required: false
  section: Collect
  advanced: true
  defaultvalue: '30'
  additionalinfo: The number of minutes of alarm changes to read again on each fetch and mirroring cycle, because ThreatMon makes changes visible with a delay of a few minutes. Alarms that already exist are not created again.
  supportedModules:
  - xsiam
  - agentix
- display: Last Incident ID (for initial fetch)
  name: lastIncidentId
  type: 0
  required: false
  section: Collect
  advanced: true
  additionalinfo: Alarms with this alarm code or a lower one are never fetched. Leave empty to rely on the First Fetch Time only.
  supportedModules:
  - xsiam
  - agentix
- display: Incident Mirroring Direction
  name: mirror_direction
  type: 15
  required: false
  section: Collect
  defaultvalue: None
  options:
  - None
  - Incoming
  - Outgoing
  - Incoming And Outgoing
  additionalinfo: 'The direction to mirror the alarm status: Incoming (from ThreatMon to Cortex), Outgoing (from Cortex to ThreatMon), or both. Applies to incidents fetched after the setting is changed. Cortex XSOAR only parameter.'
  hidden:
  - marketplacev2
  - platform
- display: Close Mirrored Cortex Incident
  name: close_incident
  type: 8
  required: false
  section: Collect
  defaultvalue: 'false'
  additionalinfo: When selected, an incident is closed when its alarm is set to Resolved or Ignore in ThreatMon, and reopened when the alarm is opened again. Cortex XSOAR only parameter.
  hidden:
  - marketplacev2
  - platform
- display: Close Mirrored ThreatMon Alarm
  name: close_out
  type: 8
  required: false
  section: Collect
  defaultvalue: 'false'
  additionalinfo: When selected, closing an incident sets its alarm to Ignore when the close reason is False Positive or Duplicate, and to Resolved otherwise. Cortex XSOAR only parameter.
  hidden:
  - marketplacev2
  - platform
- display: Fetch Interval (minutes) (Deprecated)
  name: fetchInterval
  defaultvalue: "5"
  type: 0
  required: false
  section: Collect
  advanced: true
  additionalinfo: Deprecated. This parameter is not used. Use Incidents Fetch Interval instead.
  supportedModules:
  - xsiam
  - agentix
- display: Incidents Fetch Interval
  name: incidentFetchInterval
  defaultvalue: "1"
  type: 19
  required: false
  section: Collect
  supportedModules:
  - xsiam
  - agentix
script:
  script: ''
  type: python
  subtype: python3
  commands:
  - name: threatmon-alarm-list
    description: Lists ThreatMon alarms, ordered by alarm code, or by change time when updated_after is set. Use the filters to find an alarm and its findings, for example before a takedown request.
    arguments:
    - name: limit
      description: The maximum number of alarms to return (1-100).
      defaultValue: "10"
    - name: page
      description: The page to return, 0-based. Each page holds "limit" alarms.
      defaultValue: "0"
    - name: severity
      description: A comma-separated list of severities to return.
      isArray: true
      auto: PREDEFINED
      predefined:
      - Information
      - Low
      - Medium
      - High
      - Critical
    - name: category
      description: The category of the alarms to return, for example Brand Intelligence.
    - name: status
      description: A comma-separated list of statuses to return. The filter is applied to the alarms of the requested page.
      isArray: true
      auto: PREDEFINED
      predefined:
      - Open
      - In Progress
      - Resolved
      - Ignore
    - name: start_date
      description: Return alarms created at or after this time, for example "7 days" or "2026-11-01T00:00:00Z".
    - name: end_date
      description: Return alarms created before this time.
    - name: updated_after
      description: Return alarms changed at or after this time, ordered by change time.
    outputs:
    - contextPath: ThreatMon.Alarm.AlarmCode
      description: The alarm code.
      type: Number
    - contextPath: ThreatMon.Alarm.Title
      description: The alarm title.
      type: String
    - contextPath: ThreatMon.Alarm.AlarmType
      description: The alarm type.
      type: String
    - contextPath: ThreatMon.Alarm.Category
      description: The alarm category.
      type: String
    - contextPath: ThreatMon.Alarm.SubCategory
      description: The alarm subcategory.
      type: String
    - contextPath: ThreatMon.Alarm.Severity
      description: The alarm severity.
      type: String
    - contextPath: ThreatMon.Alarm.Status
      description: The alarm status.
      type: String
    - contextPath: ThreatMon.Alarm.Source
      description: The source that detected the alarm.
      type: String
    - contextPath: ThreatMon.Alarm.AlarmDate
      description: The time the alarm was created (e.g., 2026-11-05T09:23:47.553Z).
      type: Date
    - contextPath: ThreatMon.Alarm.LastUpdateDate
      description: The time the alarm was last changed (e.g., 2026-11-06T12:01:10.12Z).
      type: Date
    - contextPath: ThreatMon.Alarm.Description
      description: The alarm description.
      type: String
    - contextPath: ThreatMon.Alarm.Mitigation
      description: The recommended mitigation.
      type: String
    - contextPath: ThreatMon.Alarm.Findings
      description: The findings of the alarm. Secret values are masked.
      type: Unknown
    - contextPath: ThreatMon.Alarm.FindingIDs
      description: The finding IDs of the alarm, used for takedown and data removal requests.
      type: Number
  - name: threatmon-alarm-status-update
    description: Sets the status of one or more ThreatMon alarms.
    arguments:
    - name: alarm_ids
      required: true
      isArray: true
      description: A comma-separated list of alarm codes.
    - name: status
      required: true
      auto: PREDEFINED
      predefined:
      - Open
      - In Progress
      - Resolved
      - Ignore
      description: The new status.
    - name: remarks
      description: The remarks to save with the status change in ThreatMon.
    - name: assigned_email
      description: The e-mail address of the ThreatMon user to assign the alarm to.
    - name: info_email_list
      isArray: true
      description: A comma-separated list of e-mail addresses that ThreatMon informs about the change.
    outputs:
    - contextPath: ThreatMon.Alarm.AlarmCode
      description: The alarm code.
      type: Number
    - contextPath: ThreatMon.Alarm.Status
      description: The new alarm status.
      type: String
  - name: threatmon-alarm-stats
    description: Returns the number of ThreatMon alarms by status, severity and category.
    arguments:
    - name: from_date
      description: Count alarms from this date, for example "30 days" or "2026-10-01".
    - name: to_date
      description: Count alarms up to this date.
    outputs:
    - contextPath: ThreatMon.AlarmStats.Status
      description: The number of alarms per status.
      type: Unknown
    - contextPath: ThreatMon.AlarmStats.Severity
      description: The number of alarms per severity.
      type: Unknown
    - contextPath: ThreatMon.AlarmStats.Category
      description: The number of alarms per category.
      type: Unknown
  - name: threatmon-takedown-request
    description: Submits a takedown request for a finding, such as a phishing domain, a rogue mobile app or a fake social media account. The request is submitted once and never retried automatically.
    execution: true
    arguments:
    - name: finding_id
      required: true
      description: The finding ID, from the findings of the alarm.
    - name: finding
      required: true
      description: The finding to take down, for example the phishing domain.
    outputs:
    - contextPath: ThreatMon.Takedown.FindingID
      description: The finding ID.
      type: Number
    - contextPath: ThreatMon.Takedown.Finding
      description: The finding.
      type: String
    - contextPath: ThreatMon.Takedown.Result
      description: 'The result: Submitted, Already Requested, Not Eligible, Not Allowed or Not Found.'
      type: String
    - contextPath: ThreatMon.Takedown.Submitted
      description: Whether a takedown request for the finding exists in ThreatMon.
      type: Boolean
    - contextPath: ThreatMon.Takedown.Message
      description: The explanation of the result.
      type: String
  - name: threatmon-data-removal-request
    description: Submits a Black Market Monitoring data removal request for a finding. Requires Black Market Data Removal credits. The request is submitted once and never retried automatically.
    execution: true
    arguments:
    - name: finding_id
      required: true
      description: The finding ID, from the findings of the alarm.
    - name: finding
      required: true
      description: The URL or content identifier of the finding to remove.
    outputs:
    - contextPath: ThreatMon.DataRemoval.FindingID
      description: The finding ID.
      type: Number
    - contextPath: ThreatMon.DataRemoval.Finding
      description: The finding.
      type: String
    - contextPath: ThreatMon.DataRemoval.Result
      description: 'The result: Submitted, Already Requested, Not Eligible, Not Allowed or Not Found.'
      type: String
    - contextPath: ThreatMon.DataRemoval.Submitted
      description: Whether a data removal request for the finding exists in ThreatMon.
      type: Boolean
    - contextPath: ThreatMon.DataRemoval.Message
      description: The explanation of the result.
      type: String
  - name: cve
    description: Returns ThreatMon Vulnerability Knowledge about a CVE, with its CVSS, ThreatMon risk scores, exploitation signals and CISA KEV entry. Requires the Vulnerability Knowledge module.
    arguments:
    - name: cve
      required: true
      default: true
      isArray: true
      description: A comma-separated list of CVE IDs, for example CVE-2024-3400.
    outputs:
    - contextPath: CVE.ID
      description: The ID of the CVE.
      type: String
    - contextPath: CVE.CVSS.Score
      description: The CVSS score of the CVE.
      type: Number
    - contextPath: CVE.Published
      description: The date the CVE was published.
      type: Date
    - contextPath: CVE.Modified
      description: The date the CVE was last modified.
      type: Date
    - contextPath: CVE.Description
      description: The description of the CVE.
      type: String
    - contextPath: DBotScore.Indicator
      description: The indicator that was tested.
      type: String
    - contextPath: DBotScore.Type
      description: The indicator type.
      type: String
    - contextPath: DBotScore.Vendor
      description: The vendor used to calculate the score.
      type: String
    - contextPath: DBotScore.Score
      description: The actual score.
      type: Number
    - contextPath: DBotScore.Reliability
      description: The reliability of the source providing the intelligence data.
      type: String
    - contextPath: ThreatMon.CVE.cve
      description: The CVE ID.
      type: String
    - contextPath: ThreatMon.CVE.severity
      description: The severity of the newest CVSS version.
      type: String
    - contextPath: ThreatMon.CVE.tmvs
      description: The ThreatMon vulnerability score.
      type: Number
    - contextPath: ThreatMon.CVE.brvs
      description: The Brainify Risk Vulnerability Score, the risk of the CVE for the company.
      type: Number
    - contextPath: ThreatMon.CVE.epss
      description: The EPSS exploit probability.
      type: Number
    - contextPath: ThreatMon.CVE.exploit
      description: Whether a known exploit exists.
      type: Boolean
    - contextPath: ThreatMon.CVE.hasPoc
      description: Whether a public proof of concept exists.
      type: Boolean
    - contextPath: ThreatMon.CVE.kev
      description: The CISA Known Exploited Vulnerabilities entry.
      type: Unknown
    - contextPath: ThreatMon.CVE.affectedAssets
      description: The number of confirmed and potentially affected company assets.
      type: Unknown
  - name: threatmon-cve-get
    description: Gets a ThreatMon Vulnerability Knowledge CVE in detail, optionally with the AI report, the timeline and the mentions. Requires the Vulnerability Knowledge module.
    arguments:
    - name: cve_id
      required: true
      description: The CVE ID, for example CVE-2024-3400.
    - name: include
      description: A comma-separated list of extra sections to return.
      isArray: true
      auto: PREDEFINED
      predefined:
      - report
      - timeline
      - mentions
    outputs:
    - contextPath: ThreatMon.CVE.cve
      description: The CVE ID.
      type: String
    - contextPath: ThreatMon.CVE.summary
      description: The CVE summary.
      type: String
    - contextPath: ThreatMon.CVE.severity
      description: The severity of the newest CVSS version.
      type: String
    - contextPath: ThreatMon.CVE.tmvs
      description: The ThreatMon vulnerability score.
      type: Number
    - contextPath: ThreatMon.CVE.brvs
      description: The Brainify Risk Vulnerability Score, the risk of the CVE for the company.
      type: Number
    - contextPath: ThreatMon.CVE.epss
      description: The EPSS exploit probability.
      type: Number
    - contextPath: ThreatMon.CVE.exploit
      description: Whether a known exploit exists.
      type: Boolean
    - contextPath: ThreatMon.CVE.hasPoc
      description: Whether a public proof of concept exists.
      type: Boolean
    - contextPath: ThreatMon.CVE.kev
      description: The CISA Known Exploited Vulnerabilities entry.
      type: Unknown
    - contextPath: ThreatMon.CVE.pocs
      description: The known proofs of concept.
      type: Unknown
    - contextPath: ThreatMon.CVE.riskBreakdown
      description: The parts of the ThreatMon vulnerability score.
      type: Unknown
    - contextPath: ThreatMon.CVE.report
      description: The AI enrichment report, when requested.
      type: Unknown
    - contextPath: ThreatMon.CVE.timeline
      description: The timeline of the CVE, when requested.
      type: Unknown
    - contextPath: ThreatMon.CVE.mentions
      description: The mentions on X, Reddit and the dark web, when requested.
      type: Unknown
  - name: threatmon-cve-search
    description: Searches ThreatMon Vulnerability Knowledge for CVEs published or updated in a period, oldest first. Requires the Vulnerability Knowledge module.
    arguments:
    - name: start_date
      required: true
      description: The start of the period, for example "7 days" or "2026-11-01". The period can be at most 366 days.
    - name: end_date
      description: The end of the period. Default is now.
    - name: date_field
      description: The date to search by.
      auto: PREDEFINED
      predefined:
      - published
      - updated
      defaultValue: published
    - name: cvss
      description: The severity of the newest CVSS version.
      auto: PREDEFINED
      predefined:
      - NONE
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    - name: search
      description: A part of a CVE ID, for example 2026-1234.
    - name: vendor
      description: The CPE vendor name.
    - name: product
      description: The CPE product name.
    - name: exploit
      description: Whether a known exploit exists.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: has_poc
      description: Whether a public proof of concept exists.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: trending
      description: Whether the CVE is trending.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: known_ransomware_use
      description: Whether the CVE is used in ransomware campaigns.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: confirmed_affected
      description: Whether company assets are confirmed to be affected.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: potentially_affected
      description: Whether company assets are potentially affected.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: limit
      description: The maximum number of CVEs to return (1-1000).
      defaultValue: "50"
    - name: cursor
      description: The cursor returned by the previous search, to get the next CVEs.
    outputs:
    - contextPath: ThreatMon.CVE.cve
      description: The CVE ID.
      type: String
    - contextPath: ThreatMon.CVE.cweId
      description: The CWE IDs.
      type: String
    - contextPath: ThreatMon.CVE.summary
      description: The CVE summary.
      type: String
    - contextPath: ThreatMon.CVE.severity
      description: The severity of the newest CVSS version.
      type: String
    - contextPath: ThreatMon.CVE.cvssV3_1
      description: The CVSS v3.1 score.
      type: Number
    - contextPath: ThreatMon.CVE.cvssV4
      description: The CVSS v4 score.
      type: Number
    - contextPath: ThreatMon.CVE.tmvs
      description: The ThreatMon vulnerability score.
      type: Number
    - contextPath: ThreatMon.CVE.brvs
      description: The Brainify Risk Vulnerability Score, the risk of the CVE for the company.
      type: Number
    - contextPath: ThreatMon.CVE.epss
      description: The EPSS exploit probability.
      type: Number
    - contextPath: ThreatMon.CVE.exploit
      description: Whether a known exploit exists.
      type: Boolean
    - contextPath: ThreatMon.CVE.hasPoc
      description: Whether a public proof of concept exists.
      type: Boolean
    - contextPath: ThreatMon.CVE.vendors
      description: The affected vendors and products.
      type: Unknown
    - contextPath: ThreatMon.CVE.publishedAt
      description: The date the CVE was published (e.g., 2026-11-01T00:00:23.604Z).
      type: Date
    - contextPath: ThreatMon.CVESearch.NextCursor
      description: The cursor to get the next CVEs, or empty when there are no more.
      type: String
  - name: threatmon-cve-subscription-list
    description: Lists the vendors and products the company follows in ThreatMon Vulnerability Knowledge, with the recipients of the CVE e-mails.
    arguments:
    - name: recipient_email
      description: Show only the subscriptions of this recipient of the CVE e-mails.
    - name: limit
      description: The maximum number of subscriptions to return (1-1000).
      defaultValue: "50"
    - name: cursor
      description: The cursor returned by the previous command, to get the next subscriptions.
    outputs:
    - contextPath: ThreatMon.CVESubscription.vendor
      description: The vendor.
      type: String
    - contextPath: ThreatMon.CVESubscription.product
      description: The product.
      type: String
    - contextPath: ThreatMon.CVESubscription.productId
      description: The product ID.
      type: Number
    - contextPath: ThreatMon.CVESubscription.subscribedAt
      description: The time of the subscription.
      type: Date
    - contextPath: ThreatMon.CVESubscription.recipients
      description: The recipients of the CVE e-mails.
      type: Unknown
    - contextPath: ThreatMon.CVESubscriptionList.NextCursor
      description: The cursor to get the next subscriptions, or empty when there are no more.
      type: String
  - name: threatmon-subscribed-cve-search
    description: Searches the CVEs published in a period for the vendors and products the company follows, oldest first.
    arguments:
    - name: start_date
      required: true
      description: The start of the period, for example "30 days" or "2026-10-01". The period can be at most 366 days.
    - name: end_date
      description: The end of the period. Default is now.
    - name: cvss
      description: The severity of the newest CVSS version.
      auto: PREDEFINED
      predefined:
      - NONE
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    - name: recipient_email
      description: Show only the CVEs e-mailed to this recipient.
    - name: limit
      description: The maximum number of CVEs to return (1-1000).
      defaultValue: "50"
    - name: cursor
      description: The cursor returned by the previous search, to get the next CVEs.
    outputs:
    - contextPath: ThreatMon.CVE.cve
      description: The CVE ID.
      type: String
    - contextPath: ThreatMon.CVE.summary
      description: The CVE summary.
      type: String
    - contextPath: ThreatMon.CVE.severity
      description: The severity of the newest CVSS version.
      type: String
    - contextPath: ThreatMon.CVE.riskScore
      description: The risk score of the CVE.
      type: Number
    - contextPath: ThreatMon.CVE.subscribedProducts
      description: The subscribed products the CVE was matched to.
      type: Unknown
    - contextPath: ThreatMon.SubscribedCVESearch.NextCursor
      description: The cursor to get the next CVEs, or empty when there are no more.
      type: String
  - name: threatmon-asset-list
    description: Lists the company assets that ThreatMon discovered (Digital Footprint), such as IP addresses, domains, websites, certificates and technologies.
    arguments:
    - name: asset_type
      required: true
      description: The type of assets to list.
      auto: PREDEFINED
      predefined:
      - IP
      - Cloud IP
      - Domain
      - Subdomain
      - Cloud Subdomain
      - WHOIS
      - Website
      - SSL Certificate
      - Technology
      - DNS Record
      - Bucket
      - Bucket File
      defaultValue: Domain
    - name: limit
      description: The maximum number of assets to return (1-100).
      defaultValue: "50"
    - name: page
      description: The page to return, 0-based. Each page holds "limit" assets.
      defaultValue: "0"
    outputs:
    - contextPath: ThreatMon.Asset.AssetType
      description: The asset type.
      type: String
    - contextPath: ThreatMon.Asset.ip
      description: The IP address (IP and Cloud IP assets).
      type: String
    - contextPath: ThreatMon.Asset.domainName
      description: The domain name (Domain assets).
      type: String
    - contextPath: ThreatMon.Asset.subDomainName
      description: The subdomain name (Subdomain and Cloud Subdomain assets).
      type: String
    - contextPath: ThreatMon.Asset.websiteUrl
      description: The website URL (Website assets).
      type: String
    - contextPath: ThreatMon.Asset.asset
      description: The asset the record belongs to (WHOIS, SSL Certificate and Technology assets).
      type: String
    - contextPath: ThreatMon.Asset.expireDate
      description: The expiry date of the certificate (SSL Certificate assets).
      type: Date
    - contextPath: ThreatMon.Asset.productName
      description: The technology name (Technology assets).
