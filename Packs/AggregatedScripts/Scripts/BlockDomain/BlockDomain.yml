args:
- description: List of domain FQDNs to block. Wildcard entries (e.g. *.evil.com) are not supported and are skipped.
  isArray: true
  name: domain_list
  required: true
- defaultValue: 'Cortex - Block Domain'
  description: The name of the rule which will be created in the relevant products.
  isArray: false
  name: rule_name
  required: false
- description: Panorama log forwarding object name. Indicate what type of Log Forwarding setting will be specified in the PAN-OS custom rules.
  isArray: false
  name: log_forwarding_name
  required: false
- description: This input determines whether PANW Panorama or Firewall Address Groups are used. Specify the Address Group name for FQDN handling.
  isArray: false
  name: address_group
  required: false
  defaultValue: 'Blocked Domains - Cortex'
- description: Whether to commit the new rule and push to the device group at the end of the run.
  isArray: false
  name: auto_commit
  required: false
  defaultValue: 'true'
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
- description: The designated tag name for the domain FQDN object. Applied to every object the script creates.
  isArray: false
  name: tag
  required: false
  defaultValue: 'cortex-blocked-domains'
- description: |-
    Which integrations brands to run the command for. If not provided, the command will run for all available integrations.
    For multi-select provide a comma-separated list.
  isArray: true
  name: brands
  required: false
  auto: PREDEFINED
  predefined:
  - 'Panorama'
- description: Whether to retrieve a human-readable entry for every command or only the final result. True retrieves a human-readable entry for every command. False retrieves a human-readable entry only for the final result.
  name: verbose
  defaultValue: 'false'
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
- description: commit job ID to use in polling commands. (automatically filled by polling).
  name: commit_job_id
  hidden: true
- description: publish job ID to use in polling commands. (automatically filled by polling).
  name: publish_job_id
  hidden: true
comment: The script blocks a list of domain FQDNs in supported integrations.
commonfields:
  id: block-domain
  version: -1
enabled: false
name: block-domain
outputs:
- contextPath: BlockDomainResults.Domain
  description: The domain FQDN that was processed.
  type: String
- contextPath: BlockDomainResults.Brand
  description: The brand (integration) used to block the domain.
  type: String
- contextPath: BlockDomainResults.Instance
  description: The integration instance used to block the domain.
  type: String
- contextPath: BlockDomainResults.Status
  description: The lifecycle status of the action. One of Done, Pending, Skipped, Failed.
  type: String
- contextPath: BlockDomainResults.Result
  description: The result of the action. Success or Failed.
  type: String
- contextPath: BlockDomainResults.Action
  description: The effect the run had on the target object. One of Created, Modified, Unchanged.
  type: String
- contextPath: BlockDomainResults.RuleName
  description: The name of the rule used for this integration. Empty if no rule was used.
  type: String
- contextPath: BlockDomainResults.Message
  description: A message concerning the result of the action.
  type: String
script: '-'
system: false
timeout: 20m0s
type: python
subtype: python3
compliantpolicies:
- IP Blockage
dockerimage: demisto/python3:3.12.13.10116658
fromversion: 6.10.0
marketplaces:
- xsoar
- marketplacev2
- platform
polling: true
tests:
- No tests (auto formatted)
