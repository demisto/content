commonfields:
  id: SearchAndDeleteEmail
  version: -1
name: SearchAndDeleteEmail
script: '-'
type: python
subtype: python3
tags:
- email
- Utility
comment: |-
  Searches for emails and optionally deletes them, using one or more of the supported mail integrations: Gmail, Microsoft Graph Mail, Microsoft Graph Security and EWS on-prem (EWS v2). The results of all vendors are normalized into the unified EmailData context path.

  Supported scopes: Gmail, Microsoft Graph Security and EWS v2 support searching all mailboxes. Microsoft Graph Mail supports only specific mailboxes.
  Delete types: Gmail, Microsoft Graph Security and EWS v2 support both soft and hard delete. Microsoft Graph Mail supports soft delete only (the emails are moved to Deleted Items).
  Microsoft Graph Security and EWS v2 honor only the date part of the time frame, so the effective search window can be up to 24 hours wider than requested.
  The command may take a long time when searching thousands of mailboxes. It uses the built-in polling: long waits (the Microsoft Graph Security eDiscovery operations and the deletion verification) are polled, while the search and delete commands of each run are executed synchronously within that run. The timeout argument is the overall time budget (in seconds) of the whole run.
  When verify_deletion is true (relevant only for "Search & Delete"), the script verifies that the emails were really deleted instead of trusting that the delete command did not fail (the verification is polled for up to 120 seconds). Verification is not supported for Microsoft Graph Security.
  Microsoft Graph Security runs in a dedicated eDiscovery case that is created for the run and is always deleted at the end, together with its search, and returns a single aggregate record (counts only) instead of per-email details. "Search & Delete" with mailbox_scope "Specific" is refused for Microsoft Graph Security, because its search would also match the copies of the email in other mailboxes.
enabled: true
args:
- name: internet_message_id
  description: One or more Internet Message IDs of the emails to search for or delete. When specified, it is preferred over subject and sender_address.
  isArray: true
- name: object_id
  description: The vendor specific ID of the email (for example, the ItemID in EWS). When specified, a single target_mailbox and a single brand must also be specified, and mailbox_scope must be "Specific". Not supported for Microsoft Graph Security.
- name: operation
  description: The operation to perform. "Search Only" searches for the emails without deleting them. "Search & Delete" also deletes the emails that were found.
  required: true
  auto: PREDEFINED
  predefined:
  - Search Only
  - Search & Delete
- name: delete_type
  description: 'The delete type to use when the operation is "Search & Delete": "soft" (the email is moved to the deleted items / trash and can be recovered) or "hard" (the email is permanently deleted). Microsoft Graph Mail supports soft delete only. Default is soft.'
  auto: PREDEFINED
  predefined:
  - soft
  - hard
  defaultValue: soft
- name: time_frame
  description: 'How far back to search, for example "7 days" or "3 hours". Supported units: minutes, hours, days, weeks and months. Microsoft Graph Security and EWS v2 honor only the date part. Default is 1 hour.'
  defaultValue: 1 hour
- name: subject
  description: One or more email subjects to search for. Ignored when internet_message_id is specified.
  isArray: true
- name: sender_address
  description: The sender address to search for. Can be used together with subject. Ignored when internet_message_id is specified.
- name: retrieve_files
  description: Whether to retrieve the attachments of the emails before they are deleted. The files are added to the Attachments key of EmailData and returned as file entries. Not supported by Microsoft Graph Security. Default is false.
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
- name: target_mailbox
  description: The mailbox(es) to search in. Required when mailbox_scope is "Specific". Ignored when mailbox_scope is "All".
  isArray: true
- name: mailbox_scope
  description: Whether to search specific mailboxes or all mailboxes. Microsoft Graph Mail does not support "All". Default is Specific.
  auto: PREDEFINED
  predefined:
  - Specific
  - All
  defaultValue: Specific
- name: brands
  description: The brands to run the operation on. If empty, all enabled instances of the supported brands are used.
  isArray: true
  auto: PREDEFINED
  predefined:
  - Gmail
  - MicrosoftGraphMail
  - Microsoft Graph
  - EWS v2
- name: verify_deletion
  description: Whether to verify the deletion by searching again after the emails were deleted and checking that they no longer exist. Relevant only when the operation is "Search & Delete". Emails whose deletion cannot be verified are reported as failed. Not supported for Microsoft Graph Security, for which a warning is returned. Default is false.
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
- name: verbose
  description: Whether to include the list of executed commands in the human readable output and the instance name in the AdditionalFields of every email. Default is false.
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
- name: timeout
  description: The overall time budget of the whole run (all polling runs together), in seconds (a positive integer). It is not a per-operation timeout. When it is exhausted, vendors that were not started yet are reported as failed and the results collected so far are returned (the Microsoft Graph Security search and case are always cleaned up, which may take up to an additional 600 seconds grace period). Default is 1800.
  defaultValue: "1800"
- name: state
  description: The state of the polling flow. Automatically filled by polling, should not be set by the user.
  hidden: true
- name: scheduled_timeout_in_seconds
  description: The timeout of the scheduled polling command. Automatically filled by polling, should not be set by the user.
  hidden: true
- name: hide_polling_output
  description: Whether to hide the polling message. Automatically filled by polling, should not be set by the user.
  hidden: true
outputs:
- contextPath: EmailData
  description: The unified results of the search and delete operation. Contains one record per email found, or one record per brand instance that found no emails, failed, or returns aggregate counts only (Microsoft Graph Security).
  type: Unknown
- contextPath: EmailData.Brand
  description: The brand that was used.
  type: String
- contextPath: EmailData.Mailbox
  description: The mailbox addresses in which the email was found. For records without an email, the target mailboxes or "All".
  type: Unknown
- contextPath: EmailData.Subject
  description: The email subject.
  type: String
- contextPath: EmailData.From
  description: The email sender.
  type: String
- contextPath: EmailData.To
  description: The email recipients.
  type: Unknown
- contextPath: EmailData.CC
  description: The email CC recipients.
  type: Unknown
- contextPath: EmailData.BCC
  description: The email BCC recipients.
  type: Unknown
- contextPath: EmailData.HTML
  description: The HTML body of the email.
  type: String
- contextPath: EmailData.Timestamp
  description: The timestamp of the email.
  type: String
- contextPath: EmailData.Attachments
  description: A dictionary of the attachment names and their SHA256 hashes. The hashes are populated only when retrieve_files is true.
  type: Unknown
- contextPath: EmailData.Success
  description: Whether the operation succeeded for this email (or for this brand instance, when the record has no email).
  type: Boolean
- contextPath: EmailData.Reason
  description: The reason for the failure, if any.
  type: String
- contextPath: EmailData.Operation
  description: The operation that was performed ("Search Only" or "Search & Delete").
  type: String
- contextPath: EmailData.AdditionalFields
  description: Additional vendor specific fields.
  type: Unknown
- contextPath: EmailData.AdditionalFields.ObjectID
  description: The vendor specific ID of the email (for example, the message ID in Microsoft Graph Mail or the item ID in EWS).
  type: String
- contextPath: EmailData.AdditionalFields.InternetMessageID
  description: The Internet Message ID of the email, when the vendor returns it.
  type: String
- contextPath: EmailData.AdditionalFields.Verified
  description: Whether the deletion of the email was verified. Also returned in the aggregate record of Microsoft Graph Security, where it reflects the estimate that was calculated after the last purge. Returned only when verify_deletion is true and the verification could be determined.
  type: Boolean
- contextPath: EmailData.AdditionalFields.Instance
  description: The name of the integration instance. Returned for records without an email and for every email when verbose is true.
  type: String
- contextPath: EmailData.AdditionalFields.HTMLBodyTruncated
  description: True when the HTML body of the email was truncated to keep the polling state small.
  type: Boolean
- contextPath: EmailData.AdditionalFields.Aggregate
  description: True for the single aggregate record of a brand that returns counts only (Microsoft Graph Security), which has no per-email details.
  type: Boolean
- contextPath: EmailData.AdditionalFields.Note
  description: A note about the run of the brand instance, for example when the vendor capped the number of returned emails. Returned only in records without an email and in aggregate records.
  type: String
- contextPath: TotalFound
  description: The total number of emails that were found across all brands.
  type: Number
- contextPath: TotalDeleted
  description: The total number of emails that were deleted across all brands.
  type: Number
- contextPath: TotalFailed
  description: The total number of emails that failed to be deleted across all brands.
  type: Number
- contextPath: File.Name
  description: The name of the retrieved attachment. Returned only when retrieve_files is true.
  type: String
- contextPath: File.SHA256
  description: The SHA256 of the retrieved attachment. Returned only when retrieve_files is true.
  type: String
dependson:
  should:
  - Gmail|||gmail-search
  - Gmail|||gmail-search-all-mailboxes
  - Gmail|||gmail-get-mail
