  - Gmail|||gmail-delete-mail
  - MicrosoftGraphMail|||msgraph-mail-list-emails
  - MicrosoftGraphMail|||msgraph-mail-get-email
  - MicrosoftGraphMail|||msgraph-mail-get-attachment
  - MicrosoftGraphMail|||msgraph-mail-delete-email
  - Microsoft Graph|||msg-create-ediscovery-case
  - Microsoft Graph|||msg-create-ediscovery-search
  - Microsoft Graph|||msg-run-estimate-statistics
  - Microsoft Graph|||msg-get-last-estimate-statistics-operation
  - Microsoft Graph|||msg-purge-ediscovery-data
  - Microsoft Graph|||msg-list-case-operation
  - Microsoft Graph|||msg-delete-ediscovery-search
  - Microsoft Graph|||msg-delete-ediscovery-case
  - Microsoft Graph|||msg-list-ediscovery-cases
  - EWS v2|||ews-search-mailboxes
  - EWS v2|||ews-get-items
  - EWS v2|||ews-get-attachment
  - EWS v2|||ews-delete-items
dockerimage: demisto/python3:3.12.14.13495286
timeout: 20m0s
fromversion: 6.10.0
