args:
- description: A comma-separated list of one or more Internet Message IDs (the "Message-ID" email header) of the emails to search for. When specified, it is preferred over the subject and sender address.
  name: internet_message_id
  isArray: true
- description: The vendor-specific ID of the email (for example, the ItemID in EWS or the message ID in Gmail and Microsoft Graph Mail). When specified, the "target_mailbox" and "brands" arguments must also be specified (a single mailbox and a single brand). Not supported for Microsoft Graph Security.
  name: object_id
- description: The operation to perform. "Search Only" only searches for the emails, "Search & Delete" also deletes the emails that were found.
  name: operation
  required: true
  auto: PREDEFINED
  predefined:
  - Search Only
  - Search & Delete
- description: |-
    The type of deletion, relevant only when the operation is "Search & Delete".
    Soft - the email is moved to a recoverable location (for example, the trash or the recoverable items folder).
    Hard - the email is permanently deleted, where the vendor supports it. Microsoft Graph Mail does not support a hard delete (the email is moved to Deleted Items).
  name: delete_type
  auto: PREDEFINED
  predefined:
  - Soft
  - Hard
  defaultValue: Soft
- description: 'The period to search in, for example "1 hour", "3 hours" or "7 days". Only emails received within this period are returned.'
  name: time_frame
  defaultValue: 1 hour
- description: The subject of the emails to search for. Ignored when "internet_message_id" is specified.
  name: subject
- description: The sender address of the emails to search for. Can be combined with the subject. Ignored when "internet_message_id" is specified.
  name: sender_address
- description: Whether to retrieve the attachments of the found emails. The attachments are added to the "Attachments" key of the EmailData and returned as file entries (File context key). The attachments are retrieved before the emails are deleted.
  name: retrieve_files
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  defaultValue: 'false'
- description: A comma-separated list of the mailboxes to search in (for example, user1@example.com,user2@example.com). Required when "mailbox_scope" is "Specific".
  name: target_mailbox
  isArray: true
- description: |-
    The scope of the mailboxes to search in.
    Specific - search only in the mailboxes specified in "target_mailbox".
    All - search in all the mailboxes of the organization.
  name: mailbox_scope
  required: true
  auto: PREDEFINED
  predefined:
  - Specific
  - All
  defaultValue: Specific
- description: |-
    Specify the integration brands to run the command for. If not provided, the command runs for all the available (enabled) supported integrations.
    For multi-select, provide a comma-separated list. For example: 'Gmail, EWS v2'.
  name: brands
  isArray: true
  auto: PREDEFINED
  predefined:
  - Gmail
  - MicrosoftGraphMail
  - Microsoft Graph
  - EWS v2
- description: Whether to return additional email details (body, headers, labels and so on) in the "AdditionalFields" key of the EmailData.
  name: verbose
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  defaultValue: 'false'
- description: Whether to verify with the vendor that the emails were deleted, by checking that they no longer exist. Not supported for Microsoft Graph Security - a warning is returned and the deletion is performed without verification.
  name: verify_deletion
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  defaultValue: 'false'
comment: Searches for emails (and optionally deletes them) across multiple email integrations - Gmail, Microsoft Graph Mail, Microsoft Graph Security and EWS v2 (on-premise). This script replaces the "Search And Delete Emails - Generic v2" and "Get Original Email - Generic v2" playbooks.
commonfields:
  id: search-and-delete-email
  version: -1
name: search-and-delete-email
outputs:
- contextPath: EmailData
  description: The emails that were found (or the failures that occurred), one item per email and brand.
  type: Unknown
- contextPath: EmailData.Mailbox
  description: The mailbox addresses of the email.
  type: String
- contextPath: EmailData.Subject
  description: The subject of the email.
  type: String
- contextPath: EmailData.From
  description: The sender of the email.
  type: String
- contextPath: EmailData.To
  description: The recipients of the email.
  type: String
- contextPath: EmailData.CC
  description: The CC recipients of the email.
  type: String
- contextPath: EmailData.BCC
  description: The BCC recipients of the email.
  type: String
- contextPath: EmailData.HTML
  description: The HTML body of the email.
  type: String
- contextPath: EmailData.Timestamp
  description: The time the email was received.
  type: String
- contextPath: EmailData.Attachments
  description: The attachments of the email, as a dictionary of the attachment name to its SHA256 hash. Populated only when "retrieve_files" is true.
  type: Unknown
- contextPath: EmailData.Success
  description: Whether the operation succeeded for the email.
  type: Boolean
- contextPath: EmailData.Reason
  description: The failure reason, if the operation failed.
  type: String
- contextPath: EmailData.Operation
  description: The operation that was performed ("Search Only" or "Search & Delete").
  type: String
- contextPath: EmailData.Brand
  description: The integration brand that was used.
  type: String
- contextPath: EmailData.AdditionalFields
  description: Additional details of the email (the object ID, the internet message ID, the deletion status and, when "verbose" is true, the body, headers and other vendor fields).
  type: Unknown
- contextPath: TotalFound
  description: The total number of emails that were found.
  type: Number
- contextPath: TotalDeleted
  description: The total number of emails that were deleted.
  type: Number
- contextPath: TotalFailed
  description: The total number of emails (or integrations) for which the operation failed.
  type: Number
- contextPath: File.Name
  description: The name of the retrieved attachment. Relevant only when "retrieve_files" is true.
  type: String
- contextPath: File.SHA256
  description: The SHA256 hash of the retrieved attachment. Relevant only when "retrieve_files" is true.
  type: String
- contextPath: File.Size
  description: The size of the retrieved attachment. Relevant only when "retrieve_files" is true.
  type: Number
- contextPath: File.Extension
  description: The extension of the retrieved attachment. Relevant only when "retrieve_files" is true.
  type: String
script: '-'
timeout: 2h0m0s
type: python
subtype: python3
