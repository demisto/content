      type: String
    - contextPath: GoogleCloudSCC.FindingV2.findingClass
      description: The class of the finding (THREAT, VULNERABILITY, MISCONFIGURATION, OBSERVATION, SCC_ERROR, POSTURE_VIOLATION, TOXIC_COMBINATION).
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.indicator
