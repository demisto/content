  - arguments:
    - description: |-
        The relative resource name of the finding.
        In the v2 API the name may include an optional "locations/{location}" segment. If no location is specified, the finding is assumed to be in "global".

        Format: organizations/{organization_id}/sources/{source_id}/findings/{findingId} or organizations/{organization_id}/sources/{source_id}/locations/{location_id}/findings/{findingId}

        Example: organizations/595779152576/sources/14801394649435054450/locations/global/findings/bc5a86da657611ebb979005056a5924e.

        Note: Users can retrieve the list of the finding names by executing the "google-cloud-scc-v2-finding-list" command.
      name: name
      required: true
    description: Mute an organization's or source's finding using the Security Command Center v2 API.
    name: google-cloud-scc-finding-mute
    outputs:
    - contextPath: GoogleCloudSCC.FindingV2.name
      description: "'The relative resource name of this finding. Format: organizations/{organization}/sources/{source}/locations/{location}/findings/{finding}.'"
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.canonicalName
      description: The canonical name of the finding, always suffixed with the region-agnostic (global) resource path.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.parent
      description: The relative resource name of the source the finding belongs to.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.resourceName
      description: For findings on Google Cloud resources, the full resource name of the Google Cloud resource this finding is for.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.state
      description: The state of the finding (ACTIVE or INACTIVE).
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.category
      description: The additional taxonomy group within findings from a given source.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.externalUri
      description: The URI that, if available, points to a web page outside of Security Command Center where additional information about the finding can be found.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.sourceProperties
      description: Source specific properties. These properties are managed by the source that writes the finding. Properties are varying from finding to finding.
      type: Unknown
    - contextPath: GoogleCloudSCC.FindingV2.securityMarks
      description: Output only.
      type: Unknown
    - contextPath: GoogleCloudSCC.FindingV2.securityMarks.name
      description: The relative resource name of the SecurityMarks.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.securityMarks.marks
      description: Mutable user specified security marks belonging to the parent resource.
      type: Unknown
    - contextPath: GoogleCloudSCC.FindingV2.securityMarks.canonicalName
      description: The canonical name of the marks.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.eventTime
      description: The time at which the event took place, or when an update to the finding occurred.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.createTime
      description: The time at which the finding was created in Security Command Center.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.severity
      description: The severity of the finding (CRITICAL, HIGH, MEDIUM, LOW).
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.mute
      description: Indicates the mute state of the finding (MUTED, UNMUTED, UNDEFINED).
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.muteInfo
      description: Additional details about the mute state of the finding, including static and dynamic mute records.
      type: Unknown
    - contextPath: GoogleCloudSCC.FindingV2.muteInfo.staticMute
      description: If set, the static mute applied to this finding.
      type: Unknown
    - contextPath: GoogleCloudSCC.FindingV2.muteInfo.staticMute.state
      description: The static mute state.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.muteInfo.staticMute.applyTime
      description: When the static mute was applied.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.muteInfo.dynamicMuteRecords
      description: The list of dynamic mute rules that currently match the finding.
      type: Unknown
    - contextPath: GoogleCloudSCC.FindingV2.muteInfo.dynamicMuteRecords.muteConfig
      description: The relative resource name of the mute rule, represented by a mute config, that created this record, for example organizations/123/muteConfigs/mymuteconfig or organizations/123/locations/global/muteConfigs/mymuteconfig.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.muteInfo.dynamicMuteRecords.matchTime
      description: When the dynamic mute rule first matched the finding.
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.findingClass
      description: The class of the finding (THREAT, VULNERABILITY, MISCONFIGURATION, OBSERVATION, SCC_ERROR, POSTURE_VIOLATION, TOXIC_COMBINATION).
      type: String
    - contextPath: GoogleCloudSCC.FindingV2.indicator
      description: Represents what's commonly known as an indicator of compromise (IoC) in computer forensics.
      type: Unknown
