  - arguments:
    - description: Filter findings by their severity (LOW, MEDIUM, HIGH, CRITICAL). Comma-separated values are supported and if any severity value is not provided, by default all the severities will be considered for listing of findings. Value provided inside severity would be applied in the query as a filter parameter for filtering results.
      name: severity
      auto: PREDEFINED
      predefined:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    - description: |-
        Filter findings by providing comma-separated values of categories or a single category.
        If any category value is not provided, by default all the categories will be considered for listing findings.
        Value provided inside the category would be applied in the query as a filter parameter for filtering results.

        For Example: anomaly,application.
      name: category
    - defaultValue: '-'
      description: Filter findings by providing the value of a single source type. If any source type Id value is not provided, by default all source types will be considered for list findings.
      name: sourceTypeId
    - defaultValue: '10'
      description: The maximum number of results to return in a single response. The minimum value is 1 and maximum value is 1000.
      name: pageSize
    - defaultValue: 'ACTIVE'
      description: Filter the findings by their state. Can be 'ACTIVE', 'INACTIVE'. Comma-separated values are supported and if any state value is not provided, by default 'ACTIVE' state will be considered for listing of findings. Value provided inside the state would be applied in the query as a filter parameter for filtering results.
      name: state
      auto: PREDEFINED
      predefined:
      - ACTIVE
      - INACTIVE
    - defaultValue: 'global'
      description: The location in which the findings reside. 'sa' is the location identifier of the Saudi Arabia (me-central2) region. If no location is provided, findings are assumed to be in 'global'.
      name: location
      auto: PREDEFINED
      predefined:
      - global
      - us
      - eu
      - sa
    - description: |-
        The v2 filter expression is a list of one or more restrictions combined via logical operators AND and OR.
        Parentheses are supported, and OR has higher precedence than AND.
        A restriction has the form <field> <operator> <value> and can be prefixed with "-" to negate it. Examples include:
        1) name
        2) securityMarks.marks.marka

        The supported operators are:
        1) = for all value types.
        2) >, <, >=, <= for integer values.
        3) :, meaning substring matching, for strings.

        The supported value types are string literals in quotes, integer literals without quotes, and the boolean literals true and false without quotes.

        The following field and operator combinations are supported:
        1) name: =
        2) parent: =, :
        3) resourceName: =, :
        4) state: =, :
        5) category: =, :
        6) externalUri: =, :
        7) eventTime: =, >, <, >=, <= (using an RFC3339 timestamp or milliseconds since epoch)
        8) severity: =, :
        9) securityMarks.marks: =, :
        10) resource:
        11) resource.name: =, :
        12) resource.parent_name: =, :
        13) resource.parent_display_name: =, :
        14) resource.project_name: =, :
        15) resource.project_display_name: =, :
        16) resource.type: =, :
        17) resource.display_name: =, :
        18) resource.folders.resource_folder: =, :

        Note: The value provided here is combined with the severity, category, and state arguments using the AND operator.

        Examples:
        1) category="XSS_SCRIPTING" AND state="ACTIVE"
        2) severity="HIGH" AND resource.projectDisplayName:"prod"
        3) eventTime > "2026-06-10T16:07:18-07:00"
        4) -resourceName:"" (a negated partial match on the empty string, to filter on a property not existing).
      name: filter
    - description: |-
        This parameter defines what fields and order to use for sorting.
        The string value should be a comma-separated list of fields. The default sorting order is ascending.
        To specify descending order for a field, a suffix " desc" should be appended to the field name.

        For example: "name desc,category".

        Supported fields in the v2 API: name, parent, state, category, resourceName, eventTime, severity, securityMarks.marks.
      name: orderBy
    - description: The value returned by the last response of a google-cloud-scc-v2-finding-list command indicates that this is a continuation of a prior findings.list call, and that the system should return the next page of data.
      name: pageToken
