  - arguments:
    - description: |-
        The relative resource name of the finding.
        In the v2 API the name may include an optional "locations/{location}" segment.

        Format: organizations/{organization_id}/sources/{source_id}/findings/{findingId} or organizations/{organization_id}/sources/{source_id}/locations/{location_id}/findings/{findingId}

        Example: organizations/595779152576/sources/14801394649435054450/locations/global/findings/bc5a86da657611ebb979005056a5924e.

        Note: Users can retrieve the list of the finding names by executing the "google-cloud-scc-v2-finding-list" command.
      name: name
      required: true
    - auto: PREDEFINED
      description: Related severity of the finding.
      name: severity
      predefined:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    - description: URI that points to a web page outside of Cloud SCC (Security Command Center) where additional information about the finding can be found.
      name: externalUri
    - description: Source specific properties. These properties are managed by the source that writes the finding. For example "key1=val1,key2=val2".
      name: sourceProperties
    - description: |-
        The name of a field that needs to be updated/deleted.
        The updateMask is automatically generated in the backend for the specific arguments provided in the command and only those values will be updated. To delete an attribute/property, provide its key in updateMask without specifying that field individually in the command arguments.

        Example: severity, externalUri, sourceProperties.browser.
      name: updateMask
    description: Update an organization's or source's finding using the Security Command Center v2 API.
    name: google-cloud-scc-v2-finding-update
    outputs:
    - contextPath: GoogleCloudSCC.FindingV2.name
      description: "'The relative resource name of this finding. Format: organizations/{organization}/sources/{source}/locations/{location}/findings/{finding}.'"
      type: String
