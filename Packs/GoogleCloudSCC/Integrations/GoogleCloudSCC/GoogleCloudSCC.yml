  - arguments:
    - description: |-
        The relative resource name of the mute rule (mute config) to retrieve.
        In the v2 API the name may include an optional "locations/{location}" segment. If no location is specified, the mute rule is assumed to be in "global".

        Format: organizations/{organization_id}/muteConfigs/{config_id} or organizations/{organization_id}/locations/{location_id}/muteConfigs/{config_id}

        Example: organizations/595779152576/locations/global/muteConfigs/mute-cryptomining-alerts.

        Note: Users can retrieve the mute rule name from the "Mute Config" column in the output of the "google-cloud-scc-v2-finding-list" command.
      name: name
      required: true
    description: Get a mute rule (mute config) of an organization using the Security Command Center v2 API.
    name: google-cloud-scc-mute-rule-get
    outputs:
    - contextPath: GoogleCloudSCC.MuteRule.name
      description: "Identifier of the mute rule. Format: organizations/{organization}/muteConfigs/{muteConfig} or organizations/{organization}/locations/{location}/muteConfigs/{muteConfig}."
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.description
      description: A description of the mute rule.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.filter
      description: An expression that defines the filter to apply across create/update events of findings.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.createTime
      description: The time at which the mute rule was created.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.updateTime
      description: The most recent time at which the mute rule was updated.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.mostRecentEditor
      description: Email address of the user who last edited the mute rule.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.type
      description: The type of the mute rule, which determines what type of mute state the rule affects (MUTE_CONFIG_TYPE_UNSPECIFIED, STATIC, DYNAMIC).
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.expiryTime
      description: The expiry of the mute rule. Only applicable for dynamic mute rules.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.cryptoKeyName
      description: The resource name of the Cloud KMS CryptoKey used to encrypt this configuration data, if CMEK was enabled during Security Command Center activation.
      type: String
  - arguments:
    - description: |-
        Unique identifier of the mute rule (mute config) within the parent scope.
        It must consist of only lowercase letters, numbers, and hyphens, must start with a letter, must end with either a letter or a number, and must be 63 characters or less.

        Example: mute-cryptomining-alerts.
      name: muteConfigId
      required: true
    - description: |-
        An expression that defines the filter to apply across create/update events of findings.
        While creating a filter string, be mindful of the scope in which the mute rule is being created. E.g., if a filter contains project = X but is created under the project = Y scope, it might not match any findings.

        The following field and operator combinations are supported:
        1) severity: =, :
        2) category: =, :
        3) resource.name: =, :
        4) resource.project_name: =, :
        5) resource.project_display_name: =, :
        6) resource.folders.resource_folder: =, :
        7) resource.parent_name: =, :
        8) resource.parent_display_name: =, :
        9) resource.type: =, :
        10) findingClass: =, :
        11) indicator.ip_addresses: =, :
        12) indicator.domains: =, :

        Example: severity="LOW" AND category="Malware: Cryptomining Bad IP".
      name: filter
      required: true
    - auto: PREDEFINED
      description: |-
        The type of the mute rule, which determines what type of mute state the rule affects. Immutable after creation.

        STATIC: sets the static mute state of future matching findings to muted.

        DYNAMIC: applied to existing and future matching findings, setting their dynamic mute state to muted.
      name: type
      predefined:
      - STATIC
      - DYNAMIC
      required: true
    - description: A description of the mute rule.
      name: description
    - description: |-
        The expiry of the mute rule. Only applicable for dynamic mute rules. If the expiry is set, when the mute rule expires, it is removed from all findings.

        Format: YYYY-MM-ddTHH:mm:ss.sssZ

        Example: 2026-07-22T07:10:02.782Z, 2026-06-02T15:01:23.045123456Z.
      name: expiryTime
    - auto: PREDEFINED
      description: |-
        The location in which the mute rule is created. If no location is specified, the mute rule is created in "global".
        'sa' is the location identifier of the Saudi Arabia (me-central2) region.
      name: location
      predefined:
      - global
      - us
      - eu
      - sa
    description: Create a mute rule (mute config) for an organization using the Security Command Center v2 API.
    name: google-cloud-scc-mute-rule-create
    outputs:
    - contextPath: GoogleCloudSCC.MuteRule.name
      description: "Identifier of the mute rule. Format: organizations/{organization}/muteConfigs/{muteConfig} or organizations/{organization}/locations/{location}/muteConfigs/{muteConfig}."
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.description
      description: A description of the mute rule.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.filter
      description: An expression that defines the filter to apply across create/update events of findings.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.createTime
      description: The time at which the mute rule was created.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.updateTime
      description: The most recent time at which the mute rule was updated.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.mostRecentEditor
      description: Email address of the user who last edited the mute rule.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.type
      description: The type of the mute rule, which determines what type of mute state the rule affects (MUTE_CONFIG_TYPE_UNSPECIFIED, STATIC, DYNAMIC).
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.expiryTime
      description: The expiry of the mute rule. Only applicable for dynamic mute rules.
      type: String
    - contextPath: GoogleCloudSCC.MuteRule.cryptoKeyName
      description: The resource name of the Cloud KMS CryptoKey used to encrypt this configuration data, if CMEK was enabled during Security Command Center activation.
      type: String
