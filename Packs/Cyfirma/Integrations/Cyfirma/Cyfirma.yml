name: Cyfirma
display: CYFIRMA
description: CYFIRMA is an AI-powered Preemptive External Threat Landscape Management platform that enables organizations to predict, identify, and prevent cyber threats by gaining visibility into external exposure and adversary intent. By transforming threat intelligence into predictive insights and actionable risk intelligence, CYFIRMA helps organizations reduce cyber risk, protect critical digital assets, and move from reactive defence to proactive threat prevention.
category: Data Enrichment & Threat Intelligence
provider: CYFIRMA
sectionorder:
- Connect
- Collect
commonfields:
  id: Cyfirma
  version: -1
configuration:
- display: API URL (e.g. https://api.cyfirma.com)
  name: url
  type: 0
  defaultvalue: https://api.cyfirma.com
  required: true
- display: ''
  name: api_key
  required: true
  type: 9
  displaypassword: API Key
  hiddenusername: true
- name: proxy
  type: 8
  required: false
  display: 'Use system proxy settings'
- display: Trust any certificate (not secure)
  name: insecure
  required: false
  type: 8
- display: Fetch incidents
  name: isFetch
  required: false
  type: 8
- display: Fetch Attack Surface
  name: fetchAttackSurface
  required: false
  type: 8
  defaultvalue: 'true'
- display: Fetch Brand Exposure
  name: fetchBrandExposure
  required: false
  type: 8
  defaultvalue: 'true'
- display: Fetch DataBreach & WebMonitor
  name: fetchDataBreachWebMonitor
  required: false
  type: 8
  defaultvalue: 'true'
- display: Fetch Social public exposure
  name: fetchSocialPublicExposure
  required: false
  type: 8
  defaultvalue: 'true'
- display: Include third party Alerts
  name: includeThirdParty
  required: false
  type: 8
- display: Incidents Fetch Interval
  name: incidentFetchInterval
  required: false
  type: 19
  defaultvalue: '5'
  additionalinfo: Interval in minutes/hours/days between incident fetches.
- display: How much time before the first fetch to retrieve incidents
  name: first_fetch
  defaultvalue: 60 days
  type: 15
  required: false
  options:
  - 15 days
  - 30 days
  - 60 days
  - 90 days
  - 120 days
  - 160 days
  - 180 days
  hidden: false
- defaultvalue: '100'
  display: Maximum number of incidents per fetch
  name: max_fetch
  required: false
  type: 0
  hidden: false
- display: Incident type
  name: incidentType
  type: 13
script:
  commands:
  - name: cyfirma-alert-parser
    deprecated: false
    description: Reads the cyfirmaalertdetails custom field of the current incident and writes it to Cyfirma.Alert dict. Exits with an error if the grid is empty.
    execution: true
    outputs:
    - contextPath: Cyfirma.Alert.Alertid
      description: Unique identifier of the CYFIRMA alert.
      type: String
    - contextPath: Cyfirma.Alert.Severity
      description: Severity level assigned to the alert, indicating the potential impact or risk.
      type: String
    - contextPath: Cyfirma.Alert.Category
      description: Primary category of the alert, identifying the type of security exposure or threat.
      type: String
    - contextPath: Cyfirma.Alert.Subcategory
      description: Subcategory providing more specific classification of the alert.
      type: String
    - contextPath: Cyfirma.Alert.Description
      description: Detailed description of the alert, including relevant information about the identified security exposure or threat.
      type: String
    - contextPath: Cyfirma.Alert.Ip
      description: IP address associated with the alert, if available.
      type: String
    - contextPath: Cyfirma.Alert.Domain
      description: Domain associated with the alert, if available.
      type: String
    - contextPath: Cyfirma.Alert.Subdomain
      description: Subdomain associated with the alert, if available.
      type: String
    - contextPath: Cyfirma.Alert.Thirdpartyrelated
      description: Indicates whether the alert is associated with a third-party entity or not.
      type: String
    - contextPath: Cyfirma.Alert.Exposurescore
      description: CYFIRMA exposure score associated with the alert, representing the assessed level of exposure.
      type: String
    - contextPath: Cyfirma.Alert.Firstseen
      description: Timestamp indicating when the identified exposure or threat was first observed.
      type: String
    - contextPath: Cyfirma.Alert.Lastseen
      description: Timestamp indicating when the identified exposure or threat was last observed.
      type: String

  - name: cyfirma-takedown-initiate
    description: Create a take-down request for a CYFIRMA alert.
    arguments:
    - name: object_id
      required: true
      description: The ID of the alert to take down.
    - name: comment
      description: Optional comment to send along with the take-down request.
    outputs:
    - contextPath: Cyfirma.TakeDown.take_down_id
      description: The ID of the created take-down ticket.
      type: String
    - contextPath: Cyfirma.TakeDown.message
      description: Result message of the take-down request.
      type: String

  - name: cyfirma-takedown-list
    description: List existing CYFIRMA take-down tickets.
    arguments:
    - name: domain
      description: Filter the tickets by domain. By default, all domains are returned.
    - name: size
      defaultValue: "50"
      description: Number of records per page.
    - name: page
      defaultValue: "0"
      description: Zero-based page number.
    outputs:
    - contextPath: Cyfirma.TakeDownList.ticket_id
      description: The ID of the take-down ticket.
      type: String
    - contextPath: Cyfirma.TakeDownList.sub_category
      description: The take-down sub-category.
      type: String
    - contextPath: Cyfirma.TakeDownList.created_date
      description: The date the ticket was created.
      type: String
    - contextPath: Cyfirma.TakeDownList.modified_date
      description: The date the ticket was last modified.
      type: String
    - contextPath: Cyfirma.TakeDownList.status
      description: The current status of the ticket.
      type: String
    - contextPath: Cyfirma.TakeDownList.domain
      description: The domain the ticket relates to.
      type: String
    - contextPath: Cyfirma.TakeDownList.created_by
      description: The user who created the ticket.
      type: String
    - contextPath: Cyfirma.TakeDownList.modified_by
      description: The user who last modified the ticket.
      type: String

  isfetch: true
  runonce: false
  script: '-'
  type: python
  subtype: python3
  dockerimage: demisto/fastapi:0.162.0.14169403
fromversion: 6.9.0
marketplaces:
- xsoar
- marketplacev2
tests:
- No tests (auto formatted)
