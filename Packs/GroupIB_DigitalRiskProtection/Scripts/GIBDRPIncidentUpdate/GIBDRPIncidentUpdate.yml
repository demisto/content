comment: |-
  Pre-processing rule script for Group-IB DRP violations: updates the existing incident of the violation
  in place instead of creating a duplicate, and closes it once the work on the violation is over - as
  Resolved when DRP resolved it or handed it to legal, as False Positive when DRP found it false or the
  customer rejected it. Expires the indicator created from the violation when the incident asks for it.

  This automation runs using the default Limited User role, unless you explicitly change the permissions.
  For more information, see the section about permissions here:
  https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/6.10/Cortex-XSOAR-Administrator-Guide/Automations
