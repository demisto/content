commonfields:
  id: Cloudflare Workers Event Collector
  version: -1
name: Cloudflare Workers Event Collector
display: Cloudflare Workers Event Collector
category: Analytics & SIEM
description: Collect the Cloudflare Workers script inventory, including bindings and served hostnames, and ingest it into the Cortex Platform.
configuration:
- display: Server URL
  name: url
  type: 0
  required: true
  defaultvalue: https://api.cloudflare.com/client/v4
  additionalinfo: The Cloudflare API base URL.
- display: API Token
  name: credentials
  type: 9
  required: true
  displaypassword: API Token
  hiddenusername: true
  additionalinfo: A Cloudflare API Token with the Workers Scripts Read permission, scoped to the accounts being collected. Provide the token in the password field; it is sent as a Bearer token.
- display: Account IDs
  name: account_ids
  type: 0
  required: true
  additionalinfo: Comma-separated Cloudflare account IDs to collect the Workers inventory from.
- display: Maximum number of events per fetch
  name: max_fetch
  type: 0
  required: false
  defaultvalue: "5000"
  advanced: true
  additionalinfo: The maximum number of Worker scripts to collect per account on each run.
- display: Events Fetch Interval
  name: eventFetchInterval
  type: 19
  required: false
  defaultvalue: "60"
  additionalinfo: How often the collector runs, in minutes. The Workers inventory is current configuration (a snapshot) and changes rarely, so an hourly interval is appropriate and keeps ingestion proportionate.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  advanced: true
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.13.10404775
  isfetchevents: true
  defaultEnabled: true
  commands:
  - name: cloudflare-workers-get-events
    description: Manual command to retrieve and preview the Cloudflare Workers inventory. Used for testing and development.
    arguments:
    - name: account_ids
      description: Comma-separated Cloudflare account IDs to collect from.
    - name: limit
      description: The maximum number of scripts to return per account.
      defaultValue: "50"
    - name: should_push_events
      description: If true, the fetched events are also pushed to the XSIAM dataset. Defaults to false.
      auto: PREDEFINED
      predefined:
      - "true"
      - "false"
      defaultValue: "false"
    outputs: []
fromversion: 6.8.0
defaultEnabled: true
marketplaces:
- marketplacev2
- platform
supportedModules:
- C1
- C3
- X1
- X3
- X5
- ENT_PLUS
tests:
- No tests (auto formatted)
