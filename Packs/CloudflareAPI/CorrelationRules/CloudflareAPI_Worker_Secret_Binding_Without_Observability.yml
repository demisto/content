name: Cloudflare - Worker With Secret Binding and No Observability - by GoCortexIO
description: Detects a Cloudflare Worker that holds a secret binding while observability is switched off, so code with access to a secret runs with no execution trail.
severity: SEV_030_MEDIUM
xql_query: |-
  // References
  //   https://attack.mitre.org/techniques/T1562/
  //   https://developers.cloudflare.com/workers/configuration/secrets/
  //   https://developers.cloudflare.com/workers/observability/
  datamodel dataset = cloudflare_workers_raw
  | filter xdm.target.resource.value contains "secret_binding" and xdm.target.resource.value contains "no_observability"
  | sort desc _time
  | dedup xdm.target.resource.id
  | fields xdm.observer.vendor, xdm.observer.product, xdm.observer.content_version, xdm.event.id, xdm.event.type, xdm.event.tags, xdm.event.operation, xdm.event.operation_sub_type, xdm.event.original_event_type, xdm.event.description, xdm.source.cloud.project, xdm.target.resource.type, xdm.target.resource.id, xdm.target.resource.name, xdm.target.resource.sub_type, xdm.target.resource.parent_id, xdm.target.resource.value, xdm.target.host.hostname, xdm.*
alert_name: Cloudflare Worker $xdm.target.resource.name holds a secret with observability off
alert_category: User Defined
user_defined_category: xdm.target.resource.type
alert_description: The Cloudflare Worker $xdm.target.resource.name in account $xdm.source.cloud.project holds a secret binding and has observability switched off. A binding is how a Worker reaches a secret, so this code can read credential material, and with observability off there is no execution record to reconstruct what it did with it. The exposure is the combination rather than either half. Switch observability on for this Worker, confirm the secret is still required, and rotate it if the Worker is unfamiliar. Its full binding set is in $xdm.target.resource.sub_type and the hostnames it answers on are in $xdm.target.host.hostname.
alert_domain: DOMAIN_POSTURE
mitre_defs:
  TA0005 - Defense Evasion:
  - T1562 - Impair Defenses
suppression_fields:
- xdm.target.resource.id
global_rule_id: d610486c-7fc0-4d05-ab26-a51d16bdca58
is_enabled: true
alert_type: null
alert_fields: {}
execution_mode: SCHEDULED
search_window: 3 hours
timezone: Australia/Melbourne
crontab: '25 * * * *'
suppression_enabled: true
suppression_duration: 24 hours
dataset: alerts
investigation_query_link: dataset = cloudflare_workers_raw | filter id = $xdm.target.resource.id
drilldown_query_timeframe: ALERT
mapping_strategy: AUTO
action: ALERTS
fromversion: 8.4.0
