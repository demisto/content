name: Cloudflare - Worker Serving Hostname With Threat Indicators - by GoCortexIO
description: Detects a Cloudflare Worker serving a hostname whose labels use command and control or malware vocabulary, indicating either live abuse of the account or exposed offensive test infrastructure.
severity: SEV_040_HIGH
xql_query: |-
  // References
  //   https://attack.mitre.org/techniques/T1071/
  //   https://developers.cloudflare.com/workers/configuration/routing/custom-domains/
  datamodel dataset = cloudflare_workers_raw
  | filter xdm.target.host.hostname != null
  | alter host_lc = lowercase(xdm.target.host.hostname)
  | filter host_lc contains "malware" or host_lc contains "botnet" or host_lc contains "c2." or host_lc contains "hacker" or host_lc contains "phish" or host_lc contains "exfil" or host_lc contains "backdoor"
  | sort desc _time
  | dedup xdm.target.resource.id
  | fields xdm.observer.vendor, xdm.observer.product, xdm.observer.content_version, xdm.event.id, xdm.event.type, xdm.event.tags, xdm.event.operation, xdm.event.operation_sub_type, xdm.event.original_event_type, xdm.event.description, xdm.source.cloud.project, xdm.target.resource.type, xdm.target.resource.id, xdm.target.resource.name, xdm.target.resource.sub_type, xdm.target.resource.parent_id, xdm.target.resource.value, xdm.target.host.hostname, xdm.*
alert_name: Cloudflare Worker $xdm.target.resource.name serves a hostname with threat indicators
alert_category: User Defined
user_defined_category: xdm.target.resource.type
alert_description: The Cloudflare Worker $xdm.target.resource.name serves $xdm.target.host.hostname in account $xdm.source.cloud.project. Hostname labels using command and control or malware vocabulary are almost never legitimate production naming. Treat this as either an attacker operating from the account's own edge infrastructure, or offensive test infrastructure that has been left publicly reachable. The field $xdm.event.operation_sub_type is the DEPLOYMENT CHANNEL, meaning dashboard, api or wrangler, and not a person. This inventory carries no deploying identity at all, so attribution has to come from the account audit log, where a script deploy naming this Worker does carry the actor. Then review the hostnames it answers on and inspect the script itself in the Cloudflare dashboard. If the Worker holds bindings, listed in $xdm.target.resource.sub_type, assume the data those bindings reach is exposed until proven otherwise.
alert_domain: DOMAIN_SECURITY
mitre_defs:
  TA0011 - Command and Control:
  - T1071 - Application Layer Protocol
suppression_fields:
- xdm.target.resource.id
global_rule_id: 3852f86c-9f66-4e68-a8e1-c837f1196ccc
is_enabled: true
alert_type: null
alert_fields: {}
execution_mode: SCHEDULED
search_window: 3 hours
timezone: Australia/Melbourne
crontab: '20 * * * *'
suppression_enabled: true
suppression_duration: 24 hours
dataset: alerts
investigation_query_link: dataset = cloudflare_workers_raw | filter id = $xdm.target.resource.id
drilldown_query_timeframe: ALERT
mapping_strategy: AUTO
action: ALERTS
fromversion: 8.4.0
