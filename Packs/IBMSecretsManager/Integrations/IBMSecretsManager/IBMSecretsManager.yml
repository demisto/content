category: Authentication & Identity Management
commonfields:
  id: IBMSecretsManager
  version: -1
configuration:
- name: url
  display: Cloud Logs Server URL
  type: 0
  required: true
  additionalinfo: IBM Cloud Logs API base URL for audit collection, e.g. https://{instance_guid}.api.{region}.logs.cloud.ibm.com.
  defaultvalue: https://{instance_guid}.api.{region}.logs.cloud.ibm.com
  section: Connect
- name: credentials
  display: API Key
  displaypassword: API Key
  type: 9
  required: true
  additionalinfo: The IBM Cloud IAM API key. Exchanged for a short-lived Bearer token.
  hiddenusername: true
  section: Connect
- name: iam_url
  display: IAM URL
  type: 0
  required: false
  defaultvalue: https://iam.cloud.ibm.com
  additionalinfo: IAM token endpoint. Override only for non-default IAM environments.
  section: Connect
  advanced: true
- name: isFetchEvents
  display: Fetch events
  type: 8
  required: false
  section: Collect
- name: max_events_per_fetch
  display: The maximum number of events per fetch
  type: 0
  required: false
  defaultvalue: '50000'
  additionalinfo: The maximum number of events to fetch per cycle from IBM Cloud Logs.
  section: Collect
  advanced: true
- name: insecure
  display: Trust any certificate (not secure)
  type: 8
  required: false
  section: Connect
  advanced: true
- name: proxy
  display: Use system proxy settings
  type: 8
  required: false
  section: Connect
  advanced: true
description: Collect IBM Secrets Manager audit / Activity Tracker events (via IBM Cloud Logs) into Cortex.
display: IBM Secrets Manager
name: IBMSecretsManager
script:
  commands:
  - name: ibm-secrets-manager-get-events
    description: Manual command to fetch events from IBM Secrets Manager and display them. Used mainly for debugging.
    arguments:
    - name: should_push_events
      description: If true, the fetched events are sent to Cortex. If false, only displayed.
      required: false
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    - name: limit
      description: The maximum number of events to return.
      required: false
      defaultValue: '50'
    - name: start_date
      description: 'The start of the time window to query (inclusive). Accepts an absolute date (e.g. 2026-07-13T00:00:00Z) or a relative time (e.g. 3 days). Defaults to one hour before end_date.'
      required: false
    - name: end_date
      description: 'The end of the time window to query (exclusive). Accepts an absolute date (e.g. 2026-07-13T00:00:00Z) or a relative time (e.g. 1 hour). Defaults to now.'
      required: false
    outputs: []
  runonce: false
  script: '-'
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.13.10116658
  isfetchevents: true
fromversion: 8.0.0
supportedModules:
- xsiam
marketplaces:
- platform
tests:
- No tests (auto formatted)
sectionorder:
- Connect
- Collect
