alert_category: CREDENTIAL_ACCESS
alert_description: A failed or denied MFA challenge was detected for an Idira Identity user.
alert_fields:
  userid: xdm.source.user.identifier
  actor_effective_username: xdm.source.user.username
  xdm_source_identity_username: xdm.source.user.username
  action_local_ip: xdm.source.ipv4
alert_name: Idira - MFA Failure Detected
crontab: '*/10 * * * *'
dataset: alerts
description: This rule alerts on any failed or denied MFA challenge in the CyberArk Identity Security Platform audit log, based on the modeled authentication outcome.
drilldown_query_timeframe: ALERT
execution_mode: SCHEDULED
global_rule_id: d094edf0-009b-40a2-8feb-323d307fb726
investigation_query_link: ''
mapping_strategy: CUSTOM
mitre_defs: {}
name: Idira - MFA Failure Detected
search_window: 10 minutes
severity: SEV_040_HIGH
suppression_duration: null
suppression_enabled: false
suppression_fields: null
user_defined_category: null
user_defined_severity: null
xql_query: "datamodel dataset = cyberark_isp_raw\n| filter xdm.event.type = \"authentication\" and xdm.event.original_event_type in (\"cloud.core.mfasummary\", \"cloud.core.login.multifactorchallenge.multifactorresponse\")\n| filter lowercase(xdm.event.outcome) = \"failed\"\n| fields _time, xdm.source.user.username, xdm.source.user.identifier, xdm.source.ipv4, xdm.event.original_event_type, xdm.event.description, xdm.event.outcome, xdm.event.outcome_reason"
fromversion: 8.4.0
