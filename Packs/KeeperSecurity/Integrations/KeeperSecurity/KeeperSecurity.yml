description: Use this integration to fetch audit events from the Keeper Security Admin REST API as Cortex XSIAM events.
display: Keeper Security
name: KeeperSecurity
script:
  commands:
  - arguments:
    - description: Maximum number of events to return.
      name: limit
      defaultValue: "50"
    - description: Start of the time range, for example "1 hour" or "2024-01-01T00:00:00Z". Defaults to 1 hour ago.
      name: start_date
    - description: End of the time range. Defaults to now.
      name: end_date
    - auto: PREDEFINED
      defaultValue: "false"
      description: Set this argument to true to create events from the retrieved results, otherwise they are only displayed.
      name: should_push_events
      predefined:
      - "true"
      - "false"
    description: "Gets audit events from Keeper Security. This command is used for development and debugging and might create duplicate events when should_push_events is true."
    name: keeper-security-get-events
  runonce: false
  isfetchevents: true
  script: '-'
