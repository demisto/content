commonfields:
  id: GoogleThreatIntelligenceAgentic
  version: -1
name: GoogleThreatIntelligenceAgentic
display: Google Threat Intelligence - Agentic
fromversion: 6.10.0
category: Data Enrichment & Threat Intelligence
provider: Google
sectionorder:
- Connect
description: This integration allows the security teams to automate and interact with the Google Threat Intelligence Agentic capabilities from Cortex XSOAR. It provides the ability to manage the GTI Agentic Flows and their executions, and to run investigations through the GTI Agentic Sessions.
configuration:
- displaypassword: API Key
  name: credentials
  type: 9
  required: true
  hiddenusername: true
  additionalinfo: Provide the API key of the Google Threat Intelligence platform for the authentication. Leave the username field empty and fill in the API key in the password field.
  section: Connect
- display: Group ID
  name: group_id
  type: 0
  required: false
  additionalinfo: Specify the ID of the group to which the API quota of the requests should be charged. If not provided, the quota is charged to the user that owns the API key.
  section: Connect
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  section: Connect
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
  advanced: true
script:
  script: ''
  type: python
  subtype: python3
  commands:
  - name: gti-agentic-flow-list
    description: Retrieves a list of the GTI Agentic Flows that are accessible to the configured API key, based on the provided filter arguments.
    arguments:
    - name: name
      description: The name of the Flow. The value supports a partial match.
      required: false
    - name: enabled
      description: Whether the Flow is enabled.
      auto: PREDEFINED
      predefined:
      - 'True'
      - 'False'
      required: false
    - name: filter
      description: "The filter search modifier expression.\n\nExample: 'enabled:true name:digest'.\n\nNote: The 'name' and the 'enabled' arguments are combined with an OR operator, and this argument is combined with that group using an AND operator."
      required: false
    - name: sort_field
      description: The sort field.
      auto: PREDEFINED
      predefined:
      - Name
      - Creation Date
      - Last Modification Date
      - Last Run At
      defaultValue: Last Run At
      required: false
    - name: sort_order
      description: The sort order.
      auto: PREDEFINED
      predefined:
      - Asc
      - Desc
      defaultValue: Desc
      required: false
    - name: limit
      description: The maximum number of Flows to return in a single command run. The maximum allowed value is 40.
      defaultValue: '10'
      required: false
    - name: cursor
      description: "The cursor of the page of results to retrieve.\n\nNote: Use the cursor returned by the previous run of the 'gti-agentic-flow-list' command to retrieve the next page."
      required: false
    outputs:
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.id
      description: The unique identifier of the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.type
      description: The type of the object. The value is always 'flow'.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.name
      description: The name of the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.enabled
      description: Whether the Flow is enabled and eligible to be triggered by its schedule.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.private
      description: Whether the Flow is private to the user that owns it.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.id
      description: The unique identifier of the node inside the Flow graph.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.type
      description: 'The type of the node. Possible values are: NODE_TYPE_SCHEDULE_TIME, NODE_TYPE_RUN_PROMPT, NODE_TYPE_SEND_EMAIL.'
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.name
      description: The display name of the node.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.schedule_node.cron_expression
      description: The cron expression that defines when the Flow is triggered.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.schedule_node.timezone
      description: The timezone in which the cron expression is evaluated.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.run_prompt_node.prompt
      description: The prompt that is sent to the Google Threat Intelligence agent when the node runs.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.run_prompt_node.reuse_session
      description: Whether the node reuses the existing agentic session instead of creating a new one.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.notification_emails
      description: The list of the email addresses that receive the notification.
      type: Unknown
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.email_subject
      description: The subject of the notification email.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.message
      description: The body of the notification email.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.source_node_id
      description: The unique identifier of the node the connection starts from.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.target_node_id
      description: The unique identifier of the node the connection points to.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.source_handle
      description: The handle of the source node the connection is attached to.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.trigger_state.last_run_at
      description: The date and time (UTC) when the Flow was last triggered.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.creation_date
      description: The date and time (UTC) when the Flow was created.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.last_modification_date
      description: The date and time (UTC) when the Flow was last modified.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.links.self
      description: The link of the Flow object on the Google Threat Intelligence platform.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.relationships.group.data.type
      description: The type of the group object that is related to the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.relationships.group.data.id
      description: The unique identifier of the group that owns the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.PageToken.Flow.next_cursor
      description: The cursor to be used in the 'cursor' argument of the next command runs to retrieve the next page of results.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.PageToken.Flow.total_count
      description: The total number of the records that match the given argument(s).
      type: Number
  - name: gti-agentic-flow-get
    description: Retrieves the details of a specific GTI Agentic Flow by its ID.
    arguments:
    - name: flow_id
      description: "The ID of the Flow.\n\nNote: Use the 'gti-agentic-flow-list' command to retrieve the Flow ID."
      required: true
    outputs:
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.id
      description: The unique identifier of the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.type
      description: The type of the object. The value is always 'flow'.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.name
      description: The name of the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.enabled
      description: Whether the Flow is enabled and eligible to be triggered by its schedule.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.private
      description: Whether the Flow is private to the user that owns it.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.id
      description: The unique identifier of the node inside the Flow graph.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.type
      description: 'The type of the node. Possible values are: NODE_TYPE_SCHEDULE_TIME, NODE_TYPE_RUN_PROMPT, NODE_TYPE_SEND_EMAIL.'
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.name
      description: The display name of the node.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.schedule_node.cron_expression
      description: The cron expression that defines when the Flow is triggered.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.schedule_node.timezone
      description: The timezone in which the cron expression is evaluated.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.run_prompt_node.prompt
