  - name: gti-agentic-session-create
    description: "Creates a new GTI Agentic Session by sending the first message to the Google Threat Intelligence agent, and returns the answer of the agent synchronously.\n\nNote: The agent can take several minutes to answer, hence the timeout of the command is set to 10 minutes. When the agent takes longer than 10 minutes to answer, the command returns a timeout error."
    timeout: 600
    arguments:
    - name: message
      description: The message to send to the Google Threat Intelligence agent.
      required: true
    - name: entry_id
      description: "A comma-separated list of the War Room entry IDs of the files to attach to the message as artifacts.\n\nNote: The maximum allowed size of a file is 32 MB."
      required: false
      isArray: true
    outputs:
