      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.run_prompt_node.reuse_session
      description: Whether the node reuses the existing agentic session instead of creating a new one.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.notification_emails
      description: The list of the email addresses that receive the notification.
      type: Unknown
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.email_subject
      description: The subject of the notification email.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.message
      description: The body of the notification email.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.source_node_id
      description: The unique identifier of the node the connection starts from.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.target_node_id
      description: The unique identifier of the node the connection points to.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.source_handle
      description: The handle of the source node the connection is attached to.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.trigger_state.last_run_at
      description: The date and time (UTC) when the Flow was last triggered.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.creation_date
      description: The date and time (UTC) when the Flow was created.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.last_modification_date
      description: The date and time (UTC) when the Flow was last modified.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.links.self
      description: The link of the Flow object on the Google Threat Intelligence platform.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.relationships.group.data.type
      description: The type of the group object that is related to the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.relationships.group.data.id
      description: The unique identifier of the group that owns the Flow.
      type: String
  - name: gti-agentic-flow-create
    description: Creates a new GTI Agentic Flow with the provided node and connection graph.
    arguments:
    - name: name
      description: "The name of the Flow to create."
      required: true
    - name: enabled
      description: "Whether the Flow should be enabled on creation."
      auto: PREDEFINED
      predefined:
      - 'True'
      - 'False'
      defaultValue: 'True'
      required: false
    - name: nodes
      description: "The nodes of the Flow graph as a JSON formatted list.\n\nExample: [{\"id\": \"n1\", \"type\": \"NODE_TYPE_SCHEDULE_TIME\", \"name\": \"Every morning\", \"schedule_node\": {\"cron_expression\": \"0 9 * * *\", \"timezone\": \"UTC\"}}, {\"id\": \"n2\", \"type\": \"NODE_TYPE_RUN_PROMPT\", \"name\": \"Summarise new detections\", \"run_prompt_node\": {\"prompt\": \"Summarise URLs first seen in the last 24h that are flagged malicious by 5+ engines.\", \"reuse_session\": false}}, {\"id\": \"n3\", \"type\": \"NODE_TYPE_SEND_EMAIL\", \"name\": \"Email the SOC\", \"send_email_node\": {\"notification_emails\": [\"soc@example.com\"], \"email_subject\": \"Daily malicious-URL digest\", \"message\": \"See attached summary.\"}}].\n\nNote: The graph requires a node of the 'NODE_TYPE_SCHEDULE_TIME' type and a node of the 'NODE_TYPE_RUN_PROMPT' type, and every node requires the 'id', the 'type' and the field that its type requires, which is the 'cron_expression', the 'prompt' and the 'notification_emails' field respectively.\n\nNote: When this argument is provided, the 'schedule_time', the 'schedule_frequency', the 'prompt', the 'reuse_session', the 'notification_emails', the 'email_subject' and the 'email_message' arguments are ignored.\n\nFor more information about the node types and their fields, see https://gtidocs.virustotal.com/reference/create-flow."
      required: false
    - name: connections
      description: "The connections between the Flow nodes as a JSON formatted list.\n\nExample: [{\"source_node_id\": \"n1\", \"target_node_id\": \"n2\", \"source_handle\": \"\"}, {\"source_node_id\": \"n2\", \"target_node_id\": \"n3\", \"source_handle\": \"\"}].\n\nNote: Every connection requires the 'source_node_id' and the 'target_node_id' fields, and both of them are required to refer to a node of the 'nodes' argument.\n\nNote: The connections are required to connect the node of the 'NODE_TYPE_SCHEDULE_TIME' type to a node of the 'NODE_TYPE_RUN_PROMPT' type, directly or through other nodes.\n\nNote: This argument is required when the 'nodes' argument is provided, and it is ignored otherwise.\n\nFor more information about the connection fields, see https://gtidocs.virustotal.com/reference/create-flow."
      required: false
    - name: schedule_time
      description: "The date or the time at which the Flow runs, which builds the cron expression of the schedule node along with the 'schedule_frequency' argument.\n\nFormat: An ISO 8601 date and time (YYYY-MM-DDTHH:MM:SSZ or YYYY-MM-DDTHH:MM:SS+HH:MM), a date and time (YYYY-MM-DD HH:MM), a time (HH:MM or H:MMam/pm), a relative time (tomorrow 9am) or an epoch timestamp in seconds.\n\nExample: '2026-09-25T09:00:00Z', '2026-09-25T14:30:00+05:30', '2026-09-25 09:00', '09:00', '9:30pm', 'tomorrow 9am', '1789026769'.\n\nNote: The value is converted into UTC, a value without a timezone is considered to be in UTC, and the seconds are ignored.\n\nNote: A time without a date is considered to be of today, hence the 'Weekly' and the 'Monthly' frequencies run on the weekday and the day of today.\n\nNote: This argument is required when the 'nodes' argument is not provided, and it is ignored otherwise."
      required: false
    - name: schedule_frequency
      description: "How often the Flow runs at the 'schedule_time' argument. 'Daily' runs at its time every day, 'Weekdays' every weekday from Monday to Friday, 'Weekends' every Saturday and Sunday, 'Weekly' on its weekday every week and 'Monthly' on its day every month.\n\nNote: A 'Monthly' Flow on the 29th, the 30th or the 31st day does not run in the months without that day.\n\nNote: This argument is only used along with the 'schedule_time' argument."
      auto: PREDEFINED
      predefined:
      - Daily
      - Weekdays
      - Weekends
      - Weekly
      - Monthly
      defaultValue: Daily
      required: false
    - name: prompt
      description: "The prompt that the Flow sends to the Google Threat Intelligence agent.\n\nNote: This argument is required when the 'nodes' argument is not provided, and it is ignored otherwise."
      required: false
    - name: reuse_session
      description: "Whether the prompt node reuses the existing agentic session instead of creating a new one.\n\nNote: This argument is only used when the 'nodes' argument is not provided."
      auto: PREDEFINED
      predefined:
      - 'True'
      - 'False'
      defaultValue: 'False'
      required: false
    - name: notification_emails
      description: "A comma-separated list of the email addresses that receive the result of the Flow.\n\nNote: This argument is only used when the 'nodes' argument is not provided."
      isArray: true
      required: false
    - name: email_subject
      description: "The subject of the notification email.\n\nNote: This argument is only used when the 'nodes' argument is not provided, and it requires the 'notification_emails' argument."
      required: false
    - name: email_message
      description: "The body of the notification email.\n\nNote: When this argument is not provided, the body of the email is the content that the GTI agent generates for the prompt.\n\nNote: This argument is only used when the 'nodes' argument is not provided, and it requires the 'notification_emails' argument."
      required: false
    outputs:
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.id
      description: The unique identifier of the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.type
      description: The type of the object. The value is always 'flow'.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.name
      description: The name of the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.enabled
      description: Whether the Flow is enabled and eligible to be triggered by its schedule.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.private
      description: Whether the Flow is private to the user that owns it.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.id
      description: The unique identifier of the node inside the Flow graph.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.type
      description: 'The type of the node. Possible values are: NODE_TYPE_SCHEDULE_TIME, NODE_TYPE_RUN_PROMPT, NODE_TYPE_SEND_EMAIL.'
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.name
      description: The display name of the node.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.schedule_node.cron_expression
      description: The cron expression that defines when the Flow is triggered.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.schedule_node.timezone
      description: The timezone in which the cron expression is evaluated.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.run_prompt_node.prompt
      description: The prompt that is sent to the Google Threat Intelligence agent when the node runs.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.run_prompt_node.reuse_session
      description: Whether the node reuses the existing agentic session instead of creating a new one.
      type: Boolean
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.notification_emails
      description: The list of the email addresses that receive the notification.
      type: Unknown
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.email_subject
      description: The subject of the notification email.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.nodes.send_email_node.message
      description: The body of the notification email.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.source_node_id
      description: The unique identifier of the node the connection starts from.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.target_node_id
      description: The unique identifier of the node the connection points to.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.connections.source_handle
      description: The handle of the source node the connection is attached to.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.trigger_state.last_run_at
      description: The date and time (UTC) when the Flow was last triggered.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.creation_date
      description: The date and time (UTC) when the Flow was created.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.last_modification_date
      description: The date and time (UTC) when the Flow was last modified.
      type: Date
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.links.self
      description: The link of the Flow object on the Google Threat Intelligence platform.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.relationships.group.data.type
      description: The type of the group object that is related to the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.relationships.group.data.id
      description: The unique identifier of the group that owns the Flow.
      type: String
  - name: gti-agentic-flow-update
    description: "Partially updates the name, the enabled state, the nodes or the connections of a GTI Agentic Flow. The 'nodes' and the 'connections' arguments replace the graph of the Flow, while the schedule, the prompt and the email arguments only change the provided fields of its existing nodes. Note: The schedule, the prompt and the email arguments retrieve the Flow first and send its complete list of nodes, hence the changes made to the Flow in the meantime are overwritten."
    execution: true
    arguments:
    - name: flow_id
      description: "The ID of the Flow.\n\nNote: Use the 'gti-agentic-flow-list' command to retrieve the Flow ID."
      required: true
    - name: name
      description: "The new name of the Flow."
      required: false
    - name: enabled
      description: "Whether the Flow should be enabled."
      auto: PREDEFINED
      predefined:
      - 'True'
      - 'False'
      required: false
    - name: nodes
      description: "The new nodes of the Flow graph as a JSON formatted list.\n\nExample: [{\"id\": \"n1\", \"type\": \"NODE_TYPE_SCHEDULE_TIME\", \"name\": \"Every morning\", \"schedule_node\": {\"cron_expression\": \"0 9 * * *\", \"timezone\": \"UTC\"}}, {\"id\": \"n2\", \"type\": \"NODE_TYPE_RUN_PROMPT\", \"name\": \"Summarise new detections\", \"run_prompt_node\": {\"prompt\": \"Summarise URLs first seen in the last 24h that are flagged malicious by 5+ engines.\", \"reuse_session\": false}}, {\"id\": \"n3\", \"type\": \"NODE_TYPE_SEND_EMAIL\", \"name\": \"Email the SOC\", \"send_email_node\": {\"notification_emails\": [\"soc@example.com\"], \"email_subject\": \"Daily malicious-URL digest\", \"message\": \"See attached summary.\"}}].\n\nNote: The provided list replaces the existing nodes of the Flow, hence it requires a node of the 'NODE_TYPE_SCHEDULE_TIME' type and a node of the 'NODE_TYPE_RUN_PROMPT' type, and every node requires the 'id', the 'type' and the field that its type requires, which is the 'cron_expression', the 'prompt' and the 'notification_emails' field respectively.\n\nNote: When this argument is provided without the 'connections' argument, the existing connections of the Flow are kept, hence they are required to refer to the provided nodes.\n\nNote: When this argument is provided, the 'schedule_time', the 'schedule_frequency', the 'prompt', the 'reuse_session', the 'notification_emails', the 'email_subject' and the 'email_message' arguments are ignored.\n\nFor more information about the node types and their fields, see https://gtidocs.virustotal.com/reference/update-flow."
      required: false
    - name: connections
      description: "The new connections between the Flow nodes as a JSON formatted list.\n\nExample: [{\"source_node_id\": \"n1\", \"target_node_id\": \"n2\", \"source_handle\": \"\"}, {\"source_node_id\": \"n2\", \"target_node_id\": \"n3\", \"source_handle\": \"\"}].\n\nNote: The provided list replaces the existing connections of the Flow. Every connection requires the 'source_node_id' and the 'target_node_id' fields, and both of them are required to refer to a node of the 'nodes' argument when it is provided, or to an existing node of the Flow otherwise.\n\nNote: The connections are required to connect the node of the 'NODE_TYPE_SCHEDULE_TIME' type to a node of the 'NODE_TYPE_RUN_PROMPT' type, directly or through other nodes.\n\nFor more information about the connection fields, see https://gtidocs.virustotal.com/reference/update-flow."
      required: false
    - name: schedule_time
      description: "The new date or time at which the Flow runs, which builds the cron expression of the schedule node along with the 'schedule_frequency' argument.\n\nFormat: An ISO 8601 date and time (YYYY-MM-DDTHH:MM:SSZ or YYYY-MM-DDTHH:MM:SS+HH:MM), a date and time (YYYY-MM-DD HH:MM), a time (HH:MM or H:MMam/pm), a relative time (tomorrow 9am) or an epoch timestamp in seconds.\n\nExample: '2026-09-25T09:00:00Z', '2026-09-25T14:30:00+05:30', '2026-09-25 09:00', '09:00', '9:30pm', 'tomorrow 9am', '1789026769'.\n\nNote: The value is converted into UTC, a value without a timezone is considered to be in UTC, and the seconds are ignored.\n\nNote: A time without a date is considered to be of today, hence the 'Weekly' and the 'Monthly' frequencies run on the weekday and the day of today.\n\nNote: This argument requires the 'schedule_frequency' argument, as the cron expression is built from both of them.\n\nNote: This argument is only used when the 'nodes' argument is not provided. The Flow is retrieved first, and only the cron expression of its existing schedule node is changed, along with its timezone, which is set to UTC."
      required: false
    - name: schedule_frequency
      description: "How often the Flow runs at the 'schedule_time' argument. 'Daily' runs at its time every day, 'Weekdays' every weekday from Monday to Friday, 'Weekends' every Saturday and Sunday, 'Weekly' on its weekday every week and 'Monthly' on its day every month.\n\nNote: A 'Monthly' Flow on the 29th, the 30th or the 31st day does not run in the months without that day.\n\nNote: This argument requires the 'schedule_time' argument, as the cron expression is built from both of them."
      auto: PREDEFINED
      predefined:
      - Daily
      - Weekdays
      - Weekends
      - Weekly
      - Monthly
      required: false
    - name: prompt
      description: "The new prompt that the Flow sends to the Google Threat Intelligence agent.\n\nNote: This argument is only used when the 'nodes' argument is not provided. The Flow is retrieved first, and only this field of its existing prompt node is changed."
      required: false
    - name: reuse_session
      description: "Whether the prompt node reuses the existing agentic session instead of creating a new one.\n\nNote: This argument is only used when the 'nodes' argument is not provided. The Flow is retrieved first, and only this field of its existing prompt node is changed."
      auto: PREDEFINED
      predefined:
      - 'True'
      - 'False'
      required: false
    - name: notification_emails
      description: "A comma-separated list of the email addresses that receive the result of the Flow.\n\nNote: This argument is only used when the 'nodes' argument is not provided. The Flow is retrieved first, and only this field of its existing email node is changed. When the Flow has no email node, a new one is added after the prompt node."
      isArray: true
      required: false
    - name: email_subject
      description: "The new subject of the notification email.\n\nNote: This argument is only used when the 'nodes' argument is not provided. The Flow is retrieved first, and only this field of its existing email node is changed. When the Flow has no email node, the 'notification_emails' argument is required."
      required: false
    - name: email_message
      description: "The new body of the notification email.\n\nNote: This argument is only used when the 'nodes' argument is not provided. The Flow is retrieved first, and only this field of its existing email node is changed. When the Flow has no email node, the 'notification_emails' argument is required."
      required: false
    outputs:
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.id
      description: The unique identifier of the Flow.
      type: String
    - contextPath: GoogleThreatIntelligenceAgentic.Flow.type
