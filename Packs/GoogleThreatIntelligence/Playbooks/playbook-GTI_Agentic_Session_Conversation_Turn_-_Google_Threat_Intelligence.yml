id: GTI Agentic Session Conversation Turn - Google Threat Intelligence
version: -1
name: GTI Agentic Session Conversation Turn - Google Threat Intelligence
description: This playbook performs a single turn of the conversation with the Google Threat Intelligence agent in a GTI Agentic Session. It asks the analyst for the next message, posts the message to the session and displays the answer of the agent. When the analyst does not provide a message, it marks the conversation as ended. It is meant to run in a loop from the GTI Agentic Session Interaction - Google Threat Intelligence playbook, which runs it up to 100 times.
