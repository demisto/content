id: GTI Agentic Session Interaction - Google Threat Intelligence
version: -1
name: GTI Agentic Session Interaction - Google Threat Intelligence
description: This playbook interacts with the Google Threat Intelligence agent through a GTI Agentic Session. It asks the analyst for the message when it is not provided, posts the message to the provided session, or asks the analyst whether to continue an existing session or to create a new one, and displays the answer of the agent. It then asks the analyst whether to send a follow-up message and, if so, asks for the next message after every answer, until the analyst declines or submits an empty message. Finally, it retrieves the complete conversation of the session and optionally shares the session. The playbook supports up to 100 follow-up messages after the first message.
