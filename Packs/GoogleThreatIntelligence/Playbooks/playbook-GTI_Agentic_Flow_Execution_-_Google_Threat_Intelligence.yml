id: GTI Agentic Flow Execution - Google Threat Intelligence
version: -1
name: GTI Agentic Flow Execution - Google Threat Intelligence
description: This playbook executes a GTI Agentic Flow on demand. It retrieves the details of the provided Flow ID, or retrieves up to 40 Flows and asks the analyst which Flow to execute, triggers a run of the Flow, polls the status of the Flow Execution until it reaches a terminal status, cancels the Flow Execution when the polling timeout is reached, and retrieves the related objects of the Flow Execution for further investigation.
