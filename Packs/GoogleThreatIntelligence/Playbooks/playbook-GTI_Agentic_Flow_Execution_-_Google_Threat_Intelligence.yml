      PollingCommandArgName:
        simple: execution_id
      PollingCommandName:
        simple: gti-agentic-flow-execution-get
      Timeout:
        simple: ${inputs.PollingTimeout}
      dt:
        simple: GoogleThreatIntelligenceAgentic.FlowExecution(val.status !== 'EXECUTION_STATUS_COMPLETED' && val.status !== 'EXECUTION_STATUS_FAILED' && val.status !== 'EXECUTION_STATUS_CANCELLED').id
    separatecontext: true
