      version: -1
      name: GenericPolling
      description: Polls the status of the Flow Execution until it reaches a terminal status or the timeout is reached.
      playbookName: GenericPolling
      type: playbook
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "9"
    scriptarguments:
      Ids:
        simple: ${GTIAgenticFlowExecutionID}
      Interval:
        complex:
          root: inputs.PollingInterval
          transformers:
          - operator: trim
          - operator: SetIfEmpty
            args:
              applyIfEmpty:
                value:
                  simple: "true"
              defaultValue:
                value:
                  simple: "1"
      PollingCommandArgName:
        simple: execution_id
      PollingCommandName:
        simple: gti-agentic-flow-execution-get
      Timeout:
        complex:
          root: inputs.PollingTimeout
          transformers:
          - operator: trim
          - operator: SetIfEmpty
            args:
              applyIfEmpty:
                value:
                  simple: "true"
              defaultValue:
                value:
                  simple: "60"
      dt:
        simple: GoogleThreatIntelligenceAgentic.FlowExecution(val.status !== 'EXECUTION_STATUS_COMPLETED' && val.status !== 'EXECUTION_STATUS_FAILED' && val.status !== 'EXECUTION_STATUS_CANCELLED').id
    separatecontext: true
    continueonerrortype: ""
