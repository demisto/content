commonfields:
  id: SyncXSOARCloseStatus
  version: -1
name: SyncXSOARCloseStatus
comment: Queries XSIAM for open alerts sourced from XSOAR, checks each alert's description for XSOAR close status, and resolves the XSIAM alert if the XSOAR incident was closed. Designed to run as a scheduled
  job.
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.10.14.100715
runas: DBotWeakRole
tags:
- xsoar
- xsiam
- sync
- close
enabled: true
args:
- name: xsiam_url
  description: XSIAM API URL (e.g. https://api-{tenant}.xdr.us.paloaltonetworks.com)
  required: true
- name: xsiam_api_key
  description: XSIAM API Key
  required: true
  secret: true
- name: xsiam_api_key_id
  description: XSIAM API Key ID
  required: true
- name: insecure
  description: Trust any certificate
  required: false
  defaultValue: 'false'
- name: max_alerts
  description: Maximum number of alerts to process per run
  required: false
  defaultValue: '100'
outputs:
- contextPath: XSOARCloseSync.ClosedCount
  description: Number of alerts closed.
  type: Number
- contextPath: XSOARCloseSync.SkippedCount
  description: Number of open alerts skipped.
  type: Number
- contextPath: XSOARCloseSync.ClosedAlerts
  description: Details of closed alerts.
  type: Unknown
fromversion: 6.10.0
tests:
- No tests (auto formatted)
