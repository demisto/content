commonfields:
  id: CloseFromXSOAR
  version: -1
name: CloseFromXSOAR
comment: Extracts Close Reason and Close Notes from a pushed Cortex XSOAR incident alert and closes the Cortex XSIAM case if the Cortex XSOAR incident was closed.
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.10.14.100715
runas: DBotWeakRole
tags:
- xsoar
- xsiam
- close
enabled: true
args: []
outputs:
- contextPath: XSOARExporter.Close.XSOARIncidentID
  description: The XSOAR incident ID from the alert.
  type: String
- contextPath: XSOARExporter.Close.XSOARCloseReason
  description: The close reason from XSOAR.
  type: String
- contextPath: XSOARExporter.Close.XSIAMCloseReason
  description: The mapped XSIAM close reason.
  type: String
- contextPath: XSOARExporter.Close.CloseNotes
  description: The close notes from XSOAR.
  type: String
- contextPath: XSOARExporter.Close.Action
  description: Whether the case was closed or no action was taken.
  type: String
marketplaces:
- marketplacev2
fromversion: 6.10.0
tests:
- No tests (auto formatted)
