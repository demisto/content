commonfields:
  id: XSOARIncidentExporter
  version: -1
name: XSOARIncidentExporter
display: XSOAR Incident Exporter
category: Utilities
provider: Open Source
description: Pushes Cortex XSOAR 6 or Cortex XSOAR 8 incidents to Cortex XSIAM as parsed alerts using the Insert Parsed Alerts API.
sectionorder:
- Connect
- Collect
configuration:
- display: Cortex XSOAR Server URL
  name: xsoar_url
  type: 0
  required: true
  section: Connect
  additionalinfo: The URL of the Cortex XSOAR server. For XSOAR 6 use the server IP/hostname (e.g., https://192.168.1.215). For XSOAR 8 use the API URL (e.g., https://api-{tenant}.xdr.us.paloaltonetworks.com).
- display: ""
  displaypassword: Cortex XSOAR API Key
  name: xsoar_api_key
  type: 9
  required: true
  hiddenusername: true
  section: Connect
- display: Cortex XSOAR API Key ID (XSOAR 8 only)
  name: xsoar_api_key_id
  type: 0
  required: false
  section: Connect
  additionalinfo: Required for Cortex XSOAR 8. Leave blank for XSOAR 6. The numeric API Key ID from XSOAR 8 Settings > API Keys.
- display: Cortex XSIAM API URL
  name: xsiam_url
  type: 0
  required: true
  section: Connect
  additionalinfo: The Cortex XSIAM API URL (e.g., https://api-{tenant}.xdr.us.paloaltonetworks.com).
- display: ""
  displaypassword: Cortex XSIAM API Key
  name: xsiam_api_key
  type: 9
  required: true
  hiddenusername: true
  section: Connect
- display: Cortex XSIAM API Key ID
  name: xsiam_api_key_id
  type: 0
  required: true
  section: Connect
  additionalinfo: The numeric API Key ID from Cortex XSIAM Settings > API Keys.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  defaultvalue: "false"
  section: Connect
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
  advanced: true
- display: Maximum incidents per push
  name: max_incidents
  type: 0
  required: false
  defaultvalue: "100"
  section: Collect
  additionalinfo: The maximum number of incidents to push in a single command execution.
- display: Incident query filter
  name: query
  type: 0
  required: false
  section: Collect
  additionalinfo: A Cortex XSOAR incident query to filter which incidents to push (e.g., type:Phishing).
- display: Elevate Low severity to Medium
  name: elevate_low
  type: 8
  required: false
  section: Collect
  additionalinfo: Whether to map Low severity incidents to Medium so they create cases in Cortex XSIAM instead of issues. Only Medium or higher severity alerts automatically trigger playbooks.
- display: Timestamp offset (minutes)
  name: timestamp_offset
  type: 0
  required: false
  defaultvalue: "0"
  section: Collect
  additionalinfo: Minutes to add to the original Cortex XSOAR incident timestamp. The event timestamp defaults to the Cortex XSOAR occurred/created time. Use a positive offset to shift forward. Cortex XSIAM drops alerts with timestamps too far in the past.
script:
  type: python
  subtype: python3
  script: ''
  commands:
  - name: xsoar-exporter-push-incidents
    description: Pushes Cortex XSOAR incidents matching a query to Cortex XSIAM as parsed alerts.
    arguments:
    - name: query
      description: The incident query filter to override the configured one.
      required: false
    - name: max_incidents
      description: The maximum number of incidents to push.
      required: false
    - name: from_date
      description: "The start date for incident search in ISO 8601 format (e.g., 2024-01-01T00:00:00Z)."
      required: false
    - name: to_date
      description: "The end date for incident search in ISO 8601 format (e.g., 2024-01-01T00:00:00Z)."
      required: false
    outputs:
    - contextPath: XSOARExporter.Push.PushedCount
      description: The number of incidents pushed.
      type: Number
    - contextPath: XSOARExporter.Push.Incidents
      description: The list of pushed incident IDs and names.
      type: Unknown
  - name: xsoar-exporter-push-incident
    description: Pushes a single Cortex XSOAR incident to Cortex XSIAM as a parsed alert.
    arguments:
    - name: incident_id
      description: The Cortex XSOAR incident ID to push.
      required: true
    outputs:
    - contextPath: XSOARExporter.Push.PushedIncident
      description: The details of the pushed incident.
      type: Unknown
  - name: xsoar-exporter-sync-new-incidents
    description: Finds and pushes only new Cortex XSOAR incidents that have not been synced yet.
    arguments:
    - name: query
      description: The incident query filter to override the configured one.
      required: false
    - name: max_incidents
      description: The maximum number of incidents to sync.
      required: false
    - name: from_date
      description: "The sync timestamp override in ISO 8601 format (e.g., 2024-01-01T00:00:00Z)."
      required: false
    outputs:
    - contextPath: XSOARExporter.Sync.SyncedCount
      description: The number of new incidents synced.
      type: Number
    - contextPath: XSOARExporter.Sync.Incidents
      description: The list of synced incident IDs and names.
      type: Unknown
    - contextPath: XSOARExporter.Sync.LastSyncedID
      description: The highest incident ID that has been synced.
      type: Number
  - name: xsoar-exporter-reset-sync
    description: Resets the sync state so the next sync will send all incidents.
    arguments: []
    outputs: []
  - name: xsoar-exporter-sync-close-status
    description: Queries Cortex XSIAM for open XSOAR-sourced alerts and resolves those whose XSOAR incidents are closed.
    arguments:
    - name: max_alerts
      description: The maximum number of alerts to process per run.
      required: false
    outputs:
    - contextPath: XSOARExporter.CloseSync.ClosedCount
      description: The number of alerts closed.
      type: Number
    - contextPath: XSOARExporter.CloseSync.SkippedCount
      description: The number of open alerts skipped.
      type: Number
    - contextPath: XSOARExporter.CloseSync.ClosedAlerts
      description: The details of closed alerts.
      type: Unknown
  dockerimage: demisto/python3:3.12.15.14069087
fromversion: 6.10.0
tests:
- No tests (auto formatted)
