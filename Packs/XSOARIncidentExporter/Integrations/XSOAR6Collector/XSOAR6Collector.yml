commonfields:
  id: XSOAR6Collector
  version: -1
name: XSOAR6Collector
display: XSOAR 6 Incident Collector
category: Utilities
provider: Palo Alto Networks
description: Fetches incidents from a remote Cortex XSOAR 6 instance into Cortex XSIAM.
sectionorder:
  - Connect
  - Collect
configuration:
  - display: XSOAR 6 Server URL
    name: url
    type: 0
    required: true
    section: Connect
    additionalinfo: "The XSOAR 6 server URL (e.g. https://192.168.1.215)."
  - displaypassword: XSOAR 6 API Key
    name: api_key
    type: 9
    required: true
    hiddenusername: true
    section: Connect
  - display: Trust any certificate (not secure)
    name: insecure
    type: 8
    required: false
    defaultvalue: 'false'
    section: Connect
    advanced: true
  - display: Use system proxy settings
    name: proxy
    type: 8
    required: false
    section: Connect
    advanced: true
  - display: Fetch incidents
    name: isFetch
    type: 8
    section: Collect
    required: false
  - display: Incidents Fetch Interval
    name: incidentFetchInterval
    type: 19
    defaultvalue: "1"
    section: Collect
    required: false
  - display: Incident type
    name: incident_type
    type: 13
    required: false
    section: Collect
  - display: Maximum incidents per fetch
    name: max_fetch
    type: 0
    required: false
    defaultvalue: "50"
    section: Collect
  - display: First fetch time
    name: first_fetch
    type: 0
    required: false
    defaultvalue: "3 days"
    section: Collect
    additionalinfo: "How far back to fetch incidents on first run (e.g. 3 days, 7 days, 1 month)."
  - display: Incident query filter
    name: query
    type: 0
    required: false
    section: Collect
    additionalinfo: "XSOAR 6 incident query to filter which incidents to fetch (e.g. type:Phishing)."
script:
  type: python
  subtype: python3
  script: ''
  isfetch: true
  commands:
    - name: xsoar6-get-incidents
      description: Search and retrieve incidents from the remote XSOAR 6 instance.
      arguments:
        - name: query
          description: The XSOAR incident query filter.
          required: false
        - name: limit
          description: The maximum number of incidents to return.
          required: false
          defaultValue: "50"
        - name: from_date
          description: The start date in ISO format or relative like '3 days'.
          required: false
        - name: to_date
          description: The end date in ISO format or relative.
          required: false
      outputs:
        - contextPath: XSOAR6.Incidents
          description: A list of incidents from XSOAR 6.
          type: Unknown
        - contextPath: XSOAR6.Incidents.id
          description: The incident ID.
          type: String
        - contextPath: XSOAR6.Incidents.name
          description: The incident name.
          type: String
        - contextPath: XSOAR6.Incidents.severity
          description: The incident severity.
          type: Number
        - contextPath: XSOAR6.Incidents.type
          description: The incident type.
          type: String
        - contextPath: XSOAR6.Incidents.created
          description: The incident creation date.
          type: Date
    - name: xsoar6-get-incident
      description: Get a specific incident from the remote XSOAR 6 instance by ID.
      arguments:
        - name: incident_id
          description: The XSOAR 6 incident ID.
          required: true
      outputs:
        - contextPath: XSOAR6.Incident
          description: The incident details from XSOAR 6.
          type: Unknown
  dockerimage: demisto/python3:3.10.14.100715
fromversion: 6.10.0
tests:
  - No tests (auto formatted)
