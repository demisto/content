category: Analytics & SIEM
provider: BitSight
sectionorder:
  - Connect
  - Collect
commonfields:
  id: BitSight Event Collector
  version: -1
configuration:
  - name: base_url
    display: Server URL
    required: true
    defaultvalue: https://api.bitsighttech.com
    type: 0
    additionalinfo: REST API Endpoint of BitSight server.
    section: Connect
  - display: API Key
    name: credentials
    required: true
    type: 9
    hiddenpassword: true
    section: Connect
  - additionalinfo: Optional. GUID of the company. If provided, findings for this company and its subsidiaries will be collected.
    display: Company's GUID
    name: guid
    required: false
    type: 0
    section: Connect
  - display: Trust any certificate (not secure)
    name: insecure
    required: false
    type: 8
    section: Connect
    advanced: true
  - display: Use system proxy settings
    name: proxy
    required: false
    type: 8
    section: Connect
    advanced: true
  - additionalinfo: Maximum number of findings to fetch per run.
    defaultvalue: 1000
    display: Max events per fetch
    name: max_fetch
    required: false
    type: 0
    section: Collect
  - display: Fetch events
    name: isFetchEvents
    required: false
    type: 8
    section: Collect
  - defaultvalue: 5
    display: Events Fetch Interval
    name: eventFetchInterval
    required: false
    type: 19
    section: Collect
description: Use this integration to fetch BitSight findings as events in XSIAM.
display: BitSight Event Collector
name: BitSight Event Collector
supportlevelheader: xsoar
script:
  commands:
    - arguments:
        - description: The number of events to return.
          name: limit
          defaultValue: 5
        - description: Optional. Override the Company GUID to collect for this command only.
          name: guid
        - auto: PREDEFINED
          defaultValue: "false"
          description: Set this argument to true in order to create events, otherwise the command will only display them.
          name: should_push_events
          predefined:
            - "true"
            - "false"
          required: true
        - description: 'Returns findings first seen on or after this date. Accepts free text (e.g. "2 days ago", "1 week ago") or a date (e.g. 2026-08-31). Defaults to 2 days before end_date. When start_date or end_date is provided, this date range is used instead of the default 2-day lookback.'
          name: start_date
        - description: 'Returns findings first seen on or before this date. Accepts free text (e.g. "now", "1 day ago") or a date (e.g. 2026-09-02). Defaults to now. Must not be earlier than start_date.'
          name: end_date
      description: Gets BitSight findings events from the last 2 days (48 hours) by default, or from an explicit start_date/end_date window when provided.
      name: bitsight-get-events
  runonce: false
  script: "-"
  type: python
  subtype: python3
  isfetchevents: true
  dockerimage: demisto/python3:3.12.15.14069087
marketplaces:
  - marketplacev2
  - platform
fromversion: 6.9.0
tests:
  - No tests (auto formatted)
supportedModules:
  - xsiam
