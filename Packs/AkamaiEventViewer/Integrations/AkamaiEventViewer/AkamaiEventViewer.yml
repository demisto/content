description: Use the Akamai Event Viewer integration to collect Control Center portal-visible events (such as configuration changes, login attempts, alert activity, and log deliveries) stored in the Akamai Event Logger system.
display: Akamai Event Viewer
name: AkamaiEventViewer
script:
  commands:
  - name: akamai-event-viewer-get-events
    description: Gets events from Akamai Event Viewer. This command is used for developing/debugging and is to be used with caution, as it can create events, leading to events duplication and API request limitation exceeding.
    arguments:
    - name: limit
      description: The maximum number of events to return. Maximum is 500.
      defaultValue: '50'
    - name: start_time
      description: 'The start time to fetch events from (e.g., "3 days ago", "2026-01-01T00:00:00Z"). Default is 1 minute ago.'
    - name: end_time
      description: 'The end time to fetch events until (e.g., "now", "2026-01-01T00:00:00Z"). Default is now.'
    - name: should_push_events
      description: If true, the command creates events; otherwise, it only displays them.
      auto: PREDEFINED
      defaultValue: 'false'
      predefined:
      - 'true'
      - 'false'
      required: true
    outputs: []
  runonce: false
  script: '-'
  type: python
  subtype: python3
  isfetchevents: true
  dockerimage: demisto/auth-utils:1.0.0.10133006
fromversion: 8.4.0
tests:
- No tests
marketplaces:
- marketplacev2
- platform
supportedModules:
- xsiam
