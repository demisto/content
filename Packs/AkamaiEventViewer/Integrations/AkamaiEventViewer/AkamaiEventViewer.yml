commonfields:
  id: AkamaiEventViewer
  version: -1
configuration:
- name: host
  display: Server URL
  required: true
  defaultvalue: https://akaa-xxxxxxxxxxxxxxxx-xxxxxxxxxxxxxxxx.luna.akamaiapis.net
  type: 0
  additionalinfo: The customer-specific EdgeGrid API host, e.g., https://akaa-xxxxxxxxxxxxxxxx-xxxxxxxxxxxxxxxx.luna.akamaiapis.net. The /event-viewer-api/v1 base path is appended by the integration.
  section: Connect
- name: clienttoken_creds
  type: 9
  displaypassword: Client token
  hiddenusername: true
  required: true
  section: Connect
- name: accesstoken_creds
  type: 9
  displaypassword: Access token
  hiddenusername: true
  required: true
  section: Connect
- name: clientsecret_creds
  type: 9
  displaypassword: Client secret
  hiddenusername: true
  required: true
  section: Connect
- name: account_switch_key
  display: Account switch key
  type: 0
  additionalinfo: For customers who manage more than one account. Runs the operation from another account.
  required: false
  section: Connect
  advanced: true
- name: insecure
  display: Trust any certificate (not secure)
  type: 8
  required: false
  section: Connect
  advanced: true
- name: proxy
  display: Use system proxy settings
  type: 8
  required: false
  section: Connect
  advanced: true
- name: isFetchEvents
  display: Fetch events
  type: 8
  required: false
  section: Collect
- name: event_type_names
  display: Event Type Names
  type: 0
  defaultvalue: all
  additionalinfo: A comma-separated list of event type names to fetch (for example, "All Logins,Alert Activity"). Use "all" to fetch all event types. Up to 10 event types can be selected.
  required: false
  section: Collect
- name: max_events_per_fetch
  display: The maximum number of events per fetch
  type: 0
  defaultvalue: '500'
  additionalinfo: The maximum is 500. When multiple event types are selected, the limit is shared between them.
  required: false
  section: Collect
  advanced: true
- name: eventFetchInterval
  display: Events Fetch Interval
  type: 19
  defaultvalue: '1'
  required: false
