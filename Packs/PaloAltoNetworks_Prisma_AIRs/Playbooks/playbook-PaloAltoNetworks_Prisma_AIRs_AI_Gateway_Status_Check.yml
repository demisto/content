description: |-
  Checks the health of the configured Prisma AIRS AI Gateway deployments (gateways) for a single integration instance, reports any unhealthy gateways to the War Room as a human-readable table, optionally emails a notification, and closes the incident when the run completes without errors (so it can be driven by a recurring job).

  Flow - list the deployments on the AI Gateway admin plane (filtered by status, default active). Each returned deployment carries a connection_status field, which is the health signal. Filter the inventory down to the gateways whose connection_status indicates a definite problem (present, and not "healthy" or "unknown"; unknown/unset are treated as informational). When at least one unhealthy gateway is found, write the offenders to the War Room as a table and - when email notifications are enabled and at least one recipient is configured - send an email summary.

  Auto-close vs. manual close - the healthy paths (no deployments found, or all gateways healthy) close the incident automatically (closeReason "Resolved", closeNotes "Completed") so a recurring job leaves no open incidents. The unhealthy path never auto-closes: it pauses on a manual "Validate remediation and approve to close" task so an analyst can investigate and confirm the fix before the incident is closed.

  Clone-per-tenant - every integration command is pinned to the instance named in the InstanceName input via the universal "using" argument, so this playbook can be duplicated and pointed at a different Prisma AIRS AI Gateway instance (tenant) without editing any task. Leave InstanceName empty to use the single enabled instance.
id: PaloAltoNetworks_Prisma_AIRs_AI_Gateway_Status_Check
inputs:
- key: InstanceName
  value: {}
  required: false
  description: The Prisma AIRS AI Gateway integration instance name to run every command against (universal "using" argument). Leave empty to use the single enabled instance. Set this (and clone the playbook) to check a different tenant.
  playbookInputQuery:
- key: StatusFilter
  value:
    simple: active
  required: false
  description: Which deployments to inventory and health-check. One of "active" or "archived". Defaults to active; archived gateways are intentionally disabled and are not treated as faults.
  playbookInputQuery:
- key: WorkspaceSlug
  value: {}
  required: false
  description: Optional comma-separated list of workspace slugs to narrow the deployment inventory. Leave empty to check all workspaces.
  playbookInputQuery:
- key: SendEmail
  value:
    simple: "true"
  required: false
  description: Master on/off switch for email notifications. One of "true" or "false". Email is sent only when this is true AND NotificationRecipients is non-empty AND at least one unhealthy gateway is found.
  playbookInputQuery:
- key: NotificationRecipients
  value: {}
  required: false
  description: Comma-separated email address(es) to notify. If left empty, no email is sent (the unhealthy gateways are still reported to the War Room). Requires a configured mail-sender integration on the tenant.
  playbookInputQuery:
- key: EmailSubjectPrefix
  value:
    simple: '[Prisma AIRS AI Gateway]'
  required: false
  description: Prefix added to the notification email subject. Useful for per-tenant mailbox filtering.
  playbookInputQuery:
name: PaloAltoNetworks_Prisma_AIRs_AI_Gateway_Status_Check
outputs:
- contextPath: PrismaAIRs.AIGatewayDeployment
  description: The configured gateway deployments returned by the inventory step (each row includes connection_status).
  type: unknown
- contextPath: PrismaAIRs.AIGatewayUnhealthy
  description: The subset of deployments whose connection_status indicates a definite problem (present, and not healthy or unknown).
  type: unknown
