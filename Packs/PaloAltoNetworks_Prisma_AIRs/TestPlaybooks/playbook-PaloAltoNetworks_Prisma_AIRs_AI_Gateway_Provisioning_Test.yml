description: Comprehensive test playbook for the Prisma AIRS AI Gateway integration - a linear provisioning + lifecycle flow. Each run generates a 6-char RandomString suffix appended to the scope, workspace, and config names, so every run creates brand-new, uniquely named objects that never collide with soft-archived leftovers (no find-or-create needed). Flow - list workspaces (baseline), create an IAM scope, create a workspace bound to it, list workspaces again to confirm the new one appears, get the created workspace by id, create then delete a config inside it, archive the workspace (soft delete), and finally delete the IAM scope. Exercises the data/admin-plane workspace reads, admin-plane workspace writes, control-plane config writes, and IAM-plane scope writes.
id: PaloAltoNetworks_Prisma_AIRs_AI_Gateway_Provisioning_Test
inputs:
- key: Plane
  value:
    simple: admin
  required: false
  description: The AI Gateway plane to read workspaces on (data or admin). Workspace writes are always admin-plane regardless of this input.
  playbookInputQuery:
- key: ScopeName
  value:
    simple: ws_xsoar_test
  required: false
  description: Base name of the IAM scope to create. The playbook appends "_<RandomString>" to make a per-run-unique name (EffectiveScopeName). Scope names must be lowercase alphanumerics/underscores (SCM ws_<name>_<suffix> convention), so keep this base to that charset.
  playbookInputQuery:
- key: WorkspaceName
  value:
    simple: xsoar-aigw-test-workspace
  required: false
  description: Base display name of the workspace to create. The playbook appends "-<RandomString>" to make a per-run-unique name (EffectiveWorkspaceName).
  playbookInputQuery:
- key: ConfigName
  value:
    simple: xsoar-aigw-test-config
  required: false
  description: Base name of the gateway config to create inside the new workspace. The playbook appends "-<RandomString>" to make a per-run-unique name (EffectiveConfigName).
  playbookInputQuery:
- key: ConfigDefinition
  value:
    simple: '{"retry":{"attempts":1},"cache":{"mode":"simple"}}'
  required: false
  description: The gateway config definition (JSON) to use when creating the config.
  playbookInputQuery:
name: PaloAltoNetworks_Prisma_AIRs_AI_Gateway_Provisioning_Test
