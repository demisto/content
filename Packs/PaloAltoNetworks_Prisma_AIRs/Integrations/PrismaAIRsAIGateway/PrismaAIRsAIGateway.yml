description: Manage Palo Alto Networks Prisma AIRS AI Gateway governance resources, including guardrails, gateway configs, deployments, rate- and usage-limit policies, secret references, and MCP servers and integrations.
display: Palo Alto Networks Prisma AIRS - AI Gateway
name: Palo Alto Networks Prisma AIRS - AI Gateway
script:
  commands:
  - name: prisma-airs-aigateway-guardrails-list
    description: Lists guardrails on the AI Gateway control plane.
    arguments:
    - name: workspace_id
      description: The workspace ID to list guardrails for. Required; omitting it returns a 404 (errorCode AB02).
      required: true
    - name: page_size
      description: The number of results to return per page.
      defaultValue: '50'
    - name: current_page
      description: The page number to retrieve.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrail.id
      description: The guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.name
      description: The guardrail name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.slug
      description: The guardrail slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.target
      description: The guardrail target (llm or mcp_tools).
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.status
      description: The guardrail status (active or archived).
      type: String
  - name: prisma-airs-aigateway-guardrails-create
    description: Creates a guardrail on the AI Gateway control plane.
    arguments:
    - name: name
      required: true
      description: The guardrail name.
    - name: target
      description: The guardrail target.
      auto: PREDEFINED
      predefined:
      - llm
      - mcp_tools
    - name: workspace_id
      description: The workspace ID the guardrail belongs to.
    - name: checks
      description: A JSON array of guardrail checks. For example, '[{"id":"...","parameters":{}}]'.
    - name: actions
      description: A JSON object describing the guardrail actions.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrail.id
      description: The created guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.slug
      description: The created guardrail slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.version_id
      description: The created guardrail version ID.
      type: String
  - name: prisma-airs-aigateway-guardrails-get
    description: Retrieves a guardrail by ID from the AI Gateway control plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrail.id
      description: The guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.name
      description: The guardrail name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.slug
      description: The guardrail slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.target
      description: The guardrail target.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.status
      description: The guardrail status.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.workspace_id
      description: The workspace ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.created_at
      description: The creation timestamp.
      type: Date
  - name: prisma-airs-aigateway-guardrails-update
    description: Updates a guardrail on the AI Gateway control plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
    - name: name
      description: The updated guardrail name.
    - name: checks
      description: A JSON array of guardrail checks.
    - name: actions
      description: A JSON object describing the guardrail actions.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrail.id
      description: The guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.slug
      description: The guardrail slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrail.version_id
      description: The new guardrail version ID.
      type: String
  - name: prisma-airs-aigateway-guardrails-delete
    execution: true
    description: Deletes a guardrail from the AI Gateway control plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
  - name: prisma-airs-aigateway-guardrails-catalog
    description: Lists the available guardrail evaluators and their parameter schemas (the catalog of check types), not configured guardrail instances. Uses the AI Gateway admin plane.
    arguments: []
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrailCatalog.id
      description: The guardrail evaluator ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrailCatalog.name
      description: The guardrail evaluator name.
      type: String
  - name: prisma-airs-aigateway-guardrails-mcp-servers-list
    description: Lists the MCP server mappings attached to a guardrail on the AI Gateway control plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServer.id
      description: The mapping ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServer.guardrail_id
      description: The guardrail ID the mapping belongs to.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServer.mcp_server_id
      description: The mapped MCP server ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServer.run_on
      description: The stages the guardrail runs on for this MCP server.
      type: Unknown
  - name: prisma-airs-aigateway-guardrails-mcp-servers-sync
    description: Replaces all MCP server mappings on a guardrail in one bulk sync on the AI Gateway control plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
    - name: mcp_servers
      required: true
      description: 'A JSON object keyed by MCP server ID, each value an object with optional run_on and mcp_integration_capability_ids arrays. Example: {"<mcp_server_id>": {"run_on": ["request"], "mcp_integration_capability_ids": []}}.'
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerSync.guardrail_id
      description: The guardrail ID that was synced.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerSync.changed
      description: Whether any mapping changed.
      type: Boolean
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerSync.added
      description: The number of mappings added.
      type: Number
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerSync.updated
      description: The number of mappings updated.
      type: Number
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerSync.removed
      description: The number of mappings removed.
      type: Number
  - name: prisma-airs-aigateway-guardrails-mcp-server-set
    description: Enables or disables a single MCP server mapping on a guardrail on the AI Gateway control plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
    - name: mcp_server_id
      required: true
      description: The MCP server ID to map.
    - name: run_on
      description: A comma-separated list of stages the guardrail runs on for this MCP server.
      isArray: true
    - name: mcp_integration_capability_ids
      description: A comma-separated list of MCP integration capability IDs to scope the mapping to.
      isArray: true
    outputs:
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerMapping.map_id
      description: The mapping ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerMapping.guardrail_id
      description: The guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayGuardrailMcpServerMapping.mcp_server_id
      description: The mapped MCP server ID.
      type: String
  - name: prisma-airs-aigateway-org-guardrails-list
    description: Lists organization-level guardrails on the AI Gateway admin plane.
    arguments:
    - name: workspace_id
      description: Filters guardrails by workspace ID.
    - name: page_size
      description: The number of results to return per page.
      defaultValue: '50'
    - name: current_page
      description: The page number to retrieve.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.id
      description: The guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.name
      description: The guardrail name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.slug
      description: The guardrail slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.status
      description: The guardrail status.
      type: String
  - name: prisma-airs-aigateway-org-guardrails-create
    description: Creates an organization-level guardrail on the AI Gateway admin plane.
    arguments:
    - name: name
      required: true
      description: The guardrail name.
    - name: target
      description: The guardrail target.
      auto: PREDEFINED
      predefined:
      - llm
      - mcp_tools
    - name: workspace_id
      description: The workspace ID the guardrail belongs to.
    - name: checks
      description: A JSON array of guardrail checks.
    - name: actions
      description: A JSON object describing the guardrail actions.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.id
      description: The created guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.slug
      description: The created guardrail slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.version_id
      description: The created guardrail version ID.
      type: String
  - name: prisma-airs-aigateway-org-guardrails-get
    description: Retrieves an organization-level guardrail by ID from the AI Gateway admin plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.id
      description: The guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.name
      description: The guardrail name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.status
      description: The guardrail status.
      type: String
  - name: prisma-airs-aigateway-org-guardrails-update
    description: Updates an organization-level guardrail on the AI Gateway admin plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
    - name: name
      description: The updated guardrail name.
    - name: checks
      description: A JSON array of guardrail checks.
    - name: actions
      description: A JSON object describing the guardrail actions.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.id
      description: The guardrail ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayOrgGuardrail.version_id
      description: The new guardrail version ID.
      type: String
  - name: prisma-airs-aigateway-org-guardrails-delete
    execution: true
    description: Deletes an organization-level guardrail from the AI Gateway admin plane.
    arguments:
    - name: guardrail_id
      required: true
      description: The guardrail ID.
  - name: prisma-airs-aigateway-configs-list
    description: Lists gateway configs on the AI Gateway control plane.
    arguments:
    - name: workspace_id
      required: true
      description: The workspace ID to list configs for. Required; omitting it returns a 404 (errorCode AB02).
    - name: page_size
      description: The number of results to return per page.
      defaultValue: '50'
    - name: current_page
      description: The page number to retrieve.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayConfig.id
      description: The config ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayConfig.name
      description: The config name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayConfig.slug
      description: The config slug.
      type: String
  - name: prisma-airs-aigateway-configs-create
    description: Creates a gateway config on the AI Gateway control plane.
    arguments:
    - name: name
      description: The config name.
    - name: config
      description: A JSON object describing the config definition.
    - name: workspace_id
      description: The workspace ID the config belongs to.
      required: true
    outputs:
    - contextPath: PrismaAIRs.AIGatewayConfig.id
      description: The created config ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayConfig.slug
      description: The created config slug.
      type: String
  - name: prisma-airs-aigateway-configs-get
    description: Retrieves a gateway config by ID from the AI Gateway control plane.
    arguments:
    - name: config_id
      required: true
      description: The config ID (UUID) from prisma-airs-aigateway-configs-list. Must be the UUID, not the slug; a slug returns a 404 (errorCode AB02).
    outputs:
    - contextPath: PrismaAIRs.AIGatewayConfig.id
      description: The config ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayConfig.name
      description: The config name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayConfig.slug
      description: The config slug.
      type: String
  - name: prisma-airs-aigateway-configs-update
    description: Updates a gateway config on the AI Gateway control plane.
    arguments:
    - name: config_id
      required: true
      description: The config ID (UUID) from prisma-airs-aigateway-configs-list. Must be the UUID, not the slug; a slug returns a 404 (errorCode AB02).
    - name: name
      description: The updated config name.
    - name: config
      description: A JSON object describing the config definition.
    - name: status
      description: The config status.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayConfig.id
      description: The config ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayConfig.slug
      description: The config slug.
      type: String
  - name: prisma-airs-aigateway-configs-delete
    execution: true
    description: Deletes a gateway config from the AI Gateway control plane.
    arguments:
    - name: config_id
      required: true
      description: The config ID (UUID) from prisma-airs-aigateway-configs-list. Must be the UUID, not the slug; a slug returns a 404 (errorCode AB02).
  - name: prisma-airs-aigateway-config-versions-list
    description: Lists the versions of a gateway config on the AI Gateway control plane.
    arguments:
    - name: config_id
      required: true
      description: The config ID (UUID) from prisma-airs-aigateway-configs-list. Must be the UUID, not the slug; a slug returns a 404 (errorCode AB02).
    outputs:
    - contextPath: PrismaAIRs.AIGatewayConfigVersion.id
      description: The config version ID.
      type: String
  - name: prisma-airs-aigateway-deployments-list
    description: Lists deployments on the AI Gateway admin plane.
    arguments:
    - name: status
      description: Filters deployments by status.
      auto: PREDEFINED
      predefined:
      - active
      - archived
    - name: type
      description: Filters deployments by type.
      auto: PREDEFINED
      predefined:
      - production
      - non_production
    - name: workspace_slug
      description: A comma-separated list of workspace slugs to filter by.
      isArray: true
    - name: search
      description: Filters deployments by a search term.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayDeployment.id
      description: The deployment ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeployment.name
      description: The deployment name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeployment.slug
      description: The deployment slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeployment.type
      description: The deployment type.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeployment.status
      description: The deployment status.
      type: String
  - name: prisma-airs-aigateway-deployments-create
    description: Creates a deployment on the AI Gateway admin plane.
    arguments:
    - name: name
      required: true
      description: The deployment name.
    - name: slug
      description: The deployment slug.
    - name: type
      description: The deployment type.
      auto: PREDEFINED
      predefined:
      - production
      - non_production
    - name: deployment_config
      description: A JSON object describing the deployment configuration.
    - name: is_default
      description: Whether this deployment is the default.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: auth_settings
      description: A JSON object describing the deployment auth settings.
    - name: tags
      description: A JSON object of deployment tags.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayDeployment.id
      description: The created deployment ID.
      type: String
  - name: prisma-airs-aigateway-deployments-get
    description: Retrieves a deployment by ID from the AI Gateway admin plane.
    arguments:
    - name: deployment_id
      required: true
      description: The deployment ID.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayDeployment.id
      description: The deployment ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeployment.name
      description: The deployment name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeployment.status
      description: The deployment status.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeployment.connection_status
      description: The deployment connection status.
      type: String
  - name: prisma-airs-aigateway-deployments-update
    description: Updates a deployment on the AI Gateway admin plane.
    arguments:
    - name: deployment_id
      required: true
      description: The deployment ID.
    - name: name
      description: The updated deployment name.
    - name: type
      description: The deployment type.
      auto: PREDEFINED
      predefined:
      - production
      - non_production
    - name: status
      description: The deployment status.
      auto: PREDEFINED
      predefined:
      - active
      - archived
    - name: deployment_config
      description: A JSON object describing the deployment configuration.
    - name: is_default
      description: Whether this deployment is the default.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: rotate_auth
      description: Whether to rotate the deployment auth credentials.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: override_existing
      description: Whether to override the existing deployment configuration.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: auth_settings
      description: A JSON object describing the deployment auth settings.
    - name: tags
      description: A JSON object of deployment tags.
  - name: prisma-airs-aigateway-deployments-delete
    execution: true
    description: Deletes a deployment from the AI Gateway admin plane.
    arguments:
    - name: deployment_id
      required: true
      description: The deployment ID.
  - name: prisma-airs-aigateway-deployment-ping
    description: Pings a deployment to check its connectivity and health on the AI Gateway admin plane.
    arguments:
    - name: deployment_id
      required: true
      description: The deployment ID.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayDeploymentPing.deployment_id
      description: The deployment ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeploymentPing.status
      description: The deployment health status (healthy, partial, or unhealthy).
      type: String
    - contextPath: PrismaAIRs.AIGatewayDeploymentPing.gateway_base_url
      description: The gateway base URL.
      type: String
  - name: prisma-airs-aigateway-rate-limit-policies-list
    description: Lists rate-limit policies on the AI Gateway control plane.
    arguments:
    - name: workspace_id
      description: The workspace ID to list rate-limit policies for. Required; omitting it returns a 404 (errorCode AB02).
      required: true
    - name: status
      description: Filters policies by status.
      auto: PREDEFINED
      predefined:
      - active
      - archived
    - name: type
      description: Filters policies by type.
      auto: PREDEFINED
      predefined:
      - requests
      - tokens
    - name: unit
      description: Filters policies by unit.
      auto: PREDEFINED
      predefined:
      - rpm
      - rph
      - rpd
      - rpw
    - name: target
      description: Filters policies by target.
      auto: PREDEFINED
      predefined:
      - llm
      - mcp_tools
    - name: page_size
      description: The number of results to return per page.
      defaultValue: '50'
    - name: current_page
      description: The page number to retrieve.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.id
      description: The policy ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.name
      description: The policy name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.type
      description: The policy type.
      type: String
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.unit
      description: The policy unit.
      type: String
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.value
      description: The policy limit value.
      type: Number
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.status
      description: The policy status.
      type: String
  - name: prisma-airs-aigateway-rate-limit-policies-create
    description: Creates a rate-limit policy on the AI Gateway control plane.
    arguments:
    - name: name
      description: The policy name.
    - name: conditions
      required: true
      description: A JSON array of policy conditions.
    - name: group_by
      required: true
      description: A JSON array describing how usage is grouped.
    - name: type
      required: true
      description: The policy type.
      auto: PREDEFINED
      predefined:
      - requests
      - tokens
    - name: unit
      required: true
      description: The policy unit.
      auto: PREDEFINED
      predefined:
      - rpm
      - rph
      - rpd
      - rpw
    - name: value
      required: true
      description: The rate-limit value.
    - name: target
      description: The policy target.
      auto: PREDEFINED
      predefined:
      - llm
      - mcp_tools
    - name: workspace_id
      description: The workspace ID the policy belongs to.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.id
      description: The created policy ID.
      type: String
  - name: prisma-airs-aigateway-rate-limit-policies-get
    description: Retrieves a rate-limit policy by ID from the AI Gateway control plane.
    arguments:
    - name: policy_id
      required: true
      description: The policy ID.
    - name: status
      description: Filters by policy status.
      auto: PREDEFINED
      predefined:
      - active
      - archived
    outputs:
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.id
      description: The policy ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.name
      description: The policy name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.value
      description: The policy limit value.
      type: Number
    - contextPath: PrismaAIRs.AIGatewayRateLimitPolicy.status
      description: The policy status.
      type: String
  - name: prisma-airs-aigateway-rate-limit-policies-update
    description: Updates a rate-limit policy on the AI Gateway control plane.
    arguments:
    - name: policy_id
      required: true
      description: The policy ID.
    - name: name
      description: The updated policy name.
    - name: unit
      description: The policy unit.
      auto: PREDEFINED
      predefined:
      - rpm
      - rph
      - rpd
      - rpw
    - name: value
      description: The rate-limit value.
    - name: conditions
      description: A JSON array of policy conditions.
  - name: prisma-airs-aigateway-rate-limit-policies-delete
    execution: true
    description: Deletes a rate-limit policy from the AI Gateway control plane.
    arguments:
    - name: policy_id
      required: true
      description: The policy ID.
  - name: prisma-airs-aigateway-usage-limit-policies-list
    description: Lists usage-limit policies on the AI Gateway control plane.
    arguments:
    - name: workspace_id
      description: The workspace ID to list usage-limit policies for. Required; omitting it returns a 404 (errorCode AB02).
      required: true
    - name: status
      description: Filters policies by status.
      auto: PREDEFINED
      predefined:
