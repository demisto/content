    - name: default_provider_slug
      description: Slug for the default provider when create_default_provider is set.
    - name: pricing_adjustments
      description: Pricing adjustment settings (JSON).
    outputs:
    - contextPath: PrismaAIRs.AIGatewayIntegration.id
      description: The created integration ID.
      type: String
    - contextPath: PrismaAIRs.AIGatewayIntegration.slug
      description: The created integration slug.
      type: String
  - name: prisma-airs-aigateway-integrations-update
    description: Updates a credential integration on the AI Gateway admin plane. Provide at least one field.
    arguments:
    - name: integration_id
      required: true
      description: The integration UUID.
    - name: name
      description: The integration display name.
    - name: description
      description: A free-form description.
    - name: configurations
      description: Provider-specific configuration object (JSON).
    - name: key
      description: The upstream API key / credential (secret).
    - name: secret_mappings
      description: Secret mapping entries (JSON array).
    - name: pricing_adjustments
      description: Pricing adjustment settings (JSON).
