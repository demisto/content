    outputs:
    - contextPath: PrismaAIRs.AIGatewayIntegrationWorkspace.id
      description: The bound workspace ID.
      type: String
  - name: prisma-airs-aigateway-integrations-create
    description: Creates a credential integration (upstream provider binding) on the AI Gateway admin plane. Accepts secret credential material via the key/secret_mappings arguments.
    arguments:
    - name: ai_provider_id
      required: true
      description: The upstream provider UUID (from integrations-catalog).
    - name: name
      required: true
      description: The integration display name.
    - name: slug
      required: true
      description: The integration slug.
    - name: organisation_id
      description: The numeric organisation ID. Defaults to the configured tenant TSG ID when omitted.
    - name: workspace_id
      description: Optional upstream workspace scope.
    - name: description
      description: A free-form description.
    - name: configurations
      description: Provider-specific configuration object (JSON).
    - name: key
      description: The upstream API key / credential (secret).
    - name: secret_mappings
      description: Secret mapping entries (JSON array).
    - name: create_default_provider
      description: Whether to create a default provider binding for this integration.
