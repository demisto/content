      description: The workspace lifecycle state.
      type: String
  - name: prisma-airs-aigateway-workspaces-get
    description: Gets one AI Gateway workspace by UUID or slug, including its settings blocks.
    arguments:
    - name: workspace_ref
      required: true
      description: The workspace UUID or slug.
    - name: plane
      description: Which plane to read from. 'data' (default) reads workspaces the service account is scoped to; 'admin' reads a workspace outside your workspace scope.
      auto: PREDEFINED
      predefined:
      - data
      - admin
      defaultValue: data
    outputs:
    - contextPath: PrismaAIRs.AIGatewayWorkspace.id
      description: The workspace ID (UUID).
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspace.name
      description: The workspace name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspace.slug
      description: The workspace slug.
      type: String
  - name: prisma-airs-aigateway-workspaces-create
    description: 'Creates an AI Gateway workspace (admin plane). scope_name must name an IAM scope that already exists - create one first with prisma-airs-aigateway-scopes-create. The response omits status/icon/limit blocks; call prisma-airs-aigateway-workspaces-get for full detail.'
    arguments:
    - name: name
      required: true
      description: The workspace display name.
    - name: scope_name
      required: true
      description: The name of an existing SCM IAM scope that grants access to this workspace. Must already exist (see prisma-airs-aigateway-scopes-create).
    - name: description
      description: The workspace description.
    - name: icon
      description: The workspace icon identifier.
    - name: defaults
      description: 'Default settings for the workspace as a JSON object (e.g. {"config_id": "...", "allow_config_override": true, "metadata": {}}).'
    - name: users
      description: Comma-separated list of user IDs to seed as workspace members.
      isArray: true
    - name: usage_limits
      description: Usage-limit definitions as a JSON array.
    - name: rate_limits
      description: Rate-limit definitions as a JSON array.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayWorkspace.id
      description: The workspace ID (UUID).
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspace.name
      description: The workspace name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspace.slug
      description: The workspace slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspace.scope_name
      description: The SCM scope name that grants data-plane access to the workspace.
      type: String
  - name: prisma-airs-aigateway-workspaces-update
    description: Updates an AI Gateway workspace by UUID or slug (admin plane). Partial patch - supply at least one field. scope_name is not updatable here; rebind through the IAM scope instead.
    arguments:
    - name: workspace_ref
      required: true
      description: The workspace UUID or slug.
    - name: name
      description: The new workspace display name.
    - name: description
      description: The new workspace description.
    - name: icon
      description: The new workspace icon identifier.
    - name: defaults
      description: Default settings for the workspace as a JSON object.
    - name: usage_limits
      description: Usage-limit definitions as a JSON array.
    - name: rate_limits
      description: Rate-limit definitions as a JSON array.
    outputs: []
  - name: prisma-airs-aigateway-workspaces-archive
    description: 'Archives (soft-deletes) an AI Gateway workspace by UUID or slug (admin plane). This is a soft delete: a subsequent workspaces-get returns 404 (errorCode AB08), but the row is still listed by prisma-airs-aigateway-workspaces-list status=archived.'
    execution: true
    arguments:
    - name: workspace_ref
      required: true
      description: The workspace UUID or slug to archive.
    outputs: []
  - name: prisma-airs-aigateway-workspaces-provision
    description: 'Provisions a workspace end to end the way the SCM UI does (admin + IAM planes): creates the IAM scope, creates the workspace bound to that scope_name, then binds the scope to the new workspace slug. On a partial failure the scope create is rolled back (best effort) and the error reports how to recover. Use this instead of orchestrating scopes-create + workspaces-create + scopes-bind yourself.'
    arguments:
    - name: name
      required: true
      description: The workspace display name.
    - name: scope_name
      description: The IAM scope name to use. When omitted, one is generated as ws_<name>_<suffix>. Required when existing_scope is true.
    - name: existing_scope
      description: Whether to bind to a scope that already exists instead of creating one. When true, scope_name is required.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
    - name: description
      description: The workspace (and, when created, the IAM scope) description.
    - name: icon
      description: The workspace icon identifier.
    - name: defaults
      description: 'Default settings for the workspace as a JSON object (e.g. {"config_id": "...", "allow_config_override": true, "metadata": {}}).'
    - name: users
      description: Comma-separated list of user IDs to seed as workspace members.
      isArray: true
    - name: usage_limits
      description: Usage-limit definitions as a JSON array.
    - name: rate_limits
      description: Rate-limit definitions as a JSON array.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayWorkspaceProvision.workspace_slug
      description: The provisioned workspace slug.
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspaceProvision.workspace_id
      description: The provisioned workspace ID (UUID).
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspaceProvision.scope_name
      description: The IAM scope name bound to the workspace.
      type: String
    - contextPath: PrismaAIRs.AIGatewayWorkspaceProvision.scope_created
      description: Whether a new IAM scope was created (false when an existing scope was reused).
      type: Boolean
  - name: prisma-airs-aigateway-scopes-list
    description: Lists every SCM IAM scope in the tenant. Scopes are the objects a workspace's scope_name points at; unbound scopes have no resources.
    arguments: []
    outputs:
    - contextPath: PrismaAIRs.AIGatewayScope.name
      description: The scope name (the path key, e.g. ws_production_bx7qw0).
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.description
      description: The scope description.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.tsg_id
      description: The Tenant Services Group ID the scope belongs to.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.id
      description: The scope ID (name:tsg_id). Display only; the path key is the name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.resources
      description: The resources bound to the scope.
      type: Unknown
  - name: prisma-airs-aigateway-scopes-get
    description: Gets one SCM IAM scope by name.
    arguments:
    - name: name
      required: true
      description: The scope name (e.g. ws_production_bx7qw0). This is the path key, not the id (name:tsg_id).
    outputs:
    - contextPath: PrismaAIRs.AIGatewayScope.name
      description: The scope name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.description
      description: The scope description.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.tsg_id
      description: The Tenant Services Group ID the scope belongs to.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.id
      description: The scope ID (name:tsg_id).
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.resources
      description: The resources bound to the scope.
      type: Unknown
  - name: prisma-airs-aigateway-scopes-create
    description: Creates an unbound SCM IAM scope. This is step 1 of workspace provisioning; a workspace's scope_name must name a scope that already exists.
    arguments:
    - name: name
      required: true
      description: The scope name. Must be unique in the tenant, e.g. ws_production_bx7qw0.
    - name: description
      description: The scope description.
    - name: resources
      description: A JSON array of resources to bind at creation time. For example, '[{"resource_type":"workspace","resource_id":"ws-produc-985697"}]'. Usually omitted; bind later with prisma-airs-aigateway-scopes-bind.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayScope.name
      description: The created scope name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.id
      description: The created scope ID (name:tsg_id).
      type: String
  - name: prisma-airs-aigateway-scopes-update
    description: Updates an SCM IAM scope. This is a full replacement (PUT), not a patch - omitting resources unbinds everything. To add a workspace without dropping existing bindings, use prisma-airs-aigateway-scopes-bind.
    arguments:
    - name: name
      required: true
      description: The scope name (path key).
    - name: description
      description: The new scope description.
    - name: resources
      description: A JSON array of resources that fully replaces the scope's current resources. For example, '[{"resource_type":"workspace","resource_id":"ws-produc-985697"}]'.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayScope.name
      description: The scope name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.id
      description: The scope ID (name:tsg_id).
      type: String
  - name: prisma-airs-aigateway-scopes-bind
    description: Binds a workspace to an existing SCM IAM scope. This is step 3 of workspace provisioning; existing bindings are preserved. SCM binds by workspace slug, not UUID.
    arguments:
    - name: name
      required: true
      description: The scope name to bind the workspace to.
    - name: workspace_slug
      required: true
      description: The workspace slug (e.g. ws-produc-985697) to bind. Not the UUID - SCM binds by slug.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayScope.name
      description: The scope name.
      type: String
    - contextPath: PrismaAIRs.AIGatewayScope.resources
      description: The resources now bound to the scope.
      type: Unknown
  - name: prisma-airs-aigateway-scopes-delete
    execution: true
    description: Deletes an SCM IAM scope by name. Note that scope deletion is not verified upstream; the API may decline with a 404 or 405.
    arguments:
    - name: name
      required: true
      description: The scope name to delete.
  - name: prisma-airs-aigateway-integrations-catalog
    description: Lists the static provider catalog on the AI Gateway admin plane. Maps a provider slug (for example open-ai or x-ai) to the ai_provider_id UUID required when binding an integration or creating a provider.
    arguments: []
    outputs:
    - contextPath: PrismaAIRs.AIGatewayProviderCatalog.id
