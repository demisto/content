  - name: prisma-airs-aigateway-integrations-workspaces-set
    description: Bulk-sets which workspaces a credential integration is exposed to, on the AI Gateway admin plane. Provide at least one field.
    arguments:
    - name: integration_id
      required: true
      description: The integration UUID.
    - name: workspaces
      description: Workspace binding entries (JSON array).
    - name: global_workspace_access
      description: Global workspace access settings object (JSON) with enabled/rate_limits/usage_limits.
    - name: override_existing_workspace_access
      description: Whether to override existing workspace access.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: create_default_provider
      description: Whether to create a default provider binding.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: default_provider_slug
      description: Slug for the default provider when create_default_provider is set.
