  - name: prisma-airs-aigateway-integrations-models-list
    description: Lists the models bound to a credential integration on the AI Gateway admin plane.
    arguments:
    - name: integration_id
      required: true
      description: The integration UUID.
    outputs:
    - contextPath: PrismaAIRs.AIGatewayIntegrationModel.slug
      description: The model slug.
