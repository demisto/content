  - name: prisma-airs-runtime-topics-update
    description: Update an existing custom topic. WARNING - Modifying topic definition can break detection if misconfigured.
    arguments:
    - name: topic_id
      required: true
      description: The topic UUID to update.
    - name: topic_name
      required: true
      description: The topic name (can be changed or kept the same).
    - name: description
      required: false
      description: The updated description (if omitted, description remains unchanged).
    - name: examples
      required: false
      description: An updated comma-separated list of examples (if omitted, examples remain unchanged).
      isArray: true
    - name: active
      required: false
      description: Whether the topic should be active.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    outputs:
    - contextPath: PrismaAIRs.TopicUpdate.topic_id
      description: The topic UUID.
      type: String
    - contextPath: PrismaAIRs.TopicUpdate.topic_name
      description: The topic name.
      type: String
    - contextPath: PrismaAIRs.TopicUpdate.revision
      description: The topic revision number (incremented after update).
      type: Number
    - contextPath: PrismaAIRs.TopicUpdate.active
      description: Whether the topic is active.
      type: Boolean
    - contextPath: PrismaAIRs.TopicUpdate.description
      description: The topic description.
      type: String
    - contextPath: PrismaAIRs.TopicUpdate.examples
