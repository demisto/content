  - name: prisma-airs-runtime-topics-delete
    execution: true
    description: Delete a custom topic. WARNING - This action cannot be undone. Fails if topic is referenced by any security profile (use force to override).
    arguments:
    - name: topic_id
      required: true
      description: The topic UUID to delete.
    - name: force
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
      description: Whether to force-delete the topic, removing it from any referencing profiles.
    - name: updated_by
      description: The email of the user performing the deletion. Optional for force-delete.
    outputs:
    - contextPath: PrismaAIRs.TopicDeleted.topic_id
      description: The deleted topic ID.
      type: String
    - contextPath: PrismaAIRs.TopicDeleted.message
      description: The deletion confirmation message.
      type: String
    - contextPath: PrismaAIRs.TopicDeleted.deleted
      description: The boolean indicating successful deletion.
      type: Boolean
    - contextPath: PrismaAIRs.TopicDeleted.force
      description: Whether the topic was force-deleted.
      type: Boolean
  - name: prisma-airs-runtime-topics-apply
    description: Apply a topic to a security profile (additive - preserves existing topics). This command orchestrates multiple API calls to assign a custom topic to a profile's topic-guardrails configuration.
    arguments:
    - name: profile_name
      required: true
      description: The security profile name to apply the topic to.
    - name: topic_name
      required: true
      description: The topic name to apply. The topic must already exist (create with prisma-airs-runtime-topics-create).
    - name: action
      required: false
      auto: PREDEFINED
      predefined:
      - allow
      - block
      defaultValue: block
      description: The topic action. 'block' = block prompts matching this topic. 'allow' = allow prompts matching this topic.
    - name: guardrail_action
      required: false
      auto: PREDEFINED
      predefined:
      - allow
      - block
      defaultValue: block
      description: The guardrail-level default action. 'block' = block all unless explicitly allowed (requires allow topics). 'allow' = allow all unless explicitly blocked (only block topics needed).
    outputs:
    - contextPath: PrismaAIRs.TopicApplied.profile_name
      description: The security profile name.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.profile_id
      description: The security profile UUID.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.topic_name
      description: The topic name that was applied.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.topic_id
      description: The topic UUID.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.topic_revision
      description: The topic revision number (pinned to ensure consistent detection).
      type: Number
    - contextPath: PrismaAIRs.TopicApplied.action
      description: The topic action (allow or block).
      type: String
    - contextPath: PrismaAIRs.TopicApplied.guardrail_action
      description: The guardrail-level default action.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.applied
      description: The boolean indicating successful application.
      type: Boolean
  - name: prisma-airs-runtime-bulk-scan
    description: Perform bulk scanning of multiple prompts.
    arguments:
    - name: profile_name
      required: true
      description: The security profile name to use for scanning.
    - name: prompts_csv
      required: true
      description: The CSV content with prompts to scan (must include 'prompt' column header, or use newline-separated format).
    - name: session_id
      required: false
      description: The optional session ID for grouping scans in AIRS dashboard.
    outputs:
    - contextPath: PrismaAIRs.BulkScan.profile_name
      description: The security profile used.
      type: String
    - contextPath: PrismaAIRs.BulkScan.session_id
      description: The session ID.
      type: String
    - contextPath: PrismaAIRs.BulkScan.total
      description: The total prompts scanned.
      type: Number
    - contextPath: PrismaAIRs.BulkScan.blocked
      description: The number of prompts blocked.
      type: Number
    - contextPath: PrismaAIRs.BulkScan.allowed
      description: The number of prompts allowed.
      type: Number
    - contextPath: PrismaAIRs.BulkScan.errors
      description: The number of scan errors.
      type: Number
    - contextPath: PrismaAIRs.BulkScan.results
      description: The array of individual scan results.
      type: Unknown
