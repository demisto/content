  - name: prisma-airs-runtime-topics-create
    description: Create a new custom topic guardrail with examples for detection.
    arguments:
    - name: topic_name
      required: true
      description: The name for the new topic (must be unique).
    - name: description
      required: true
      description: The description of what this topic detects.
    - name: examples
      required: true
      description: A comma-separated list of example prompts/content that match this topic.
      isArray: true
    - name: active
      required: false
      description: Whether the topic should be active.
      defaultValue: 'true'
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    outputs:
