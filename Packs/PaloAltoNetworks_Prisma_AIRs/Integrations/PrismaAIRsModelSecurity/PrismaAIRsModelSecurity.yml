description: 'Scan and govern AI models with Palo Alto Networks Prisma AIRS AI Supply Chain Security: model scans, evaluations, violations, labels, model groups, and security rules.'
display: Palo Alto Networks Prisma AIRS - AI Supply Chain Security
name: Palo Alto Networks Prisma AIRS - AI Model Security
supportlevelheader: community
script:
  commands:
  - name: prisma-airs-model-security-scans-list
    description: List all model security scans.
    arguments:
    - name: limit
      required: false
      description: The maximum number of scans to return.
      defaultValue: '50'
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityScan.uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScan.model_uri
      description: The model URI that was scanned.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScan.eval_outcome
      description: The evaluation outcome (ALLOWED, BLOCKED).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScan.source_type
      description: The source type (HUGGING_FACE, LOCAL, etc.).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScan.security_group_uuid
      description: The security group UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScan.security_group_name
      description: The security group name.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScan.scan_origin
      description: The scan origin.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScan.created_at
      description: The creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityScan.updated_at
      description: The last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityScan.created_by
      description: The user who created the scan.
      type: String
  - name: prisma-airs-model-security-scans-create
    description: Create a new model security scan to check a model for supply chain security issues. Scan is asynchronous - use scans-get to poll for completion.
    arguments:
    - name: model_uri
      required: true
      description: The model URI (HuggingFace URL like https://huggingface.co/microsoft/DialoGPT-medium or local path).
    - name: security_group_uuid
      required: true
      description: The security group UUID to use for scanning.
    - name: scan_origin
      required: false
      description: The scan origin identifier.
      defaultValue: MODEL_SECURITY_API
      auto: PREDEFINED
      predefined:
      - MODEL_SECURITY_SDK
      - MODEL_SECURITY_API
      - MODEL_SECURITY_FRONTEND
      - HUGGING_FACE
    - name: model_name
      required: false
      description: The model name (optional metadata).
    - name: model_author
      required: false
      description: The model author (optional metadata).
    - name: model_version
      required: false
      description: The model version (optional metadata).
    - name: labels
      required: false
      description: 'The labels to tag the scan, as a JSON array of key/value objects, e.g. [{"key": "env", "value": "prod"}, {"key": "team", "value": "ml"}]. Keys (<=128 chars) and values (<=256 chars) must match ^[a-zA-Z0-9_-]+$.'
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.labels
      description: The labels (key/value pairs) applied to the scan.
      type: Unknown
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.model_uri
      description: The model URI that was scanned.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.security_group_uuid
      description: The security group UUID used for scanning.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.security_group_name
      description: The security group name.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.scan_origin
      description: The scan origin.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.eval_outcome
      description: The evaluation outcome (PENDING initially, then ALLOWED/BLOCKED).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.source_type
      description: The model source type.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.owner
      description: The scan owner.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.created_at
      description: The creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.updated_at
      description: The last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.rules_passed
      description: The number of rules that passed.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.rules_failed
      description: The number of rules that failed.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanCreate.total_rules
      description: The total number of rules evaluated.
      type: Number
  - name: prisma-airs-model-security-scans-get
    description: Get model security scan status and results. Use this to poll scan completion after scans-create.
    arguments:
    - name: uuid
      required: true
      description: The scan UUID to retrieve.
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityScanGet.uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.model_uri
      description: The model URI that was scanned.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.security_group_uuid
      description: The security group UUID used for scanning.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.security_group_name
      description: The security group name.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.scan_origin
      description: The scan origin.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.eval_outcome
      description: The evaluation outcome (PENDING/ALLOWED/BLOCKED).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.source_type
      description: The model source type.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.owner
      description: The scan owner.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.created_at
      description: The creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityScanGet.updated_at
      description: The last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityScanGet.created_by
      description: The user who created the scan.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.model_version_uuid
      description: The model version UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.enabled_rule_count_snapshot
      description: The snapshot of enabled rules count at scan time.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanGet.scanner_version
      description: The scanner version used.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.time_started
      description: The scan start time in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityScanGet.total_files_scanned
      description: The total files scanned.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanGet.total_files_skipped
      description: The total files skipped.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanGet.rules_passed
      description: The number of rules that passed.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanGet.rules_failed
      description: The number of rules that failed.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanGet.total_rules
      description: The total number of rules evaluated.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityScanGet.error_code
      description: The error code if scan failed.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.error_message
      description: The error message if scan failed.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityScanGet.model_formats
      description: The model file formats detected.
      type: Unknown
  - name: prisma-airs-model-security-scans-violations
    description: Get rule violations for a model security scan. Shows detailed information about which security rules failed and why.
    arguments:
    - name: uuid
      required: true
      description: The scan UUID to retrieve violations for.
    - name: limit
      required: false
      description: The maximum number of violations to return.
      defaultValue: '50'
    - name: offset
      required: false
      description: The offset for pagination.
      defaultValue: '0'
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityViolation.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.uuid
      description: The violation UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.rule_name
      description: The security rule name that failed.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.rule_description
      description: The security rule description.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.description
      description: The violation description.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.rule_instance_state
      description: The rule instance state (BLOCKING/ALLOWING).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.file
      description: The file path where violation was found.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.threat
      description: The threat type.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.threat_description
      description: The threat description.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.module
      description: The module where threat was found.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.operator
      description: The operator involved in violation.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.hash
      description: The hash of the violating file.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.rule_instance_uuid
      description: The rule instance UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.created_at
      description: The violation creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.updated_at
      description: The violation last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityViolation.violations.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolation.total_items
      description: The total number of violations available.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityViolation.limit
      description: The limit used for pagination.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityViolation.offset
      description: The offset used for pagination.
      type: Number
  - name: prisma-airs-model-security-labels-keys
    description: Get distinct label keys across all model security scans. Use for discovering available labels for filtering/organization.
    arguments:
    - name: limit
      required: false
      description: The maximum number of label keys to return.
      defaultValue: '50'
    - name: offset
      required: false
      description: The offset for pagination.
      defaultValue: '0'
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityLabelKeys.keys
      description: The list of distinct label keys.
      type: Unknown
    - contextPath: PrismaAIRs.ModelSecurityLabelKeys.total_items
      description: The total number of label keys available.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityLabelKeys.limit
      description: The limit used for pagination.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityLabelKeys.offset
      description: The offset used for pagination.
      type: Number
  - name: prisma-airs-model-security-labels-values
    description: Get distinct values for a specific label key across all model security scans. Use to discover what values exist for a given label.
    arguments:
    - name: key
      required: true
      description: The label key to get values for.
    - name: limit
      required: false
      description: The maximum number of label values to return.
      defaultValue: '50'
    - name: offset
      required: false
      description: The offset for pagination.
      defaultValue: '0'
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityLabelValues.key
      description: The label key.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityLabelValues.values
      description: The list of distinct label values.
      type: Unknown
    - contextPath: PrismaAIRs.ModelSecurityLabelValues.total_items
      description: The total number of label values available.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityLabelValues.limit
      description: The limit used for pagination.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityLabelValues.offset
      description: The offset used for pagination.
      type: Number
  - name: prisma-airs-model-security-labels-add
    description: Add labels to a model security scan for organization and filtering. Labels are key-value pairs.
    arguments:
    - name: scan_uuid
      required: true
      description: The scan UUID to add labels to.
    - name: labels
      required: true
      description: The labels to add as JSON array (e.g., '[{"key":"env","value":"prod"}]').
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityLabelsAdd.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityLabelsAdd.labels_added
      description: The labels that were added.
      type: Unknown
    - contextPath: PrismaAIRs.ModelSecurityLabelsAdd.success
      description: Whether the operation succeeded.
      type: Boolean
  - name: prisma-airs-model-security-labels-set
    description: Set labels on a model security scan, replacing all existing labels. Use this to completely update scan labels.
    arguments:
    - name: scan_uuid
      required: true
      description: The scan UUID to set labels on.
    - name: labels
      required: true
      description: The labels to set as JSON array (e.g., '[{"key":"env","value":"staging"}]'). Replaces all existing labels.
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityLabelsSet.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityLabelsSet.labels_set
      description: The labels that were set.
      type: Unknown
    - contextPath: PrismaAIRs.ModelSecurityLabelsSet.success
      description: Whether the operation succeeded.
      type: Boolean
  - name: prisma-airs-model-security-labels-delete
    execution: true
    description: Delete labels from a model security scan by key. Removes specific labels while preserving others.
    arguments:
    - name: scan_uuid
      required: true
      description: The scan UUID to delete labels from.
    - name: keys
      required: true
      isArray: true
      description: A comma-separated list of label keys to delete (e.g., "env,team"). Alternatively, a JSON array.
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityLabelsDelete.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityLabelsDelete.keys_deleted
      description: The label keys that were deleted.
      type: Unknown
    - contextPath: PrismaAIRs.ModelSecurityLabelsDelete.success
      description: Whether the operation succeeded.
      type: Boolean
  - name: prisma-airs-model-security-scans-evaluation
    description: Get a single rule evaluation by UUID. Retrieves detailed information about how a specific rule was evaluated during a scan.
    arguments:
    - name: uuid
      required: true
      description: The evaluation UUID to retrieve.
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.uuid
      description: The evaluation UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.scan_uuid
      description: The scan UUID this evaluation belongs to.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.rule_instance_uuid
      description: The rule instance UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.rule_name
      description: The security rule name.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.rule_description
      description: The security rule description.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.result
      description: The evaluation result (PASSED/FAILED/ERROR).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.violation_count
      description: The number of violations found.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.rule_instance_state
      description: The rule instance state (BLOCKING/ALLOWING/DISABLED).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.created_at
      description: The evaluation creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.updated_at
      description: The evaluation last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityEvaluation.tsg_id
      description: The tenant Service Group ID.
      type: String
  - name: prisma-airs-model-security-scans-violation
    description: Get a single violation by UUID. Retrieves detailed information about a specific security rule violation found during a scan.
    arguments:
    - name: uuid
      required: true
      description: The violation UUID to retrieve.
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.uuid
      description: The violation UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.rule_name
      description: The security rule name that failed.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.rule_description
      description: The security rule description.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.description
      description: The violation description.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.rule_instance_state
      description: The rule instance state (BLOCKING/ALLOWING).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.file
      description: The file path where violation was found.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.threat
      description: The threat type.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.threat_description
      description: The threat description.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.module
      description: The module where threat was found.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.operator
      description: The operator involved in violation.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.hash
      description: The hash of the violating file.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.rule_instance_uuid
      description: The rule instance UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.created_at
      description: The violation creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.updated_at
      description: The violation last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityViolationDetail.tsg_id
      description: The tenant Service Group ID.
      type: String
  - name: prisma-airs-model-security-scans-files
    description: Get files for a scan. Lists all files that were scanned within a model, showing file structure and scan results.
    arguments:
    - name: scan_uuid
      required: true
      description: The scan UUID to retrieve files for.
    - name: limit
      required: false
      description: The maximum number of files to return.
      defaultValue: '50'
    - name: offset
      required: false
      description: The offset for pagination.
      defaultValue: '0'
    - name: sort_field
      required: false
      description: The sort by field (path, type).
    - name: sort_dir
      required: false
      description: The sort direction (asc, desc).
    - name: type
      required: false
      description: The file type to filter results by (FILE, DIRECTORY).
    - name: result
      required: false
      description: The scan result to filter results by (SUCCESS, FAILURE).
    - name: query_path
      required: false
      description: The path prefix to filter files by.
      defaultValue: /
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityFiles.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.uuid
      description: The file entry UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.path
      description: The file path within model.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.parent_path
      description: The parent directory path.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.type
      description: The file type (FILE, DIRECTORY).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.result
      description: The scan result (SUCCESS, FAILURE).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.model_version_uuid
      description: The model version UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.blob_id
      description: The blob storage identifier.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.formats
      description: The model formats detected.
      type: Unknown
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.created_at
      description: The file entry creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.updated_at
      description: The file entry last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ModelSecurityFiles.files.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityFiles.total_items
      description: The total number of files available.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityFiles.limit
      description: The limit used for pagination.
      type: Number
    - contextPath: PrismaAIRs.ModelSecurityFiles.offset
      description: The offset used for pagination.
      type: Number
  - name: prisma-airs-model-security-scans-evaluations
    description: Get rule evaluations for a scan. Lists all rule evaluations showing which security rules passed, failed, or had errors.
    arguments:
    - name: scan_uuid
      required: true
      description: The scan UUID to retrieve evaluations for.
    - name: limit
      required: false
      description: The maximum number of evaluations to return.
      defaultValue: '50'
    - name: offset
      required: false
      description: The offset for pagination.
      defaultValue: '0'
    - name: sort_field
      required: false
      description: The sort by field (created_at, updated_at).
    - name: sort_order
      required: false
      description: The sort order (asc, desc).
    - name: result
      required: false
      description: The evaluation result to filter results by (PASSED, FAILED, ERROR).
    - name: rule_instance_uuid
      required: false
      description: The rule instance UUID to filter results by.
    outputs:
    - contextPath: PrismaAIRs.ModelSecurityEvaluations.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluations.evaluations.uuid
      description: The rule evaluation UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluations.evaluations.scan_uuid
      description: The scan UUID.
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluations.evaluations.rule_name
      description: The security rule name (e.g., Pickle Scan, Malware Scan).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluations.evaluations.result
      description: The evaluation result (PASSED, FAILED, ERROR).
      type: String
    - contextPath: PrismaAIRs.ModelSecurityEvaluations.evaluations.violation_count
      description: The number of violations detected by this rule.
      type: Number
