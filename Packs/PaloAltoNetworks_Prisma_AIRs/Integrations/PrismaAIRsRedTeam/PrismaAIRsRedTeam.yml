name: Palo Alto Networks Prisma AIRS - AI Red Teaming
supportlevelheader: community
script:
  commands:
  - name: prisma-airs-redteam-targets-list
    description: List all Red Team targets.
    arguments:
    - name: limit
      required: false
      description: The maximum number of targets to return.
      defaultValue: '50'
    - name: target_type
      required: false
      description: The target type to filter results by (e.g., API, UI, MOBILE).
    - name: status
      required: false
      description: The target status to filter results by (e.g., READY, VALIDATING, FAILED).
    outputs:
    - contextPath: PrismaAIRs.RedTeamTarget.uuid
      description: The target UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTarget.name
      description: The target name.
      type: String
    - contextPath: PrismaAIRs.RedTeamTarget.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTarget.status
      description: The target status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTarget.active
      description: Whether the target is active.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTarget.validated
      description: Whether the target has been validated.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTarget.created_at
      description: The creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.RedTeamTarget.updated_at
      description: The last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.RedTeamTarget.description
      description: The target description.
      type: String
    - contextPath: PrismaAIRs.RedTeamTarget.target_type
      description: The target type.
      type: String
    - contextPath: PrismaAIRs.RedTeamTarget.connection_type
      description: The connection type.
      type: String
    - contextPath: PrismaAIRs.RedTeamTarget.auth_type
      description: The authentication type.
      type: String
  - name: prisma-airs-redteam-targets-create
    description: Create a new Red Team target.
    arguments:
    - name: name
      required: true
      description: The target name.
    - name: description
      required: false
      description: The target description.
    - name: target_type
      required: false
      description: The target type (e.g., APPLICATION, AGENT, MODEL).
    - name: connection_type
      required: false
      description: The connection type (e.g., REST, STREAMING, WEBSOCKET).
    - name: api_endpoint_type
      required: false
      description: The API endpoint accessibility (PUBLIC, PRIVATE, NETWORK_BROKER).
    - name: response_mode
      required: false
      description: The response mode (REST, STREAMING).
    - name: session_supported
      required: false
      description: Whether the target supports sessions (true/false).
    - name: connection_params
      required: false
      description: The connection parameters as JSON string.
    - name: validate
      required: false
      description: Whether to validate target connectivity before creating.
      defaultValue: 'false'
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetCreate.uuid
      description: The target UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetCreate.name
      description: The target name.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetCreate.status
      description: The target status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetCreate.active
      description: Whether the target is active.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetCreate.validated
      description: Whether the target has been validated.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetCreate.created_at
      description: The creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
  - name: prisma-airs-redteam-targets-get
    description: Get Red Team target details by UUID.
    arguments:
    - name: uuid
      required: true
      description: The target UUID.
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetGet.uuid
      description: The target UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetGet.name
      description: The target name.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetGet.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetGet.status
      description: The target status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetGet.active
      description: Whether the target is active.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetGet.validated
      description: Whether the target has been validated.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetGet.target_type
      description: The target type.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetGet.connection_type
      description: The connection type.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetGet.profiling_status
      description: The profiling status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetGet.target_metadata
      description: The target metadata object with probe results.
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetGet.target_background
      description: The target background context.
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetGet.additional_context
      description: The additional target context.
      type: Unknown
  - name: prisma-airs-redteam-targets-update
    description: Update an existing Red Team target.
    arguments:
    - name: uuid
      required: true
      description: The target UUID.
    - name: name
      required: false
      description: The new target name.
    - name: description
      required: false
      description: The new target description.
    - name: target_type
      required: false
      description: The new target type.
    - name: connection_type
      required: false
      description: The new connection type.
    - name: connection_params
      required: false
      description: The new connection parameters as JSON string.
    - name: validate
      required: false
      description: Whether to validate target connectivity after the update.
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetUpdate.uuid
      description: The target UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetUpdate.name
      description: The target name.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetUpdate.status
      description: The target status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetUpdate.updated_at
      description: The last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
  - name: prisma-airs-redteam-targets-delete
    execution: true
    description: Delete a Red Team target.
    arguments:
    - name: uuid
      required: true
      description: The target UUID to delete.
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetDelete.uuid
      description: The deleted target UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetDelete.message
      description: The deletion confirmation message.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetDelete.status
      description: The HTTP status code.
      type: Number
  - name: prisma-airs-redteam-targets-probe
    description: Probe a Red Team target to validate connectivity and gather profiling data.
    arguments:
    - name: name
      required: true
      description: The target name.
    - name: uuid
      required: false
      description: The existing target UUID (optional, for probing existing targets).
    - name: description
      required: false
      description: The target description.
    - name: target_type
      required: false
      description: The target type.
    - name: connection_type
      required: false
      description: The connection type.
    - name: connection_params
      required: false
      description: The connection parameters as JSON string.
    - name: probe_fields
      required: false
      isArray: true
      description: A comma-separated list of fields to probe (e.g., "multi_turn,rate_limit,content_filter").
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetProbe.uuid
      description: The target UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetProbe.name
      description: The target name.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetProbe.status
      description: The target status after probing.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetProbe.validated
      description: Whether the target was validated.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetProbe.profiling_status
      description: The profiling status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetProbe.multi_turn_supported
      description: Whether multi-turn conversation is supported.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetProbe.rate_limit_enabled
      description: Whether rate limiting is enabled.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetProbe.content_filter_enabled
      description: Whether content filtering is enabled.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetProbe.target_metadata
      description: The full probe results metadata.
      type: Unknown
  - name: prisma-airs-redteam-targets-profile
    description: Get Red Team target profile (background, context, profiling status). View detailed profiling information including background context and AI-generated fields.
    arguments:
    - name: target_uuid
      required: true
      description: The target UUID to retrieve profile for.
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetProfile.target_id
      description: The target ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetProfile.target_version
      description: The target version number.
      type: Number
    - contextPath: PrismaAIRs.RedTeamTargetProfile.status
      description: The target status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetProfile.profiling_status
      description: The profiling status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetProfile.target_background
      description: The target background information (industry, use case, etc.).
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetProfile.additional_context
      description: The additional context (model details, languages, etc.).
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetProfile.ai_generated_fields
      description: The aI-generated fields from profiling.
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetProfile.other_details
      description: The other profile details.
      type: Unknown
  - name: prisma-airs-redteam-targets-update-profile
    description: Update Red Team target profile (background and additional context). Modify target background information or add additional context like model details and supported languages.
    arguments:
    - name: target_uuid
      required: true
      description: The target UUID to update.
    - name: target_background
      required: false
      description: 'The target background as JSON string. Example: {"industry": "Healthcare", "use_case": "Patient Support Chatbot"}.'
    - name: additional_context
      required: false
      description: 'The additional context as JSON string. Example: {"base_model": "GPT-4", "languages_supported": ["en", "es"]}.'
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.uuid
      description: The target UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.name
      description: The target name.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.status
      description: The target status.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.active
      description: Whether the target is active.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.validated
      description: Whether the target is validated.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.updated_at
      description: The last update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.target_background
      description: The updated target background.
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetUpdateProfile.additional_context
      description: The updated additional context.
      type: Unknown
  - name: prisma-airs-redteam-targets-metadata
    description: Get Red Team target field metadata. Returns field definitions (types, requirements, constraints) for all available target configuration fields. Useful for understanding what fields can be configured when creating or updating targets.
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetMetadata
      description: The field metadata dictionary with field definitions.
      type: Unknown
  - name: prisma-airs-redteam-targets-validate-auth
    description: Validate authentication credentials for a Red Team target provider without creating or modifying a target. Useful for verifying credentials before creating a target.
    arguments:
    - name: auth_type
      description: The authentication type to validate (for example, HEADERS, BEARER, API_KEY).
      required: true
    - name: auth_config
      description: 'The authentication configuration as a JSON object (for example: {"Authorization": "Bearer sk-xxx"}).'
      required: true
    - name: target_id
      description: The optional UUID of an existing target to validate credentials against.
    - name: network_broker_channel_uuid
      description: The optional network broker channel UUID to route the validation through.
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetAuthValidation.validated
      description: Whether the supplied credentials were successfully validated.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamTargetAuthValidation.token_preview
      description: A masked preview of the validated token, if provided.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetAuthValidation.expires_in
      description: The number of seconds until the validated token expires, if provided.
      type: Number
  - name: prisma-airs-redteam-targets-templates
    description: List Red Team target configuration templates per provider (for example, OPENAI, HUGGING_FACE, DATABRICKS, BEDROCK, REST, STREAMING, WEBSOCKET). Each template describes the connection fields expected for that target provider type.
    arguments: []
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetTemplate
      description: The provider-keyed dictionary of target configuration templates.
      type: Unknown
  - name: prisma-airs-redteam-targets-error-logs
    description: List target-profile (profiling) error logs for a Red Team target. Returns the failures recorded while Prisma AIRs was probing or profiling the target (for example, connection, probe, or authentication errors).
    arguments:
    - name: target_id
      description: The UUID of the target whose profiling error logs to retrieve.
      required: true
    - name: limit
      description: The maximum number of error-log entries to return.
      defaultValue: '50'
    - name: skip
      description: The number of entries to skip (offset) for pagination.
    - name: search
      description: Optional text to filter the error-log entries by.
    outputs:
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.created_at
      description: The timestamp when the error was recorded.
      type: Date
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.updated_at
      description: The timestamp when the error record was last updated.
      type: Date
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.job_id
      description: The scan job UUID associated with the error, if any.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.target_id
      description: The target UUID the error relates to.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.target_version
      description: The target version the error relates to.
      type: Number
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.attack_id
      description: The attack UUID associated with the error, if any.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.error_type
      description: The category of the error.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.error_source
      description: The source component that raised the error.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.error_message
      description: The human-readable error message.
      type: String
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.target_object
      description: The target object snapshot associated with the error.
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.extra_info
      description: Additional error context, if provided.
      type: Unknown
    - contextPath: PrismaAIRs.RedTeamTargetErrorLog.version
      description: The record schema version.
      type: Number
  - name: prisma-airs-redteam-instances-create
    description: Create a new Red Team tenant instance.
    arguments:
    - name: tsg_id
      required: true
      description: The Tenant Service Group ID.
    - name: tenant_id
      required: true
      description: The tenant ID.
    - name: app_id
      required: true
      description: The application ID.
    - name: region
      required: true
      description: The instance region.
    - name: tenant_instance_name
      required: false
      description: The tenant instance name.
    - name: support_account_id
      required: false
      description: The support account ID.
    - name: support_account_name
      required: false
      description: The support account name.
    - name: created_by
      required: false
      description: The identity that created the instance.
    - name: internal
      required: false
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      description: Whether the instance is internal.
    - name: iam_controlled
      required: false
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      description: Whether the instance is IAM controlled.
    - name: platform_region
      required: false
      description: The platform region.
    - name: csp_tenant_id
      required: false
      description: The cloud service provider tenant ID.
    - name: extra
      required: false
      description: The additional instance attributes as a JSON string.
    outputs:
    - contextPath: PrismaAIRs.RedTeamInstanceCreate.tenant_id
      description: The tenant ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceCreate.tsg_id
      description: The Tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceCreate.app_id
      description: The application ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceCreate.is_success
      description: Whether the instance was created successfully.
      type: Boolean
  - name: prisma-airs-redteam-instances-get
    description: Get a Red Team tenant instance by tenant ID.
    arguments:
    - name: tenant_id
      required: true
      description: The tenant ID.
    outputs:
    - contextPath: PrismaAIRs.RedTeamInstanceGet.tenant_id
      description: The tenant ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.tsg_id
      description: The Tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.app_id
      description: The application ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.region
      description: The instance region.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.tenant_instance_name
      description: The tenant instance name.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.support_account_id
      description: The support account ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.support_account_name
      description: The support account name.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.created_by
      description: The identity that created the instance.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceGet.internal
      description: Whether the instance is internal.
      type: Boolean
    - contextPath: PrismaAIRs.RedTeamInstanceGet.deployment_profiles
      description: The deployment profiles associated with the instance.
      type: Unknown
  - name: prisma-airs-redteam-instances-update
    description: Update an existing Red Team tenant instance.
    arguments:
    - name: tenant_id
      required: true
      description: The tenant ID of the instance to update.
    - name: tsg_id
      required: false
      description: The new Tenant Service Group ID.
    - name: app_id
      required: false
      description: The new application ID.
    - name: region
      required: false
      description: The new instance region.
    - name: tenant_instance_name
      required: false
      description: The new tenant instance name.
    - name: support_account_id
      required: false
      description: The new support account ID.
    - name: support_account_name
      required: false
      description: The new support account name.
    - name: created_by
      required: false
      description: The identity that created the instance.
    - name: internal
      required: false
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      description: Whether the instance is internal.
    - name: iam_controlled
      required: false
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      description: Whether the instance is IAM controlled.
    - name: platform_region
      required: false
      description: The new platform region.
    - name: csp_tenant_id
      required: false
      description: The new cloud service provider tenant ID.
    - name: extra
      required: false
      description: The additional instance attributes as a JSON string.
    outputs:
    - contextPath: PrismaAIRs.RedTeamInstanceUpdate.tenant_id
      description: The tenant ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceUpdate.tsg_id
      description: The Tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceUpdate.app_id
      description: The application ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceUpdate.is_success
      description: Whether the instance was updated successfully.
      type: Boolean
  - name: prisma-airs-redteam-instances-delete
    execution: true
    description: Delete a Red Team tenant instance. This permanently removes the instance and cannot be undone.
    arguments:
    - name: tenant_id
      required: true
      description: The tenant ID of the instance to delete.
    outputs:
    - contextPath: PrismaAIRs.RedTeamInstanceDelete.tenant_id
      description: The deleted tenant ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceDelete.tsg_id
      description: The Tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceDelete.app_id
      description: The application ID.
      type: String
    - contextPath: PrismaAIRs.RedTeamInstanceDelete.is_success
      description: Whether the instance was deleted successfully.
      type: Boolean
  - name: prisma-airs-redteam-devices-create
    description: Create one or more devices on a Red Team tenant instance. Provide a single device with serial_number, or a batch with the devices JSON array (maximum 5).
    arguments:
    - name: tenant_id
      required: true
      description: The tenant ID of the parent instance.
    - name: serial_number
      required: false
      description: The device serial number. Use this for a single device.
    - name: device_name
      required: false
      description: The device name. Applies to the single-device form.
    - name: model
      required: false
      description: The device model. Applies to the single-device form.
    - name: sku
      required: false
      description: The device SKU. Applies to the single-device form.
    - name: device_type
      required: false
      description: The device type. Applies to the single-device form.
    - name: asset_type
      required: false
      description: The device asset type. Applies to the single-device form.
    - name: support_account_id
      required: false
      description: The support account ID. Applies to the single-device form.
    - name: devices
      required: false
      description: 'The devices as a JSON array for batch operations (maximum 5). Example: [{"serial_number": "SN-0001", "device_name": "gw-1"}].'
    - name: created_by
      required: false
      description: The identity creating the devices.
    - name: app_id
      required: false
      description: The parent instance application ID. Resolved from the instance when omitted.
    - name: region
      required: false
      description: The parent instance region. Resolved from the instance when omitted.
    - name: tsg_id
      required: false
      description: The parent instance Tenant Service Group ID. Resolved from the instance when omitted.
    outputs:
    - contextPath: PrismaAIRs.RedTeamDeviceCreate.serial_number
      description: The device serial number.
      type: String
    - contextPath: PrismaAIRs.RedTeamDeviceCreate.status
      description: The per-device operation status.
      type: String
    - contextPath: PrismaAIRs.RedTeamDeviceCreate.error
      description: The per-device error message, if any.
      type: String
  - name: prisma-airs-redteam-devices-update
    description: Update one or more devices on a Red Team tenant instance. Provide a single device with serial_number, or a batch with the devices JSON array (maximum 5).
    arguments:
    - name: tenant_id
      required: true
      description: The tenant ID of the parent instance.
    - name: serial_number
      required: false
      description: The device serial number. Use this for a single device.
    - name: device_name
      required: false
      description: The new device name. Applies to the single-device form.
    - name: model
      required: false
      description: The device model. Applies to the single-device form.
    - name: sku
      required: false
      description: The device SKU. Applies to the single-device form.
    - name: device_type
      required: false
      description: The device type. Applies to the single-device form.
    - name: asset_type
      required: false
