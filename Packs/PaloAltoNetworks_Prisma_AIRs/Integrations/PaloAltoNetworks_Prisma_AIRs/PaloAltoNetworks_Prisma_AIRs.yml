  - name: prisma-airs-redteam-adapters-validate
    description: Validate a Red Team custom target adapter script end-to-end through a network broker channel without saving anything. Returns the execution outcome (validated plus stdout/stderr/traceback), not an adapter record. The channel must be ONLINE.
    arguments:
    - name: network_broker_channel_uuid
      required: true
      description: The network broker channel UUID to run the script through. Must be ONLINE.
    - name: prompt
      required: true
      description: A sample prompt used to exercise the adapter script.
    - name: script
      description: The adapter Python script as plain text (base64-encoded automatically). Use this or script_b64.
    - name: script_b64
      description: The adapter Python script, already base64-encoded. Use this or script.
    - name: variables
      description: 'A JSON array of adapter configuration variables. Each entry is an object with keys: key, value, and type (VAR or SECRET). When adapter_uuid is provided, null/redacted values resolve from that adapter''s stored secrets.'
    - name: adapter_uuid
      description: An optional existing adapter UUID whose stored secrets resolve null/redacted variable values during the run.
    outputs:
    - contextPath: PrismaAIRs.RedTeamAdapterValidation.validated
      description: Whether the adapter script executed successfully.
