  - name: prisma-airs-runtime-topics-apply
    description: Apply a topic to a security profile (additive - preserves existing topics). This command orchestrates multiple API calls to assign a custom topic to a profile's topic-guardrails configuration.
    arguments:
    - name: profile_name
      required: true
      description: The security profile name to apply the topic to.
    - name: topic_name
      required: true
      description: The topic name to apply. The topic must already exist (create with prisma-airs-runtime-topics-create).
    - name: action
      required: false
      auto: PREDEFINED
      predefined:
      - allow
      - block
      defaultValue: block
      description: The topic action. 'block' = block prompts matching this topic. 'allow' = allow prompts matching this topic.
    - name: guardrail_action
      required: false
      auto: PREDEFINED
      predefined:
      - allow
      - block
      defaultValue: block
      description: The guardrail-level default action. 'block' = block all unless explicitly allowed (requires allow topics). 'allow' = allow all unless explicitly blocked (only block topics needed).
    outputs:
    - contextPath: PrismaAIRs.TopicApplied.profile_name
      description: The security profile name.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.profile_id
      description: The security profile UUID.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.topic_name
      description: The topic name that was applied.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.topic_id
      description: The topic UUID.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.topic_revision
      description: The topic revision number (pinned to ensure consistent detection).
      type: Number
    - contextPath: PrismaAIRs.TopicApplied.action
      description: The topic action (allow or block).
      type: String
    - contextPath: PrismaAIRs.TopicApplied.guardrail_action
      description: The guardrail-level default action.
      type: String
    - contextPath: PrismaAIRs.TopicApplied.applied
      description: The boolean indicating successful application.
      type: Boolean
