  - name: prisma-airs-redteam-adapters-create
    description: Create a new Red Team custom target adapter. By default the script is run end-to-end during save (validate=true) and the adapter is saved as ACTIVE on success or DRAFT on failure. Provide the script via either the script or script_b64 argument.
    arguments:
    - name: name
      required: true
      description: The adapter name.
    - name: prompt
      required: true
      description: A sample prompt used to exercise the adapter during validation. Not stored.
    - name: script
      description: The adapter Python script as plain text. It will be base64-encoded automatically. Use this or script_b64.
    - name: script_b64
      description: The adapter Python script, already base64-encoded. Use this or script.
    - name: description
      description: An optional description for the adapter.
    - name: network_broker_channel_uuid
      description: The network broker channel UUID. Optional while the adapter is a DRAFT, required to activate it (validate=true).
    - name: variables
      description: 'A JSON array of adapter configuration variables. Each entry is an object with keys: key, value, and type (VAR or SECRET). Example: [{"key":"endpoint","value":"http://agent.svc:8080","type":"VAR"},{"key":"api_key","value":"s3cret","type":"SECRET"}].'
    - name: validate
      description: Whether to run the script end-to-end during save. When true (default) the adapter is saved ACTIVE on success or DRAFT on failure. Set to false to save as DRAFT without running the script.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'true'
    outputs:
    - contextPath: PrismaAIRs.RedTeamAdapter.uuid
      description: The created adapter UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.name
      description: The adapter name.
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.status
      description: The adapter status (DRAFT or ACTIVE).
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.network_broker_channel_uuid
      description: The network broker channel UUID used to reach the target.
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.target_count
      description: The number of targets currently referencing this adapter.
      type: Number
    - contextPath: PrismaAIRs.RedTeamAdapter.created_at
      description: The adapter creation timestamp.
      type: String
  - name: prisma-airs-redteam-adapters-update
    description: Update a Red Team custom target adapter. The upstream update is a full replacement, so the prompt argument is always required, and the variables argument (when provided) defines the complete desired variable set (omitted keys are deleted). Fields not provided are preserved from the current record; stored secrets are kept when their variables are resent unchanged.
    arguments:
    - name: uuid
      required: true
      description: The UUID of the adapter to update.
    - name: prompt
      required: true
      description: A sample prompt used to exercise the adapter during validation. Required on every update because it is not stored server-side.
    - name: name
      description: A new adapter name. Preserved from the current record when omitted.
    - name: script
      description: A new adapter Python script as plain text (base64-encoded automatically). Preserved from the current record when omitted.
    - name: script_b64
      description: A new adapter Python script, already base64-encoded. Preserved from the current record when omitted.
    - name: description
      description: A new adapter description.
    - name: network_broker_channel_uuid
      description: A new network broker channel UUID. Preserved from the current record when omitted.
    - name: variables
      description: 'A JSON array of adapter configuration variables that replaces the entire variable set. Each entry is an object with keys: key, value, and type (VAR or SECRET). Use value=null to keep a stored secret unchanged. When omitted, the stored variable set is preserved.'
    - name: validate
      description: Whether to re-run the script end-to-end during save. When true (default) the adapter is saved ACTIVE on success or DRAFT on failure. Set to false to save as DRAFT without running the script.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'true'
    outputs:
    - contextPath: PrismaAIRs.RedTeamAdapter.uuid
      description: The adapter UUID.
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.name
      description: The adapter name.
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.status
      description: The adapter status (DRAFT or ACTIVE).
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.network_broker_channel_uuid
      description: The network broker channel UUID used to reach the target.
      type: String
    - contextPath: PrismaAIRs.RedTeamAdapter.target_count
      description: The number of targets currently referencing this adapter.
      type: Number
    - contextPath: PrismaAIRs.RedTeamAdapter.updated_at
      description: The adapter last-update timestamp.
      type: String
  - name: prisma-airs-redteam-adapters-delete
    execution: true
    description: Delete a Red Team custom target adapter by UUID. This permanently removes the adapter and cannot be undone.
    arguments:
    - name: uuid
