description: Integrate with Palo Alto Networks Prisma AIRs for AI security capabilities including runtime scanning, red teaming, model security, and DLP configuration.
display: Palo Alto Networks - Prisma AIRs AI Security
name: Palo Alto Networks - Prisma AIRs AI Security
supportlevelheader: community
script:
  commands:
  - name: prisma-airs-runtime-scan
    description: Scan a single prompt against a security profile for AI security threats.
    arguments:
    - name: profile_name
      required: true
      description: The name of the security profile to use for scanning.
    - name: prompt
      required: true
      description: The prompt text to scan.
    - name: response
      required: false
      description: The optional response text to scan alongside the prompt.
    - name: tr_id
      required: false
      description: The unique identifier string for correlating the prompt and response transactions. Returned in the scan response.
    - name: session_id
      required: false
      description: The unique identifier string for tracking sessions. Returned in the scan response.
    - name: app_name
      required: false
      description: The AI application requesting the content scan.
    - name: app_user
      required: false
      description: The end user using the AI application.
    - name: ai_model
      required: false
      description: The AI model serving the AI application.
    - name: user_ip
      required: false
      description: The end user IP address using the AI application.
    - name: agent_id
      required: false
      description: The agent identifier for metadata tracking.
    - name: agent_version
      required: false
      description: The agent version for metadata tracking.
    - name: agent_arn
      required: false
      description: The agent ARN for metadata tracking.
    outputs:
    - contextPath: PrismaAIRs.RuntimeScan.scan_id
      description: The unique scan identifier.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.report_id
      description: The report identifier for this scan.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.tr_id
      description: The transaction ID passed in the request and returned in the response.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.session_id
      description: The session ID passed in the request and returned in the response.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.prompt
      description: The scanned prompt text.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.response
      description: The scanned response text.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.action
      description: The action taken (allow or block).
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.category
      description: The threat category (benign, malicious, etc.).
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.detected
      description: Whether any threat was detected across prompt or response.
      type: Boolean
    - contextPath: PrismaAIRs.RuntimeScan.prompt_detected
      description: The object containing all detection types for the prompt (e.g., injection, dlp, toxic_content, topic_violation, url_cats, malicious_code, agent).
      type: Unknown
    - contextPath: PrismaAIRs.RuntimeScan.response_detected
      description: The object containing all detection types for the response (e.g., dlp, toxic_content, topic_violation, url_cats, malicious_code, agent, db_security, ungrounded).
      type: Unknown
    - contextPath: PrismaAIRs.RuntimeScan.profile_id
      description: The profile ID used for scanning.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.profile_name
      description: The profile name used for scanning.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.source
      description: The source of the scan request.
      type: String
    - contextPath: PrismaAIRs.RuntimeScan.timeout
      description: Whether any detection service timed out.
      type: Boolean
    - contextPath: PrismaAIRs.RuntimeScan.error
      description: Whether any detection service encountered an error.
      type: Boolean
    - contextPath: PrismaAIRs.RuntimeScan.errors
      description: The list of detection service errors or timeouts.
      type: Unknown
  - name: prisma-airs-runtime-api-keys-list
    description: List all Runtime API Keys configured in Prisma AIRs.
    arguments:
    - name: limit
      required: false
      description: The maximum number of API keys to return.
      defaultValue: '50'
    outputs:
    - contextPath: PrismaAIRs.ApiKey.id
      description: The API Key ID (UUID).
      type: String
    - contextPath: PrismaAIRs.ApiKey.name
      description: The API Key name.
      type: String
    - contextPath: PrismaAIRs.ApiKey.last8
      description: The last 8 characters of the API key (for identification).
      type: String
    - contextPath: PrismaAIRs.ApiKey.created_at
      description: The API Key creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ApiKey.expires_at
      description: The API Key expiration timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ApiKey.revoked
      description: Whether the API key has been revoked.
      type: Boolean
  - name: prisma-airs-runtime-api-keys-create
    description: Create a new Runtime API Key. WARNING - The full API key secret is only shown once during creation. Save it securely.
    arguments:
    - name: api_key_name
      required: true
      description: The name for the new API key.
    - name: auth_code
      required: true
      description: The deployment profile auth code (obtained from deployment profile).
    - name: cust_app
      required: true
      description: The customer application name using this API key.
    - name: rotation_time_interval
      required: true
      description: The rotation time interval (number).
    - name: rotation_time_unit
      required: true
      description: The rotation time unit.
      auto: PREDEFINED
      predefined:
      - 'hours'
      - 'days'
      - 'months'
    - name: created_by
      required: true
      description: The email of the user creating the API key.
    - name: dp_name
      required: false
      description: The deployment profile name (optional).
    - name: cust_env
      required: true
      description: The customer environment (e.g., production, staging). The underlying customer app record mandates an environment value; omitting it causes the API to return "Error inserting/updating customer app record", so this argument is required.
    - name: cust_cloud_provider
      required: true
      description: The customer cloud provider (e.g., aws, gcp, azure). The underlying customer app record mandates a cloud provider value; omitting it causes the API to return "Error inserting/updating customer app record", so this argument is required.
    - name: cust_ai_agent_framework
      required: false
      description: The customer AI agent framework (optional).
    outputs:
    - contextPath: PrismaAIRs.ApiKeyCreate.id
      description: The created API Key ID (UUID).
      type: String
    - contextPath: PrismaAIRs.ApiKeyCreate.name
      description: The API Key name.
      type: String
    - contextPath: PrismaAIRs.ApiKeyCreate.api_key
      description: The FULL API KEY SECRET - Only shown once! Save this securely.
      type: String
    - contextPath: PrismaAIRs.ApiKeyCreate.last8
      description: The last 8 characters of the API key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyCreate.auth_code
      description: The auth code associated with the key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyCreate.expires_at
      description: The API Key expiration timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ApiKeyCreate.revoked
      description: Whether the API key has been revoked.
      type: Boolean
    - contextPath: PrismaAIRs.ApiKeyCreate.created_at
      description: The creation timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ApiKeyCreate.created_by
      description: The user who created the key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyCreate.cust_app
      description: The customer application name.
      type: String
  - name: prisma-airs-runtime-api-keys-regenerate
    execution: true
    description: Regenerate an existing Runtime API Key. WARNING - This creates a NEW key with a NEW UUID and invalidates the old key. The new secret is only shown once.
    arguments:
    - name: api_key_id
      required: true
      description: The UUID of the API key to regenerate.
    - name: rotation_time_interval
      required: true
      description: The new rotation time interval (number).
    - name: rotation_time_unit
      required: true
      description: The new rotation time unit.
      auto: PREDEFINED
      predefined:
      - 'hours'
      - 'days'
      - 'months'
    - name: updated_by
      required: false
      description: The email of the user performing regeneration (optional).
    outputs:
    - contextPath: PrismaAIRs.ApiKeyRegenerate.id
      description: The NEW API Key ID (UUID) - different from the old one.
      type: String
    - contextPath: PrismaAIRs.ApiKeyRegenerate.name
      description: The API Key name (same as before).
      type: String
    - contextPath: PrismaAIRs.ApiKeyRegenerate.api_key
      description: The NEW FULL API KEY SECRET - Only shown once! The old key is now invalid.
      type: String
    - contextPath: PrismaAIRs.ApiKeyRegenerate.last8
      description: The last 8 characters of the new API key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyRegenerate.auth_code
      description: The auth code associated with the key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyRegenerate.expires_at
      description: The new expiration timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ApiKeyRegenerate.revoked
      description: Whether the API key has been revoked.
      type: Boolean
    - contextPath: PrismaAIRs.ApiKeyRegenerate.updated_at
      description: The update timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.ApiKeyRegenerate.updated_by
      description: The user who regenerated the key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyRegenerate.cust_app
      description: The customer application name.
      type: String
  - name: prisma-airs-runtime-api-keys-delete
    execution: true
    description: Delete a Runtime API Key by name. WARNING - This action cannot be undone and immediately revokes access for all applications using this key.
    arguments:
    - name: api_key_name
      required: true
      description: The name of the API key to delete.
    - name: updated_by
      required: true
      description: The email of the user performing the deletion.
    outputs:
    - contextPath: PrismaAIRs.ApiKeyDeleted.api_key_name
      description: The name of the deleted API key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyDeleted.deleted_by
      description: The email of the user who deleted the key.
      type: String
    - contextPath: PrismaAIRs.ApiKeyDeleted.message
      description: The deletion confirmation message.
      type: String
    - contextPath: PrismaAIRs.ApiKeyDeleted.deleted
      description: The boolean indicating successful deletion.
      type: Boolean
  - name: prisma-airs-runtime-profiles-list
    description: List all runtime security profiles.
    arguments:
    - name: limit
      required: false
      description: The maximum number of profiles to return.
      defaultValue: '50'
    outputs:
    - contextPath: PrismaAIRs.SecurityProfile.id
      description: The profile ID (UUID).
      type: String
    - contextPath: PrismaAIRs.SecurityProfile.name
      description: The profile name.
      type: String
    - contextPath: PrismaAIRs.SecurityProfile.revision
      description: The profile revision number.
      type: Number
    - contextPath: PrismaAIRs.SecurityProfile.active
      description: Whether the profile is active.
      type: Boolean
    - contextPath: PrismaAIRs.SecurityProfile.created_by
      description: The user who created the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfile.updated_by
      description: The user who last updated the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfile.last_modified_ts
      description: The last modification timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.SecurityProfile.tsg_id
      description: The tenant Service Group ID.
      type: String
  - name: prisma-airs-runtime-profiles-get
    description: Get a specific security profile by ID or name. Returns the highest-revision profile if filtering by name.
    arguments:
    - name: profile_id
      required: false
      description: The profile UUID (either profile_id or profile_name is required).
    - name: profile_name
      required: false
      description: The profile name (returns highest-revision match if multiple exist).
    outputs:
    - contextPath: PrismaAIRs.SecurityProfileGet.id
      description: The profile ID (UUID).
      type: String
    - contextPath: PrismaAIRs.SecurityProfileGet.name
      description: The profile name.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileGet.revision
      description: The profile revision number.
      type: Number
    - contextPath: PrismaAIRs.SecurityProfileGet.active
      description: Whether the profile is active.
      type: Boolean
    - contextPath: PrismaAIRs.SecurityProfileGet.policy
      description: The full policy configuration (AI security profiles and DLP data profiles).
      type: Unknown
    - contextPath: PrismaAIRs.SecurityProfileGet.created_by
      description: The user who created the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileGet.updated_by
      description: The user who last updated the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileGet.last_modified_ts
      description: The last modification timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.SecurityProfileGet.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileGet.csp_id
      description: The cloud Service Provider ID.
      type: String
  - name: prisma-airs-runtime-profiles-create
    description: Create a new security profile with custom policy configuration.
    arguments:
    - name: profile_name
      required: true
      description: The name for the new security profile (must be unique).
    - name: active
      required: false
      description: Whether the profile should be active.
      defaultValue: 'true'
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: policy
      required: false
      description: The policy configuration as JSON string. Structure - ai-security-profiles array and dlp-data-profiles array. If omitted, creates empty policy.
    outputs:
    - contextPath: PrismaAIRs.SecurityProfileCreate.id
      description: The profile ID (UUID).
      type: String
    - contextPath: PrismaAIRs.SecurityProfileCreate.name
      description: The profile name.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileCreate.revision
      description: The profile revision number (starts at 1).
      type: Number
    - contextPath: PrismaAIRs.SecurityProfileCreate.active
      description: Whether the profile is active.
      type: Boolean
    - contextPath: PrismaAIRs.SecurityProfileCreate.policy
      description: The full policy configuration.
      type: Unknown
    - contextPath: PrismaAIRs.SecurityProfileCreate.created_by
      description: The user who created the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileCreate.updated_by
      description: The user who last updated the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileCreate.last_modified_ts
      description: The last modification timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.SecurityProfileCreate.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileCreate.csp_id
      description: The cloud Service Provider ID.
      type: String
  - name: prisma-airs-runtime-profiles-update
    description: Update an existing security profile. WARNING - Modifying profile configuration can break scanning if misconfigured.
    arguments:
    - name: profile_id
      required: true
      description: The profile UUID to update.
    - name: profile_name
      required: true
      description: The profile name (can be changed or kept the same).
    - name: active
      required: false
      description: Whether the profile should be active.
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
    - name: policy
      required: false
      description: The updated policy configuration as JSON string. If omitted, policy remains unchanged.
    outputs:
    - contextPath: PrismaAIRs.SecurityProfileUpdate.id
      description: The profile ID (UUID).
      type: String
    - contextPath: PrismaAIRs.SecurityProfileUpdate.name
      description: The profile name.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileUpdate.revision
      description: The profile revision number (incremented after update).
      type: Number
    - contextPath: PrismaAIRs.SecurityProfileUpdate.active
      description: Whether the profile is active.
      type: Boolean
    - contextPath: PrismaAIRs.SecurityProfileUpdate.policy
      description: The full policy configuration.
      type: Unknown
    - contextPath: PrismaAIRs.SecurityProfileUpdate.created_by
      description: The user who created the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileUpdate.updated_by
      description: The user who last updated the profile.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileUpdate.last_modified_ts
      description: The last modification timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: PrismaAIRs.SecurityProfileUpdate.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileUpdate.csp_id
      description: The cloud Service Provider ID.
      type: String
  - name: prisma-airs-runtime-profiles-delete
    execution: true
    description: Delete a security profile. WARNING - This action cannot be undone and permanently removes the profile.
    arguments:
    - name: profile_id
      required: true
      description: The profile UUID to delete.
    - name: force
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'false'
      description: Whether to force-delete the profile, bypassing safety checks. Requires updated_by.
    - name: updated_by
      description: The email of the user performing the deletion. Required when force is true.
    outputs:
    - contextPath: PrismaAIRs.SecurityProfileDeleted.profile_id
      description: The deleted profile ID.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileDeleted.message
      description: The deletion confirmation message.
      type: String
    - contextPath: PrismaAIRs.SecurityProfileDeleted.deleted
      description: The boolean indicating successful deletion.
      type: Boolean
    - contextPath: PrismaAIRs.SecurityProfileDeleted.force
      description: Whether the profile was force-deleted.
      type: Boolean
  - name: prisma-airs-runtime-customer-apps-list
    description: List all customer applications.
    arguments:
    - name: limit
      required: false
      description: The maximum number of customer apps to return.
      defaultValue: '50'
    outputs:
    - contextPath: PrismaAIRs.CustomerApp.id
      description: The customer App ID.
      type: String
    - contextPath: PrismaAIRs.CustomerApp.name
      description: The customer App name.
      type: String
    - contextPath: PrismaAIRs.CustomerApp.model_name
      description: The model name used by the app.
      type: String
    - contextPath: PrismaAIRs.CustomerApp.cloud_provider
      description: The cloud provider.
      type: String
    - contextPath: PrismaAIRs.CustomerApp.environment
      description: The environment (prod, staging, dev).
      type: String
    - contextPath: PrismaAIRs.CustomerApp.ai_agent_framework
      description: The AI agent framework used.
      type: String
    - contextPath: PrismaAIRs.CustomerApp.tsg_id
      description: The tenant Service Group ID.
      type: String
  - name: prisma-airs-runtime-customer-apps-get
    description: Get customer application details by name.
    arguments:
    - name: app_name
      required: true
      description: The name of the customer application to retrieve.
    outputs:
    - contextPath: PrismaAIRs.CustomerAppGet.id
      description: The customer App ID (UUID).
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.name
      description: The customer App name.
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.model_name
      description: The model name used by the app.
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.cloud_provider
      description: The cloud provider (aws, azure, gcp, other).
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.environment
      description: The environment (prod, staging, dev).
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.ai_agent_framework
      description: The AI agent framework used.
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.status
      description: The customer App status.
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.created_by
      description: The email of user who created the app.
      type: String
    - contextPath: PrismaAIRs.CustomerAppGet.updated_by
      description: The email of user who last updated the app.
      type: String
  - name: prisma-airs-runtime-customer-apps-update
    description: Update a customer application configuration.
    arguments:
    - name: customer_app_id
      required: true
      description: The UUID of the customer application to update.
    - name: app_name
      required: true
      description: The application name.
    - name: cloud_provider
      required: true
      description: The cloud provider.
      auto: PREDEFINED
      predefined:
      - aws
      - azure
      - gcp
      - other
    - name: environment
      required: true
      description: The environment.
      auto: PREDEFINED
      predefined:
      - prod
      - staging
      - dev
    - name: tsg_id
      required: false
      description: The tenant Service Group ID. If not provided, the configured TSG ID is used.
    - name: model_name
      required: false
      description: The model name used by the application.
    - name: ai_agent_framework
      required: false
      description: The AI agent framework used by the application.
    - name: updated_by
      required: false
      description: The email of user performing the update.
    outputs:
    - contextPath: PrismaAIRs.CustomerAppUpdate.id
      description: The customer App ID (UUID).
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.name
      description: The customer App name.
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.model_name
      description: The model name used by the app.
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.cloud_provider
      description: The cloud provider (aws, azure, gcp, other).
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.environment
      description: The environment (prod, staging, dev).
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.ai_agent_framework
      description: The AI agent framework used.
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.tsg_id
      description: The tenant Service Group ID.
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.status
      description: The customer App status.
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.created_by
      description: The email of user who created the app.
      type: String
    - contextPath: PrismaAIRs.CustomerAppUpdate.updated_by
      description: The email of user who last updated the app.
      type: String
  - name: prisma-airs-runtime-customer-apps-consumption
    description: Get per-application token consumption and session statistics over the requested time window.
    arguments:
    - name: app_id
      required: true
      description: The customer Application UUID (from customer-apps-list or customer-apps-get).
    - name: app_name
      required: true
      description: The application display name (literal metadata.app_name value from scan payloads).
    - name: time_interval
      required: false
      description: The look-back window in days (7, 30, or 60).
      defaultValue: '30'
