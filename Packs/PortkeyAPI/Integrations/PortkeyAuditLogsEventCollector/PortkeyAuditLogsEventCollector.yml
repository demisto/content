commonfields:
  id: Portkey Audit Logs Event Collector
  version: -1
name: Portkey Audit Logs Event Collector
display: Portkey Audit Logs Event Collector
category: Analytics & SIEM
description: Collect control-plane audit logs from the Portkey Admin API and ingest them into Cortex XSIAM.
configuration:
- display: Server URL
  name: url
  type: 0
  required: true
  defaultvalue: https://api.portkey.ai/v1
  additionalinfo: The Portkey API base URL.
- display: API Key
  name: credentials
  type: 9
  required: true
  displaypassword: API Key
  hiddenusername: true
  additionalinfo: A Portkey admin API key with access to the control-plane Admin API. Provide the key in the password field; it is sent as the x-portkey-api-key header.
- display: First fetch time
  name: first_fetch
  type: 0
  required: false
  defaultvalue: 3 days
  additionalinfo: 'The time range to fetch on the first run (e.g. "3 days", "12 hours").'
- display: Maximum number of events per fetch
  name: max_fetch
  type: 0
  required: false
  defaultvalue: "5000"
  advanced: true
  additionalinfo: The maximum number of audit log events to fetch on each run.
- display: Page size
  name: page_size
  type: 0
  required: false
  defaultvalue: "100"
  advanced: true
  additionalinfo: The number of records to request per page.
- display: Events Fetch Interval
  name: eventFetchInterval
  type: 19
  required: false
  defaultvalue: "5"
  additionalinfo: How often the collector runs, in minutes. Audit logs are a time series and this is the near real time source, so a short interval is appropriate. The correlation that reads it runs every ten minutes, so collecting more often than every five minutes adds no detection speed.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  advanced: true
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.13.10404775
  isfetchevents: true
  defaultEnabled: true
  commands:
  - name: portkey-audit-logs-get-events
    description: Manual command to retrieve and preview Portkey audit log events. Used for testing and development.
    arguments:
    - name: since
      description: 'The time range to fetch events from (e.g. "3 days", "12 hours").'
      defaultValue: 3 days
    - name: limit
      description: The maximum number of events to return.
      defaultValue: "50"
    - name: should_push_events
      description: If true, the fetched events are also pushed to the XSIAM dataset. Defaults to false.
      auto: PREDEFINED
      predefined:
      - "true"
      - "false"
      defaultValue: "false"
    outputs: []
fromversion: 6.8.0
defaultEnabled: true
marketplaces:
- marketplacev2
- platform
supportedModules:
- C1
- C3
- X1
- X3
- X5
- ENT_PLUS
tests:
- No tests (auto formatted)
