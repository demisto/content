commonfields:
  id: Portkey Configs Event Collector
  version: -1
name: Portkey Configs Event Collector
display: Portkey Configs Event Collector
category: Analytics & SIEM
description: Collect the Portkey gateway config inventory from the Admin API and ingest it into Cortex XSIAM.
configuration:
- display: Server URL
  name: url
  type: 0
  required: true
  defaultvalue: https://api.portkey.ai/v1
  additionalinfo: The Portkey API base URL.
- display: API Key
  name: credentials
  type: 9
  required: true
  displaypassword: API Key
  hiddenusername: true
  additionalinfo: A Portkey admin API key with the configs.list scope. Provide the key in the password field; it is sent as the x-portkey-api-key header.
- display: Maximum number of events per fetch
  name: max_fetch
  type: 0
  required: false
  defaultvalue: "5000"
  advanced: true
  additionalinfo: The maximum number of config records to fetch on each run.
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  advanced: true
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.13.10404775
  isfetchevents: true
  defaultEnabled: true
  commands:
  - name: portkey-configs-get-events
    description: Manual command to retrieve and preview the Portkey config inventory. Used for testing and development.
    arguments:
    - name: limit
      description: The maximum number of records to return.
      defaultValue: "50"
    - name: should_push_events
      description: If true, the fetched events are also pushed to the XSIAM dataset. Defaults to false.
      auto: PREDEFINED
      predefined:
      - "true"
      - "false"
      defaultValue: "false"
    outputs: []
fromversion: 6.8.0
defaultEnabled: true
marketplaces:
- marketplacev2
- platform
supportedModules:
- C1
- C3
- X1
- X3
- X5
- ENT_PLUS
tests:
- No tests (auto formatted)
