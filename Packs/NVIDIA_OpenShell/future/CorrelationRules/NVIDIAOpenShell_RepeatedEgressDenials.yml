global_rule_id: NVIDIAOpenShell_RepeatedEgressDenials
name: NVIDIA OpenShell - Repeated Egress Policy Denials From One Sandbox
alert_name: 'NVIDIA OpenShell: AI agent sandbox repeatedly blocked from egress'
description: Detects an OpenShell sandbox whose outbound TCP connections are denied by policy many times in a short window, across several destinations.
alert_description: Review the sandbox agent task and denied destinations. Check status_detail for the policy stage that blocked each attempt.
alert_category: EXFILTRATION
alert_fields:
  action_remote_ip: dst_ip
  description: sandbox_id
dataset: nvidia_openshell_raw
drilldown_query_timeframe: ALERT
execution_mode: SCHEDULED
crontab: '*/10 * * * *'
search_window: 30 MINUTES
mitre_defs:
  TA0010 - Exfiltration:
  - T1048 - Exfiltration Over Alternative Protocol
  TA0011 - Command and Control:
  - T1071 - Application Layer Protocol
severity: SEV_030_MEDIUM
suppression_enabled: true
suppression_duration: 120 MINUTES
suppression_fields: sandbox_id
xql_query: 'dataset = nvidia_openshell_raw | filter class_uid in (4001, 4002) and action_id = 2 and activity_id != 5 | alter sandbox_id = json_extract_scalar(container, "$.uid"), dst_host = coalesce(json_extract_scalar(dst_endpoint, "$.domain"), json_extract_scalar(dst_endpoint, "$.ip")), dst_ip = json_extract_scalar(dst_endpoint, "$.ip") | filter sandbox_id != null and dst_host != null | comp count() as denial_count, count_distinct(dst_host) as distinct_destinations, values(dst_host) as destinations by sandbox_id | filter denial_count >= 10 and distinct_destinations >= 3'
mapping_strategy: CUSTOM
fromversion: 8.4.0
investigation_query_link: 'dataset = nvidia_openshell_raw | filter class_uid in (4001, 4002) and action_id = 2 | alter sandbox_id = json_extract_scalar(container, "$.uid"), dst_host = coalesce(json_extract_scalar(dst_endpoint, "$.domain"), json_extract_scalar(dst_endpoint, "$.ip")), reason = status_detail, engine = json_extract_scalar(firewall_rule, "$.type"), stage = if(activity_id = 5, "dns", "tcp") | fields _time, sandbox_id, dst_host, stage, reason, engine, message'
