      type: Date
    - contextPath: Koi.Policy.updated_at
      description: The last update time of the policy in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
  - name: koi-inventory-list
    description: Retrieves a paginated list of items installed across your organization's endpoints. Supports extensive filtering by marketplace, platform, risk level, publisher, and specific categories.
    arguments:
    - name: page
      description: 'The page number for pagination (1-based). When provided, fetches a single page and ignores the limit argument.'
    - name: page_size
      description: 'The number of results per page (default: 50, max: 500). Used in single-page mode with the page argument.'
    - name: limit
      description: 'The maximum total number of inventory items to return (default: 50, max: 1000). When provided without page, auto-paginates to collect up to this many items.'
      defaultValue: '50'
    - name: brew_category_koi
      description: The Homebrew package category to filter by (Koi classification).
    - name: browser_category_koi
      description: The browser extension category to filter by (Koi classification).
    - name: chocolatey_category_koi
      description: The Chocolatey package category to filter by (Koi classification).
    - name: device_id
      description: The device ID to filter devices by.
    - name: finding_id
      description: The finding ID to filter devices by.
    - name: first_seen
      description: 'The first seen date to filter by (items first seen on or after this date). ISO 8601 format (e.g., "2024-01-01T00:00:00Z").'
    - name: ide_category_koi
      description: The IDE extension category to filter by (Koi classification).
    - name: installation_method
      description: The installation method to filter by.
      auto: PREDEFINED
      predefined:
      - marketplace
      - manual
      - built_in
      - side_loaded
    - name: item_display_name
      description: The item display name to filter by. Performs case-insensitive partial match.
    - name: item_id
      description: The item ID to filter by.
    - name: marketplace
      description: The marketplace to filter by.
      auto: PREDEFINED
