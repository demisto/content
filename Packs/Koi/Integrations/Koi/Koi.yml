      description: The risk level to filter by.
      auto: PREDEFINED
      predefined:
      - low
      - medium
      - high
      - critical
      - pending
    - name: software_category_koi
      description: The software category to filter by (Koi classification).
    - name: sort_by
      description: The column to sort by.
      auto: PREDEFINED
      defaultValue: first_seen
      predefined:
      - first_seen
      - last_seen
      - item_display_name
