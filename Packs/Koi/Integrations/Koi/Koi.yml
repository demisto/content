name: KOI
display: KOI
category: Endpoint
provider: KOI
sectionorder:
- Connect
- Collect
commonfields:
  id: KOI
  version: -1
configuration:
- name: url
  display: Server URL
  required: true
  defaultvalue: https://api.prod.koi.security/
  type: 0
  additionalinfo: 'The KOI API server URL.'
  section: Connect
- name: api_key
  display: API Key
  required: true
  type: 14
  additionalinfo: 'The API key for authenticating with the KOI API. See the help section for instructions on creating an API key.'
  section: Connect
- name: proxy
  display: Use system proxy settings
  type: 8
  additionalinfo:
  section: Connect
  advanced: true
  required: false
- name: insecure
  display: Trust any certificate (not secure)
  type: 8
  additionalinfo:
  section: Connect
  advanced: true
  required: false
description: Koi (Agentic Endpoint Security) provides visibility and governance over non-binary software supply chains including browser extensions, IDE extensions, code packages, AI models, MCP servers, OS packages, binaries, and repositories.
script:
  commands:
  - name: koi-alert-list
    description: Retrieves a list of alerts from the Koi OCSF alert feed. Supports filtering by alert type, event ID, and date range. Returns structured alert data including finding info, severity, resources, and observables.
    arguments:
    - name: alert_type
      description: 'The alert type to filter by. "system" returns system alerts (e.g., guardrails, malware). "policy" returns policy violation alerts.'
      auto: PREDEFINED
      predefined:
      - system
      - policy
    - name: created_at_gte
      description: 'The start date filter for alerts (ISO 8601 format, e.g., 2024-01-01T00:00:00Z).'
    - name: created_at_lte
      description: 'The end date filter for alerts (ISO 8601 format, e.g., 2024-12-31T23:59:59Z).'
    - name: event_id
      description: 'The event ID to filter by.'
    - name: sort_direction
      description: 'The sort direction for results.'
      auto: PREDEFINED
      predefined:
      - asc
      - desc
    - name: page
      description: 'The page number for pagination (1-based). When provided, fetches a single page and ignores the limit argument.'
    - name: page_size
      description: 'The number of results per page (default: 50, max: 500). Used only in single-page mode together with the page argument.'
    - name: limit
      description: 'The maximum total number of alerts to return via auto-pagination (default: 50). Ignored when the page argument is provided.'
    outputs:
    - contextPath: Koi.Alert.metadata.notification_event_id
      description: The unique notification event identifier.
      type: String
    - contextPath: Koi.Alert.finding_info.title
      description: The title of the finding that triggered the alert.
      type: String
    - contextPath: Koi.Alert.finding_info.types
      description: The types and categories of the finding.
      type: Unknown
    - contextPath: Koi.Alert.severity
      description: The alert severity label.
      type: String
    - contextPath: Koi.Alert.risk_level
      description: The risk level (low, medium, high, critical).
      type: String
    - contextPath: Koi.Alert.risk_score
      description: The numeric risk score.
      type: Number
    - contextPath: Koi.Alert.status
      description: The alert status.
      type: String
    - contextPath: Koi.Alert.message
      description: The human-readable alert message.
      type: String
    - contextPath: Koi.Alert.time
      description: The alert timestamp in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: Koi.Alert.resources
      description: The resources associated with the alert.
      type: Unknown
    - contextPath: Koi.Alert.observables
      description: The observables extracted from the alert.
      type: Unknown
  - name: koi-policy-list
    description: Retrieves a list of all policies. Use 'page' and 'page_size' to fetch a specific page, or use 'limit' to auto-paginate and collect up to the specified number of policies. If 'page' is provided, 'limit' is ignored.
    arguments:
    - name: page
      description: 'The page number for pagination (1-based). When provided, fetches a single page and ignores the limit argument.'
    - name: page_size
      description: 'The number of results per page (default: 50, max: 500). Used only in single-page mode together with the page argument.'
    - name: limit
      description: 'The maximum total number of policies to return (default: 50, max: 1000). When provided without page, auto-paginates to collect up to this many policies.'
      defaultValue: '50'
    outputs:
    - contextPath: Koi.Policy.id
      description: The unique identifier of the policy.
      type: Number
    - contextPath: Koi.Policy.name
      description: The name of the policy.
      type: String
    - contextPath: Koi.Policy.description
      description: The description of the policy.
      type: String
    - contextPath: Koi.Policy.action
      description: The action taken by the policy (e.g., block).
      type: String
    - contextPath: Koi.Policy.enabled
      description: Whether the policy is enabled.
      type: Boolean
    - contextPath: Koi.Policy.group_ids
      description: The list of group IDs associated with the policy.
      type: Unknown
    - contextPath: Koi.Policy.creator_fullname
      description: The full name of the policy creator.
      type: String
    - contextPath: Koi.Policy.created_at
      description: The creation time of the policy in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
    - contextPath: Koi.Policy.updated_at
      description: The last update time of the policy in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
  - name: koi-allowlist-get
    description: Retrieves all items in the allowlist.
    arguments: []
    outputs:
    - contextPath: Koi.Allowlist.item_id
      description: The unique identifier of the allowlist item.
      type: String
    - contextPath: Koi.Allowlist.item_name
      description: The name of the allowlist item.
      type: String
    - contextPath: Koi.Allowlist.item_display_name
      description: The display name of the allowlist item.
      type: String
    - contextPath: Koi.Allowlist.marketplace
      description: The marketplace of the allowlist item (e.g., vscode).
      type: String
    - contextPath: Koi.Allowlist.publisher_name
      description: The publisher name of the allowlist item.
      type: String
    - contextPath: Koi.Allowlist.package_name
      description: The package name of the allowlist item.
      type: String
    - contextPath: Koi.Allowlist.notes
      description: The notes associated with the allowlist item.
      type: String
    - contextPath: Koi.Allowlist.created_by
      description: The user who created the allowlist item.
      type: String
    - contextPath: Koi.Allowlist.created_at
      description: The creation time of the allowlist item in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
  - name: koi-allowlist-items-remove
    description: Removes one or more items from the global allowlist. Provide either 'item_id' and 'marketplace' for a single item, or 'items_list_raw_json_entry_id' for bulk removal from a JSON file.
    execution: true
    arguments:
    - name: item_id
      description: The ID of the item to remove from the allowlist. Required when not using items_list_raw_json_entry_id.
    - name: marketplace
      description: The source marketplace of the item. Required when not using items_list_raw_json_entry_id.
      auto: PREDEFINED
      predefined:
      - binaries
      - bitbucket
      - chocolatey
      - chrome_web_store
      - claude_desktop_extensions
      - cursor
      - docker
      - edge_add_ons
      - firefox_add_ons
      - github
      - github_mcp_registry
      - gitlab
      - homebrew
      - hugging_face
      - jetbrains
      - linux
      - mac
      - mcp_registry
      - notepad++
      - npm
      - office_add_ins
      - ollama
      - open_vsx_registry
      - pypi
      - skill
      - visual_studio
      - vscode
      - windows
      - windsurf
    - name: created_by
      description: The email of the user who created this entry.
    - name: notes
      description: The additional notes about the removal.
    - name: items_list_raw_json_entry_id
      description: 'The War Room entry ID of a JSON file containing a list of items to remove. Each item must have "item_id" and "marketplace" fields. Optional fields: "created_by", "notes". When provided, item_id and marketplace arguments are ignored.'
    outputs: []
  - name: koi-allowlist-items-add
    description: Adds one or more items to the global allowlist. Provide either 'item_id' and 'marketplace' for a single item, or 'items_list_raw_json_entry_id' for bulk addition from a JSON file.
    arguments:
    - name: item_id
      description: The ID of the item to add to the allowlist. Required when not using items_list_raw_json_entry_id.
    - name: marketplace
      description: The source marketplace of the item. Required when not using items_list_raw_json_entry_id.
      auto: PREDEFINED
      predefined:
      - binaries
      - bitbucket
      - chocolatey
      - chrome_web_store
      - claude_desktop_extensions
      - cursor
      - docker
      - edge_add_ons
      - firefox_add_ons
      - github
      - github_mcp_registry
      - gitlab
      - homebrew
      - hugging_face
      - jetbrains
      - linux
      - mac
      - mcp_registry
      - notepad++
      - npm
      - office_add_ins
      - ollama
      - open_vsx_registry
      - pypi
      - skill
      - visual_studio
      - vscode
      - windows
      - windsurf
    - name: created_by
      description: The email of the user who created this entry.
    - name: notes
      description: The additional notes about the entry.
    - name: items_list_raw_json_entry_id
      description: 'The War Room entry ID of a JSON file containing a list of items to add. Each item must have "item_id" and "marketplace" fields. Optional fields: "created_by", "notes". When provided, item_id and marketplace arguments are ignored.'
    outputs: []
  - name: koi-blocklist-get
    description: Retrieves all items in the blocklist.
    arguments: []
    outputs:
    - contextPath: Koi.Blocklist.item_id
      description: The unique identifier of the blocklist item.
      type: String
    - contextPath: Koi.Blocklist.item_name
      description: The name of the blocklist item.
      type: String
    - contextPath: Koi.Blocklist.item_display_name
      description: The display name of the blocklist item.
      type: String
    - contextPath: Koi.Blocklist.marketplace
      description: The marketplace of the blocklist item (e.g., vscode).
      type: String
    - contextPath: Koi.Blocklist.publisher_name
      description: The publisher name of the blocklist item.
      type: String
    - contextPath: Koi.Blocklist.package_name
      description: The package name of the blocklist item.
      type: String
    - contextPath: Koi.Blocklist.notes
      description: The notes associated with the blocklist item.
      type: String
    - contextPath: Koi.Blocklist.created_by
      description: The user who created the blocklist item.
      type: String
    - contextPath: Koi.Blocklist.created_at
      description: The creation time of the blocklist item in ISO 8601 format (e.g., 2024-01-15T12:34:56Z).
      type: Date
