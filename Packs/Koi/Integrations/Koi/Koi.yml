    description: Searches inventory items using advanced query builder filters. Provide a filter via 'filter_json' (inline JSON string) or 'filter_raw_json_entry_id' (War Room file entry ID). At least one filter source must be provided.
    arguments:
    - name: filter_json
      description: 'The advanced filter using query builder syntax as a JSON string. Either filter_json or filter_raw_json_entry_id must be provided.'
    - name: filter_raw_json_entry_id
      description: 'The War Room entry ID of a JSON file containing the filter object. Takes priority over filter_json when both are provided.'
    - name: page
      description: 'The page number for pagination (1-based). When provided, fetches a single page and ignores the limit argument.'
    - name: page_size
      description: 'The number of results per page (default: 50, max: 500). Used in single-page mode with the page argument.'
    - name: limit
      description: 'The maximum total number of inventory items to return (default: 50, max: 1000). When provided without page, auto-paginates to collect up to this many items.'
