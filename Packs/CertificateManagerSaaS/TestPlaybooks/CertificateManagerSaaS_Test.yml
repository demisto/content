version: -1
name: CertificateManagerSaaS - Test
description: |-
  Test playbook for the CyberArk Certificate Manager SaaS integration. Runs every implemented command against a live tenant and asserts the shape of the results.

  The write commands - revoke, request, request status and download - are deliberately not exercised here: they mutate a real tenant's certificate inventory and revocation cannot be undone.
