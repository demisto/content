category: Analytics & SIEM
provider: Cisco Systems
sectionorder:
- Connect
- Collect
commonfields:
  id: CiscoWebexEventCollectorV2
  version: -1
configuration:
- display: URL
  name: base_url
  defaultvalue: https://webexapis.com
  required: true
  type: 0
  section: Connect
- display: Organization ID
  name: org_id
  required: true
  type: 0
  additionalinfo: The Webex organization ID. Required for admin audit and security audit events.
  section: Connect
- display: Trust any certificate (not secure)
  name: insecure
  required: false
  type: 8
  section: Connect
  advanced: true
- display: Use system proxy settings
  name: proxy
  required: false
  type: 8
  section: Connect
  advanced: true
- display: Event types to fetch
  name: event_types
  required: true
  type: 16
  defaultvalue: Admin Audit Events,Security Audit Events,Events
  options:
  - Admin Audit Events
  - Security Audit Events
  - Events
  additionalinfo: Security Audit Events require an active Webex Pro Pack license.
  section: Collect
- display: Maximum number of events per fetch
  name: max_fetch
  defaultvalue: '200'
  required: false
  type: 0
  additionalinfo: Maximum number of events per event type per fetch. Maximum is 2000.
  section: Collect
  advanced: true
description: Collects Webex admin audit, security audit and compliance officer events using a single OAuth 2.0 integration app authorized from the Cisco Webex connector.
display: Cisco Webex Event Collector v2
name: CiscoWebexEventCollectorV2
script:
  commands:
  - arguments:
    - auto: PREDEFINED
      defaultValue: 'false'
      description: If true, the command will create events, otherwise it will only display them.
      name: should_push_events
      predefined:
      - 'true'
      - 'false'
      required: true
    - description: Maximum number of events to return.
      name: limit
    - description: Date in ISO format (2023-10-01T20:33:22.123Z) to return events from.
      name: since_datetime
    description: Gets admin audit events from Cisco Webex.
    name: cisco-webex-v2-get-admin-audit-events
  - arguments:
    - auto: PREDEFINED
      defaultValue: 'false'
      description: If true, the command will create events, otherwise it will only display them.
      name: should_push_events
      predefined:
      - 'true'
      - 'false'
      required: true
    - description: Maximum number of events to return.
      name: limit
    - description: Date in ISO format (2023-10-01T20:33:22.123Z) to return events from.
      name: since_datetime
    description: Gets security audit events from Cisco Webex. Requires an active Webex Pro Pack license.
    name: cisco-webex-v2-get-security-audit-events
  - arguments:
    - auto: PREDEFINED
      defaultValue: 'false'
      description: If true, the command will create events, otherwise it will only display them.
      name: should_push_events
      predefined:
      - 'true'
      - 'false'
      required: true
    - description: Maximum number of events to return.
      name: limit
    - description: Date in ISO format (2023-10-01T20:33:22.123Z) to return events from.
      name: since_datetime
    description: Gets compliance officer events from Cisco Webex.
    name: cisco-webex-v2-get-compliance-officer-events
  dockerimage: demisto/python3:3.12.15.14069087
  isfetchevents: true
  runonce: false
  script: ''
  subtype: python3
  type: python
marketplaces:
- platform
fromversion: 8.15.0
tests:
- No tests
supportedModules:
- xsiam
