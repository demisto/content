description: Manage Qualys Enterprise TruRisk Management (ETM) finding reports. ETM consolidates findings relating to vulnerabilities, misconfigurations, malware, and compliance from multiple sources into a unified view with a risk score (TruRisk Score).
display: Qualys Enterprise TruRisk Management (ETM)
name: QualysETM
script:
  commands:
  - name: qualys-etm-active-reports-list
    description: Lists the active reports in the Qualys ETM subscription. To retrieve the full details of a single report, use the qualys-etm-report-get-details command.
    arguments:
    - name: page
      description: The page number of the results to retrieve. Minimum value is 1. Used together with the page_size argument.
      type: Number
    - name: page_size
      description: The number of results to retrieve in a single page. Used together with the page argument.
      type: Number
    - name: limit
      description: The maximum number of results to return. Used when the page and page_size arguments are not provided.
      type: Number
      defaultValue: '50'
    outputs:
    - contextPath: QualysETM.Report.id
      description: The unique ID of the report.
      type: String
    - contextPath: QualysETM.Report.name
      description: The name of the report.
      type: String
    - contextPath: QualysETM.Report.status
      description: The current status of the report.
      type: String
    - contextPath: QualysETM.Report.created
      description: The date and time when the report was created.
      type: Date
    - contextPath: QualysETM.Report.expirationDate
      description: The date and time when the report expires.
      type: Date
  - name: qualys-etm-report-get-details
    description: Returns the full details of a single report, including the list of its downloadable resources.
    arguments:
    - name: report_id
      description: The unique ID of the report.
      required: true
    outputs:
    - contextPath: QualysETM.Report.id
      description: The unique ID of the report.
      type: String
    - contextPath: QualysETM.Report.name
      description: The name of the report.
      type: String
    - contextPath: QualysETM.Report.description
      description: The description of the report.
      type: String
    - contextPath: QualysETM.Report.reportFormat
      description: The format of the report.
      type: String
    - contextPath: QualysETM.Report.status
      description: The current status of the report.
      type: String
    - contextPath: QualysETM.Report.assetQql
      description: The asset QQL filter that was used to generate the report.
      type: String
    - contextPath: QualysETM.Report.findingsQql
      description: The findings QQL filter that was used to generate the report.
      type: String
    - contextPath: QualysETM.Report.created
      description: The date and time when the report was created.
      type: Date
    - contextPath: QualysETM.Report.createdBy.name
      description: The name of the user who created the report.
      type: String
    - contextPath: QualysETM.Report.updated
      description: The date and time when the report was last updated.
      type: Date
    - contextPath: QualysETM.Report.expirationDate
      description: The date and time when the report expires.
      type: Date
    - contextPath: QualysETM.Report.resources
      description: The names of the downloadable part-files of the report. Available once the report status is COMPLETED.
      type: Unknown
  - name: qualys-etm-report-download
    description: Downloads a single part-file of a report by its resource name and returns it to the War Room as a file. Use the qualys-etm-report-get-details command to obtain the valid resource names of a completed report.
    arguments:
    - name: report_id
      description: The unique ID of the report.
      required: true
    - name: resource_name
      description: The name of the part-file to download, as listed in the resources field of the report details.
      required: true
    outputs:
    - contextPath: InfoFile.Name
      description: The name of the file.
      type: String
    - contextPath: InfoFile.EntryID
      description: The entry ID of the file.
      type: String
    - contextPath: InfoFile.Size
      description: The size of the file in bytes.
      type: Number
    - contextPath: InfoFile.Type
      description: The type of the file.
      type: String
    - contextPath: InfoFile.Extension
      description: The extension of the file.
      type: String
    - contextPath: InfoFile.Info
      description: The information about the file.
      type: String
  - name: qualys-etm-report-generate
    description: Submits a new findings report request, polls until the report generation completes, and then downloads all of the report resources as a ZIP file to the War Room. Note that each polling iteration consumes a request from the Qualys rate limit of 300 requests per hour.
    polling: true
    arguments:
    - name: name
      description: The name of the report.
    - name: description
      description: The description of the report.
    - name: report_format
      description: The format of the generated report.
      auto: PREDEFINED
      predefined:
      - JSON
      - PARQUET
      defaultValue: JSON
    - name: asset_qql
      description: 'A QQL filter that limits the report to the matching assets. For example, "asset.name: my-host".'
    - name: findings_qql
      description: 'A QQL filter that limits the report to the matching findings. For example, "finding.severity: 5".'
    - name: interval_in_seconds
      description: The interval in seconds between each poll of the report status.
      type: Number
      defaultValue: '10'
    - name: timeout_in_seconds
      description: The total time in seconds to wait for the report to complete before the command fails. The report is not deleted on timeout and can be retrieved later using the qualys-etm-report-get-details command.
      type: Number
      defaultValue: '300'
    - name: report_id
      description: The ID of the submitted report. Used internally between the polling iterations.
      hidden: true
    - name: hide_polling_output
      description: Whether to hide the polling result message. Used internally between the polling iterations.
      hidden: true
    outputs:
    - contextPath: QualysETM.Report.id
      description: The unique ID of the report.
      type: String
    - contextPath: QualysETM.Report.name
      description: The name of the report.
      type: String
    - contextPath: QualysETM.Report.description
      description: The description of the report.
      type: String
    - contextPath: QualysETM.Report.reportFormat
      description: The format of the report.
      type: String
    - contextPath: QualysETM.Report.status
      description: The current status of the report.
      type: String
    - contextPath: QualysETM.Report.assetQql
      description: The asset QQL filter that was used to generate the report.
      type: String
    - contextPath: QualysETM.Report.findingsQql
      description: The findings QQL filter that was used to generate the report.
      type: String
    - contextPath: QualysETM.Report.created
      description: The date and time when the report was created.
      type: Date
    - contextPath: QualysETM.Report.createdBy.name
      description: The name of the user who created the report.
      type: String
    - contextPath: QualysETM.Report.updated
      description: The date and time when the report was last updated.
      type: Date
    - contextPath: QualysETM.Report.expirationDate
      description: The date and time when the report expires.
      type: Date
    - contextPath: QualysETM.Report.resources
      description: The names of the downloadable part-files of the report.
      type: Unknown
  - name: qualys-etm-reports-delete
    description: Deletes one or more reports. To delete a single report, provide its ID as the only value of the report_ids argument.
    execution: true
    arguments:
    - name: report_ids
      description: A comma-separated list of the IDs of the reports to delete.
      required: true
      isArray: true
    outputs:
    - contextPath: QualysETM.ReportDeletion.reportId
      description: The ID of the deleted report.
      type: String
    - contextPath: QualysETM.ReportDeletion.message
      description: The message returned by Qualys for the deleted report.
      type: String
  dockerimage: demisto/python3:3.12.14.13495286
  runonce: false
  script: ''
  subtype: python3
  type: python
