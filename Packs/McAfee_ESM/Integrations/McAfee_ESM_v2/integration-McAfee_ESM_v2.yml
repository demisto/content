      description: The name of the watchlist.
      type: string
    - contextPath: McAfeeESM.Watchlist.id
      description: The ID of the watchlist.
      type: number
    - contextPath: McAfeeESM.Watchlist.type
      description: The type of the watchlist.
      type: string
  - arguments:
