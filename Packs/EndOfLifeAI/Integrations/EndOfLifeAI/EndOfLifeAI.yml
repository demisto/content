    arguments:
    - name: products
      description: A comma-separated list of product:version pairs, for example nodejs:18,python:3.8,ubuntu:20.04. An entry without a version returns the highest-risk version of that product.
      required: true
      isArray: true
    - name: chunk_size
      description: The number of pairs to send in one API request. A free API key accepts 5 pairs per request. Each request counts against the daily request allowance of the API key.
      required: false
      defaultValue: '5'
