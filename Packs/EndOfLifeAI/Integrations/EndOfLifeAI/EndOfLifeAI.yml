description: Look up end-of-life and end-of-support dates, EOL risk scores and CISA KEV exposure for software and hardware products. endoflife.ai is an independent service, and each date is labelled with its source.
display: endoflife.ai
name: EndOfLifeAI
script:
  commands:
  - name: endoflife-ai-product-get
    description: 'Returns the lifecycle of a product: each tracked version with its end-of-life date, support status, EOL risk score and the source of the date.'
    arguments:
    - name: product
      description: The product slug as endoflife.ai tracks it, for example nodejs, python or windows-server. When the slug is not found, the command lists the closest tracked slugs.
      required: true
      default: true
    - name: limit
      description: The maximum number of versions to return, in the order the API returns them.
      required: false
      defaultValue: '50'
    outputs:
    - contextPath: EndOfLifeAI.Product.product
      description: The slug of the tracked product.
      type: String
    - contextPath: EndOfLifeAI.Product.alias_of
      description: Present only when the slug sent is an alias of a tracked product. The slug as sent.
      type: String
    - contextPath: EndOfLifeAI.Product.version_count
      description: The number of versions that endoflife.ai tracks for the product.
      type: Number
    - contextPath: EndOfLifeAI.Product.product_url
      description: The product page on endoflife.ai.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.product
      description: The slug of the tracked product the answer is for.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.version
      description: The release cycle the answer is for.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.latest_release
      description: The latest release published on this release cycle.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.release_date
      description: The date the release cycle was first released.
      type: Date
    - contextPath: EndOfLifeAI.Product.versions.status
      description: The lifecycle status. Possible values are active, warn (within 180 days of end of life, still supported), eol and unknown (the published date could not be read).
      type: String
    - contextPath: EndOfLifeAI.Product.versions.is_supported
      description: Whether the vendor still ships fixes today. True for the status active or warn.
      type: Boolean
    - contextPath: EndOfLifeAI.Product.versions.eol_date
      description: The end-of-life date. Empty when the vendor has published no date.
      type: Date
    - contextPath: EndOfLifeAI.Product.versions.eol_boolean
      description: Used when no end-of-life date is published. True means end of life with no exact date, false means not end of life.
      type: Boolean
    - contextPath: EndOfLifeAI.Product.versions.eol_date_precision
      description: The precision of eol_date. Possible values are day, month and quarter. A month or quarter date is stored as the last day of the period.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.date_precision_note
      description: Present only when a date has month or quarter precision. Says which date and which period it stands for.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.days_until_eol
      description: The number of days until eol_date. Empty when the version is past end of life or has no date.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.days_past_eol
      description: The number of days since eol_date. Empty when the version has not reached end of life or has no date.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.support_date
      description: The end of the vendor's active (full or standard) support phase, where one is published.
      type: Date
    - contextPath: EndOfLifeAI.Product.versions.support_date_precision
      description: The precision of support_date. Possible values are day, month and quarter.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.extended_support_available
      description: False when endoflife.ai records that no extended support option exists for the product. True otherwise.
      type: Boolean
    - contextPath: EndOfLifeAI.Product.versions.extended_support_date
      description: The end of the vendor's own extended or paid support phase, where one is published.
      type: Date
    - contextPath: EndOfLifeAI.Product.versions.extended_support_date_precision
      description: The precision of extended_support_date. Possible values are day, month and quarter.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.extended_support_ships_fixes
      description: False when the vendor ships no fixes in the phase that ends on extended_support_date. Empty when no such statement is recorded.
      type: Boolean
    - contextPath: EndOfLifeAI.Product.versions.score
      description: The EOL risk score, from 0 to 100. A higher score means a higher risk.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.grade
      description: The letter grade of the EOL risk score.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.grade_label
      description: The label of the grade, for example Critical risk.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.band
      description: The risk band of the EOL risk score, for example Critical.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.factors.eol_recency
      description: The end-of-life recency component of the EOL risk score.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.factors.attack_surface
      description: The attack surface component of the EOL risk score.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.factors.cisa_kev_exposure
      description: The CISA Known Exploited Vulnerabilities (KEV) component of the EOL risk score.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.factors.extended_support
      description: The extended support component of the EOL risk score.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.kev_exposed
      description: Whether the factors.cisa_kev_exposure component is above zero. The integration derives this value from that component.
      type: Boolean
    - contextPath: EndOfLifeAI.Product.versions.cpe
      description: The verified CPE 2.3 identifiers of the product. Empty when none has been verified.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.cpe_scope
      description: Present only for hardware products whose versions are models. The value model means cpe lists the identifiers of this model only.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.cpe_note
      description: Present only when cpe_scope is model and no CPE names this model.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.purl
      description: The package URLs that resolve a software bill of materials component to this product. Empty when none is known.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.eol_date_source
      description: Where eol_date comes from. Possible values are vendor-override, vendor-fetched, vendor-verified, custom, upstream and discrepancy.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.eol_date_source_url
      description: The vendor page or record that the eol_date_source label rests on.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.eol_date_verified_at
      description: The date the eol_date_source label was last established.
      type: Date
    - contextPath: EndOfLifeAI.Product.versions.eol_date_status
      description: The state of the source check. Possible values are ok, fallback, mismatch, human, upstream and custom.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.eol_date_agreement
      description: The number of independent source classes that agree with eol_date.
      type: Number
    - contextPath: EndOfLifeAI.Product.versions.eol_date_confidence
      description: The confidence label of eol_date. Possible values are high, medium and low.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.data_source
      description: The URL that the served eol_date was read from.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.score_card_url
      description: The score card page of this version on endoflife.ai.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.product_url
      description: The product page on endoflife.ai.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.methodology_url
      description: The page that describes how the EOL risk score is calculated.
      type: String
    - contextPath: EndOfLifeAI.Product.versions.generated_at
      description: The time the API generated the answer.
      type: Date
