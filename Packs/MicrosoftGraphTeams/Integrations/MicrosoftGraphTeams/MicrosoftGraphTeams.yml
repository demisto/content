description: Microsoft Graph lets your app get authorized access to a user's Teams app in a personal or organization account.
display: O365 Teams (Using Graph API)
name: MicrosoftGraphTeams
script:
  commands:
  - arguments:
    - description: User ID to use Teams as (can be principal ID (email address)).
      name: user_id
    - description: An OData query. See README for OData usage examples.
      name: odata
    - defaultValue: "20"
      description: Limit chats to fetch in one request.
      name: limit
    description: Retrieve the list of chats that the user is part of.
    name: msgraph-teams-list-chats
    outputs:
    - contextPath: MSGraphTeamsChat.ID
      description: The ID of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.UserID
      description: The ID of the user.
      type: String
    - contextPath: MSGraphTeamsChat.Subject
      description: The title of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.Created
      description: The time the chat was created.
      type: Date
    - contextPath: MSGraphTeamsChat.LastUpdatedTime
      description: The time the chat was last updated.
      type: Date
    - contextPath: MSGraphTeamsChat.Type
      description: The type of chat.
      type: String
  - arguments:
    - description: User ID to use Teams as (can be principal ID (email address)).
      name: user_id
    - description: The title of the chat. Supported only for "group" type.
      name: subject
    - auto: PREDEFINED
      default: true
      defaultValue: group
      description: 'Specifies the type of chat. Possible values are: group and oneOnOne.'
      name: type
      predefined:
      - group
      - oneOnOne
    - description: A comma-separated list members that should be added. using user principal name (email).
      isArray: true
      name: members
      required: true
    description: Create a new chat.
    name: msgraph-teams-create-chat
    outputs:
    - contextPath: MSGraphTeamsChat.ID
      description: The ID of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.UserID
      description: The ID of the user.
      type: String
    - contextPath: MSGraphTeamsChat.Subject
      description: The title of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.Created
      description: The time the chat was created.
      type: Date
    - contextPath: MSGraphTeamsChat.LastUpdatedTime
      description: The time the chat was last updated.
      type: Date
    - contextPath: MSGraphTeamsChat.Type
      description: The type of chat.
      type: String
  - arguments:
    - description: User ID to use Teams as (can be principal ID (email address)).
      name: user_id
    - description: The chat's unique identifier.
      name: chat_id
      required: true
    description: Retrieve a single chat (without its messages).
    name: msgraph-teams-get-chat
    outputs:
    - contextPath: MSGraphTeamsChat.ID
      description: The ID of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.UserID
      description: The ID of the user.
      type: String
    - contextPath: MSGraphTeamsChat.Subject
      description: The title of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.Created
      description: The time the chat was created.
      type: Date
    - contextPath: MSGraphTeamsChat.LastUpdatedTime
      description: The time the chat was last updated.
      type: Date
    - contextPath: MSGraphTeamsChat.Type
      description: The type of chat.
      type: String
  - arguments:
    - description: The chat's unique identifier.
      name: chat_id
      required: true
    - description: The title of the chat.
      name: subject
      required: true
    description: Update the properties of a chat object.
    name: msgraph-teams-update-chat
    outputs:
    - contextPath: MSGraphTeamsChat.ID
      description: The ID of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.UserID
      description: The ID of the user.
      type: String
    - contextPath: MSGraphTeamsChat.Subject
      description: The title of the chat.
      type: String
    - contextPath: MSGraphTeamsChat.Created
      description: The time the chat was created.
      type: Date
    - contextPath: MSGraphTeamsChat.LastUpdatedTime
      description: The time the chat was last updated.
      type: Date
    - contextPath: MSGraphTeamsChat.Type
      description: The type of chat.
      type: String
  - arguments:
    - description: User ID to use Teams as (can be principal ID (email address)).
      name: user_id
    - description: The chat's unique identifier.
      name: chat_id
      required: true
    description: List all conversation members in a chat.
    name: msgraph-teams-list-members
    outputs:
    - contextPath: MSGraphTeamsChatMember.ID
      description: The ID of the chat member.
      type: String
    - contextPath: MSGraphTeamsChatMember.Name
      description: The display name of the chat member.
      type: String
    - contextPath: MSGraphTeamsChatMember.HistoryStartTime
      description: The timestamp denoting how far back a conversation's history is shared with the conversation member. This property is settable only for members of a chat.
      type: Date
    - contextPath: MSGraphTeamsChatMember.ChatID
      description: The ID of the chat.
  - arguments:
    - description: The chat's unique identifier.
      name: chat_id
      required: true
    - description: User ID to add to Teams chat (can be principal ID (email address)).
      name: user_id
      required: true
    - auto: PREDEFINED
      default: true
      defaultValue: "true"
      description: Allowing sharing of the whole history of the chat.
      name: share_history
      predefined:
      - "true"
      - "false"
    description: Add a conversationMember to a chat.
    name: msgraph-teams-add-member
  - arguments:
    - description: User ID to use Teams as (can be principal ID (email address)).
      name: user_id
    - description: The chat's unique identifier.
      name: chat_id
      required: true
    - default: true
      defaultValue: "50"
      description: Limit messages to fetch in one request.
      name: limit
    description: Retrieve the list of messages in a chat.
    name: msgraph-teams-list-messages
    outputs:
    - contextPath: MSGraphTeamsChatMessage.ID
      description: The ID of the message.
      type: String
    - contextPath: MSGraphTeamsChatMessage.ChatID
      description: The ID of the chat.
      type: String
    - contextPath: MSGraphTeamsChatMessage.From
      description: The Name of the sender of the chat message.
      type: String
    - contextPath: MSGraphTeamsChatMessage.Created
      description: Timestamp of when the chat message was created.
      type: Date
    - contextPath: MSGraphTeamsChatMessage.LastModifiedTime
      description: Timestamp when the chat message is created (initial setting) or modified, including when a reaction is added or removed.
      type: Date
    - contextPath: MSGraphTeamsChatMessage.Body
      description: HTML representation of the content of the chat message. Representation is specified by the contentType inside the body.
      type: htmlBody
  - arguments:
    - description: The chat's unique identifier.
      name: chat_id
      required: true
    - description: HTML representation of the content of the chat message. Representation is specified by the contentType inside the body.
      name: body
      required: true
    description: Send a new message in a chat.
    name: msgraph-teams-send-message
    outputs:
    - contextPath: MSGraphTeamsChatMessage.ID
      description: The ID of the message.
      type: String
    - contextPath: MSGraphTeamsChatMessage.chatID
      description: The ID of the chat.
      type: String
    - contextPath: MSGraphTeamsChatMessage.From
      description: The Name of the sender of the chat message.
      type: String
    - contextPath: MSGraphTeamsChatMessage.Created
      description: Timestamp of when the chat message was created.
      type: Date
    - contextPath: MSGraphTeamsChatMessage.LastModifiedTime
      description: Timestamp when the chat message is created (initial setting) or modified, including when a reaction is added or removed.
      type: Date
    - contextPath: MSGraphTeamsChatMessage.Body
      description: HTML representation of the content of the chat message. Representation is specified by the contentType inside the body.
      type: htmlBody
  - arguments: []
    description: Tests connectivity to Microsoft Graph Teams.
    name: msgraph-teams-test
  - description: Generate the login url used for Authorization code flow.
    name: msgraph-teams-generate-login-url
    arguments: []
  - description: Run this command if for some reason you need to rerun the authentication process.
    name: msgraph-teams-auth-reset
    arguments: []
  - arguments:
    - description: The chat ID hosting the message. Provide this for a chat message. Retrieve chat IDs from the Microsoft Teams client URL or via the Microsoft Graph list chats endpoint. Mutually exclusive with team_id and channel_id.
      name: chat_id
    - description: The team ID hosting the channel message. Provide together with channel_id for a channel message. Retrieve team IDs from the Microsoft Teams admin center or via the Microsoft Graph list joinedTeams endpoint.
      name: team_id
    - description: The channel ID hosting the message. Provide together with team_id for a channel message. Retrieve channel IDs from the Microsoft Teams client URL or via the Microsoft Graph list channels endpoint.
      name: channel_id
    - description: The parent message ID when targeting a channel reply. Only supported for channel messages. Retrieve message IDs via the Microsoft Graph list channel messages endpoint.
      name: parent_message_id
    - description: The ID of the message to update. Retrieve message IDs via the Microsoft Graph list messages endpoint for the chat or channel.
      name: message_id
      required: true
    - auto: PREDEFINED
      description: The action taken on the message. One of NoAction, BlockAccess, BlockAccessExternal.
      name: dlp_action
      predefined:
      - NoAction
      - BlockAccess
      - BlockAccessExternal
    - description: The explanatory text shown to the user in the policy tip.
      name: policy_tip_general_text
    - auto: PREDEFINED
      description: The reviewer actions available on the flagged message. One of None, AllowFalsePositiveOverride, AllowOverrideWithoutJustification, AllowOverrideWithJustification. When omitted, Microsoft Graph applies its default behavior.
      name: verdict_details
      predefined:
      - None
      - AllowFalsePositiveOverride
      - AllowOverrideWithoutJustification
      - AllowOverrideWithJustification
    - description: The billing model appended as the model query parameter. Provide when the tenant uses a specific Microsoft Graph metered API payment model.
      name: payment_model
    description: Applies a data loss prevention policy violation to a Microsoft Teams message, quarantining a chat message, a channel message, or a channel reply. HTTP error responses from Microsoft Graph are surfaced verbatim as a command error.
    name: microsoft-teams-message-update-policy-violation
    outputs:
    - contextPath: MSGraphTeams.TeamsMessagePolicyViolation.messageId
      description: The ID of the message the policy violation was applied to.
      type: String
    - contextPath: MSGraphTeams.TeamsMessagePolicyViolation.chatId
      description: The ID of the chat hosting the message, when targeting a chat message.
      type: String
    - contextPath: MSGraphTeams.TeamsMessagePolicyViolation.teamId
      description: The ID of the team hosting the message, when targeting a channel message.
      type: String
    - contextPath: MSGraphTeams.TeamsMessagePolicyViolation.channelId
      description: The ID of the channel hosting the message, when targeting a channel message.
      type: String
    - contextPath: MSGraphTeams.TeamsMessagePolicyViolation.parentMessageId
      description: The ID of the parent message, when targeting a channel reply.
      type: String
    - contextPath: MSGraphTeams.TeamsMessagePolicyViolation.dlpAction
      description: The data loss prevention action that was applied to the message.
      type: String
    - contextPath: MSGraphTeams.TeamsMessagePolicyViolation.verdictDetails
      description: The reviewer actions that were made available on the flagged message.
      type: String
  dockerimage: demisto/crypto:1.0.0.5490413
  script: ''
  subtype: python3
  type: python
  runonce: false
fromversion: 6.0.0
tests:
- No tests (auto formatted)
